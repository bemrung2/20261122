}

/* ════════════════════════════════════
   PHOTO VIEWER & AUTO-PLAY
════════════════════════════════════ */
let isManualMode = false; // set via secret triple-tap on 민소 circle
let classicMode  = false; // ON → old card carousel; default is the pixel world
let apChIdx      = -1;   // autoplay: current chapter
let apPIdx       = 0;    // autoplay: current photo index
let apRunning    = false;
let apTimer      = null;
let apRemaining  = 4000; // ms remaining when paused
let apTimerStart = 0;    // timestamp when current timer started
let apHolding    = false;

function startAutoPlay(chIdx)            { startAutoPlayFrom(chIdx, 0); }
function startAutoPlayFrom(chIdx, pIdx)  {
  stopAutoPlay();
  apChIdx   = chIdx;
  apPIdx    = pIdx;
  apRunning = true;
  runAutoStep(chIdx, pIdx);
}

function stopAutoPlay() {
  _apGen++;          // invalidate any in-flight openPhotoViewer calls
  apRunning = false;
  apChIdx   = -1;
  apHolding = false;
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
}

async function runAutoStep(chIdx, pIdx) {
  if (!apRunning || apChIdx !== chIdx || isManualMode) return;
  apPIdx = pIdx;

  // tap animation on grid cell
  const cells = $('ch-scroll').querySelectorAll('.photo-cell');
  const cell  = cells[pIdx];
  if (cell) {
    cell.classList.remove('tapping');
    void cell.offsetWidth;
    cell.classList.add('tapping');
  }
  await sleep(1200);
  if (!apRunning || apChIdx !== chIdx) return;

  const dur = await openPhotoViewer(chIdx, pIdx, true);
  startHoldTimer(dur);
}

/* ── 홀드 타이머 (일시정지 지원) ── */
function startHoldTimer(ms) {
  if (isManualMode || !apRunning) return; // manual mode or stopped: no auto-advance
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
  apRemaining  = ms;
  apTimerStart = Date.now();
  apHolding    = false;
  apTimer = setTimeout(async () => {
    if (!apRunning) return;
    const chIdx = apChIdx;
    const pIdx  = apPIdx;
    const ch    = CHAPTERS[chIdx];

    if (pIdx >= ch.photos.length - 1) {
      // 마지막 사진 → 다음 에피소드로 자동 전환
      onChapterNext();
      return;
    }

    // 다음 사진으로 — 뷰어 유지, 사진만 교체
    if (!apRunning || apChIdx !== chIdx) return;
    apPIdx = pIdx + 1;
    const dur = await openPhotoViewer(chIdx, pIdx + 1, true);
    startHoldTimer(dur);
  }, ms);
}

function pauseHold() {
  if (!apRunning || apHolding || !apTimer) return;
  apHolding = true;
  clearTimeout(apTimer); apTimer = null;
  apRemaining = Math.max(80, apRemaining - (Date.now() - apTimerStart));
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = 'paused';
  const kb = $('pv-img')?.querySelector('.pv-layer.in .pv-main');
  if (kb) kb.style.animationPlayState = 'paused';   // freeze the drift too
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.pause();
}

function resumeHold() {
  if (!apHolding) return;
  apHolding = false;
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = '';
  const kb = $('pv-img')?.querySelector('.pv-layer.in .pv-main');
  if (kb) kb.style.animationPlayState = '';
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.play().catch(() => {});
  startHoldTimer(apRemaining);
}

async function openPhotoViewer(chIdx, pIdx, isAuto) {
  const myGen = _apGen;   // capture — if stopAutoPlay fires mid-await, myGen !== _apGen
  const ch    = CHAPTERS[chIdx];
  const photo = ch.photos[pIdx];
  const pv    = $('photo-viewer');
  const pvImg = $('pv-img');
  const alreadyOpen = pv.classList.contains('show');
  const isVideo = photo.src && /\.(mp4|mov|webm|m4v)$/i.test(photo.src);

  let dur = 6000;

  // Build the incoming shot in its own layer, so it can dissolve over the
  // outgoing one instead of the frame blinking to black between photos.
  const prevLayers = [...pvImg.querySelectorAll('.pv-layer')];
  const layer = document.createElement('div');
  layer.className = 'pv-layer';
  let kbEl = null;   // element that carries the Ken Burns drift

  if (!photo.src) {
    layer.style.background = ch.bg.replace('145deg', '155deg');
    layer.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <svg width="50" height="50" viewBox="0 0 40 40" fill="none" style="opacity:0.2">
        <rect x="3" y="9" width="34" height="23" rx="4" stroke="white" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="6.5" stroke="white" stroke-width="1.4"/>
        <circle cx="30" cy="14" r="2" fill="white"/>
      </svg>
    </div>`;
    pvImg.appendChild(layer);
  } else if (isVideo) {
    layer.style.background = '#000';

    // Reuse pre-buffered pool element — moving it preserves the download buffer
    let vid = _vidPool.get(photo.src);
    if (!vid) {
      // Fallback: create on-demand (shouldn't normally reach here)
      vid = document.createElement('video');
      vid.src = photo.src; vid.preload = 'auto'; vid.playsInline = true;
      vid.muted = true; vid.load();
      _vidPool.set(photo.src, vid);
    }
    vid.className   = 'pv-main';   // full-bleed, contained — no crop
    vid.style.cssText = '';
    vid.muted  = false;
    vid.volume = 1.0;
    vid.currentTime = 0;
    layer.appendChild(vid);        // moves from _mpc to the layer — buffer intact
    pvImg.appendChild(layer);

    // Metadata should already be available from preload; wait only if needed
    if (vid.readyState < 1) {
      await new Promise(res => {
        vid.addEventListener('loadedmetadata', res, { once: true });
        setTimeout(res, 4000);
      });
    }
    if (vid.duration && isFinite(vid.duration) && vid.duration > 0.1) {
      dur = Math.round(vid.duration * 1000) + 300;
    }
    // Play — already buffered, starts immediately
    vid.play().catch(() => {
      vid.muted = true;
      vid.play().catch(() => {});
    });
  } else {
    // Blurred copy behind the photo fills the frame, so a portrait shot on a
    // wide screen reads as a composed frame rather than a letterboxed image.
    const blur = document.createElement('img');
    blur.className = 'pv-blur'; blur.src = photo.src; blur.alt = '';
    const main = document.createElement('img');
    main.className = 'pv-main'; main.src = photo.src; main.alt = '';
    layer.append(blur, main);
    pvImg.appendChild(layer);
    kbEl = main;

    await new Promise(res => {
      if (main.complete && main.naturalWidth) { res(); return; }
      main.addEventListener('load',  res, { once: true });
      main.addEventListener('error', res, { once: true });
      setTimeout(res, 4000);
    });
  }

  // caption fades out now; the new text is set at the cut, below, so a stale
  // shot can never leave its words on screen
  const capEl = $('pv-cap');
  if (alreadyOpen) {
    capEl.classList.add('swapping');
    // a real frame has to elapse or the browser coalesces the fade away, and
    // letting the words clear just before the cut reads better besides
    await sleep(110);
  }

  // progress bars
  const barsEl = $('pv-bars');
  barsEl.innerHTML = '';
  if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
  ch.photos.forEach((_, i) => {
    const bar  = document.createElement('div'); bar.className = 'pv-bar';
    const fill = document.createElement('div'); fill.className = 'pv-bar-fill';
    if (i < pIdx) fill.classList.add('done');
    bar.appendChild(fill); barsEl.appendChild(bar);
  });
  barsEl.style.transition = 'opacity 0.35s ease';
  barsEl.style.opacity = '1';
  pvBarsVisible = true;

  function activateBar() {
    const fills = barsEl.querySelectorAll('.pv-bar-fill');
    if (fills[pIdx]) {
      fills[pIdx].style.setProperty('--pv-dur', `${(dur / 1000).toFixed(2)}s`);
      fills[pIdx].classList.add('active');
    }
  }

  // Stale call — this shot was superseded while its media loaded. Drop the
  // layer we built so it can never surface over the current one.
  if (_apGen !== myGen) { layer.remove(); return dur; }

  // Start the drift so the motion runs for exactly as long as the shot holds
  if (kbEl) {
    kbEl.style.setProperty('--kbdur', `${Math.round(dur * 1.35)}ms`);
    kbEl.classList.add(`kb${1 + Math.floor(Math.random() * 4)}`);
  }

  // The cut: sweep the new shot in, push the previous ones out, swap the words
  capEl.textContent = photo.cap;
  requestAnimationFrame(() => {
    layer.classList.add('in');
    capEl.classList.remove('swapping');
  });
  prevLayers.forEach(old => {
    old.classList.add('out');
    setTimeout(() => {
      // re-query: if this video was reclaimed by a later shot it is no longer
      // inside `old`, and must not be yanked back to the pool
      _returnVidToPool(old.querySelector('video'));
      old.remove();
    }, 700);
  });

  if (!alreadyOpen) pv.classList.add('show');

  if (isAuto) { await sleep(60); activateBar(); }
  return dur;
}

async function closePhotoViewer(instant) {
  const pv = $('photo-viewer');
  if (!pv.classList.contains('show')) return;
  const vid = $('pv-img')?.querySelector('video');
  _returnVidToPool(vid); // return to pool so buffer is preserved for next open
  if (instant) {
    pv.style.transition = 'none';
    pv.classList.remove('show');
    await sleep(20);
    pv.style.transition = '';
  } else {
    pv.classList.remove('show');
    await sleep(420);
  }
  // Discard spent shot layers so the next open starts on a clean frame
  $('pv-img').innerHTML = '';
  $('pv-cap').classList.remove('swapping');
}

/* Roll straight from the last shot of one episode into the first shot of the
   next. The chapter card rises over the still-open viewer, the episode is
   swapped behind it, and the card lifts onto the new opening shot — so the
   carousel and the grid never reappear and the reel never stops. */
async function advanceEpisodeSeamless(next) {
  const veil   = $('ch-veil');
  const vtitle = $('ch-vtitle');
  const ch     = CHAPTERS[next];

  preloadChapterMedia(next);

  // Chapter card rises over the frame that is still on screen
  $('ch-vt-num').textContent  = ch.num;
  $('ch-vt-name').textContent = ch.name;
  vtitle.classList.remove('in', 'up');
  veil.classList.add('solid', 'show');
  await sleep(560);
  vtitle.classList.add('in');
  await sleep(1450);

  // Behind the opaque card: retire the old episode, stage the new one
  stopAutoPlay();
  await closePhotoViewer(true);
  currentCh = next;

  if (ch.future) {
    openFuturePage();                 // raises its own curtain over us
    await sleep(900);
    veil.classList.remove('show', 'solid');
    vtitle.classList.remove('in', 'up');
    return;
  }

  loadDetail(next);
  positionCards(next, false);
  $('ch-hd').classList.add('in');
  $('ch-scroll').classList.add('show');
  $('ch-foot').classList.add('show');
  $('ch-detail').classList.add('show');

  vtitle.classList.add('up');
  await sleep(430);

  // Open the new episode's first shot, then lift the card onto it
  apChIdx = next; apPIdx = 0; apRunning = true;
  const dur = await openPhotoViewer(next, 0, true);
  veil.classList.remove('show');
  await sleep(520);
  veil.classList.remove('solid');
  if (apRunning) startHoldTimer(dur);
}

async function onChapterNext() {
  // ── 뷰어 열림: 사진 레벨 네비게이션 우선 ──
  if ($('photo-viewer').classList.contains('show')) {
    const ch = CHAPTERS[currentCh];
    const isLastPhoto = apPIdx >= ch.photos.length - 1;

    if (!isLastPhoto) {
      // 다음 사진으로
      stopAutoPlay();
      await closePhotoViewer(false);
      await sleep(160);
      startAutoPlayFrom(currentCh, apPIdx + 1);
      return;
    }
    // 마지막 사진 → 월드 모드면 캐릭터가 있던 자리로 돌아감
    if (!classicMode) {
      if (busy) return;
      busy = true;
      await returnToWorld();
      busy = false;
      return;
    }

    // 카드 모드: 다음 에피소드로 끊김 없이 이어서 재생
    if (!isManualMode && currentCh < CHAPTERS.length - 1) {
      if (busy) return;
      busy = true;
      await advanceEpisodeSeamless(currentCh + 1);
      busy = false;
      return;
    }

    // 수동 모드 / 마지막 에피소드 → 뷰어 닫고 fall-through
    stopAutoPlay();
    await closePhotoViewer(false);
    await sleep(800);
  }

  // ── 에피소드 레벨 네비게이션 ──
  if (busy) return;
  busy = true;

  // Manual mode: return to carousel unless it's the last episode (→ letter 2)
  if (isManualMode && currentCh !== CHAPTERS.length - 1) {
    await exitChapter();
    busy = false;
    return;
  }

  const isLastEp = currentCh === CHAPTERS.length - 1;

  if (isLastEp) {
    await fadeTo('pg-letter2', () => {
      $('ch-detail').classList.remove('show');
      $('ch-hd').classList.remove('in');
      $('ch-scroll').classList.remove('show');
      $('ch-foot').classList.remove('show');
    });
    busy = false;
    startCosmicLetter(LETTER2, goToProposal);
  } else {
    await exitChapter();
    const next = currentCh + 1;
    await sleep(300);
    positionCards(next, true);
    await sleep(1600);
    busy = false;
    enterChapter(next);
  }
}

// Main keywords — ignite one by one with predefined positions
const FUTURE_MAIN = ['결혼식', '신혼여행', '아파트 이사', '신혼생활', '해외여행', '출산', '육아'];
const FUTURE_MAIN_POS = [
  { x: 25, y: 10, fs: 32 },   // 결혼식  → 화면 좌측 ~14%
  { x: 63, y:  7, fs: 28 },   // 신혼여행 → 화면 우측 ~66%
  { x: 16, y: 37, fs: 24 },   // 아파트 이사 → 화면 좌측 ~11%
  { x: 63, y: 26, fs: 28 },   // 신혼생활 → 화면 우측 ~66%
  { x: 20, y: 62, fs: 27 },   // 해외여행 → 화면 좌측 ~14%
  { x: 70, y: 68, fs: 34 },   // 출산 → 화면 우측 ~73%
  { x: 46, y: 82, fs: 25 },   // 육아 → 화면 중앙 ~45%
];

// Landscape keyword layout — authored in VISIBLE-screen %, converted below.
// Spread wide across the 16:9 canvas, leaving the centre clear for the closing line.
const FUTURE_MAIN_POS_LS = [
  { x: 12, y: 15, fs: 30 },   // 결혼식
  { x: 73, y: 11, fs: 26 },   // 신혼여행
  { x:  7, y: 45, fs: 22 },   // 아파트 이사
  { x: 77, y: 39, fs: 26 },   // 신혼생활
  { x: 15, y: 75, fs: 25 },   // 해외여행
  { x: 60, y: 72, fs: 32 },   // 출산
  { x: 41, y: 84, fs: 24 },   // 육아
];

/* #ft-bg is inset beyond the viewport so it can pan, so a word's % position
   inside it is not the % the eye sees. Convert desired screen % → container %. */
function ftToContainer(bg, visX, visY) {
  const W = bg.offsetWidth,   H  = bg.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  const insX = (W - vw) / 2,  insY = (H - vh) / 2;
  return {
    x: ((visX / 100) * vw + insX) / W * 100,
    y: ((visY / 100) * vh + insY) / H * 100,
  };
}

// Secondary and ambient words — appear all at once, fill the field
const FUTURE_MID = [
  '크리스마스', '새해', '드라이브', '캠핑',
  '첫눈', '생일', '설날', '추석', '가족사진', '주말 아침', '기념일', '카페'
];
const FUTURE_BG = [
  '웃음', '바다',
  '여름밤', '공원 산책', '요리', '집들이',
  '여행 계획', '소소한 행복', '함께', '이사', '파티',
  '가족', '새벽', '봄날', '승진'
];

function ftShuf(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) { const j = 0 | Math.random() * (i + 1); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

/* Word sizes below are authored for a phone. Sideways the same field may be
   on a TV, so scale them with the viewport height. */
function ftScale() {
  return isLandscape() ? Math.min(2.4, Math.max(1, window.innerHeight / 393)) : 1;
}

function ftSpawn(container, text, cls, x, y, fs, op, adS, fdur, gdur, dx, dy) {
  fs *= ftScale();
  const el = document.createElement('span');
  el.className = `ft-word ${cls}`;
  el.textContent = text;
  const style = [
    `left:${x.toFixed(1)}%`, `top:${y.toFixed(1)}%`, `font-size:${fs.toFixed(1)}px`,
    `--op:${op.toFixed(3)}`,  `--ad:${adS.toFixed(2)}s`,
    `--fdur:${fdur.toFixed(1)}s`, `--dx:${dx.toFixed(1)}px`, `--dy:${dy.toFixed(1)}px`,
  ];
  if (gdur) style.push(`--gdur:${gdur.toFixed(1)}s`);
  el.style.cssText = style.join(';');
  container.appendChild(el);
}

function buildFutureAtmosphere(container) {
  // 70 twinkling stars
  for (let i = 0; i < 70; i++) {
    const s   = document.createElement('div');
    s.className = 'ft-star';
    const sz  = Math.random() < 0.72 ? 1 : Math.random() < 0.7 ? 2 : 3;
    const op1 = (0.15 + Math.random() * 0.55).toFixed(2);
    const op2 = (parseFloat(op1) * (0.12 + Math.random() * 0.25)).toFixed(2);
    s.style.cssText = [
      `left:${(Math.random()*100).toFixed(1)}%`, `top:${(Math.random()*100).toFixed(1)}%`,
      `width:${sz}px`, `height:${sz}px`,
      `--op1:${op1}`, `--op2:${op2}`,
      `--dur:${(1.8+Math.random()*3.5).toFixed(1)}s`,
      `--del:${(Math.random()*4).toFixed(1)}s`,
    ].join(';');
    container.appendChild(s);
  }

  // Centre-avoiding helper
  const outsideCenter = (x, y, mx, my, Mx, My) => !(x > mx && x < Mx && y > my && y < My);

  // Background micro-words — staggered 0.18s apart so they float up one by one
  ftShuf(FUTURE_BG).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 28, 32, 72, 68));
    ftSpawn(container, w, 'ft-bgw',
      x, y, 10 + Math.random() * 5,
      0.22 + Math.random() * 0.14,   // brighter: 0.22–0.36
      0.2 + i * 0.18 + Math.random() * 0.08,  // ~3.6s to show all 20
      8 + Math.random() * 7,
      null,
      (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 18);
  });

  // Mid words — staggered 0.24s apart
  ftShuf(FUTURE_MID).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 25, 30, 75, 70));
    ftSpawn(container, w, 'ft-mid',
      x, y, 15 + Math.random() * 8,
      0.52 + Math.random() * 0.18,   // brighter: 0.52–0.70
      0.4 + i * 0.24 + Math.random() * 0.1,  // ~3.3s to show all 14
      10 + Math.random() * 8,
      null,
      (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 22);
  });
}

async function openFuturePage() {
  await fadeTo('pg-future', () => {
    $('ch-detail').classList.remove('show');
    $('ch-hd').classList.remove('in');
    $('ch-scroll').classList.remove('show');
    $('ch-foot').classList.remove('show');
  });

  const bg = $('ft-bg');
  bg.innerHTML = '';
  buildFutureAtmosphere(bg);   // stars + mid + bg words (all start fading in now)

  const endEl = $('ft-end');
  endEl.style.opacity    = '0';
  endEl.style.transition = '';

  // Sequential main keyword ignitions — each waits for previous to bloom
  await sleep(700);
  const ls    = isLandscape();
  const table = ls ? FUTURE_MAIN_POS_LS : FUTURE_MAIN_POS;
  for (let i = 0; i < FUTURE_MAIN.length; i++) {
    const p    = table[i];
    const pos  = ls ? ftToContainer(bg, p.x, p.y) : { x: p.x, y: p.y };
    const gdur = 3.4 + Math.random() * 2.0;
    const dx   = (Math.random() - 0.5) * 20;
    const dy   = (Math.random() - 0.5) * 14;
    // --ad:0 so animation fires immediately on DOM insert
    ftSpawn(bg, FUTURE_MAIN[i], 'ft-main', pos.x, pos.y, p.fs, 0.90, 0, 18, gdur, dx, dy);
    // Gap: first keyword gets a bit longer to stand alone, rest tighter
    await sleep(i === 0 ? 1900 : 1450);
  }

  // Let all words float and settle together
  await sleep(2200);

  // Closing message fades in over the word-field
  endEl.style.transition = 'opacity 2.2s ease';
  endEl.style.opacity    = '1';
  await sleep(3600);

  await fadeTo('pg-letter2', () => { endEl.style.opacity = '0'; });
  startCosmicLetter(LETTER2, goToProposal);
}

// btn-no is sized by CSS per orientation — keep the JS maths in step
function noBtnSize() { return isLandscape() ? { w: 168, h: 40 } : { w: 210, h: 46 }; }

function placeNo() {
  const yes = document.querySelector('.btn-yes');
  const r   = yes.getBoundingClientRect();
  const btn = $('btn-no');
  const { w, h } = noBtnSize();
  const left = r.left + r.width / 2 - w / 2;
  btn.style.left   = `${Math.max(12, Math.min(window.innerWidth - w - 12, left))}px`;
  btn.style.top    = `${Math.min(r.bottom + 18, window.innerHeight - h - 12)}px`;
  btn.style.bottom = 'auto';
}

const NO_MSGS = ['싫어!','싫다고!','안 해!','절대!','저리 가!','왜 이래!','싫어!!!','안 돼!','진짜 싫어!'];
let noTaps = 0, _noLastTs = 0;
function dodgeNo(e) {
  const now = Date.now();
  if (now - _noLastTs < 350) return;
  _noLastTs = now;
  const btn = $('btn-no');
  const yes = document.querySelector('.btn-yes');
  const yR  = yes.getBoundingClientRect();
  const w = window.innerWidth, h = window.innerHeight;
  const { w: bw, h: bh } = noBtnSize();
  const margin = isLandscape() ? 14 : 20;
  // vertical keep-out at top/bottom — much smaller in landscape, where height is scarce
  const vPad = isLandscape() ? 16 : 90;

  // pick a random position that doesn't overlap btn-yes
  let x, y, tries = 0;
  do {
    x = margin + Math.random() * Math.max(10, w - bw - margin * 2);
    y = vPad   + Math.random() * Math.max(10, h - bh - vPad * 2);
    tries++;
  } while (
    tries < 30 &&
    x < yR.right  + margin && x + bw > yR.left   - margin &&
    y < yR.bottom + margin && y + bh > yR.top     - margin
  );

  btn.style.left = x + 'px';
  btn.style.top  = y + 'px';
  btn.textContent = NO_MSGS[noTaps % NO_MSGS.length];
  noTaps++;
}

async function onYes() {
  const ring = document.querySelector('.ring-wrap');
  ring.classList.add('accept');

  // Three expanding glow rings, staggered
  const ringRect = ring.getBoundingClientRect();
  const cx = ringRect.left + ringRect.width / 2;
  const cy = ringRect.top  + ringRect.height / 2;
  [0, 200, 400].forEach(delay => {
    setTimeout(() => {
      const ripple = document.createElement('div');
      ripple.className = 'ring-ripple';
      ripple.style.left = cx + 'px';
      ripple.style.top  = cy + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 900);
    }, delay);
  });

  await sleep(820);
  await fadeTo('pg-accept', () => spawnBokeh('bk2', 18, TIFFANY_BOKEH));
  await sleep(100);
  $('accept-title').classList.add('in');
  await sleep(320);
  $('accept-sub').classList.add('in');
  await sleep(580);
  $('accept-badge').classList.add('in');

function runConfetti() {
  const canvas = $('confetti');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx  = canvas.getContext('2d');
  const cols = ['#81D8D0','#B2EDE9','#ffffff','#4AADA5','#E8FAFA','#0ABAB5'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: 4 + Math.random() * 8, h: 6 + Math.random() * 13,
    rot: Math.random() * Math.PI * 2,
    dr: (Math.random() - 0.5) * 0.13,
    vy: 1.2 + Math.random() * 1.9,
    vx: (Math.random() - 0.5) * 0.7,
    col: cols[Math.floor(Math.random() * cols.length)],
    a: 0.65 + Math.random() * 0.35,
  }));
  let frame = 0;
  function draw() {
    if (frame > 380) {
      canvas.style.transition = 'opacity 1.5s ease'; canvas.style.opacity = '0'; return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.rot += p.dr;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save(); ctx.globalAlpha = p.a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++; requestAnimationFrame(draw);
  }
  draw();
}

/* ════════════════════════════════════
   GRID SWIPE-DOWN → 에피소드 카드로 복귀
════════════════════════════════════ */
function initGridDismiss() {
  const scroll  = $('ch-scroll');
  const detail  = $('ch-detail');
  let startY = 0, startScrollTop = 0;
  let dismissing = false, dragY = 0;

  scroll.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startScrollTop = scroll.scrollTop;
    dismissing = false; dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    if (!dismissing) {
      if (startScrollTop <= 0 && dy > 8) dismissing = true;
      else return;
    }
    e.preventDefault();
    dragY = dy;
  }, { passive: false });

  scroll.addEventListener('touchend', async () => {
    if (!dismissing) return;
    dismissing = false;
    if (dragY > 90 && !busy) {
      busy = true;
      await exitChapter();
      busy = false;
    }
    dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchcancel', () => {
    dismissing = false;
    dragY = 0;
  }, { passive: true });
}

/* ════════════════════════════════════
   PIXEL WORLD — the default way into the episodes
   A small overworld drawn entirely in code: no sprite sheets, so the page
   stays self-contained. The girl walks to a place, steps to its door and
   that episode's reel plays.
════════════════════════════════════ */
const WT = 32;   // tile size in world pixels — finer art than the old 16

/* The hall, laid out in code.
   # wall  . floor  r runner  F floral border  s stage  S step  H head table */
const W_COLS = 29, W_ROWS = 46;
const AISLE_L = 13, AISLE_R = 15;      // a narrower runner, 3 tiles across
const AISLE_MID = 14;

const WORLD_MAP = (() => {
  const m = Array.from({ length: W_ROWS }, () => new Array(W_COLS).fill('.'));
  const box = (r0, r1, c0, c1, ch) => {
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
      if (m[r] && m[r][c] !== undefined) m[r][c] = ch;
  };
  box(0, W_ROWS - 1, 0, 1, '#'); box(0, W_ROWS - 1, W_COLS - 2, W_COLS - 1, '#');
  box(0, 1, 0, W_COLS - 1, '#'); box(W_ROWS - 1, W_ROWS - 1, 0, W_COLS - 1, '#');

  box(2, 7, 2, W_COLS - 3, 's');          // stage floor
  box(3, 6, 11, 17, 'd');                 // the narrow dais the groom stands on
  box(4, 4, 12, 16, 'H');                 // head table
  box(8, 42, AISLE_L, AISLE_R, 'r');      // runner — no steps at its head
  box(8, 42, AISLE_L - 1, AISLE_L - 1, 'F');
  box(8, 42, AISLE_R + 1, AISLE_R + 1, 'F');
  box(43, 43, AISLE_L - 1, AISLE_R + 1, 'P');   // the little podium
  box(44, 44, AISLE_L - 2, AISLE_R + 2, 'G');   // gateway behind it
  return m.map(row => row.join(''));
})();

/* Memory stands sit just outside the flower line, episode 1 nearest the doors */
const W_PLACES = [
  { ep:0, col:AISLE_L-2, row:36, side:-1, doorCol:AISLE_MID, doorRow:36, name:'회사 동기' },
  { ep:1, col:AISLE_R+2, row:29, side: 1, doorCol:AISLE_MID, doorRow:29, name:'연인' },
  { ep:2, col:AISLE_L-2, row:22, side:-1, doorCol:AISLE_MID, doorRow:22, name:'일상' },
  { ep:3, col:AISLE_R+2, row:15, side: 1, doorCol:AISLE_MID, doorRow:15, name:'여행' },
  { ep:4, col:AISLE_MID, row:5,  side: 0, doorCol:AISLE_MID, doorRow:8,  name:'앞으로의 우리', groom:true },
];

/* Round banquet tables, every seat taken */
const W_TABLES = (() => {
  const out = [];
  for (const r of [14, 20, 26, 32, 38])
    for (const c of [4, 8, 19, 23]) out.push({ col: c, row: r, seats: 8 });
  return out;
})();

/* 혼주석 — two parents seated either side, right at the head of the aisle */
const W_PARENTS = [
  { col: AISLE_L - 2.6, row: 9,    who: 'father' },
  { col: AISLE_L - 2.6, row: 10.6, who: 'mother' },
  { col: AISLE_R + 1.6, row: 9,    who: 'father' },
  { col: AISLE_R + 1.6, row: 10.6, who: 'mother' },
];

/* Guests standing along the flower line, turned in to watch her pass */
const W_STANDING = (() => {
  const out = [];
  for (let r = 12; r <= 41; r += 1.7) {
    out.push({ col: AISLE_L - 1.75, row: r, face: 1,  seed: wHash(r * 3, 1) });
    out.push({ col: AISLE_R + 1.75, row: r + 0.8, face: -1, seed: wHash(r * 5, 7) });
    if (r % 5 < 1.7) {
      out.push({ col: AISLE_L - 2.7, row: r + 0.5, face: 1,  seed: wHash(r * 7, 3) });
      out.push({ col: AISLE_R + 2.7, row: r + 1.2, face: -1, seed: wHash(r * 11, 9) });
    }
  }
  return out;
})();

/* Big pillar arrangements massed at the mouth of the aisle */
const W_ENTRY_FLOWERS = [
  { col: AISLE_L - 1, row: 41.4, big: 1 }, { col: AISLE_R + 1, row: 41.4, big: 1 },
  { col: AISLE_L - 2, row: 42.2, big: 0 }, { col: AISLE_R + 2, row: 42.2, big: 0 },
  { col: AISLE_L - 1, row: 39.6, big: 0 }, { col: AISLE_R + 1, row: 39.6, big: 0 },
];

/* Chandeliers: a dense run down the aisle plus rows either side, as the hall has */
const W_CHANDELIERS = (() => {
  const out = [];
  for (let r = 9; r <= 43; r += 3.4) {
    out.push({ col: AISLE_MID, row: r, big: 1 });
    out.push({ col: AISLE_L - 5.5, row: r + 1.7, big: 0 });
    out.push({ col: AISLE_R + 6.5, row: r + 1.7, big: 0 });
    out.push({ col: AISLE_L - 10,  row: r, big: 0 });
    out.push({ col: AISLE_R + 11,  row: r, big: 0 });
  }
  return out;
})();

const wSolid = ch => '#FtHBcdG'.includes(ch);
function wTileAt(c, r) {
  if (c < 0 || r < 0 || c >= W_COLS || r >= W_ROWS) return 'T';
  return WORLD_MAP[r][c];
}

const W = {
  on:false, raf:0, last:0,
  x:AISLE_MID*WT+WT/2, y:41*WT+WT/2,   // just inside the gateway, facing the aisle
  dir:'up', step:0, walkT:0, moving:false,
  vx:0, vy:0, scale:3,
  visited:new Set(), near:null, locked:false, t:0,
};

/* Each memory opens only once the one before it has played, so walking the
   aisle walks the story in order. The groom waits for all four. */
function wLocked(pl) {
  if (!pl) return false;
  if (pl.groom) return W.visited.size < 4;
  return pl.ep > 0 && !W.visited.has(pl.ep - 1);
}

/* ── deterministic per-tile noise so grass detail never flickers ── */
function wHash(c, r) {
  let h = (c * 374761393 + r * 668265263) ^ 0x5bf03635;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const TAU = Math.PI * 2;

/* Round shapes are drawn properly now — smooth edges, a lit side and a
   shaded one — instead of the stepped scanlines this used to use. */
function pxDisc(g, cx, cy, rad, col, _q) {
  if (rad <= 0) return;
  g.beginPath(); g.arc(cx, cy, rad, 0, TAU);
  g.fillStyle = col; g.fill();
}

/* A bloom: petal lobes around a shaded body, lit from above-left. */
function wBloom(g, cx, cy, rad, col) {
  if (rad <= 0.9) { g.fillStyle = col; g.beginPath(); g.arc(cx, cy, Math.max(0.4, rad), 0, TAU); g.fill(); return; }
  g.fillStyle = col;
  if (rad > 2) {                                   // petals break the circle
    const n = rad > 4 ? 6 : 5, ph = cx * 0.07 + cy * 0.05;
    for (let i = 0; i < n; i++) {
      const a2 = i / n * TAU + ph;
      g.beginPath();
      g.arc(cx + Math.cos(a2) * rad * 0.44, cy + Math.sin(a2) * rad * 0.44, rad * 0.6, 0, TAU);
      g.fill();
    }
  }
  g.beginPath(); g.arc(cx, cy, rad * 0.82, 0, TAU); g.fill();
  g.save();
  g.beginPath(); g.arc(cx, cy, rad * 1.08, 0, TAU); g.clip();
  g.beginPath(); g.arc(cx + rad * 0.4, cy + rad * 0.46, rad * 0.95, 0, TAU);
  g.fillStyle = 'rgba(70,25,60,0.22)'; g.fill();
  g.beginPath(); g.arc(cx - rad * 0.34, cy - rad * 0.38, rad * 0.6, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.30)'; g.fill();
  g.restore();
  g.beginPath(); g.arc(cx, cy, rad * 0.2, 0, TAU);
  g.fillStyle = 'rgba(120,60,90,0.30)'; g.fill();          // seed centre
  g.beginPath(); g.arc(cx - rad * 0.24, cy - rad * 0.28, rad * 0.2, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.78)'; g.fill();
}

/* Soft contact shadow — a real falloff rather than a flat grey ellipse. */
function wShadow(g, cx, cy, rx, ry, strength) {
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rx);
  gr.addColorStop(0, `rgba(0,0,0,${strength})`);
  gr.addColorStop(0.6, `rgba(0,0,0,${strength * 0.5})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.translate(cx, cy); g.scale(1, ry / rx); g.translate(-cx, -cy);
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, rx, 0, TAU); g.fill();
  g.restore();
}

/* A rounded, softly lit body — used for torsos, cloth and furniture. */
function wSoftRect(g, x, y, w, h, col, r) {
  const rr = Math.min(r === undefined ? Math.min(w, h) * 0.28 : r, w / 2, h / 2);
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, rr);
  else {
    g.moveTo(x + rr, y); g.lineTo(x + w - rr, y); g.quadraticCurveTo(x + w, y, x + w, y + rr);
    g.lineTo(x + w, y + h - rr); g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    g.lineTo(x + rr, y + h); g.quadraticCurveTo(x, y + h, x, y + h - rr);
    g.lineTo(x, y + rr); g.quadraticCurveTo(x, y, x + rr, y);
  }
  g.fillStyle = col; g.fill();
}

function wDrawTile(g, ch, c, r, S) {
  const U = WT / 16;                       // art authored in 16ths of a tile
  const X = c * WT * S, Y = r * WT * S;
  const px = (ox, oy, w, h, col) => {
    g.fillStyle = col;
    g.fillRect(X + ox * U * S, Y + oy * U * S, w * U * S, h * U * S);
  };
  const n = wHash(c, r);

  // polished stone floor — graded slab with faint veining
  const fg = g.createLinearGradient(X, Y, X + 16 * U * S, Y + 16 * U * S);
  fg.addColorStop(0, n > 0.5 ? '#342d3f' : '#312a3b');
  fg.addColorStop(1, n > 0.5 ? '#292332' : '#26202e');
  g.fillStyle = fg; g.fillRect(X, Y, 16 * U * S, 16 * U * S);
  if (n > 0.42) {                                   // vein
    g.save(); g.beginPath(); g.rect(X, Y, 16 * U * S, 16 * U * S); g.clip();
    g.beginPath();
    g.moveTo(X + n * 16 * U * S, Y);
    g.quadraticCurveTo(X + (1 - n) * 18 * U * S, Y + 8 * U * S, X + n * 12 * U * S, Y + 16 * U * S);
    g.strokeStyle = 'rgba(255,255,255,0.045)'; g.lineWidth = Math.max(1, 0.5 * U * S); g.stroke();
    g.restore();
  }
  if (r % 2 === 0) px(0, 0, 16, 0.35, 'rgba(0,0,0,0.30)');
  if (c % 2 === 0) px(0, 0, 0.35, 16, 'rgba(0,0,0,0.30)');
  px(0, 0.35, 16, 0.3, 'rgba(255,255,255,0.035)');

  if (ch === '#') {
    // pleated drapery wall, gold sconce every few tiles
    px(0, 0, 16, 16, '#100d16');
    for (let i = 0; i < 8; i++) px(i * 2, 0, 1, 16, i % 2 ? '#171320' : '#131019');
    px(0, 0, 16, 0.5, '#0b0910');
    if ((r + c * 3) % 6 === 0) {
      px(6, 2, 4, 12, '#3a2f1c'); px(6.5, 2.5, 3, 11, '#241d11');
      px(7, 3, 2, 10, '#c9a961'); px(7, 3, 0.5, 10, '#f0dcae');
      px(6.5, 2.5, 3, 1, '#e8d5a0');
    }
  } else if (ch === 's') {
    px(0, 0, 16, 16, n > 0.5 ? '#332b3b' : '#2f2836');
    if (r === 2) {                          // pleated backdrop
      px(0, 0, 16, 16, '#181422');
      for (let i = 0; i < 8; i++) px(i * 2, 0, 1, 16, i % 2 ? '#221c2e' : '#1b1626');
      px(0, 15, 16, 1, '#2a2336');
    }
    if (r === 3 && c % 3 === 0) {           // urns of blossom along the back
      px(6.5, 9, 3, 6, '#3a3348'); px(6, 14.5, 4, 1.5, '#2a2436');
      pxDisc(g, X + 8 * U * S, Y + 6 * U * S, 4.5 * U * S, '#f6c2d4', Math.max(1, S));
      px(5, 4, 2, 2, '#ffffff'); px(9.5, 6, 1.5, 1.5, '#fdeaf0');
    }
    if (r === 7) { px(0, 13.5, 16, 2.5, '#8d7440'); px(0, 13.5, 16, 0.6, '#e0c07a'); }
  } else if (ch === 'd') {
    // the narrow dais the couple stand on
    px(0, 0, 16, 16, '#3a3143');
    px(0, 0, 16, 1, '#463c52');
    if (r === 6) { px(0, 13, 16, 3, '#241e2c'); px(0, 13, 16, 0.7, '#c9a961'); }
    if (c === 11) { px(0, 0, 1, 16, '#2c2536'); px(0.6, 0, 0.5, 16, '#c9a961'); }
    if (c === 17) { px(15, 0, 1, 16, '#2c2536'); px(14.9, 0, 0.5, 16, '#c9a961'); }
  } else if (ch === 'P') {
    // low podium at the mouth of the aisle
    px(0, 0, 16, 16, '#332c3d');
    px(0, 0, 16, 1.2, '#41384d');
    px(0, 14.4, 16, 1.6, '#231e2c');
    px(0, 13.8, 16, 0.6, '#c9a961');
    if (n > 0.6) px(3 + (n * 8 | 0), 5, 2, 1, '#3c3448');
  } else if (ch === 'G') {
    // the gateway she comes through
    px(0, 0, 16, 16, '#15111d');
    px(0, 0, 16, 6, '#241d2e');
    px(0, 0, 16, 1.2, '#c9a961');
    px(0, 5.2, 16, 0.8, '#8d7440');
    for (let i = 0; i < 4; i++) px(i * 4 + 1, 6.5, 2, 9.5, '#2e2740');
    for (let i = 0; i < 4; i++) px(i * 4 + 1.4, 6.9, 1.2, 8.7, '#1c1728');
    if (c === AISLE_L - 2 || c === AISLE_R + 2) {
      px(c === AISLE_L - 2 ? 0 : 12, 0, 4, 16, '#2a2337');
      px(c === AISLE_L - 2 ? 1 : 13, 1, 2, 14, '#c9a961');
      px(c === AISLE_L - 2 ? 1 : 13, 1, 1, 14, '#f0dcae');
    }
  } else if (ch === 'r') {
    // the runner — deep navy weave with a pale selvedge and fallen petals
    const gr = g.createLinearGradient(X, Y, X + 16 * U * S, Y);
    if (c === AISLE_MID) { gr.addColorStop(0, '#20213a'); gr.addColorStop(0.5, '#262745'); gr.addColorStop(1, '#20213a'); }
    else { gr.addColorStop(0, '#1a1b2e'); gr.addColorStop(1, '#1e1f36'); }
    g.fillStyle = gr; g.fillRect(X, Y, 16 * U * S, 16 * U * S);
    for (let i = 0; i < 4; i++) px(0, i * 4 + (c % 2), 16, 0.4, 'rgba(255,255,255,0.028)');
    if (c === AISLE_L) { px(0, 0, 1.5, 16, '#262742'); px(1, 0, 0.5, 16, '#4a4b6b'); }
    if (c === AISLE_R) { px(14.5, 0, 1.5, 16, '#262742'); px(14.5, 0, 0.5, 16, '#4a4b6b'); }
    if (n > 0.9) {
      const petal = ['#f0c6d6', '#e8bfe0', '#fbe4ee'][(n * 3) | 0];
      px(4 + (n * 8 | 0), 3 + (n * 9 | 0), 1.5, 1, petal);
    }
    if (n < 0.08) px(9, 11, 1, 1.5, '#e6bdd0');
  } else if (ch === 'F') {
    // an unbroken bank of blooms hugging the runner
    px(0, 0, 16, 16, '#2b2534');
    const gy = g.createLinearGradient(X, Y, X, Y + 16 * U * S);
    gy.addColorStop(0, '#3f6244'); gy.addColorStop(0.55, '#33523a'); gy.addColorStop(1, '#26402c');
    g.fillStyle = gy; g.fillRect(X, Y + 3 * U * S, 16 * U * S, 13 * U * S);
    for (let i = 0; i < 6; i++) {                       // foliage
      const lx = wHash(c + i * 3, r) * 15, ly = 2 + wHash(c, r + i * 4) * 12;
      g.save(); g.translate(X + lx * U * S, Y + ly * U * S);
      g.rotate((wHash(c + i, r + i) - 0.5) * 2);
      g.fillStyle = i % 2 ? '#4a7150' : '#2e4c34';
      g.beginPath(); g.ellipse(0, 0, 2.6 * U * S, 1.1 * U * S, 0, 0, TAU); g.fill();
      g.restore();
    }
    const pinks = ['#f9c8d8','#f4aac6','#fde0ea','#eeb4dd','#ffffff','#f8cdb8','#e9bbe8'];
    for (let i = 0; i < 15; i++) {
      const bx = wHash(c + i * 5, r) * 15.5;
      const by = wHash(c, r + i * 3) * 15;
      const bs = (1.3 + wHash(c + i, r + i) * 1.7) * U * S;
      wBloom(g, X + bx * U * S, Y + by * U * S, bs, pinks[(wHash(c + i * 2, r + i) * 7) | 0]);
    }
    for (let i = 0; i < 5; i++) {                       // baby's breath
      const bx = wHash(c + i * 13, r + 2) * 15, by = wHash(c + 5, r + i * 7) * 15;
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.beginPath(); g.arc(X + bx * U * S, Y + by * U * S, 0.45 * U * S, 0, TAU); g.fill();
    }
  } else if (ch === 'H') {
    // long head table in white linen
    px(0, 2, 16, 11, '#eee8de'); px(0, 2, 16, 1.5, '#fbf7f0');
    px(0, 11.5, 16, 2, '#c3b9ad'); px(0, 13.5, 16, 1, '#8f877d');
    if (c % 2 === 0) { px(5, -1, 1.6, 4, '#efe6d6'); px(5, -2.4, 1.6, 1.6, '#ffd98a'); px(5.4, -3, 0.8, 1, '#fff4d0'); }
    if (c % 3 === 1) { pxDisc(g, X + 9 * U * S, Y + 6 * U * S, 3 * U * S, '#f6c2d4', Math.max(1, S)); px(8, 4, 1, 1, '#fff'); }
  }
}

/* ── a guest: seated at a table, or standing along the aisle ── */
function wDrawPerson(g, cx, cy, S, seed, faceX, standing) {
  const U = WT / 16, u = U * S;
  const p = (ox, oy, w, h, col) => { g.fillStyle = col; g.fillRect(cx + ox * u, cy + oy * u, w * u, h * u); };
  const q = Math.max(1, S);
  const s2 = wHash(seed * 977, 31), s3 = wHash(seed * 613, 57);
  const fem = s2 > 0.46;
  const suits  = ['#232032','#2e2438','#1d2433','#33283a','#262d3c','#2b2129'];
  const dress  = ['#5b3f56','#3f4d63','#6b4a52','#45385c','#7a5a63','#3d5052','#5d4a6e'];
  const wear   = fem ? dress[(s2 * 7) | 0] : suits[(s2 * 6) | 0];
  const hairC  = ['#241810','#3a2717','#171009','#4a3320','#2b2028'][(s3 * 5) | 0];
  const skin   = s3 > 0.55 ? '#ffdcbc' : (s3 > 0.25 ? '#f6d0ab' : '#e8bd97');
  const H = standing ? 1.15 : 1;

  if (standing) wShadow(g, cx, cy + 4.6 * u, 4.4 * u, 2 * u, 0.45);

  // body — rounded shoulders with a lit top edge
  wSoftRect(g, cx - 3 * H * u, cy - 1.4 * u, 6 * H * u, 6.4 * H * u, wear, 2.1 * u);
  const bg = g.createLinearGradient(cx, cy - 1.4 * u, cx, cy + 5 * u);
  bg.addColorStop(0, 'rgba(255,244,220,0.18)'); bg.addColorStop(0.5, 'rgba(0,0,0,0)');
  bg.addColorStop(1, 'rgba(0,0,0,0.32)');
  g.save(); wSoftRect(g, cx - 3 * H * u, cy - 1.4 * u, 6 * H * u, 6.4 * H * u, 'rgba(0,0,0,0)', 2.1 * u);
  g.clip(); g.fillStyle = bg; g.fillRect(cx - 4 * u, cy - 2 * u, 8 * u, 8 * u); g.restore();
  if (fem) {                                   // a wrap or shawl
    p(-3 * H, -1.4, 6 * H, 2.2, 'rgba(255,255,255,0.10)');
    if (s2 > 0.78) p(-1, -1.2, 2, 4.2, '#e6dfe8');
  } else {
    p(-0.9, -1.4, 1.8, 4.6, '#efeae2');        // shirt
    p(-0.45, -1.1, 0.9, 3, ['#7a2f3a','#2f3f6b','#4a3a2a','#3f5a4a'][(s3 * 4) | 0]);
  }
  // arms
  wSoftRect(g, cx - 4.2 * H * u, cy - u, 1.4 * u, 4.6 * u, wear, 0.7 * u);
  wSoftRect(g, cx + 2.9 * H * u, cy - u, 1.4 * u, 4.6 * u, wear, 0.7 * u);
  // head — hair behind, then a lit face
  pxDisc(g, cx, cy - 3.9 * u, 2.55 * u, hairC);
  if (fem) { pxDisc(g, cx - 1.9 * u, cy - 2.5 * u, 1.5 * u, hairC); pxDisc(g, cx + 1.9 * u, cy - 2.5 * u, 1.5 * u, hairC); }
  const hg = g.createRadialGradient(cx - 0.9 * u, cy - 4.1 * u, 0.2 * u, cx, cy - 3.3 * u, 2.5 * u);
  hg.addColorStop(0, skin); hg.addColorStop(0.72, skin); hg.addColorStop(1, 'rgba(150,95,60,0.55)');
  g.beginPath(); g.arc(cx, cy - 3.2 * u, 2.3 * u, 0, TAU); g.fillStyle = hg; g.fill();
  g.beginPath(); g.arc(cx, cy - 4.2 * u, 2.45 * u, Math.PI * 1.02, Math.PI * 1.98);
  g.lineTo(cx + 2.45 * u, cy - 3.4 * u); g.lineTo(cx - 2.45 * u, cy - 3.4 * u);
  g.closePath(); g.fillStyle = hairC; g.fill();
  if (fem) {                                   // longer hair falling past the shoulders
    p(-2.9, -3.9, 5.8, 3.2, hairC);
    if (s2 > 0.7) { p(-3.2, -3.6, 0.9, 4.4, hairC); p(2.3, -3.6, 0.9, 4.4, hairC); }
    if (s3 > 0.8) p(-1, -5.6, 2, 0.9, '#e6b8cc');   // a small clip
  }
  // face, turned toward the runner
  const fx = faceX * 0.55;
  p(-1.25 + fx, -3.45, 0.75, 0.85, '#241a14');
  p(0.5 + fx, -3.45, 0.75, 0.85, '#241a14');
  p(-1.35 + fx, -4.1, 0.95, 0.4, hairC);
  p(0.4 + fx, -4.1, 0.95, 0.4, hairC);
  p(-0.35 + fx, -2.3, 0.8, 0.35, '#d9a184');
  if (s3 > 0.62) { p(-1.9 + fx, -2.6, 0.6, 0.5, '#f0b2b8'); p(1.3 + fx, -2.6, 0.6, 0.5, '#f0b2b8'); }
}

/* ── round banquet table, every seat taken ── */
function wDrawTable(g, tb, S) {
  const U = WT / 16, u = U * S;
  const cx = (tb.col + 1.5) * WT * S, cy = (tb.row + 1.5) * WT * S;
  const rad = 1.15 * WT * S;
  const toAisle = tb.col < AISLE_L ? 1 : -1;

  // chairs first, so the table sits over them
  for (let i = 0; i < tb.seats; i++) {
    const a = i / tb.seats * Math.PI * 2 + 0.4;
    const chx = cx + Math.cos(a) * rad * 1.42, chy = cy + Math.sin(a) * rad * 1.42;
    wShadow(g, chx, chy + 0.18 * WT * S, 0.6 * WT * S, 0.32 * WT * S, 0.42);
    pxDisc(g, chx, chy, 0.42 * WT * S, '#1c1826');
    pxDisc(g, chx, chy - 0.09 * WT * S, 0.34 * WT * S, '#2b2438');
  }
  // guests, back rows drawn first
  const order = [...Array(tb.seats).keys()].sort((i, j) =>
    Math.sin(i / tb.seats * Math.PI * 2 + 0.4) - Math.sin(j / tb.seats * Math.PI * 2 + 0.4));
  for (const i of order) {
    const a = i / tb.seats * Math.PI * 2 + 0.4;
    wDrawPerson(g, cx + Math.cos(a) * rad * 1.42, cy + Math.sin(a) * rad * 1.42,
                S, wHash(tb.col + i * 7, tb.row + i * 3), toAisle, false);
  }
  // cloth, then the top
  wShadow(g, cx, cy + rad * 0.34, rad * 1.5, rad * 0.9, 0.5);
  pxDisc(g, cx, cy + 0.16 * WT * S, rad * 1.06, '#14111c');
  const tg = g.createRadialGradient(cx - rad * 0.35, cy - rad * 0.4, rad * 0.1, cx, cy, rad);
  tg.addColorStop(0, '#3b3350'); tg.addColorStop(0.65, '#2a2438'); tg.addColorStop(1, '#1b1725');
  g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fillStyle = tg; g.fill();
  g.beginPath(); g.arc(cx, cy, rad * 0.98, Math.PI * 1.12, Math.PI * 1.78);
  g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = rad * 0.07; g.stroke();
  // a full centrepiece of blooms — no plates, no food
  const q = Math.max(1, S);
  pxDisc(g, cx, cy, rad * 0.56, '#33523a', q);
  const petals = ['#f7bfd2','#e9b3d8','#fbe4ee','#f2a8c4','#ffffff','#f6c9b6','#dcb4e8'];
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + tb.row;
    const rr = rad * (0.18 + wHash(tb.col + i, tb.row + i * 3) * 0.44);
    wBloom(g, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr,
           rad * (0.11 + wHash(tb.col + i * 2, tb.row) * 0.08),
           petals[(wHash(tb.col + i * 5, tb.row + i) * 7) | 0]);
  }
  pxDisc(g, cx, cy - rad * 0.06, rad * 0.17, '#fdf3f7', q);
}

/* ── 혼주석: father in a suit, mother in hanbok ── */
function wDrawParent(g, pr, S) {
  const U = WT / 16, u = U * S;
  const cx = (pr.col + 0.5) * WT * S, cy = (pr.row + 0.5) * WT * S;
  const p = (ox, oy, w, h, col) => { g.fillStyle = col; g.fillRect(cx + ox * u, cy + oy * u, w * u, h * u); };
  const faceX = pr.col < AISLE_L ? 1 : -1;

  wShadow(g, cx, cy + 5.6 * u, 6.4 * u, 2.6 * u, 0.45);
  pxDisc(g, cx, cy + 4.6 * u, 3.4 * u, '#241d2f');                   // chair back
  pxDisc(g, cx, cy + 4.2 * u, 2.9 * u, '#31283f');

  if (pr.who === 'father') {
    p(-3.4, -1, 6.8, 7, '#171420');                    // suit
    p(-3.4, -1, 6.8, 1, '#241f2e');
    p(-1.1, -1, 2.2, 5.6, '#f4f0e8');                  // shirt
    p(-0.5, -0.6, 1, 4.2, '#7a2f3a');                  // tie
    p(-3.4, -1, 1.5, 7, '#12101a'); p(1.9, -1, 1.5, 7, '#12101a');
    p(2.2, 0.4, 1.1, 1.1, '#f7c9d8');                  // boutonniere
  } else {
    p(-3.8, 1.4, 7.6, 5.8, '#c98fb4');                 // hanbok chima
    p(-3.8, 1.4, 7.6, 0.8, '#dba6c6');
    p(-3.2, 5.6, 6.4, 1.4, '#b57aa2');
    p(-3, -1.2, 6, 3.2, '#f3ece0');                    // jeogori
    p(-3, -1.2, 6, 0.8, '#fbf6ee');
    p(-0.4, -1.2, 0.9, 3.2, '#9c3f52');                // goreum ribbon
    p(0.5, 0.9, 2.2, 0.9, '#9c3f52');
    p(-3, 1.6, 6, 0.7, '#6d8fb0');                     // trim
  }
  // head
  pxDisc(g, cx, cy - 3.4 * u, 2.6 * u, pr.who === 'father' ? '#ffdcbc' : '#ffdcbc', Math.max(1, S));
  const hair = pr.who === 'father' ? '#3a3438' : '#2c2028';
  pxDisc(g, cx, cy - 4.2 * u, 2.7 * u, hair, Math.max(1, S));
  p(-2.7, -5.2, 5.4, 1.8, hair);
  if (pr.who === 'mother') { p(-2.9, -4.2, 5.8, 2.4, hair); p(-1, -6, 2, 1, '#9c3f52'); }
  p(-1.3 + faceX * 0.4, -3.7, 0.8, 0.8, '#241a14');
  p(0.5 + faceX * 0.4, -3.7, 0.8, 0.8, '#241a14');
  p(-0.4, -2.5, 0.8, 0.4, '#d9a184');
}

/* ── massed pillar arrangement at the mouth of the aisle ── */
function wDrawEntryFlowers(g, fl, S) {
  const U = WT / 16, u = U * S, q = Math.max(1, S);
  const cx = (fl.col + 0.5) * WT * S, cy = (fl.row + 0.5) * WT * S;
  const R  = (fl.big ? 1.55 : 1.1) * WT * S;
  wShadow(g, cx, cy + R * 0.72, R * 1.15, R * 0.55, 0.5);
  pxDisc(g, cx, cy + R * 0.3, R * 0.66, '#2b4530', q);     // greenery mound
  pxDisc(g, cx, cy, R * 0.74, '#33523a', q);
  const petals = ['#f7bfd2','#f2a8c4','#e9b3d8','#fbe4ee','#ffffff','#f6c9b6','#dcb4e8','#fdd7e4'];
  const N = fl.big ? 34 : 22;
  for (let i = 0; i < N; i++) {
    const a2 = wHash(fl.col + i * 3, fl.row + i) * Math.PI * 2;
    const rr = R * (0.1 + wHash(fl.col + i, fl.row + i * 5) * 0.86);
    const sz = R * (0.11 + wHash(fl.col + i * 7, fl.row) * 0.1);
    const px2 = cx + Math.cos(a2) * rr, py2 = cy + Math.sin(a2) * rr * 0.92;
    wBloom(g, px2, py2, sz, petals[(wHash(fl.col + i * 2, fl.row + i * 3) * 8) | 0]);
  }
  for (let i = 0; i < 8; i++) {                            // baby's breath
    const a2 = wHash(fl.col + i * 11, fl.row + 4) * Math.PI * 2;
    const rr = R * (0.5 + wHash(fl.col, fl.row + i) * 0.6);
    g.fillStyle = '#ffffff';
    g.fillRect(cx + Math.cos(a2) * rr, cy + Math.sin(a2) * rr, u, u);
  }
  if (fl.big) {                                            // candle lanterns at its foot
    g.fillStyle = '#efe6d6'; g.fillRect(cx - R * 0.75, cy + R * 0.5, 2.4 * u, 5 * u);
    g.fillStyle = '#ffd98a'; g.fillRect(cx - R * 0.75, cy + R * 0.5 - 2 * u, 2.4 * u, 2 * u);
  }
}

/* ── memory stands down the aisle, and the groom at the top of it ── */
function wDrawPlace(g, pl, S) {
  const U = WT / 16, u = U * S;
  const X = pl.col * WT * S, Y = (pl.row - 3) * WT * S;
  const px = (ox, oy, w, h, col) => {
    g.fillStyle = col;
    g.fillRect(X + ox * u, Y + oy * u, w * u, h * u);
  };
  const done = W.visited.has(pl.ep);

  if (pl.groom) {
    // Groom: black tux, white shirt and tie, waiting at the head of the aisle
    const sway = Math.sin(W.t / 900) * 0.35;
    const gx = 8, gy = 30 + sway;
    wShadow(g, X + gx * u, Y + (gy + 21.5) * u, 8 * u, 3 * u, 0.5);
    px(gx - 4.2, gy, 8.4, 12.5, '#141119');                    // jacket
    px(gx - 4.2, gy, 8.4, 1, '#1e1a26');
    px(gx - 1.6, gy - 0.4, 3.2, 9, '#f6f2ea');                 // shirt
    px(gx - 0.9, gy + 0.4, 1.8, 7, '#ffffff');                 // white tie
    px(gx - 4.2, gy, 1.8, 12.5, '#0d0b12'); px(gx + 2.4, gy, 1.8, 12.5, '#0d0b12');
    px(gx - 6, gy + 0.8, 1.9, 9.5, '#141119');                 // arms
    px(gx + 4.1, gy + 0.8, 1.9, 9.5, '#141119');
    px(gx + 2.6, gy + 2.4, 1.6, 1.6, '#f7c9d8');               // boutonniere
    px(gx - 3.2, gy + 12.5, 3, 8.5, '#141119');                // legs
    px(gx + 0.2, gy + 12.5, 3, 8.5, '#141119');
    px(gx - 3.4, gy + 20, 3.4, 1.8, '#08060c');
    px(gx + 0.1, gy + 20, 3.4, 1.8, '#08060c');
    // head — small eyes with skin between them, not a dark bar
    pxDisc(g, X + gx * u, Y + (gy - 4.4) * u, 3.2 * u, '#ffdcbc', Math.max(1, S));
    pxDisc(g, X + gx * u, Y + (gy - 5.6) * u, 3.4 * u, '#2a1c12', Math.max(1, S));
    px(gx - 3.4, gy - 7.2, 6.8, 2, '#2a1c12');
    px(gx - 3.4, gy - 7.2, 6.8, 0.7, '#3d2a18');
    px(gx - 1.9, gy - 4.9, 0.9, 0.9, '#241a14');               // left eye
    px(gx + 1, gy - 4.9, 0.9, 0.9, '#241a14');                 // right eye
    px(gx - 2.1, gy - 5.7, 1.3, 0.5, '#3a2a1c');               // brows
    px(gx + 0.8, gy - 5.7, 1.3, 0.5, '#3a2a1c');
    px(gx - 0.6, gy - 3.2, 1.2, 0.4, '#d9a184');               // mouth
    if (!done) {
      const by = 12 - Math.sin(W.t / 320) * 2.5;
      px(gx - 3, by + 1, 2.4, 1.6, '#ff9ab5'); px(gx + 0.6, by + 1, 2.4, 1.6, '#ff9ab5');
      px(gx - 3, by + 2.6, 6, 1.6, '#ff9ab5'); px(gx - 2.2, by + 4.2, 4.4, 1.6, '#ff9ab5');
      px(gx - 1, by + 5.8, 2, 1.6, '#ff9ab5');
    }
    return;
  }

  // Memory stand: a gilt-framed photo on an easel, banked with blooms
  if (!done) {
    const halo = 0.5 + 0.5 * Math.sin(W.t / 520);
    const cx = X + 8 * u, cy = Y + 34 * u, rad = 34 * u;
    const grd = g.createRadialGradient(cx, cy, rad * 0.1, cx, cy, rad);
    grd.addColorStop(0, `rgba(255,228,190,${0.16 + halo * 0.16})`);
    grd.addColorStop(1, 'rgba(255,228,190,0)');
    g.fillStyle = grd;
    g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }

  wShadow(g, X + 8 * u, Y + 45.5 * u, 8 * u, 3 * u, 0.55);
  px(6.4, 33, 3.2, 12, '#7a6436'); px(6.4, 33, 1, 12, '#c9a961');
  px(3.5, 43.5, 9, 1.6, '#6d5a33');
  px(0.6, 13, 14.8, 21, '#8d7440');                    // frame
  px(1.4, 13.8, 13.2, 19.4, '#e0c07a');
  px(2.4, 14.8, 11.2, 17.4, '#c9a961');
  px(3.4, 15.8, 9.2, 15.4, done ? '#403752' : '#241f30');
  if (done) {
    px(4.6, 19, 6.8, 6.8, '#f6c2d4'); px(4, 27, 8, 3.4, '#e0b6e8');
    px(5.6, 20.4, 2, 2, '#fbe4ee');
  } else {
    px(4.6, 20, 6.8, 5.6, '#4a4260'); px(4, 27, 8, 3.4, '#413a55');
  }
  px(3.4, 15.8, 9.2, 1.4, 'rgba(255,255,255,0.20)');

  const blooms = ['#f7bfd2', '#e6bfee', '#fad6bb', '#fbf4f7', '#f2aecb'];
  px(0, 35, 16, 9, '#2f4a33'); px(1, 33.5, 14, 3, '#3c5c40');
  for (let i = 0; i < 11; i++) {
    const bx = ((wHash(pl.col + i * 3, pl.row) * 14) | 0);
    const by = 33 + ((wHash(pl.col, pl.row + i * 4) * 10) | 0);
    wBloom(g, X + (bx + 1.4) * u, Y + (by + 1.4) * u, 1.6 * u,
           blooms[(wHash(pl.col + i, pl.row + i) * 5) | 0]);
  }
  const cx2 = pl.side < 0 ? 13.2 : 0.6;
  px(cx2, 39, 2.4, 6, '#efe6d6'); px(cx2, 36.8, 2.4, 2.2, '#ffd98a');
  px(cx2 + 0.7, 35.4, 1, 1.6, '#fff4d0');

  if (!done) {
    const by = 3 - Math.sin(W.t / 320) * 2.5;
    px(3, by, 10, 8, '#ffffff'); px(5, by + 8, 6, 2.6, '#ffffff');
    px(7, by + 10.6, 2, 1.8, '#ffffff');
    px(6, by + 2, 4, 4, '#ff6b8f');
  }
}

/* ── the bride: gown, veil and a long trailing train ── */
function wDrawGirl(g, sx, sy, dir, step, S) {
  const U = WT / 16, u = U * S;
  const p = (ox, oy, w, h, col) => {
    g.fillStyle = col;
    g.fillRect(sx + ox * u, sy + oy * u, w * u, h * u);
  };
  const HAIR='#3d2416', HAIR2='#5c3720', SKIN='#ffdcbc', SKIN2='#e8b894',
        GOWN='#fbf8f2', GOWN2='#e9e3d9', GOWN3='#d3ccc1',
        PINK='#f2b8cc', LILAC='#ddb6e8', PEACH='#f7cdb0', LEAF='#5d7a55',
        EYE='#2b1b12';
  const la = step === 1 ? 1 : 0, ra = step === 2 ? 1 : 0;
  const sway = step ? 0.6 : 0;

  wShadow(g, sx + 8 * u, sy + 21 * u, 8 * u, 3.4 * u, 0.5);

  /* Veil and train always fall away from the way she is facing: behind her
     back when she walks up the aisle, and above her when she turns round. */
  const tiers = [[6.2, 3.6, 0.16], [5.2, 5.6, 0.26], [4.2, 7.6, 0.38],
                 [3.2, 9.6, 0.50], [2.2, 11.6, 0.62], [1.6, 12.8, 0.74]];
  const veilAt = (ox, ow, len, al) => {
    if (dir === 'down')       p(ox, 4 - len, ow, len, `rgba(252,249,244,${al})`);
    else if (dir === 'up')    p(ox, 17, ow, len, `rgba(252,249,244,${al})`);
    else if (dir === 'left')  p(11, 6, len, ow, `rgba(252,249,244,${al})`);
    else                      p(5 - len, 6, len, ow, `rgba(252,249,244,${al})`);
  };
  let off = 0;
  for (let i = tiers.length - 1; i >= 0; i--) {
    const [ox, ow, al] = tiers[i];
    const len = 6 + i * 1.4;
    if (dir === 'down')      p(ox, -off - len + 4, ow, len, `rgba(252,249,244,${al})`);
    else if (dir === 'up')   p(ox, 15 + off, ow, len, `rgba(252,249,244,${al})`);
    else if (dir === 'left') p(9 + off, 4 + (16 - ow) / 2 - 2, len, ow, `rgba(252,249,244,${al})`);
    else                     p(7 - off - len, 4 + (16 - ow) / 2 - 2, len, ow, `rgba(252,249,244,${al})`);
    off += len * 0.72;
  }
  // veil over the shoulders, and its cap on the back of her head
  if (dir === 'up')        { p(2, 10, 12, 8, 'rgba(255,253,250,0.30)'); p(2.4, 2.6, 11.2, 11, 'rgba(255,253,250,0.42)'); p(3.2, 1.6, 9.6, 4, 'rgba(255,255,255,0.34)'); }
  else if (dir === 'down') { p(2.6, 1, 10.8, 4, 'rgba(255,253,250,0.34)'); p(3.4, 0.4, 9.2, 2, 'rgba(255,255,255,0.40)'); }
  else                     { p(dir === 'left' ? 7 : 2.2, 2, 6.8, 12, 'rgba(255,253,250,0.30)'); }

  if (dir === 'up') {
    p(3,1,10,9,HAIR); p(2,3,2,6,HAIR); p(12,3,2,6,HAIR);
    p(4,2,8,3,HAIR2);
    p(4.5,0,7,2,'#f6eef2'); p(5.5,0,2,1,PINK); p(9,0,2,1,LILAC);
    p(6,10,4,1,SKIN2);
    p(5,11,6,4,GOWN); p(4,14,8,4,GOWN); p(2.4,17,11.2,4.5,GOWN);
    p(2.4,20.6,11.2,1,GOWN3); p(4,15,8,0.8,GOWN2);
    p(3,11,2,4,SKIN); p(11,11,2,4,SKIN);
  } else if (dir === 'down') {
    p(3,1,10,9,HAIR);
    p(4,3,8,7,SKIN);
    p(3,1,10,3,HAIR); p(3,2,2,5,HAIR); p(11,2,2,5,HAIR);
    p(5,6,1.8,1.8,EYE); p(9.2,6,1.8,1.8,EYE);
    p(5,6,0.7,0.7,'#ffffff'); p(9.2,6,0.7,0.7,'#ffffff');
    p(4,8,1,1,PINK); p(11,8,1,1,PINK);
    p(7,8.4,2,0.8,SKIN2);
    p(4,0,8,2,'#f6eef2'); p(5,0,2,1,PINK); p(9,0,2,1,LILAC);
    p(7,10,2,1,SKIN2);
    p(5,11,6,4,GOWN); p(4,14,8,4,GOWN); p(2.4,17,11.2,4.5,GOWN);
    p(2.4,20.6,11.2,1,GOWN3); p(4,15,8,0.8,GOWN2); p(5,11,6,0.8,GOWN2);
    p(3,11,2,4,SKIN); p(11,11,2,4,SKIN);
    p(5,13,6,5,LEAF);                                  // bouquet
    pxDisc(g, sx + 6.4 * u, sy + 14.4 * u, 2 * u, PINK, Math.max(1, S));
    pxDisc(g, sx + 9.4 * u, sy + 13.6 * u, 1.9 * u, LILAC, Math.max(1, S));
    pxDisc(g, sx + 8 * u, sy + 16.6 * u, 1.8 * u, PEACH, Math.max(1, S));
    p(5.8,13.4,0.7,0.7,'#ffffff'); p(8.9,12.8,0.7,0.7,'#ffffff');
  } else {
    const flip = dir === 'left';
    const q = (ox, oy, w, h, col) => p(flip ? 16 - ox - w : ox, oy, w, h, col);
    q(3,1,10,9,HAIR);
    q(6,3,6,7,SKIN);
    q(3,1,9,3,HAIR); q(3,2,3,7,HAIR);
    q(9,6,1.8,1.8,EYE); q(9,6,0.7,0.7,'#ffffff');
    q(11,8,1,1,PINK);
    q(4,0,7,2,'#f6eef2'); q(5,0,2,1,PINK);
    q(7,10,3,1,SKIN2);
    q(5,11,7,4,GOWN); q(4,14,9,4,GOWN); q(3,17,10.6,4.5,GOWN);
    q(3,20.6,10.6,1,GOWN3); q(4,15,9,0.8,GOWN2);
    q(10,11,2,4,SKIN);
    q(9,13,5,4,LEAF); q(9,13,3,3,PINK); q(11,14,3,3,LILAC);
  }

  // satin sheen down the gown
  const sg = g.createLinearGradient(sx + 2 * u, sy, sx + 14 * u, sy);
  sg.addColorStop(0, 'rgba(120,110,130,0.22)'); sg.addColorStop(0.34, 'rgba(255,255,255,0.30)');
  sg.addColorStop(0.62, 'rgba(255,255,255,0.06)'); sg.addColorStop(1, 'rgba(110,100,120,0.26)');
  g.save(); g.beginPath();
  g.moveTo(sx + 5 * u, sy + 11 * u); g.lineTo(sx + 11 * u, sy + 11 * u);
  g.lineTo(sx + 13.6 * u, sy + 21.4 * u); g.lineTo(sx + 2.4 * u, sy + 21.4 * u);
  g.closePath(); g.clip(); g.fillStyle = sg;
  g.fillRect(sx, sy + 10 * u, 16 * u, 12 * u); g.restore();

  // hem shifts a touch as she walks — a gown shows no stride
  p(3 + sway, 21.4, 4, 0.8, GOWN2);
  p(9 - sway, 21.4, 4, 0.8, GOWN2);
  if (la) p(3, 20.6, 3, 0.8, GOWN);
  if (ra) p(10, 20.6, 3, 0.8, GOWN);
}

/* ── frame ── */
function wRender() {
  const cv = $('world-canvas'), g = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = cv.clientWidth, chh = cv.clientHeight;
  if (cv.width !== (cw * dpr | 0) || cv.height !== (chh * dpr | 0)) {
    cv.width = cw * dpr | 0; cv.height = chh * dpr | 0;
  }
  const S = W.scale = Math.max(1, Math.min(3, Math.round(Math.min(cw, chh) / 300)));
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';

  // camera — centred on the girl, clamped to the map
  const mapW = W_COLS * WT * S, mapH = W_ROWS * WT * S;
  let camX = W.x * S - cw / 2, camY = W.y * S - chh / 2;
  camX = mapW <= cw ? (mapW - cw) / 2 : Math.max(0, Math.min(mapW - cw, camX));
  camY = mapH <= chh ? (mapH - chh) / 2 : Math.max(0, Math.min(mapH - chh, camY));

  g.fillStyle = '#141119';
  g.fillRect(0, 0, cw, chh);
  g.save();
  g.translate(-Math.round(camX), -Math.round(camY));

  // only draw the tiles the camera can see
  const c0 = Math.max(0, Math.floor(camX / (WT * S)) - 1);
  const c1 = Math.min(W_COLS - 1, Math.ceil((camX + cw) / (WT * S)));
  const r0 = Math.max(0, Math.floor(camY / (WT * S)) - 1);
  const r1 = Math.min(W_ROWS - 1, Math.ceil((camY + chh) / (WT * S)));
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++) {
      wDrawTile(g, wTileAt(c, r), c, r, S);
    }

  // pools of warm light under every fixture
  for (const ch2 of W_CHANDELIERS) {
    const gx = (ch2.col + 0.5) * WT * S, gy = (ch2.row + 0.5) * WT * S;
    const rad = (ch2.big ? 5.2 : 3.4) * WT * S;
    const glow = g.createRadialGradient(gx, gy, 0, gx, gy, rad);
    const flick = 0.86 + 0.14 * Math.sin(W.t / 700 + ch2.row);
    glow.addColorStop(0, `rgba(255,226,170,${(ch2.big ? 0.24 : 0.15) * flick})`);
    glow.addColorStop(0.5, `rgba(255,214,150,${0.07 * flick})`);
    glow.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = glow;
    g.fillRect(gx - rad, gy - rad, rad * 2, rad * 2);
  }

  // the floor is polished, so the fixtures streak back down it
  for (const ch2 of W_CHANDELIERS) {
    if (!ch2.big) continue;
    const gx = (ch2.col + 0.5) * WT * S, gy = (ch2.row + 0.5) * WT * S;
    const h = 3.6 * WT * S, w = 0.9 * WT * S;
    const refl = g.createLinearGradient(gx, gy, gx, gy + h);
    refl.addColorStop(0, 'rgba(255,232,180,0.16)');
    refl.addColorStop(1, 'rgba(255,232,180,0)');
    g.fillStyle = refl; g.fillRect(gx - w / 2, gy, w, h);
  }

  // depth sort so she passes in front of a stand she has walked past
  const inView = (col, row, pad = 4) =>
    col > c0 - pad && col < c1 + pad && row > r0 - pad && row < r1 + pad;
  const drawables = W_PLACES.map(pl => ({
    y: pl.groom ? (pl.row - 3) * WT + 51 * (WT / 16) : pl.row * WT + 8,
    f: () => wDrawPlace(g, pl, S),
  }));
  for (const tb of W_TABLES)
    if (inView(tb.col, tb.row))
      drawables.push({ y: (tb.row + 3) * WT, f: () => wDrawTable(g, tb, S) });
  for (const pr of W_PARENTS)
    if (inView(pr.col, pr.row))
      drawables.push({ y: (pr.row + 1) * WT, f: () => wDrawParent(g, pr, S) });
  for (const st of W_STANDING)
    if (inView(st.col, st.row, 3))
      drawables.push({ y: (st.row + 0.6) * WT,
        f: () => wDrawPerson(g, (st.col + 0.5) * WT * S, (st.row + 0.5) * WT * S, S, st.seed, st.face, true) });
  for (const fl of W_ENTRY_FLOWERS)
    if (inView(fl.col, fl.row, 3))
      drawables.push({ y: (fl.row + 0.8) * WT, f: () => wDrawEntryFlowers(g, fl, S) });
  drawables.push({ y: W.y, f: () => wDrawGirl(g, Math.round(W.x * S) - WT / 2 * S, Math.round(W.y * S) - 21 * (WT / 16) * S, W.dir, W.step, S) });
  drawables.sort((a, b) => a.y - b.y).forEach(d => d.f());

  // crystal chandeliers, seen from below — tiered drops around a bright core
  for (const ch2 of W_CHANDELIERS) {
    const gx = (ch2.col + 0.5) * WT * S, gy = (ch2.row + 0.5) * WT * S;
    const tw = 0.88 + 0.12 * Math.sin(W.t / 640 + ch2.col * 1.7 + ch2.row);
    const R  = (ch2.big ? 0.66 : 0.44) * WT * S;
    const q  = Math.max(1, S);
    // a soft square of light, like the coffered crystal panels overhead
    g.fillStyle = `rgba(255,238,198,${0.10 * tw})`;
    g.fillRect(gx - R * 1.5, gy - R * 1.5, R * 3, R * 3);
    const core = g.createRadialGradient(gx, gy, 0, gx, gy, R * 1.7);
    core.addColorStop(0, `rgba(255,246,220,${0.55 * tw})`);
    core.addColorStop(1, 'rgba(255,232,180,0)');
    g.fillStyle = core;
    g.fillRect(gx - R * 1.7, gy - R * 1.7, R * 3.4, R * 3.4);
    // a couple of tiers of crystal drops, kept small so the fixture reads as
    // a light rather than a ring of dots
    for (const [ring, cnt, al] of [[1, 9, 0.5], [0.58, 6, 0.8]]) {
      for (let k = 0; k < cnt; k++) {
        const ang = k / cnt * Math.PI * 2 + ring * 3 + ch2.row;
        const dx2 = gx + Math.cos(ang) * R * ring, dy2 = gy + Math.sin(ang) * R * ring;
        g.fillStyle = `rgba(255,250,232,${al * tw})`;
        g.beginPath(); g.arc(dx2, dy2, R * 0.07, 0, TAU); g.fill();
      }
    }
    // bright body of the fixture
    const halo = g.createRadialGradient(gx, gy, 0, gx, gy, R * 0.95);
    halo.addColorStop(0, `rgba(255,254,248,${0.98 * tw})`);
    halo.addColorStop(0.25, `rgba(255,246,214,${0.72 * tw})`);
    halo.addColorStop(0.6, `rgba(255,232,178,${0.26 * tw})`);
    halo.addColorStop(1, 'rgba(255,228,170,0)');
    g.fillStyle = halo; g.beginPath(); g.arc(gx, gy, R * 0.95, 0, TAU); g.fill();
  }

  g.restore();

  // warm grade: candlelight up the middle, cool in the corners
  const grade = g.createLinearGradient(0, 0, 0, chh);
  grade.addColorStop(0, 'rgba(255,214,150,0.07)');
  grade.addColorStop(0.5, 'rgba(255,226,180,0.04)');
  grade.addColorStop(1, 'rgba(90,80,150,0.07)');
  g.fillStyle = grade; g.fillRect(0, 0, cw, chh);

  // hall vignette — the room is lit only where it matters
  const vig = g.createRadialGradient(cw / 2, chh * 0.46, Math.min(cw, chh) * 0.22,
                                     cw / 2, chh * 0.46, Math.max(cw, chh) * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.44)');
  g.fillStyle = vig;
  g.fillRect(0, 0, cw, chh);
}

/* She stays on the runner — the aisle is the only ground she walks. */
function wCanMove(nx, ny) {
  const pts = [[nx - 9, ny - 5], [nx + 9, ny - 5], [nx - 9, ny], [nx + 9, ny]];
  return pts.every(([px2, py2]) => {
    const t = wTileAt(Math.floor(px2 / WT), Math.floor(py2 / WT));
    return t === 'r' || t === 'P';
  });
}

function wNearPlace() {
  const c = Math.floor(W.x / WT), r = Math.floor(W.y / WT);
  // she can be anywhere across the runner, so match generously on the column
  return W_PLACES.find(pl => Math.abs(pl.doorCol - c) <= 2 && Math.abs(pl.doorRow - r) <= 1) || null;
}

function wStep(dt) {
  const sp = 104 / 1000 * dt;   // world px this frame
  let dx = W.vx, dy = W.vy;
  const mag = Math.hypot(dx, dy);
  if (mag > 1) { dx /= mag; dy /= mag; }
  W.moving = mag > 0.12 && !W.locked;
  if (W.locked) { dx = dy = 0; }

  if (W.moving) {
    if (Math.abs(dx) > Math.abs(dy)) W.dir = dx < 0 ? 'left' : 'right';
    else                             W.dir = dy < 0 ? 'up' : 'down';
    const nx = W.x + dx * sp, ny = W.y + dy * sp;
    if (wCanMove(nx, W.y)) W.x = nx;
    if (wCanMove(W.x, ny)) W.y = ny;
    W.walkT += dt;
    if (W.walkT > 150) { W.walkT = 0; W.step = W.step === 1 ? 2 : 1; }
  } else { W.step = 0; W.walkT = 0; }

  // door prompt
  const near = W.locked ? null : wNearPlace();
  if (near !== W.near) {
    W.near = near;
    const el = $('world-prompt');
    if (near) {
      const lock = wLocked(near);
      $('world-prompt-name').textContent = lock
        ? `${near.name} · 아직이야` : near.name;
      el.classList.toggle('show', !lock);
    } else el.classList.remove('show');
  }
}

function wLoop(ts) {
  if (!W.on) return;
  const dt = Math.min(48, ts - (W.last || ts));
  W.last = ts; W.t += dt;
  wStep(dt);
  wRender();
  W.raf = requestAnimationFrame(wLoop);
}

/* ── controls: on-screen stick + keyboard ── */
function wInitControls() {
  const stick = $('world-stick'), knob = $('world-stick-knob');
  let id = null, cx = 0, cy = 0;
  const R = 34;        // how far the knob may travel
  const LIVE = 11;     // ...but this much deflection is already full speed
  const set = (dx, dy) => {
    const m = Math.hypot(dx, dy) || 1;
    const cl = Math.min(m, R);
    knob.style.transform = `translate(${dx / m * cl}px, ${dy / m * cl}px)`;
    const out = Math.min(1, m / LIVE);          // saturates after a nudge
    W.vx = dx / m * out; W.vy = dy / m * out;
  };
  const reset = () => { knob.style.transform = ''; W.vx = W.vy = 0; id = null; };

  stick.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; id = t.identifier;
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    set(t.clientX - cx, t.clientY - cy);
  }, { passive: true });
  stick.addEventListener('touchmove', e => {
    for (const t of e.changedTouches)
      if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
  }, { passive: true });
  stick.addEventListener('touchend',    reset, { passive: true });
  stick.addEventListener('touchcancel', reset, { passive: true });

  // mouse drag, for desktop
  stick.addEventListener('mousedown', e => {
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    id = 'm'; set(e.clientX - cx, e.clientY - cy);
    const mv = ev => { if (id === 'm') set(ev.clientX - cx, ev.clientY - cy); };
    const up = () => { reset(); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });

  const keys = {};
  const apply = () => {
    W.vx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    W.vy = (keys.ArrowDown  || keys.s ? 1 : 0) - (keys.ArrowUp   || keys.w ? 1 : 0);
  };
  window.addEventListener('keydown', e => {
    if (!W.on) return;
    if (e.key === 'Enter' || e.key === ' ') { wTryEnter(); return; }
    keys[e.key] = true; apply();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; apply(); });

  $('world-prompt').addEventListener('click', wTryEnter);
}

function wTryEnter() {
  if (!W.on || W.locked || !W.near) return;
  const pl = W.near;
  if (wLocked(pl)) return;
  W.locked = true;
  W.vx = W.vy = 0;
  $('world-prompt').classList.remove('show');
  $('world-stick').classList.remove('show');
  $('world-hint').classList.remove('show');
  W.visited.add(pl.ep);
  enterChapter(pl.ep);
}

async function openWorld(firstTime) {
  await fadeTo('pg-world');
  W.on = true; W.locked = false; W.last = 0;
  if (!W.raf) W.raf = requestAnimationFrame(wLoop);
  CHAPTERS.forEach((_, i) => preloadChapterMedia(i));
  await sleep(260);
  $('world-stick').classList.add('show');
  if (firstTime) {
    $('world-hint').classList.add('show');
    setTimeout(() => $('world-hint').classList.remove('show'), 5200);
  }
}

/* Called when an episode's reel finishes — walk back out into the world */
async function returnToWorld() {
  stopAutoPlay();
  await closePhotoViewer(true);
  $('ch-detail').classList.remove('show');
  $('ch-hd').classList.remove('in');
  $('ch-scroll').classList.remove('show');
  $('ch-foot').classList.remove('show');
  await fadeTo('pg-world');
  // step the girl back out in front of the door she came from
  const pl = W.near;
  if (pl) {
    W.x = AISLE_MID * WT + WT / 2;
    W.y = (pl.doorRow + 1) * WT + WT / 2;
    W.dir = 'up';
  }
  W.on = true; W.locked = false; W.last = 0; W.near = null;
  if (!W.raf) W.raf = requestAnimationFrame(wLoop);
  $('world-stick').classList.add('show');
}

function closeWorld() {
  W.on = false;
  if (W.raf) { cancelAnimationFrame(W.raf); W.raf = 0; }
  $('world-stick').classList.remove('show');
  $('world-prompt').classList.remove('show');
  $('world-hint').classList.remove('show');
}

/* ════════════════════════════════════
   ORIENTATION — re-layout anything positioned in JS pixels
════════════════════════════════════ */
function relayoutForOrientation() {
  // Carousel cards are placed with JS transforms — restep them for the new width
  if ($('cc0')) positionCards(activeCard, false);

  // Confetti canvas is a fixed-size bitmap
  const canvas = $('confetti');
  if (canvas && canvas.style.display !== 'none') {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  // The dodging button lives in absolute pixels — pull it back on screen
  if ($('pg-proposal').classList.contains('active')) {
    const btn = $('btn-no');
    const { w, h } = noBtnSize();
    const left = parseFloat(btn.style.left) || 0;
    const top  = parseFloat(btn.style.top)  || 0;
    if (left + w > window.innerWidth - 8 || top + h > window.innerHeight - 8) placeNo();
  }
}

let _orientTimer = null;
function onViewportChange() {
  clearTimeout(_orientTimer);
  // wait for the browser to settle on the new viewport size before measuring
  _orientTimer = setTimeout(relayoutForOrientation, 220);
}
window.addEventListener('orientationchange', onViewportChange);
window.addEventListener('resize', onViewportChange);

/* ════════════════════════════════════
   BOOT
════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  initLock();
  initGridDismiss();
  wInitControls();
  $('btn-ch-next').addEventListener('click', onChapterNext);
  $('btn-yes').addEventListener('click', onYes);
  $('btn-no').addEventListener('click', dodgeNo);

  // ─── Photo Viewer Touch ───────────────────────────────────
  // ① 좌/우 탭 or 스와이프 → 이전/다음
  // ② 가운데 탭          → 프로그레스바 토글 (2.5s 후 자동 숨김)
  // ③ 길게 누름          → 멈춤 (바 표시 + 타이머 정지)
  // ④ 아래 스와이프      → 뷰어 닫기 (슬라이드 다운)
  let pvStartX = 0, pvStartY = 0, pvStartT = 0;
  let pvMoveX  = 0, pvMoveY  = 0;
  let pvLongTimer = null;

  const pvEl   = $('photo-viewer');
  const pvBody = $('pv-body');

  function pvShowBars() {
    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
    pvBarsVisible = true;
    const bars = $('pv-bars');
    bars.style.transition = 'opacity 0.35s ease';
    bars.style.opacity = '1';
  }
  function pvHideBars() {
    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
    pvBarsVisible = false;
    const bars = $('pv-bars');
    bars.style.transition = 'none';
    bars.style.opacity = '0';
  }
  function pvToggleBars() {
    if (pvBarsVisible) {
      pvHideBars();
    } else {
      pvShowBars();
      pvBarsHideTimer = setTimeout(pvHideBars, 2500);
    }
  }

  function pvGoNext() {
    const cIdx   = apChIdx >= 0 ? apChIdx : currentCh;
    const photos = CHAPTERS[cIdx].photos;
    if (apPIdx < photos.length - 1) {
      const next = apPIdx + 1;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = next; apRunning = true;
      openPhotoViewer(cIdx, next, true).then(dur => { if (apRunning) startHoldTimer(dur); });
    } else {
      stopAutoPlay();
      if (isManualMode) {
        // manual mode: last photo → close viewer, stay in grid
        closePhotoViewer(false);
      } else {
        closePhotoViewer(false).then(() => onChapterNext());
      }
    }
  }
  function pvGoPrev() {
    if (apPIdx > 0) {
      const prev = apPIdx - 1;
      const cIdx = apChIdx >= 0 ? apChIdx : currentCh;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = prev; apRunning = true;
      openPhotoViewer(cIdx, prev, true).then(dur => startHoldTimer(dur));
    } else { resumeHold(); }
  }

  function pvBodyReset(animate) {
    if (animate) {
      pvBody.style.transition = 'transform 0.42s cubic-bezier(0.16,1,0.3,1), opacity 0.32s ease';
      requestAnimationFrame(() => {
        pvBody.style.transform = '';
        pvBody.style.opacity   = '';
      });
      setTimeout(() => { pvBody.style.transition = ''; }, 500);
    } else {
      pvBody.style.transition = '';
      pvBody.style.transform  = '';
      pvBody.style.opacity    = '';
    }
  }

  pvEl.addEventListener('touchstart', (e) => {
    const t  = e.touches[0];
    pvStartX = t.clientX; pvStartY = t.clientY;
    pvStartT = Date.now();
    pvMoveX  = 0; pvMoveY = 0;
    // 300ms 유지 시에만 일시정지 (빠른 탭에서 버벅임 방지)
    pvLongTimer = setTimeout(() => { pauseHold(); pvShowBars(); }, 300);
  }, { passive: true });

  pvEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    pvMoveX = t.clientX - pvStartX;
    pvMoveY = t.clientY - pvStartY;
    // 아래 드래그: 바디가 손가락 따라 내려옴
    if (pvMoveY > 0 && pvMoveY > Math.abs(pvMoveX) * 0.7) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
      const damped = pvMoveY * 0.55;
      const sc     = Math.max(0.88, 1 - pvMoveY / 1800);
      const al     = Math.max(0.25, 1 - pvMoveY / 260);
      pvBody.style.transition = 'none';
      pvBody.style.transform  = `translateY(${damped}px) scale(${sc})`;
      pvBody.style.opacity    = al;
    } else if (Math.abs(pvMoveX) > 8) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    }
  }, { passive: true });

  pvEl.addEventListener('touchend', (e) => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    const t    = e.changedTouches[0];
    const dx   = t.clientX - pvStartX;
    const dy   = t.clientY - pvStartY;
    const adx  = Math.abs(dx);
    const ady  = Math.abs(dy);
    const held = Date.now() - pvStartT;

    // ④ 아래 스와이프 → 슬라이드 다운 닫기
    if (dy > 60 && ady > adx * 0.8) {
      pvHideBars();
      stopAutoPlay();
      pvBody.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.6,1), opacity 0.28s ease';
      pvBody.style.transform  = `translateY(${pvMoveY * 0.55 + window.innerHeight * 0.22}px) scale(0.84)`;
      pvBody.style.opacity    = '0';
      pvEl.classList.remove('show'); // CSS transition 으로 fade-out
      setTimeout(() => { pvBodyReset(false); }, 380);
      return;
    }

    // ③ 길게 누름 → 재개 + 바 잠시 유지 후 숨김
    if (held >= 450 && adx < 18 && ady < 18) {
      pvBodyReset(true);
      pvBarsHideTimer = setTimeout(pvHideBars, 1000);
      resumeHold();
      return;
    }

    // ① 가로 스와이프 → 이전/다음
    if (adx > 36 && adx > ady * 1.2) {
      pvBodyReset(true);
      dx < 0 ? pvGoNext() : pvGoPrev();
      return;
    }

    // 탭 (움직임 없음) → 존 기반
    if (adx <= 22 && ady <= 22) {
      pvBodyReset(false);   // 즉시 리셋 — rAF 없이 bars transition과 충돌 방지
      const zone = t.clientX / window.innerWidth;
      if      (zone < 0.33) { pvGoPrev(); return; }
      else if (zone > 0.67) { pvGoNext(); return; }
      else                  { pvToggleBars(); resumeHold(); return; }
    }

    pvBodyReset(true);
    resumeHold();
  });

  pvEl.addEventListener('touchcancel', () => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    pvBodyReset(true);
    pvHideBars();
    resumeHold();
  });
});
</script>
</body>
</html>
