function buildCarousel() {
  const stage = $('carousel-stage');
  const dots  = $('carousel-dots');
  stage.innerHTML = ''; dots.innerHTML = '';

  CHAPTERS.forEach((ch, i) => {
    // card
    const card = document.createElement('div');
    card.className = 'cc'; card.id = `cc${i}`;
    card.style.boxShadow = CC_GLOW[i];
    card.innerHTML = `
      <div class="cc-bg" style="background:${ch.bg}"></div>
      <div class="cc-nebula" style="background:${CC_NEBULA[i]}"></div>
      <div class="cc-tex"></div>
      <div class="cc-shim"></div>
      <div class="cc-deco">${ch.deco}</div>
      <div class="cc-line"></div>
      <div class="cc-content">
        <div class="cc-num">${ch.num}</div>
        <div class="cc-name">${ch.name}</div>
        <div class="cc-date">${ch.sub}</div>
      </div>`;

    stage.appendChild(card);

    // dot
    const dot = document.createElement('div');
    dot.className = 'cdot'; dot.id = `cdot${i}`;
    dots.appendChild(dot);
  });

  positionCards(0, false);
  initCarouselTouch();
}

function positionCards(idx, animated) {
  activeCard = idx;
  CHAPTERS.forEach((_, i) => {
    const card = $(`cc${i}`);
    const offset = i - idx;
    const x = offset * cardStep();
    const scale = Math.max(0.76, 1 - Math.abs(offset) * 0.13);
    const opacity = Math.max(0.28, 1 - Math.abs(offset) * 0.33);
    const zIndex = 10 - Math.abs(offset);
    card.style.transition = animated
      ? 'transform 0.58s cubic-bezier(0.16,1,0.3,1), opacity 0.55s ease'
      : 'none';
    card.style.transform = `translateX(${x}px) scale(${scale})`;
    card.style.opacity   = opacity;
    card.style.zIndex    = zIndex;
  });
  // dots
  CHAPTERS.forEach((_, i) => {
    $(`cdot${i}`).classList.toggle('active', i === idx);
  });
}

/* ─── touch & click on carousel ─── */
function initCarouselTouch() {
  const stage = $('carousel-stage');
  let startX = 0, startT = 0, dragging = false, liveOffset = 0;

  stage.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startT = Date.now();
    dragging = false; liveOffset = 0;
    // kill transition during drag
    CHAPTERS.forEach((_, i) => {
      $(`cc${i}`).style.transition = 'none';
    });
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    if (!dragging && Math.abs(dx) > 8) dragging = true;
    if (!dragging) return;
    liveOffset = dx;
    // live drag: shift all cards
    CHAPTERS.forEach((_, i) => {
      const offset = i - activeCard;
      const baseX = offset * cardStep() + dx * 0.88;
      const scale = Math.max(0.76, 1 - Math.abs(offset) * 0.13);
      $(`cc${i}`).style.transform = `translateX(${baseX}px) scale(${scale})`;
    });
  }, { passive: true });

  stage.addEventListener('touchend', e => {
    if (!dragging) {
      // tap: find which card was touched
      const touchX = e.changedTouches[0].clientX;
      const stageRect = stage.getBoundingClientRect();
      const cx = stageRect.left + stageRect.width / 2;
      const touched = Math.round((cx - touchX) / cardStep()) * -1 + activeCard;
      const clamped = Math.max(0, Math.min(CHAPTERS.length - 1, touched));

      if (clamped !== activeCard) {
        positionCards(clamped, true);
      } else {
        // tap on active card → enter
        if (!busy) enterChapter(activeCard);
      }
      return;
    }

    const dt = Date.now() - startT;
    const velocity = Math.abs(liveOffset) / dt; // px/ms
    const threshold = Math.abs(liveOffset) > 55 || velocity > 0.35;

    if (threshold) {
      const dir = liveOffset < 0 ? 1 : -1;
      const next = Math.max(0, Math.min(CHAPTERS.length - 1, activeCard + dir));
      positionCards(next, true);
    } else {
      positionCards(activeCard, true); // snap back
    }
    dragging = false; liveOffset = 0;
  }, { passive: true });

  // click fallback (desktop / non-touch)
  stage.addEventListener('click', e => {
    const card = e.target.closest('.cc'); if (!card) return;
    const idx = parseInt(card.id.replace('cc',''));
    if (idx !== activeCard) {
      positionCards(idx, true);
    } else {
      if (!busy) enterChapter(idx);
    }
  });
}

/* After the opening letter: the pixel world by default, cards if switched */
function startJourney() {
  if (classicMode) goToChapters();
  else             openWorld(true);
}

async function goToChapters() {
  await fadeTo('pg-chapters', buildCarousel);

  // zoom-out reveal — stage scales from large to normal
  const stage = $('carousel-stage');
  stage.style.transform = 'scale(1.4)';
  stage.style.opacity   = '0';
  stage.style.transition = 'none';
  await sleep(60);
  stage.style.transition = 'transform 0.85s cubic-bezier(0.16,1,0.3,1), opacity 0.7s ease';
  stage.style.transform  = 'scale(1)';
  stage.style.opacity    = '1';

  // Kick off preloading for ALL chapters while user sees carousel
  CHAPTERS.forEach((_, i) => preloadChapterMedia(i));

  // pause so user sees carousel, then auto-enter ch0
  await sleep(2400);
  if (!busy && !isManualMode) enterChapter(0);
}

async function enterChapter(idx) {
  if (busy) return;
  busy = true; currentCh = idx;
  const ch = CHAPTERS[idx];

  // Ensure media is queued for download before any animation delay
  preloadChapterMedia(idx);

  if ($('cc0')) {
    // Coming from the card carousel — focus the card, dim the rest
    if (activeCard !== idx) positionCards(idx, true);
    await sleep(400);
    CHAPTERS.forEach((_, i) => {
      const c = $(`cc${i}`);
      if (i !== idx) {
        c.style.transition = 'transform 0.55s ease, opacity 0.55s ease';
        c.style.transform  = `translateX(${(i - idx) * cardStep()}px) scale(0.72)`;
        c.style.opacity    = '0.05';
      } else {
        c.style.transition = 'transform 0.55s cubic-bezier(0.16,1,0.3,1)';
        c.style.transform  = 'translateX(0) scale(1.04)';
      }
    });
    await sleep(450);
  } else {
    // Coming from the world — raise the title card behind the curtain so the
    // empty carousel page is never seen
    closeWorld();
    await fadeTo('pg-chapters', () => {
      $('ch-vt-num').textContent  = ch.num;
      $('ch-vt-name').textContent = ch.name;
      $('ch-vtitle').classList.remove('in', 'up');
      $('ch-veil').classList.add('solid', 'show');
    });
  }

  // Show title veil
  const veil    = $('ch-veil');
  const vtitle  = $('ch-vtitle');
  const vtNum   = $('ch-vt-num');
  const vtName  = $('ch-vt-name');

  vtNum.textContent  = ch.num;
  vtName.textContent = ch.name;
  vtitle.classList.remove('in','up');

  veil.classList.add('show');
  await sleep(100);
  vtitle.classList.add('in');    // title zooms in
  await sleep(1700);             // let user read the title
  vtitle.classList.add('up');    // title drifts up

  // If future episode → special page, no detail grid
  if (ch.future) {
    await sleep(300);
    veil.classList.remove('show','solid');
    await sleep(300);
    busy = false;
    openFuturePage();
    return;
  }

  // Prepare detail
  loadDetail(idx);
  const detail = $('ch-detail');
  const hd     = $('ch-hd');
  const scroll = $('ch-scroll');
  const foot   = $('ch-foot');
  hd.classList.remove('in');
  scroll.classList.remove('show');
  foot.classList.remove('show');
  detail.classList.add('show');

  await sleep(250);

  // Cross-fade: veil out, header slides in
  veil.classList.remove('show','solid');
  hd.classList.add('in');
  await sleep(450);

  // Images were pre-cached; this wait should resolve almost instantly from HTTP cache.
  // Videos in the grid only need metadata (for the first-frame thumbnail).
  const gridImgs = [...($('ch-scroll').querySelectorAll('img'))];
  const gridVids = [...($('ch-scroll').querySelectorAll('video'))];
  const imgWaits = gridImgs.map(img => new Promise(res => {
    if (img.complete && img.naturalWidth) { res(); return; }
    img.addEventListener('load',  res, { once: true });
    img.addEventListener('error', res, { once: true });
  }));
  const vidWaits = gridVids.map(vid => new Promise(res => {
    if (vid.readyState >= 1) { res(); return; } // HAVE_METADATA is enough for thumbnail
    vid.addEventListener('loadedmetadata', res, { once: true });
    vid.addEventListener('error',          res, { once: true });
  }));
  await Promise.race([Promise.all([...imgWaits, ...vidWaits]), sleep(1500)]);

  scroll.classList.add('show');
  foot.classList.add('show');

  // 그리드가 보인 직후 자동 재생 시작
  await sleep(1700);
  if (!isManualMode) startAutoPlay(idx);

  busy = false;
}

async function exitChapter() {
  // 자동재생 멈추고 뷰어 즉시 닫기
  stopAutoPlay();
  await closePhotoViewer(true);

  // Hide detail content
  const detail = $('ch-detail');
  const hd     = $('ch-hd');
  const scroll = $('ch-scroll');
  const foot   = $('ch-foot');

  scroll.classList.remove('show');
  foot.classList.remove('show');
  await sleep(320);
  hd.classList.remove('in');
  await sleep(400);

  // Veil comes up
  const veil   = $('ch-veil');
  const vtitle = $('ch-vtitle');
  vtitle.classList.remove('in','up');
  veil.classList.add('show');
  await sleep(280);
  detail.classList.remove('show');

  // Restore cards
  CHAPTERS.forEach((_, i) => {
    const c = $(`cc${i}`);
    c.style.transition = 'transform 0.55s cubic-bezier(0.16,1,0.3,1), opacity 0.55s ease';
    const offset = i - currentCh;
    const scale  = Math.max(0.76, 1 - Math.abs(offset) * 0.13);
    const opacity= Math.max(0.28, 1 - Math.abs(offset) * 0.33);
    c.style.transform = `translateX(${offset * cardStep()}px) scale(${scale})`;
    c.style.opacity   = opacity;
  });
  activeCard = currentCh;
  $(`cdot${currentCh}`).classList.add('active');

  await sleep(700);

  // Veil fades out → carousel visible
  veil.classList.remove('show','solid');
  await sleep(520);
}

function loadDetail(idx) {
  const ch = CHAPTERS[idx];
  $('ch-hd-num').textContent  = ch.num;
  $('ch-hd-name').textContent = ch.name;
  $('ch-hd-sub').textContent  = ch.sub;
  $('btn-ch-label').textContent = '다음';

  const grid = $('ch-scroll');
  grid.innerHTML = ''; grid.scrollTop = 0;

  ch.photos.forEach((photo, i) => {
    const cell = document.createElement('div');
    cell.className = 'photo-cell';

    if (photo.src && isVideoSrc(photo.src)) {
      // Video thumbnail: show first frame via preload="metadata"
      const vid = document.createElement('video');
      vid.src = photo.src;
      vid.preload = 'metadata';
      vid.muted = true;
      vid.playsInline = true;
      vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.1; }, { once: true });
      cell.appendChild(vid);
      // Small play badge top-right
      const badge = document.createElement('div');
      badge.className = 'cell-vid-badge';
      badge.innerHTML = `<svg width="12" height="12" viewBox="0 0 20 20" fill="none">
        <polygon points="5,3 17,10 5,17" fill="white"/>
      </svg>`;
      cell.appendChild(badge);
    } else if (photo.src) {
      const img = document.createElement('img');
      img.src = photo.src; img.alt = '';
      cell.appendChild(img);
    } else {
      // No source: camera icon placeholder
      const bg = document.createElement('div');
      bg.className = 'cell-grad';
      bg.style.cssText = `background:${ch.bg};opacity:0.72;`;
      cell.appendChild(bg);
      const icon = document.createElement('div');
      icon.className = 'cell-ph-icon';
      icon.innerHTML = `<svg width="22" height="22" viewBox="0 0 40 40" fill="none">
        <rect x="3" y="9" width="34" height="23" rx="4" stroke="white" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="6.5" stroke="white" stroke-width="1.6"/>
        <circle cx="30" cy="14" r="2" fill="white"/>
      </svg>`;
      cell.appendChild(icon);
    }

    cell.addEventListener('click', () => {
      stopAutoPlay();
      apChIdx   = idx;
      apPIdx    = i;
      apRunning = true;
      openPhotoViewer(idx, i, true).then(dur => startHoldTimer(dur));
    });

    grid.appendChild(cell);
  });
}

/* ════════════════════════════════════
   PHOTO VIEWER & AUTO-PLAY
════════════════════════════════════ */
let isManualMode = false; // set via secret triple-tap on 민소 circle
let classicMode  = false; // ON → old card carousel; default is the pixel world
let apChIdx      = -1;   // autoplay: current chapter
let apPIdx       = 0;    // autoplay: current photo index
let apRunning    = false;
let apTimer      = null;
let apRemaining  = 4000; // ms remaining when paused
let apTimerStart = 0;    // timestamp when current timer started
let apHolding    = false;

function startAutoPlay(chIdx)            { startAutoPlayFrom(chIdx, 0); }
function startAutoPlayFrom(chIdx, pIdx)  {
  stopAutoPlay();
  apChIdx   = chIdx;
  apPIdx    = pIdx;
  apRunning = true;
  runAutoStep(chIdx, pIdx);
}

function stopAutoPlay() {
  _apGen++;          // invalidate any in-flight openPhotoViewer calls
  apRunning = false;
  apChIdx   = -1;
  apHolding = false;
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
}

async function runAutoStep(chIdx, pIdx) {
  if (!apRunning || apChIdx !== chIdx || isManualMode) return;
  apPIdx = pIdx;

  // tap animation on grid cell
  const cells = $('ch-scroll').querySelectorAll('.photo-cell');
  const cell  = cells[pIdx];
  if (cell) {
    cell.classList.remove('tapping');
    void cell.offsetWidth;
    cell.classList.add('tapping');
  }
  await sleep(1200);
  if (!apRunning || apChIdx !== chIdx) return;

  const dur = await openPhotoViewer(chIdx, pIdx, true);
  startHoldTimer(dur);
}

/* ── 홀드 타이머 (일시정지 지원) ── */
function startHoldTimer(ms) {
  if (isManualMode || !apRunning) return; // manual mode or stopped: no auto-advance
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
  apRemaining  = ms;
  apTimerStart = Date.now();
  apHolding    = false;
  apTimer = setTimeout(async () => {
    if (!apRunning) return;
    const chIdx = apChIdx;
    const pIdx  = apPIdx;
    const ch    = CHAPTERS[chIdx];

    if (pIdx >= ch.photos.length - 1) {
      // 마지막 사진 → 다음 에피소드로 자동 전환
      onChapterNext();
      return;
    }

    // 다음 사진으로 — 뷰어 유지, 사진만 교체
    if (!apRunning || apChIdx !== chIdx) return;
    apPIdx = pIdx + 1;
    const dur = await openPhotoViewer(chIdx, pIdx + 1, true);
    startHoldTimer(dur);
  }, ms);
}

function pauseHold() {
  if (!apRunning || apHolding || !apTimer) return;
  apHolding = true;
  clearTimeout(apTimer); apTimer = null;
  apRemaining = Math.max(80, apRemaining - (Date.now() - apTimerStart));
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = 'paused';
  const kb = $('pv-img')?.querySelector('.pv-layer.in .pv-main');
  if (kb) kb.style.animationPlayState = 'paused';   // freeze the drift too
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.pause();
}

function resumeHold() {
  if (!apHolding) return;
  apHolding = false;
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = '';
  const kb = $('pv-img')?.querySelector('.pv-layer.in .pv-main');
  if (kb) kb.style.animationPlayState = '';
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.play().catch(() => {});
  startHoldTimer(apRemaining);
}

async function openPhotoViewer(chIdx, pIdx, isAuto) {
  const myGen = _apGen;   // capture — if stopAutoPlay fires mid-await, myGen !== _apGen
  const ch    = CHAPTERS[chIdx];
  const photo = ch.photos[pIdx];
  const pv    = $('photo-viewer');
  const pvImg = $('pv-img');
  const alreadyOpen = pv.classList.contains('show');
  const isVideo = photo.src && /\.(mp4|mov|webm|m4v)$/i.test(photo.src);

  let dur = 6000;

  // Build the incoming shot in its own layer, so it can dissolve over the
  // outgoing one instead of the frame blinking to black between photos.
  const prevLayers = [...pvImg.querySelectorAll('.pv-layer')];
  const layer = document.createElement('div');
  layer.className = 'pv-layer';
  let kbEl = null;   // element that carries the Ken Burns drift

  if (!photo.src) {
    layer.style.background = ch.bg.replace('145deg', '155deg');
    layer.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <svg width="50" height="50" viewBox="0 0 40 40" fill="none" style="opacity:0.2">
        <rect x="3" y="9" width="34" height="23" rx="4" stroke="white" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="6.5" stroke="white" stroke-width="1.4"/>
        <circle cx="30" cy="14" r="2" fill="white"/>
      </svg>
    </div>`;
    pvImg.appendChild(layer);
  } else if (isVideo) {
    layer.style.background = '#000';

    // Reuse pre-buffered pool element — moving it preserves the download buffer
    let vid = _vidPool.get(photo.src);
    if (!vid) {
      // Fallback: create on-demand (shouldn't normally reach here)
      vid = document.createElement('video');
      vid.src = photo.src; vid.preload = 'auto'; vid.playsInline = true;
      vid.muted = true; vid.load();
      _vidPool.set(photo.src, vid);
    }
    vid.className   = 'pv-main';   // full-bleed, contained — no crop
    vid.style.cssText = '';
    vid.muted  = false;
    vid.volume = 1.0;
    vid.currentTime = 0;
    layer.appendChild(vid);        // moves from _mpc to the layer — buffer intact
    pvImg.appendChild(layer);

    // Metadata should already be available from preload; wait only if needed
    if (vid.readyState < 1) {
      await new Promise(res => {
        vid.addEventListener('loadedmetadata', res, { once: true });
        setTimeout(res, 4000);
      });
    }
    if (vid.duration && isFinite(vid.duration) && vid.duration > 0.1) {
      dur = Math.round(vid.duration * 1000) + 300;
    }
    // Play — already buffered, starts immediately
    vid.play().catch(() => {
      vid.muted = true;
      vid.play().catch(() => {});
    });
  } else {
    // Blurred copy behind the photo fills the frame, so a portrait shot on a
    // wide screen reads as a composed frame rather than a letterboxed image.
    const blur = document.createElement('img');
    blur.className = 'pv-blur'; blur.src = photo.src; blur.alt = '';
    const main = document.createElement('img');
    main.className = 'pv-main'; main.src = photo.src; main.alt = '';
    layer.append(blur, main);
    pvImg.appendChild(layer);
    kbEl = main;

    await new Promise(res => {
      if (main.complete && main.naturalWidth) { res(); return; }
      main.addEventListener('load',  res, { once: true });
      main.addEventListener('error', res, { once: true });
      setTimeout(res, 4000);
    });
  }

  // caption fades out now; the new text is set at the cut, below, so a stale
  // shot can never leave its words on screen
  const capEl = $('pv-cap');
  if (alreadyOpen) {
    capEl.classList.add('swapping');
    // a real frame has to elapse or the browser coalesces the fade away, and
    // letting the words clear just before the cut reads better besides
    await sleep(110);
  }

  // progress bars
  const barsEl = $('pv-bars');
  barsEl.innerHTML = '';
  if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
  ch.photos.forEach((_, i) => {
    const bar  = document.createElement('div'); bar.className = 'pv-bar';
    const fill = document.createElement('div'); fill.className = 'pv-bar-fill';
    if (i < pIdx) fill.classList.add('done');
    bar.appendChild(fill); barsEl.appendChild(bar);
  });
  barsEl.style.transition = 'opacity 0.35s ease';
  barsEl.style.opacity = '1';
  pvBarsVisible = true;

  function activateBar() {
    const fills = barsEl.querySelectorAll('.pv-bar-fill');
    if (fills[pIdx]) {
      fills[pIdx].style.setProperty('--pv-dur', `${(dur / 1000).toFixed(2)}s`);
      fills[pIdx].classList.add('active');
    }
  }

  // Stale call — this shot was superseded while its media loaded. Drop the
  // layer we built so it can never surface over the current one.
  if (_apGen !== myGen) { layer.remove(); return dur; }

  // Start the drift so the motion runs for exactly as long as the shot holds
  if (kbEl) {
    kbEl.style.setProperty('--kbdur', `${Math.round(dur * 1.35)}ms`);
    kbEl.classList.add(`kb${1 + Math.floor(Math.random() * 4)}`);
  }

  // The cut: sweep the new shot in, push the previous ones out, swap the words
  capEl.textContent = photo.cap;
  requestAnimationFrame(() => {
    layer.classList.add('in');
    capEl.classList.remove('swapping');
  });
  prevLayers.forEach(old => {
    old.classList.add('out');
    setTimeout(() => {
      // re-query: if this video was reclaimed by a later shot it is no longer
      // inside `old`, and must not be yanked back to the pool
      _returnVidToPool(old.querySelector('video'));
      old.remove();
    }, 700);
  });

  if (!alreadyOpen) pv.classList.add('show');

  if (isAuto) { await sleep(60); activateBar(); }
  return dur;
}

async function closePhotoViewer(instant) {
  const pv = $('photo-viewer');
  if (!pv.classList.contains('show')) return;
  const vid = $('pv-img')?.querySelector('video');
  _returnVidToPool(vid); // return to pool so buffer is preserved for next open
  if (instant) {
    pv.style.transition = 'none';
    pv.classList.remove('show');
    await sleep(20);
    pv.style.transition = '';
  } else {
    pv.classList.remove('show');
    await sleep(420);
  }
  // Discard spent shot layers so the next open starts on a clean frame
  $('pv-img').innerHTML = '';
  $('pv-cap').classList.remove('swapping');
}

/* Roll straight from the last shot of one episode into the first shot of the
   next. The chapter card rises over the still-open viewer, the episode is
   swapped behind it, and the card lifts onto the new opening shot — so the
   carousel and the grid never reappear and the reel never stops. */
async function advanceEpisodeSeamless(next) {
  const veil   = $('ch-veil');
  const vtitle = $('ch-vtitle');
  const ch     = CHAPTERS[next];

  preloadChapterMedia(next);

  // Chapter card rises over the frame that is still on screen
  $('ch-vt-num').textContent  = ch.num;
  $('ch-vt-name').textContent = ch.name;
  vtitle.classList.remove('in', 'up');
  veil.classList.add('solid', 'show');
  await sleep(560);
  vtitle.classList.add('in');
  await sleep(1450);

  // Behind the opaque card: retire the old episode, stage the new one
  stopAutoPlay();
  await closePhotoViewer(true);
  currentCh = next;

  if (ch.future) {
    openFuturePage();                 // raises its own curtain over us
    await sleep(900);
    veil.classList.remove('show', 'solid');
    vtitle.classList.remove('in', 'up');
    return;
  }

  loadDetail(next);
  positionCards(next, false);
  $('ch-hd').classList.add('in');
  $('ch-scroll').classList.add('show');
  $('ch-foot').classList.add('show');
  $('ch-detail').classList.add('show');

  vtitle.classList.add('up');
  await sleep(430);

  // Open the new episode's first shot, then lift the card onto it
  apChIdx = next; apPIdx = 0; apRunning = true;
  const dur = await openPhotoViewer(next, 0, true);
  veil.classList.remove('show');
  await sleep(520);
  veil.classList.remove('solid');
  if (apRunning) startHoldTimer(dur);
}

async function onChapterNext() {
  // ── 뷰어 열림: 사진 레벨 네비게이션 우선 ──
  if ($('photo-viewer').classList.contains('show')) {
    const ch = CHAPTERS[currentCh];
    const isLastPhoto = apPIdx >= ch.photos.length - 1;

    if (!isLastPhoto) {
      // 다음 사진으로
      stopAutoPlay();
      await closePhotoViewer(false);
      await sleep(160);
      startAutoPlayFrom(currentCh, apPIdx + 1);
      return;
    }
    // 마지막 사진 → 월드 모드면 캐릭터가 있던 자리로 돌아감
    if (!classicMode) {
      if (busy) return;
      busy = true;
      await returnToWorld();
      busy = false;
      return;
    }

    // 카드 모드: 다음 에피소드로 끊김 없이 이어서 재생
    if (!isManualMode && currentCh < CHAPTERS.length - 1) {
      if (busy) return;
      busy = true;
      await advanceEpisodeSeamless(currentCh + 1);
      busy = false;
      return;
    }

    // 수동 모드 / 마지막 에피소드 → 뷰어 닫고 fall-through
    stopAutoPlay();
    await closePhotoViewer(false);
    await sleep(800);
  }

  // ── 에피소드 레벨 네비게이션 ──
  if (busy) return;
  busy = true;

  // Manual mode: return to carousel unless it's the last episode (→ letter 2)
  if (isManualMode && currentCh !== CHAPTERS.length - 1) {
    await exitChapter();
    busy = false;
    return;
  }

  const isLastEp = currentCh === CHAPTERS.length - 1;

  if (isLastEp) {
    await fadeTo('pg-letter2', () => {
      $('ch-detail').classList.remove('show');
      $('ch-hd').classList.remove('in');
      $('ch-scroll').classList.remove('show');
      $('ch-foot').classList.remove('show');
    });
    busy = false;
    startCosmicLetter(LETTER2, goToProposal);
  } else {
    await exitChapter();
    const next = currentCh + 1;
    await sleep(300);
    positionCards(next, true);
    await sleep(1600);
    busy = false;
    enterChapter(next);
  }
}

// Main keywords — ignite one by one with predefined positions
const FUTURE_MAIN = ['결혼식', '신혼여행', '아파트 이사', '신혼생활', '해외여행', '출산', '육아'];
const FUTURE_MAIN_POS = [
  { x: 25, y: 10, fs: 32 },   // 결혼식  → 화면 좌측 ~14%
  { x: 63, y:  7, fs: 28 },   // 신혼여행 → 화면 우측 ~66%
  { x: 16, y: 37, fs: 24 },   // 아파트 이사 → 화면 좌측 ~11%
  { x: 63, y: 26, fs: 28 },   // 신혼생활 → 화면 우측 ~66%
  { x: 20, y: 62, fs: 27 },   // 해외여행 → 화면 좌측 ~14%
  { x: 70, y: 68, fs: 34 },   // 출산 → 화면 우측 ~73%
  { x: 46, y: 82, fs: 25 },   // 육아 → 화면 중앙 ~45%
];

// Landscape keyword layout — authored in VISIBLE-screen %, converted below.
// Spread wide across the 16:9 canvas, leaving the centre clear for the closing line.
const FUTURE_MAIN_POS_LS = [
  { x: 12, y: 15, fs: 30 },   // 결혼식
  { x: 73, y: 11, fs: 26 },   // 신혼여행
  { x:  7, y: 45, fs: 22 },   // 아파트 이사
  { x: 77, y: 39, fs: 26 },   // 신혼생활
  { x: 15, y: 75, fs: 25 },   // 해외여행
  { x: 60, y: 72, fs: 32 },   // 출산
  { x: 41, y: 84, fs: 24 },   // 육아
];

/* #ft-bg is inset beyond the viewport so it can pan, so a word's % position
   inside it is not the % the eye sees. Convert desired screen % → container %. */
function ftToContainer(bg, visX, visY) {
  const W = bg.offsetWidth,   H  = bg.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  const insX = (W - vw) / 2,  insY = (H - vh) / 2;
  return {
    x: ((visX / 100) * vw + insX) / W * 100,
    y: ((visY / 100) * vh + insY) / H * 100,
  };
}

// Secondary and ambient words — appear all at once, fill the field
const FUTURE_MID = [
  '크리스마스', '새해', '드라이브', '캠핑',
  '첫눈', '생일', '설날', '추석', '가족사진', '주말 아침', '기념일', '카페'
];
const FUTURE_BG = [
  '웃음', '바다',
  '여름밤', '공원 산책', '요리', '집들이',
  '여행 계획', '소소한 행복', '함께', '이사', '파티',
  '가족', '새벽', '봄날', '승진'
];

function ftShuf(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) { const j = 0 | Math.random() * (i + 1); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

/* Word sizes below are authored for a phone. Sideways the same field may be
   on a TV, so scale them with the viewport height. */
function ftScale() {
  return isLandscape() ? Math.min(2.4, Math.max(1, window.innerHeight / 393)) : 1;
}

function ftSpawn(container, text, cls, x, y, fs, op, adS, fdur, gdur, dx, dy) {
  fs *= ftScale();
  const el = document.createElement('span');
  el.className = `ft-word ${cls}`;
  el.textContent = text;
  const style = [
    `left:${x.toFixed(1)}%`, `top:${y.toFixed(1)}%`, `font-size:${fs.toFixed(1)}px`,
    `--op:${op.toFixed(3)}`,  `--ad:${adS.toFixed(2)}s`,
    `--fdur:${fdur.toFixed(1)}s`, `--dx:${dx.toFixed(1)}px`, `--dy:${dy.toFixed(1)}px`,
  ];
  if (gdur) style.push(`--gdur:${gdur.toFixed(1)}s`);
  el.style.cssText = style.join(';');
  container.appendChild(el);
}

function buildFutureAtmosphere(container) {
  // 70 twinkling stars
  for (let i = 0; i < 70; i++) {
    const s   = document.createElement('div');
    s.className = 'ft-star';
    const sz  = Math.random() < 0.72 ? 1 : Math.random() < 0.7 ? 2 : 3;
    const op1 = (0.15 + Math.random() * 0.55).toFixed(2);
    const op2 = (parseFloat(op1) * (0.12 + Math.random() * 0.25)).toFixed(2);
    s.style.cssText = [
      `left:${(Math.random()*100).toFixed(1)}%`, `top:${(Math.random()*100).toFixed(1)}%`,
      `width:${sz}px`, `height:${sz}px`,
      `--op1:${op1}`, `--op2:${op2}`,
      `--dur:${(1.8+Math.random()*3.5).toFixed(1)}s`,
      `--del:${(Math.random()*4).toFixed(1)}s`,
    ].join(';');
    container.appendChild(s);
  }

  // Centre-avoiding helper
  const outsideCenter = (x, y, mx, my, Mx, My) => !(x > mx && x < Mx && y > my && y < My);

  // Background micro-words — staggered 0.18s apart so they float up one by one
  ftShuf(FUTURE_BG).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 28, 32, 72, 68));
    ftSpawn(container, w, 'ft-bgw',
      x, y, 10 + Math.random() * 5,
      0.22 + Math.random() * 0.14,   // brighter: 0.22–0.36
      0.2 + i * 0.18 + Math.random() * 0.08,  // ~3.6s to show all 20
      8 + Math.random() * 7,
      null,
      (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 18);
  });

  // Mid words — staggered 0.24s apart
  ftShuf(FUTURE_MID).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 25, 30, 75, 70));
    ftSpawn(container, w, 'ft-mid',
      x, y, 15 + Math.random() * 8,
      0.52 + Math.random() * 0.18,   // brighter: 0.52–0.70
      0.4 + i * 0.24 + Math.random() * 0.1,  // ~3.3s to show all 14
      10 + Math.random() * 8,
      null,
      (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 22);
  });
}

async function openFuturePage() {
  await fadeTo('pg-future', () => {
    $('ch-detail').classList.remove('show');
    $('ch-hd').classList.remove('in');
    $('ch-scroll').classList.remove('show');
    $('ch-foot').classList.remove('show');
  });

  const bg = $('ft-bg');
  bg.innerHTML = '';
  buildFutureAtmosphere(bg);   // stars + mid + bg words (all start fading in now)

  const endEl = $('ft-end');
  endEl.style.opacity    = '0';
  endEl.style.transition = '';

  // Sequential main keyword ignitions — each waits for previous to bloom
  await sleep(700);
  const ls    = isLandscape();
  const table = ls ? FUTURE_MAIN_POS_LS : FUTURE_MAIN_POS;
  for (let i = 0; i < FUTURE_MAIN.length; i++) {
    const p    = table[i];
    const pos  = ls ? ftToContainer(bg, p.x, p.y) : { x: p.x, y: p.y };
    const gdur = 3.4 + Math.random() * 2.0;
    const dx   = (Math.random() - 0.5) * 20;
    const dy   = (Math.random() - 0.5) * 14;
    // --ad:0 so animation fires immediately on DOM insert
    ftSpawn(bg, FUTURE_MAIN[i], 'ft-main', pos.x, pos.y, p.fs, 0.90, 0, 18, gdur, dx, dy);
    // Gap: first keyword gets a bit longer to stand alone, rest tighter
    await sleep(i === 0 ? 1900 : 1450);
  }

  // Let all words float and settle together
  await sleep(2200);

  // Closing message fades in over the word-field
  endEl.style.transition = 'opacity 2.2s ease';
  endEl.style.opacity    = '1';
  await sleep(3600);

  await fadeTo('pg-letter2', () => { endEl.style.opacity = '0'; });
  startCosmicLetter(LETTER2, goToProposal);
}

// btn-no is sized by CSS per orientation — keep the JS maths in step
function noBtnSize() { return isLandscape() ? { w: 168, h: 40 } : { w: 210, h: 46 }; }

function placeNo() {
  const yes = document.querySelector('.btn-yes');
  const r   = yes.getBoundingClientRect();
  const btn = $('btn-no');
  const { w, h } = noBtnSize();
  const left = r.left + r.width / 2 - w / 2;
  btn.style.left   = `${Math.max(12, Math.min(window.innerWidth - w - 12, left))}px`;
  btn.style.top    = `${Math.min(r.bottom + 18, window.innerHeight - h - 12)}px`;
  btn.style.bottom = 'auto';
}

const NO_MSGS = ['싫어!','싫다고!','안 해!','절대!','저리 가!','왜 이래!','싫어!!!','안 돼!','진짜 싫어!'];
let noTaps = 0, _noLastTs = 0;
function dodgeNo(e) {
  const now = Date.now();
  if (now - _noLastTs < 350) return;
  _noLastTs = now;
  const btn = $('btn-no');
  const yes = document.querySelector('.btn-yes');
  const yR  = yes.getBoundingClientRect();
  const w = window.innerWidth, h = window.innerHeight;
  const { w: bw, h: bh } = noBtnSize();
  const margin = isLandscape() ? 14 : 20;
  // vertical keep-out at top/bottom — much smaller in landscape, where height is scarce
  const vPad = isLandscape() ? 16 : 90;

  // pick a random position that doesn't overlap btn-yes
  let x, y, tries = 0;
  do {
    x = margin + Math.random() * Math.max(10, w - bw - margin * 2);
    y = vPad   + Math.random() * Math.max(10, h - bh - vPad * 2);
    tries++;
  } while (
    tries < 30 &&
    x < yR.right  + margin && x + bw > yR.left   - margin &&
    y < yR.bottom + margin && y + bh > yR.top     - margin
  );

  btn.style.left = x + 'px';
  btn.style.top  = y + 'px';
  btn.textContent = NO_MSGS[noTaps % NO_MSGS.length];
  noTaps++;
}

async function onYes() {

  const ringRect = ring.getBoundingClientRect();
  const cx = ringRect.left + ringRect.width / 2;

      const ripple = document.createElement('div');
      ripple.className = 'ring-ripple';
      ripple.style.left = cx + 'px';
      ripple.style.top  = cy + 'px';

function runConfetti() {
  const canvas = $('confetti');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx  = canvas.getContext('2d');
  const cols = ['#81D8D0','#B2EDE9','#ffffff','#4AADA5','#E8FAFA','#0ABAB5'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: 4 + Math.random() * 8, h: 6 + Math.random() * 13,
    rot: Math.random() * Math.PI * 2,
    dr: (Math.random() - 0.5) * 0.13,
    vy: 1.2 + Math.random() * 1.9,
    vx: (Math.random() - 0.5) * 0.7,
    col: cols[Math.floor(Math.random() * cols.length)],
    a: 0.65 + Math.random() * 0.35,
  }));
  let frame = 0;
  function draw() {
    if (frame > 380) {
      canvas.style.transition = 'opacity 1.5s ease'; canvas.style.opacity = '0'; return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.rot += p.dr;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save(); ctx.globalAlpha = p.a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++; requestAnimationFrame(draw);
  }
  draw();
}

/* a firework-style pop, launched upward from one point so it fills the
   center/top of the screen rather than a low puddle by the button —
   used where the celebration should read as "something bursts right
   here" rather than confetti raining over the whole screen */
function burstConfetti(cx, cy) {
  const canvas = $('confetti');
  canvas.style.transition = '';
  canvas.style.opacity = '1';
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx  = canvas.getContext('2d');
  // warm gold, blush and ivory — the same family the rest of the hall
  // (lock screen, entrance glow, petal shower) already uses
  const cols = ['#c8a96e', '#e8d5a8', '#f9c2d4', '#eb96b4', '#fffdf9', '#f6e6cb', '#f2c0a2'];
  const pieces = Array.from({length: 76}, () => {
    // a wide upward fan (not a full circle), so the launch itself carries
    // everything up toward the center/top before gravity brings it back
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
    const spd = 5.5 + Math.random() * 8;
    return {
      x: cx, y: cy,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      w: 4 + Math.random() * 7, h: 6 + Math.random() * 11,
      rot: Math.random() * Math.PI * 2,
      dr: (Math.random() - 0.5) * 0.35,
      col: cols[Math.floor(Math.random() * cols.length)],
    };
  });
  const life = 1400;   // ms of visible flight before it's fully faded — real
                        // time, not frame count, so it lands the same on
                        // any device regardless of its actual frame rate
  const t0 = performance.now();
  let last = t0;
  function draw(now) {
    const dt = Math.min(48, now - last); last = now;
    const elapsed = now - t0;
    const steps = dt / 16.7;   // keep motion consistent even at low fps
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.vy += 0.13 * steps;        // gravity pulls it back down
      p.vx *= Math.pow(0.985, steps); // drag settles the spread
      p.x += p.vx * steps; p.y += p.vy * steps; p.rot += p.dr * steps;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - elapsed / life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (elapsed < life) {
      requestAnimationFrame(draw);
    } else {
      canvas.style.transition = 'opacity .4s ease';
      canvas.style.opacity = '0';
      setTimeout(() => { canvas.style.display = 'none'; canvas.style.transition = ''; }, 420);
    }
  }
  requestAnimationFrame(draw);
}

/* ════════════════════════════════════
   GRID SWIPE-DOWN → 에피소드 카드로 복귀
════════════════════════════════════ */
function initGridDismiss() {
  const scroll  = $('ch-scroll');
  const detail  = $('ch-detail');
  let startY = 0, startScrollTop = 0;
  let dismissing = false, dragY = 0;

  scroll.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startScrollTop = scroll.scrollTop;
    dismissing = false; dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    if (!dismissing) {
      if (startScrollTop <= 0 && dy > 8) dismissing = true;
      else return;
    }
    e.preventDefault();
    dragY = dy;
  }, { passive: false });

  scroll.addEventListener('touchend', async () => {
    if (!dismissing) return;
    dismissing = false;
    if (dragY > 90 && !busy) {
      busy = true;
      await exitChapter();
      busy = false;
    }
    dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchcancel', () => {
    dismissing = false;
    dragY = 0;
  }, { passive: true });
}

const WT = 28;   // tile size in world pixels — sized so the round

function wTileAt(c, r) {

/* ── deterministic per-tile noise so grass detail never flickers ── */
function wHash(c, r) {
  let h = (c * 374761393 + r * 668265263) ^ 0x5bf03635;

/* ══════════════════════════════════════════════════════════════
   PIXEL-ART RENDERER  ·  PixiJS
   The hall is drawn as true pixel art: every sprite is painted once
   into a small offscreen canvas at art resolution and uploaded as a
   NEAREST-filtered texture, so scaling it up keeps hard pixel edges.
   Nothing is fetched — the whole tileset and cast are generated in
   code, which keeps the page a single self-contained file.
══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const PY  = 0.62;                 // floor squash: we look at the hall from an angle
const AW  = 16, AH = 10;          // art pixels per tile — 16 across, 10 deep
const WALLA = 124;                // how tall the back wall stands, in art pixels
const MAPW = W_COLS * AW, MAPH = W_ROWS * AH;
const w2ax = x => x * AW / WT;    // world px → art px
const w2ay = y => y * AH / WT;

/* ── palette ──────────────────────────────────────────────────
   Taken from the venue's own photographs: the hall is black, the
   carpet a mottled blue-grey, the runner charcoal, and every flower

const C = {
  carpet:'#333a46', carpetL:'#3f4854', carpetD:'#282e38', carpetB:'#4a5568',

  ivory :'#efe4d4', ivoryL:'#fbf5ea', ivoryS:'#ddcfbc', ivoryD:'#bfae98',

  // The aisle and the entrance are pink shot through with soft lilac;

  pk1:'#f9c2d4', pk2:'#eb96b4', pk3:'#d4718f', pk4:'#ad5473',

  pch:'#f2c0a2', wh1:'#fffdf9', wh2:'#f2e3dd', cr1:'#f6e6cb', gyp:'#f0dcc0',
  gr1:'#8b9c73', gr2:'#6b7d58', gr3:'#4e5d41', gr4:'#33402e',
  blk:'#1b1b20', blkL:'#2a2a31', blkD:'#0e0e12',
  cloth:'#141418', clothL:'#212128', clothD:'#08080a',
  glass:'#dfeaf0', flame:'#ffe4a8', flameL:'#fff8e4',
  wood:'#6b4c39', woodL:'#84604a', woodD:'#483326',

];

  ['#1c1a20','#0e0d11','#332f39'],

];

/* ── tiny pixel canvas ────────────────────────────────────── */
function pxc(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c, g, w: c.width, h: c.height };
}
function R(p, x, y, w, h, col) {
  if (w <= 0 || h <= 0) return;
  p.g.fillStyle = col; p.g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
const D = (p, x, y, col) => R(p, x, y, 1, 1, col);
/* filled ellipse, rasterised onto the pixel grid */
function ELL(p, cx, cy, rx, ry, col) {
  if (rx <= 0 || ry <= 0) return;
  p.g.fillStyle = col;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    const dy = (y + 0.5 - cy) / ry;
    if (dy * dy > 1) continue;
    const half = rx * Math.sqrt(1 - dy * dy);
    const x0 = Math.round(cx - half), x1 = Math.round(cx + half);
    if (x1 > x0) p.g.fillRect(x0, y, x1 - x0, 1);
  }
}
/* rounded blob used for heads, blooms and cushions */
function BLOB(p, cx, cy, rx, ry, col) { ELL(p, cx, cy, rx, ry, col); }
/* scattered grain — an ordered dither turns into a visible dot grid over
   large flat areas, so every broad surface gets random speckle instead */
function SPEC(p, x, y, w, h, col, amt, seed) {
  const g = mulberry(seed || 1);
  p.g.fillStyle = col;
  const n = (w * h * amt) | 0;
  for (let k = 0; k < n; k++)
    p.g.fillRect(x + ((g() * w) | 0), y + ((g() * h) | 0), 1, 1);
}
/* deterministic little RNG so every generated sprite is stable */
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ── texture cache ────────────────────────────────────────── */
const _texc = new Map();
function TEX(key, w, h, paint) {
  let t = _texc.get(key);
  if (t) return t;
  const p = pxc(w, h);
  paint(p);
  t = PIXI.Texture.from(p.c);
  t.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
  _texc.set(key, t);
  return t;
}
/* smooth textures — only for light, never for art */
function TEXS(key, w, h, paint) {
  let t = _texc.get(key);
  if (t) return t;
  const p = pxc(w, h);
  p.g.imageSmoothingEnabled = true;
  paint(p);
  t = PIXI.Texture.from(p.c);
  t.baseTexture.scaleMode = PIXI.SCALE_MODES.LINEAR;
  _texc.set(key, t);
  return t;
}

/* ══════════════════════════════════════════════════════════
   BACKDROP — wall and floor baked into one texture
══════════════════════════════════════════════════════════ */
function bakeBackdrop() {
  const p = pxc(MAPW, WALLA + MAPH);
  const oy = WALLA;

  /* ---- floor tiles ---- */
  for (let r = 0; r < W_ROWS; r++) for (let c = 0; c < W_COLS; c++) {
    const t = WORLD_MAP[r][c], x = c * AW, y = oy + r * AH;
    if (t === '#') {
      R(p, x, y, AW, AH, C.wall);
      SPEC(p, x, y, AW, AH, C.wallD, 0.24, c * 41 + r * 13);
    } else if (t === 's' || t === 'd') {
      R(p, x, y, AW, AH, C.stage);
      SPEC(p, x, y, AW, AH, C.stageD, 0.16, c * 311 + r * 7);
      SPEC(p, x, y, AW, AH, C.stageL, 0.1, c * 131 + r * 17);
    } else if (t === 'r') {
      R(p, x, y, AW, AH, C.runner);
    } else if (t === 'F') {
      R(p, x, y, AW, AH, C.gr4);
    } else if (t === 'P' || t === 'G') {
      R(p, x, y, AW, AH, C.marble);
      SPEC(p, x, y, AW, AH, C.marbleL, 0.2, c * 97 + r * 3);
    } else {
      // the hall's carpet: a mottled blue-grey marble, no repeat you can spot
      R(p, x, y, AW, AH, C.carpet);
      const g = mulberry(c * 733 + r * 17);
      for (let k = 0; k < 8; k++) {
        // veining, not noise: mixed lengths and the odd vertical fleck
        const bx = x + ((g() * AW) | 0), by2 = y + ((g() * AH) | 0);
        const u = g();
        if (u > 0.82) R(p, bx, by2, 1, 2, C.carpetD);
        else R(p, bx, by2, 2 + ((g() * 6) | 0), 1, u > 0.55 ? C.carpetL : C.carpetD);
      }
      if (g() > 0.84) R(p, x + ((g() * AW) | 0), y + ((g() * AH) | 0), 2, 1, C.carpetB);
    }
  }

  /* ---- the runner: one continuous band that opens out at the mouth ---- */
  const RUN_OVER = 6;          // how far the runner spills past its tiles
  for (let r = 8; r <= 67; r++) {
    const h = wAisleHalf(r);
    const x0 = (AISLE_MID - h) * AW - RUN_OVER, x1 = (AISLE_MID + h + 1) * AW + RUN_OVER;
    const y = oy + r * AH;
    R(p, x0, y, x1 - x0, AH, C.runner);
    SPEC(p, x0, y, x1 - x0, AH, C.runnerL, 0.06, r * 37 + 1);
    R(p, x0, y, 2, AH, C.runnerD);  R(p, x1 - 2, y, 2, AH, C.runnerD);
    R(p, x0 + 2, y, 1, AH, C.runnerL); R(p, x1 - 3, y, 1, AH, C.runnerL);
    // the sheen the chandeliers lay down the middle of it
    SPEC(p, (AISLE_MID + 0.5) * AW - 7, y, 14, AH, C.runnerL, 0.14, r * 3 + 1);
  }

  /* ---- the flower beds either side, following the flare ---- */
  for (let r = 8; r <= 67; r++) {
    const h = wAisleHalf(r);
    for (const col of [AISLE_MID - h - 1, AISLE_MID + h + 1]) {
      const flip = col > AISLE_MID;
      // the runner has eaten into the bed's inner edge, so the flowers
      // start where it stops
      const x = col * AW + (flip ? 6 : 0), bw = AW - 6;
      const y = oy + r * AH;
      // both beds grow from the same seed, mirrored, so the two sides of
      // the runner match bloom for bloom
      const px2 = dx => x + (flip ? bw - 1 - dx : dx);
      R(p, x, y, bw, AH, C.carpet);
      const g = mulberry(r * 977 + 31);
      for (let k = 0; k < 24; k++)
        D(p, px2((g() * bw) | 0), y + ((g() * AH) | 0), g() > 0.5 ? C.gr3 : C.gr2);
      for (let k = 0; k < 13; k++)
        D(p, px2((g() * bw) | 0), y + ((g() * AH) | 0), g() > 0.55 ? C.gyp : C.pk1);
      for (let k = 0; k < 15; k++) {
        const bx = px2(1 + ((g() * (bw - 2)) | 0)), by2 = y + 1 + ((g() * (AH - 2)) | 0);
        const u = g();
        const col2 = u > 0.86 ? C.wh1 : u > 0.62 ? C.pk1 : u > 0.4 ? C.pk2
                   : u > 0.2 ? C.pk3 : u > 0.08 ? C.lv1 : C.lv2;
        BLOB(p, bx, by2, 1.5, 1.3, col2);
        D(p, bx, by2 - 1, col2 === C.wh1 ? C.ivoryL : C.pk1);
      }
    }
  }

  /* ---- the platform: the ceremony stage stands above the hall floor,
         with the dais a shallow step higher again ---- */
  const sy = oy + 8 * AH;
  const dx0 = 10 * AW, dx1 = 19 * AW;
  SPEC(p, 2 * AW, oy + 2 * AH, (W_COLS - 4) * AW, 6 * AH, C.stageL, 0.07, 615);
  SPEC(p, dx0, oy + 2 * AH, dx1 - dx0, 6 * AH, C.stageL, 0.09, 616);
  R(p, dx0 - 2, oy + 2 * AH - 2, dx1 - dx0 + 4, 2, C.stageD);
  // stage riser, skirted in black to the floor as it is in the photographs
  R(p, 2 * AW, sy, (W_COLS - 4) * AW, 7, C.clothD);
  SPEC(p, 2 * AW, sy, (W_COLS - 4) * AW, 7, C.cloth, 0.22, 617);
  R(p, 2 * AW, sy - 1, (W_COLS - 4) * AW, 1, C.stageL);
  R(p, 2 * AW, sy + 7, (W_COLS - 4) * AW, 1, '#050506');
  // dais riser
  R(p, dx0, sy - 6, dx1 - dx0, 6, C.clothD);
  R(p, dx0, sy - 7, dx1 - dx0, 1, C.stageL);
  // the flight of steps down into the runner
  const stw = (AISLE_R - AISLE_L + 1) * AW + 16;
  for (let k = 0; k < 3; k++) {
    const w2 = stw + k * 14, x2 = (AISLE_MID + 0.5) * AW - w2 / 2;
    const yy = sy - 8 + k * 6;
    R(p, x2, yy, w2, 6, C.runnerD);
    R(p, x2, yy + 1, w2, 3, C.runner);
    R(p, x2, yy, w2, 1, C.stageL);
  }

  /* ---- back wall: black, hung floor to ceiling with pleated drapery ---- */
  R(p, 0, 0, MAPW, WALLA + 2 * AH, C.wall);
  for (let x = 0; x < MAPW; x += 5) {
    R(p, x, 4, 3, WALLA - 2, C.drape);
    R(p, x, 4, 1, WALLA - 2, C.drapeL);
    R(p, x + 3, 4, 2, WALLA - 2, C.drapeD);
  }
  SPEC(p, 0, 4, MAPW, WALLA - 2, C.wallD, 0.14, 619);
  // the pelmet the drapes hang from
  R(p, 0, 0, MAPW, 4, C.wallD);
  R(p, 0, 3, MAPW, 1, C.blkD);
  // light grazing the top of the folds
  SPEC(p, 0, 4, MAPW, 10, C.drapeL, 0.16, 620);

  /* ---- entrance wall at the very bottom of the map ---- */
  const by = oy + 70 * AH;
  R(p, 0, by, MAPW, AH, C.wall);
  R(p, 0, by, MAPW, 1, C.blkD);

  return p.c;
}

/* ══════════════════════════════════════════════════════════
   PEOPLE
   Everyone is built from the same skeleton so the cast looks
   like it belongs to one hall: 26 art pixels tall, feet on the
   sprite's baseline, shaded from the chandeliers above.
══════════════════════════════════════════════════════════ */

/* the head, seen from the front (or the back, which just skips the face) */
function pxHead(p, cx, ty, sk, hr, o) {
  const [s1, s2, s3] = sk, [h1, h2, h3] = hr;
  const back = o.view === 'back';
  // face
  BLOB(p, cx, ty + 5, 4, 4.6, back ? h1 : s1);
  if (!back) {
    R(p, cx + 2, ty + 2, 2, 7, s2);                 // shade down the right cheek
    D(p, cx + 3, ty + 4, s3);
    R(p, cx - 4, ty + 3, 1, 4, s2);
    // eyes
    if (o.pretty) {
      /* Her eyes are the one place in the hall worth spending pixels on:
         an arched brow, a lash line that flicks up at the outer corner,
         a warm iris with a catchlight, and a soft lid beneath. */
      D(p, cx - 4, ty + 2, h3); D(p, cx + 3, ty + 2, h3);           // the arch
      D(p, cx - 3, ty + 3, h3); D(p, cx - 2, ty + 3, h3);
      D(p, cx + 1, ty + 3, h3); D(p, cx + 2, ty + 3, h3);
      R(p, cx - 3, ty + 4, 2, 1, h2); R(p, cx + 1, ty + 4, 2, 1, h2); // lashes
      D(p, cx - 4, ty + 4, h2);       D(p, cx + 3, ty + 4, h2);      // the flick
      D(p, cx - 4, ty + 3, h1);       D(p, cx + 3, ty + 3, h1);
      R(p, cx - 3, ty + 5, 2, 1, '#4a3350');                          // the iris
      R(p, cx + 1, ty + 5, 2, 1, '#4a3350');
      D(p, cx - 2, ty + 5, '#2a1c30'); D(p, cx + 1, ty + 5, '#2a1c30');
      D(p, cx - 3, ty + 5, '#fffdf8'); D(p, cx + 2, ty + 5, '#fffdf8'); // catchlight
      D(p, cx - 3, ty + 6, s2); D(p, cx + 2, ty + 6, s2);              // lower lid
      D(p, cx - 2, ty + 6, '#8a6472'); D(p, cx + 1, ty + 6, '#8a6472');
    } else {
      D(p, cx - 2, ty + 5, h2); D(p, cx + 1, ty + 5, h2);
      D(p, cx - 2, ty + 4, '#ffffff40'); D(p, cx + 1, ty + 4, '#ffffff40');
    }
    if (o.blush) { D(p, cx - 3, ty + 7, '#e8927f60'); D(p, cx + 2, ty + 7, '#e8927f60'); }
    D(p, cx, ty + 7, s3);                            // nose
    D(p, cx, ty + 8, '#b06a62');                     // mouth, barely there
    D(p, cx + 1, ty + 8, '#c98d84');
  }
  // hair
  const st = o.hairStyle || 0;
  R(p, cx - 4, ty + 1, 8, 3, h1);
  R(p, cx - 5, ty + 2, 1, 4, h1); R(p, cx + 4, ty + 2, 1, 4, h1);
  R(p, cx - 4, ty, 8, 1, h1);
  R(p, cx - 3, ty, 6, 1, h3);                        // sheen along the crown
  R(p, cx + 2, ty + 1, 2, 1, h2);
  if (back) { R(p, cx - 4, ty + 1, 8, 8, h1); R(p, cx - 3, ty + 2, 5, 3, h3); R(p, cx - 4, ty + 6, 8, 3, h2); }
  if (st === 0) {                                    // low bun
    if (back) BLOB(p, cx, ty + 8, 3, 2.4, h3); else BLOB(p, cx, ty + 1, 3.4, 1.8, h3);
  } else if (st === 1) {                             // long, falling past the shoulders
    R(p, cx - 5, ty + 3, 1, 9, h1); R(p, cx + 4, ty + 3, 1, 9, h1);
    R(p, cx - 6, ty + 4, 1, 7, h2); R(p, cx + 5, ty + 4, 1, 7, h2);
    if (back) R(p, cx - 5, ty + 3, 10, 10, h1);
  } else if (st === 2) {                             // short, tucked behind the ears
    R(p, cx - 4, ty + 1, 8, 4, h1); R(p, cx - 5, ty + 2, 1, 3, h2); R(p, cx + 4, ty + 2, 1, 3, h2);
  } else if (st === 3) {                             // updo with a comb
    BLOB(p, cx, ty, 3, 2, h3);
    D(p, cx + 2, ty, C.goldL); D(p, cx - 2, ty, C.goldL);
  } else {                                           // side-parted, men's cut
    R(p, cx - 4, ty + 1, 8, 3, h1); D(p, cx - 3, ty + 1, h3); D(p, cx - 2, ty + 1, h3);
  }
}

/* the head in profile, always facing right — sprites are flipped for the left */
function pxHeadSide(p, cx, ty, sk, hr, o) {
  const [s1, s2, s3] = sk, [h1, h2, h3] = hr;
  // skull, narrower than the front view
  BLOB(p, cx, ty + 5, 3.6, 4.6, s1);
  R(p, cx - 4, ty + 2, 2, 7, s2);                    // the far side falls into shade
  // jaw and chin push forward
  R(p, cx + 1, ty + 7, 2, 2, s1);
  D(p, cx + 3, ty + 6, s1);                          // nose
  D(p, cx + 3, ty + 7, s2);
  D(p, cx + 2, ty + 8, s3);                          // lips
  D(p, cx + 1, ty + 9, s2);                          // under the chin
  if (o.pretty) {
    R(p, cx - 1, ty + 3, 3, 1, h3); D(p, cx + 2, ty + 2, h3);   // arched brow
    R(p, cx - 1, ty + 4, 3, 1, h2);                  // lash line
    D(p, cx + 2, ty + 4, h1);                        // the flick at the corner
    R(p, cx, ty + 5, 2, 1, '#4a3350');               // the eye
    D(p, cx + 1, ty + 5, '#2a1c30');
    D(p, cx, ty + 5, '#fffdf8');                     // catchlight
    D(p, cx + 1, ty + 6, '#8a6472'); D(p, cx + 2, ty + 6, s2);  // lower lid
  } else {
    D(p, cx, ty + 5, h2);                            // eye, seen edge-on
    D(p, cx + 1, ty + 5, h1);
    D(p, cx - 1, ty + 3, h2);                        // brow
    D(p, cx, ty + 3, h2);
  }
  if (o.blush) D(p, cx + 1, ty + 7, '#e8927f55');
  D(p, cx - 3, ty + 6, s2);                          // ear
  D(p, cx - 3, ty + 7, s3);
  // hair, massed at the back of the head
  R(p, cx - 4, ty, 8, 3, h1);
  R(p, cx - 5, ty + 1, 2, 7, h1);
  R(p, cx + 1, ty + 1, 3, 2, h1);
  R(p, cx - 3, ty, 5, 1, h3);
  const st = o.hairStyle || 0;
  if (st === 0)      BLOB(p, cx - 5, ty + 6, 2.4, 2.2, h3);
  else if (st === 1) { R(p, cx - 6, ty + 3, 3, 10, h1); R(p, cx - 6, ty + 5, 1, 7, h2); }
  else if (st === 2)   R(p, cx - 5, ty + 1, 3, 5, h1);
  else if (st === 3) { BLOB(p, cx - 5, ty + 2, 2.4, 2, h3); D(p, cx - 4, ty + 1, C.goldL); }
  else                 R(p, cx - 5, ty + 1, 4, 3, h1);
}

/* a standing adult, front or back */
function pxPerson(p, cx, b, o) {
  const sk = o.skin, [w1, w2, w3] = o.wear;
  const ty = b - 26;
  // ground shadow
  ELL(p, cx, b - 1, 6, 2, '#00000038');
  // legs / skirt
  if (o.skirt) {
    for (let j = 0; j < 10; j++) {
      const hw = 4 + j * 0.62;
      R(p, cx - hw, b - 11 + j, hw * 2, 1, j > 7 ? w2 : w1);
    }
    R(p, cx - 1, b - 11, 2, 9, w3);                   // a lit fold down the front
    R(p, cx + 3, b - 8, 1, 6, w2);
    R(p, cx - 9, b - 2, 18, 1, '#00000030');
  } else {
    const [t1, t2] = o.trouser;
    R(p, cx - 4, b - 12, 3, 10, t1); R(p, cx + 1, b - 12, 3, 10, t1);
    R(p, cx - 4, b - 12, 1, 10, t2); R(p, cx + 1, b - 12, 1, 10, t2);
    R(p, cx - 5, b - 2, 4, 2, C.blkD); R(p, cx + 1, b - 2, 4, 2, C.blkD);
    R(p, cx - 5, b - 2, 4, 1, C.blkL); R(p, cx + 1, b - 2, 4, 1, C.blkL);
  }
  // torso
  R(p, cx - 5, b - 20, 10, 9, w1);
  R(p, cx - 5, b - 20, 10, 1, w3);                    // light catches the shoulders
  R(p, cx + 3, b - 20, 2, 9, w2);
  R(p, cx - 5, b - 20, 1, 9, w2);
  if (o.jacket) {                                     // lapels and a shirt in the gap
    R(p, cx - 1, b - 20, 2, 7, C.ivory);
    D(p, cx - 2, b - 19, w3); D(p, cx + 1, b - 19, w3);
    R(p, cx - 1, b - 19, 2, 3, o.tie || C.ivoryS);
    D(p, cx, b - 16, o.tie || C.ivoryS);
    if (o.pocket) D(p, cx + 3, b - 18, C.wh1);
  } else if (o.neckline) {
    R(p, cx - 2, b - 20, 4, 2, sk[0]); D(p, cx, b - 18, sk[1]);
    if (o.necklace) { D(p, cx, b - 19, C.goldL); D(p, cx - 1, b - 19, C.gold); D(p, cx + 1, b - 19, C.gold); }
  }
  if (o.sash) { for (let j = 0; j < 8; j++) D(p, cx - 4 + j, b - 20 + j, o.sash); }
  // arms
  const ar = o.arms || 0;                             // 0 rest, 1 clapping, 2 hands clasped
  const sl = o.sleeve === false;
  const armc = sl ? sk[0] : w1, armd = sl ? sk[1] : w2;
  if (ar === 1) {
    R(p, cx - 7, b - 19, 2, 5, armc); R(p, cx + 5, b - 19, 2, 5, armc);
    R(p, cx - 5, b - 15, 4, 2, sk[0]); R(p, cx + 1, b - 15, 4, 2, sk[0]);
    R(p, cx - 5, b - 15, 4, 1, sk[1]);
  } else if (ar === 2) {
    R(p, cx - 7, b - 19, 2, 4, armc); R(p, cx + 5, b - 19, 2, 4, armc);
    R(p, cx - 6, b - 16, 3, 3, armd); R(p, cx + 3, b - 16, 3, 3, armd);
    BLOB(p, cx, b - 14, 2.4, 1.6, sk[0]); D(p, cx, b - 15, sk[1]);
  } else {
    R(p, cx - 7, b - 19, 2, 8, armc); R(p, cx + 5, b - 19, 2, 8, armc);
    R(p, cx - 7, b - 19, 1, 8, armd); R(p, cx + 6, b - 19, 1, 8, armd);
    BLOB(p, cx - 6, b - 11, 1.6, 1.6, sk[0]); BLOB(p, cx + 6, b - 11, 1.6, 1.6, sk[0]);
  }
  // neck and head
  R(p, cx - 1, b - 21, 3, 2, sk[1]);
  pxHead(p, cx, ty, sk, o.hair, o);
}

/* a standing adult in profile, facing right */
function pxPersonSide(p, cx, b, o) {
  const sk = o.skin, [w1, w2, w3] = o.wear;
  const ty = b - 26;
  ELL(p, cx, b - 1, 5, 2, '#00000038');
  if (o.skirt) {
    for (let j = 0; j < 10; j++) {
      const hw = 3.2 + j * 0.5;
      R(p, cx - hw - 0.6, b - 11 + j, hw * 2, 1, j > 7 ? w2 : w1);
    }
    R(p, cx - 1, b - 11, 2, 9, w3);
  } else {
    const [t1, t2] = o.trouser;
    R(p, cx - 2, b - 12, 4, 10, t1);
    R(p, cx - 2, b - 12, 1, 10, t2);
    R(p, cx - 1, b - 12, 3, 4, t2);                   // the far leg, behind
    R(p, cx - 2, b - 2, 6, 2, C.blkD);
    R(p, cx - 2, b - 2, 6, 1, C.blkL);
  }
  // torso, narrower side-on but with real depth
  R(p, cx - 3, b - 20, 7, 9, w1);
  R(p, cx - 3, b - 20, 7, 1, w3);
  R(p, cx - 3, b - 20, 2, 9, w2);                     // back falls away
  D(p, cx + 3, b - 17, w3);
  if (o.jacket) {
    R(p, cx + 2, b - 20, 2, 6, C.ivory);
    R(p, cx + 2, b - 19, 1, 3, o.tie || C.ivoryS);
    D(p, cx + 3, b - 20, w3);
  } else if (o.neckline) {
    R(p, cx + 1, b - 20, 2, 2, sk[0]);
    if (o.necklace) D(p, cx + 2, b - 19, C.goldL);
  }
  if (o.sash) { for (let j = 0; j < 6; j++) D(p, cx - 2 + j * 0.8, b - 20 + j, o.sash); }
  const ar = o.arms || 0;
  const sl = o.sleeve === false;
  const armc = sl ? sk[0] : w1, armd = sl ? sk[1] : w2;
  if (ar === 3) {
    // a hand microphone held up to his mouth: the far arm rests at his
    // side, the near one bends up in front of him
    R(p, cx, b - 20, 2, 8, armc);                     // the far arm
    R(p, cx, b - 20, 1, 8, armd);
    BLOB(p, cx + 1, b - 12, 1.5, 1.4, sk[0]);
    R(p, cx + 1, b - 20, 2, 6, armc);                 // upper arm to the elbow
    R(p, cx + 1, b - 20, 1, 6, armd);
    D(p, cx + 3, b - 15, armd);                       // forearm turning up
    D(p, cx + 4, b - 16, armd);
    BLOB(p, cx + 4, b - 15, 1.6, 1.4, sk[0]);         // the hand
    D(p, cx + 4, b - 16, sk[1]);
    R(p, cx + 4, b - 18, 1, 3, '#33333d');            // the barrel
    D(p, cx + 5, b - 18, '#22222a');
    BLOB(p, cx + 4, b - 19, 1.5, 1.4, '#5d5d68');     // the head of it
    D(p, cx + 4, b - 20, '#8f8f9c');
  } else if (ar === 1) {
    R(p, cx, b - 19, 2, 4, armc);
    R(p, cx + 2, b - 16, 3, 2, sk[0]); D(p, cx + 4, b - 16, sk[1]);
  } else if (ar === 2) {
    R(p, cx, b - 19, 2, 4, armc);
    R(p, cx + 1, b - 16, 3, 3, armd);
    BLOB(p, cx + 3, b - 14, 1.8, 1.6, sk[0]);
  } else {
    R(p, cx + 1, b - 19, 2, 8, armc);
    R(p, cx + 1, b - 19, 1, 8, armd);
    BLOB(p, cx + 2, b - 11, 1.6, 1.6, sk[0]);
  }
  R(p, cx, b - 21, 2, 2, sk[1]);
  pxHeadSide(p, cx, ty, sk, o.hair, o);
}

/* a chiavari chair, seen from the side — gold frame, ivory cushion */
function pxChairSide(p, cx, seat, o) {
  // a banquet chair under a fitted black cover, which is how every seat
  // in this hall is dressed
  const g1 = o.chair ? o.chair[0] : C.cloth, g2 = o.chair ? o.chair[1] : C.clothL,
        g3 = o.chair ? o.chair[2] : C.clothD;
  R(p, cx - 5, seat - 15, 3, 16, g1);                  // the covered back
  R(p, cx - 6, seat - 15, 1, 16, '#3e414c');           // a rim of light down it
  R(p, cx - 5, seat - 15, 1, 16, g2);
  R(p, cx - 5, seat - 15, 3, 1, '#4a4d58');
  R(p, cx - 3, seat - 14, 1, 14, g3);
  R(p, cx - 5, seat - 1, 9, 3, g1);                    // the seat
  R(p, cx - 5, seat - 1, 9, 1, g2);
  R(p, cx - 5, seat + 2, 9, 1, g3);
  R(p, cx - 4, seat + 3, 3, 6, g1);                    // the skirt to the floor
  R(p, cx + 1, seat + 3, 3, 6, g1);
  R(p, cx - 4, seat + 3, 1, 6, g3);
  R(p, cx + 1, seat + 3, 1, 6, g3);
}

/* seated in profile, facing right — thighs forward, shins down */
function pxSeatedSide(p, cx, b, o) {
  const sk = o.skin, [w1, w2, w3] = o.wear;
  const seat = b - 9;
  ELL(p, cx, b - 1, 6, 2, '#00000038');
  pxChairSide(p, cx, seat, o);
  const lap = o.lap || w1, lapD = o.lap ? o.lapD || o.lap : w2;
  // thigh forward, shin down
  if (o.skirt) {
    R(p, cx - 3, seat - 4, 8, 5, lap);
    R(p, cx - 3, seat - 4, 8, 1, o.lapL || w3);
    for (let j = 0; j < 7; j++) R(p, cx + 1 - j * 0.2, seat + 1 + j, 4 + j * 0.5, 1, j > 4 ? lapD : lap);
    R(p, cx + 1, b - 2, 5, 1, '#00000030');
  } else {
    const [t1, t2] = o.trouser;
    R(p, cx - 3, seat - 4, 8, 5, t1);
    R(p, cx - 3, seat - 4, 8, 1, C.blkL);
    R(p, cx + 2, seat + 1, 3, 7, t1);
    R(p, cx + 2, seat + 1, 1, 7, t2);
    R(p, cx + 1, b - 2, 5, 2, C.blkD);
    R(p, cx + 1, b - 2, 5, 1, C.blkL);
  }
  // torso, upright against the chair back
  R(p, cx - 3, seat - 13, 7, 10, w1);
  R(p, cx - 3, seat - 13, 7, 1, w3);
  R(p, cx - 3, seat - 13, 2, 10, w2);
  D(p, cx + 3, seat - 10, w3);
  if (o.jacket) {
    R(p, cx + 2, seat - 13, 2, 6, C.ivoryL);
    R(p, cx + 2, seat - 12, 1, 4, o.tie || C.ivoryS);
    D(p, cx + 3, seat - 13, w3);
    if (o.pocket) D(p, cx + 2, seat - 11, C.wh1);
  } else if (o.neckline) {
    R(p, cx + 1, seat - 13, 2, 2, sk[0]);
    if (o.necklace) D(p, cx + 2, seat - 12, C.goldL);
  }
  if (o.hanbok) {                       // 저고리 hem and 고름 down the front
    R(p, cx - 3, seat - 6, 8, 1, o.lapL || C.wh1);
    R(p, cx + 2, seat - 12, 1, 6, o.sash || C.pk3);
    D(p, cx + 3, seat - 12, C.pk1);
  } else if (o.sash) {
    for (let j = 0; j < 6; j++) D(p, cx - 2 + j * 0.8, seat - 13 + j, o.sash);
  }
  // arms
  const ar = o.arms || 0;
  if (ar === 1) {                        // clapping
    R(p, cx, seat - 12, 2, 4, w1);
    R(p, cx + 2, seat - 9, 3, 2, sk[0]); D(p, cx + 4, seat - 9, sk[1]);
  } else if (ar === 2) {                 // hands folded
    R(p, cx, seat - 12, 2, 4, w1);
    R(p, cx + 1, seat - 9, 3, 3, w2);
    BLOB(p, cx + 3, seat - 7, 1.8, 1.6, sk[0]);
  } else {                               // resting on the lap
    R(p, cx, seat - 12, 2, 5, w1);
    R(p, cx + 1, seat - 8, 3, 2, w2);
    BLOB(p, cx + 4, seat - 7, 1.6, 1.5, sk[0]);
  }
  R(p, cx, seat - 14, 2, 2, sk[1]);
  pxHeadSide(p, cx, seat - 19, sk, o.hair, o);
}

/* the head at three-quarters, turned toward +x — the far cheek falls into
   shade, the near one carries the nose */
function pxHeadQ(p, cx, ty, sk, hr, o) {
  const [s1, s2, s3] = sk, [h1, h2, h3] = hr;
  BLOB(p, cx, ty + 5, 4, 4.6, s1);
  R(p, cx - 4, ty + 2, 2, 7, s2);                    // the far side of the face
  D(p, cx - 4, ty + 6, s3);
  D(p, cx + 4, ty + 5, s1); D(p, cx + 4, ty + 6, s2);
  D(p, cx - 1, ty + 5, h2); D(p, cx + 2, ty + 5, h2);
  D(p, cx - 1, ty + 4, '#ffffff40'); D(p, cx + 2, ty + 4, '#ffffff40');
  D(p, cx + 3, ty + 7, s3);                          // nose, catching the edge
  D(p, cx + 4, ty + 7, s3);
  R(p, cx + 1, ty + 8, 2, 1, '#a8564d');             // mouth
  if (o.blush) { D(p, cx - 2, ty + 7, '#e8927f60'); D(p, cx + 3, ty + 8, '#e8927f60'); }
  D(p, cx - 3, ty + 6, s2);                          // the far ear
  // hair, massed away from the turn
  R(p, cx - 5, ty + 1, 9, 3, h1);
  R(p, cx - 4, ty, 8, 1, h1);
  R(p, cx - 5, ty + 2, 2, 6, h1);
  R(p, cx + 4, ty + 2, 1, 3, h1);
  R(p, cx - 4, ty, 5, 1, h3);
  const st = o.hairStyle || 0;
  if (st === 0)      BLOB(p, cx - 5, ty + 6, 2.4, 2.2, h3);
  else if (st === 1) { R(p, cx - 6, ty + 3, 3, 10, h1); R(p, cx + 4, ty + 4, 1, 7, h2); }
  else if (st === 2)   R(p, cx - 5, ty + 1, 4, 5, h1);
  else if (st === 3) { BLOB(p, cx - 5, ty + 2, 2.4, 2, h3); D(p, cx - 4, ty + 1, C.goldL); }
  else                 R(p, cx - 5, ty + 1, 5, 3, h1);
}

/* seated at three-quarters, turned toward +x — the pose the 혼주 hold,
   angled off the runner so they can watch her come up it */
function pxSeatedQ(p, cx, b, o) {
  const sk = o.skin, [w1, w2, w3] = o.wear;
  const seat = b - 9;
  ELL(p, cx, b - 1, 7, 2.2, '#00000038');
  const g1 = o.chair ? o.chair[0] : C.cloth, g2 = o.chair ? o.chair[1] : C.clothL,
        g3 = o.chair ? o.chair[2] : C.clothD;
  // a covered chair at an angle: the back panel behind, one side turned to us
  R(p, cx - 5, seat - 15, 11, 15, g1);
  R(p, cx - 5, seat - 15, 11, 1, g2);
  R(p, cx - 5, seat - 15, 1, 15, g2); R(p, cx + 5, seat - 15, 1, 15, g3);
  // the seat itself, wide and pale enough to read from across the hall
  R(p, cx - 6, seat - 1, 13, 3, C.ivory);
  R(p, cx - 6, seat - 1, 13, 1, C.ivoryL);
  R(p, cx - 6, seat + 2, 13, 1, g3);
  R(p, cx - 5, seat + 3, 2, 6, g1); R(p, cx + 5, seat + 3, 2, 6, g1);
  R(p, cx - 5, seat + 7, 12, 1, g3);            // the stretcher between the legs
  // The lap: a flat block of thigh resting on the seat, then short shins
  // dropping straight down. At this size that shape is what says "seated".
  const lap = o.lap || w1;
  if (o.skirt) {
    R(p, cx - 5, seat - 5, 12, 6, lap);
    R(p, cx - 5, seat - 5, 12, 1, o.lapL || w3);
    R(p, cx - 5, seat, 12, 1, o.lapD || w2);
    for (let j = 0; j < 5; j++) R(p, cx - 1 + j * 0.4, seat + 2 + j, 7 - j * 0.4, 1, j > 2 ? (o.lapD || w2) : lap);
    R(p, cx - 1, b - 2, 7, 1, '#00000030');
  } else {
    const [t1, t2] = o.trouser;
    R(p, cx - 5, seat - 5, 12, 6, t1);          // thigh, flat on the seat
    R(p, cx - 5, seat - 5, 12, 1, C.blkL);
    R(p, cx - 5, seat, 12, 1, t2);
    R(p, cx - 1, seat + 2, 3, 6, t1);           // shins, short and vertical
    R(p, cx + 3, seat + 2, 3, 6, t1);
    R(p, cx - 1, seat + 2, 1, 6, t2); R(p, cx + 3, seat + 2, 1, 6, t2);
    R(p, cx - 2, b - 2, 4, 2, C.blkD); R(p, cx + 2, b - 2, 4, 2, C.blkD);
    R(p, cx - 2, b - 2, 4, 1, C.blkL); R(p, cx + 2, b - 2, 4, 1, C.blkL);
  }
  // torso, square to us but narrowed on the far shoulder
  R(p, cx - 4, seat - 13, 9, 10, w1);
  R(p, cx - 4, seat - 13, 9, 1, w3);
  R(p, cx - 4, seat - 13, 2, 10, w2);
  R(p, cx + 4, seat - 12, 1, 9, w3);
  if (o.jacket) {
    R(p, cx, seat - 13, 3, 7, C.ivoryL);
    R(p, cx, seat - 12, 2, 4, o.tie || C.ivoryS);
    D(p, cx - 1, seat - 12, w3); D(p, cx + 3, seat - 12, w3);
    if (o.pocket) D(p, cx + 3, seat - 11, C.wh1);
  } else if (o.neckline) {
    R(p, cx - 1, seat - 13, 4, 2, sk[0]);
    if (o.necklace) { D(p, cx, seat - 12, C.goldL); D(p, cx + 1, seat - 12, C.gold); }
  }
  if (o.hanbok) {
    R(p, cx - 4, seat - 6, 10, 1, o.lapL || C.wh1);
    R(p, cx + 1, seat - 12, 1, 6, o.sash || C.pk3);
    D(p, cx + 2, seat - 12, o.lapL || C.pk1);
  }
  const ar = o.arms || 0;
  if (ar === 1) {                                    // applauding
    R(p, cx - 6, seat - 12, 2, 4, w1); R(p, cx + 5, seat - 12, 2, 4, w1);
    R(p, cx - 4, seat - 9, 3, 2, sk[0]); R(p, cx + 2, seat - 9, 3, 2, sk[0]);
    R(p, cx - 4, seat - 9, 3, 1, sk[1]);
  } else {                                           // hands folded in the lap
    R(p, cx - 6, seat - 12, 2, 5, w1); R(p, cx + 5, seat - 12, 2, 5, w1);
    R(p, cx - 5, seat - 8, 4, 2, w2); R(p, cx + 2, seat - 8, 4, 2, w2);
    BLOB(p, cx, seat - 6, 2.6, 1.6, sk[0]); D(p, cx, seat - 7, sk[1]);
  }
  R(p, cx - 1, seat - 14, 3, 2, sk[1]);
  pxHeadQ(p, cx, seat - 19, sk, o.hair, o);
}

/* seated seen from the front or the back */
function pxSeatedFront(p, cx, b, o) {
  const sk = o.skin, [w1, w2, w3] = o.wear;
  const seat = b - 9, back = o.view === 'back';
  ELL(p, cx, b - 1, 6, 2, '#00000038');
  const g1 = o.chair ? o.chair[0] : C.gold, g3 = o.chair ? o.chair[2] : C.goldD;
  if (back) {
    R(p, cx - 5, seat - 14, 1, 14, g1); R(p, cx + 4, seat - 14, 1, 14, g1);
    R(p, cx - 5, seat - 14, 10, 1, C.goldL);
    R(p, cx - 5, seat - 10, 10, 1, g1); R(p, cx - 5, seat - 6, 10, 1, g1);
  }
  R(p, cx - 6, seat - 1, 12, 2, o.chairPad || C.ivory);
  R(p, cx - 6, seat + 1, 12, 1, g3);
  R(p, cx - 5, seat + 2, 1, 7, g1); R(p, cx + 4, seat + 2, 1, 7, g1);
  if (o.skirt) {
    const lap = o.lap || w1;
    R(p, cx - 5, seat - 3, 10, 7, lap); R(p, cx - 5, seat - 3, 10, 1, w3);
    R(p, cx - 5, seat + 4, 10, 1, o.lapD || w2);
  } else {
    const [t1, t2] = o.trouser;
    R(p, cx - 5, seat - 3, 4, 9, t1); R(p, cx + 1, seat - 3, 4, 9, t1);
    R(p, cx - 5, seat - 3, 1, 9, t2); R(p, cx + 1, seat - 3, 1, 9, t2);
    R(p, cx - 5, b - 2, 4, 2, C.blkD); R(p, cx + 1, b - 2, 4, 2, C.blkD);
  }
  R(p, cx - 4, seat - 13, 9, 10, w1);
  R(p, cx - 4, seat - 13, 9, 1, w3);
  R(p, cx + 3, seat - 13, 2, 10, w2);
  if (!back) {
    if (o.jacket) { R(p, cx - 1, seat - 13, 2, 6, C.ivoryL); R(p, cx - 1, seat - 12, 2, 3, o.tie || C.ivoryS); }
    else if (o.neckline) {
      R(p, cx - 2, seat - 13, 4, 2, sk[0]);
      if (o.necklace) D(p, cx, seat - 12, C.goldL);
    }
  }
  const ar = o.arms || 0;
  if (ar === 1) {
    R(p, cx - 6, seat - 12, 2, 4, w1); R(p, cx + 5, seat - 12, 2, 4, w1);
    R(p, cx - 4, seat - 9, 3, 2, sk[0]); R(p, cx + 2, seat - 9, 3, 2, sk[0]);
  } else {
    R(p, cx - 6, seat - 12, 2, 6, w1); R(p, cx + 5, seat - 12, 2, 6, w1);
    BLOB(p, cx - 5, seat - 6, 1.5, 1.4, sk[0]); BLOB(p, cx + 5, seat - 6, 1.5, 1.4, sk[0]);
  }
  R(p, cx - 1, seat - 14, 3, 2, sk[1]);
  pxHead(p, cx, seat - 19, sk, o.hair, o);
}

/* ── the bride ─────────────────────────────────────────────
   Taller than the congregation, because she is the one you are
   meant to follow. The train always lies behind her, so it is
   drawn on the far side of whichever way she is walking. */
const GOWN = { l: '#fffdf9', m: '#f2ece2', d: '#ddd5c8', s: '#c3b9a8', v: '#e9e6f2' };

function pxBride(p, cx, b, dir, step, wave) {
  const sk = SKIN[0], hr = HAIR[0], G = GOWN;
  const sway = step === 1 ? -1 : step === 2 ? 1 : 0;
  const back = dir === 'up', side = dir === 'side' || dir === 'left' || dir === 'right';
  const ty = b - 35;

  /* ── the train ───────────────────────────────────────────
     A teardrop of silk lying on the floor behind her: it widens
     out of the skirt, then tapers away. Walking toward us it is
     hidden by her own skirt, so only the pool around the hem
     shows; walking away, the whole length of it does. */
  // her shadow goes down first, so the train lies on top of it rather
  // than being cut in half by it
  ELL(p, cx, b - 1, 13, 2.8, '#00000026');
  ELL(p, cx, b - 1, 8, 2, '#00000030');

  /* ── the veil ────────────────────────────────────────────
     It hangs from the crown and lies behind her whichever way she
     is facing: straight down her back when she walks away, spilling
     out either side of her when she comes toward us, and swept back
     over one shoulder in profile. Drawn here, before the dress, so
     it stays behind her instead of washing over it. */
  let VEIL = null;
  {
    const ty0 = b - 35;
    const vL = back ? 25 : 23;
    const veilAt = t => back      ? { hw: 5.5 + t * 7.4, off: 0 }
                      : side      ? { hw: 3.6 + t * 5.2, off: -1.5 - t * 6.5 }
                      :             { hw: 4.6 + t * 7.6, off: 0 };
    p.g.globalAlpha = back ? 0.4 : 0.32;
    for (let j = 0; j < vL; j++) {
      const { hw, off } = veilAt(j / vL);
      const w = Math.round(hw), o2 = Math.round(off);
      R(p, cx - w + o2, ty0 + 5 + j, w * 2, 1, '#ffffff');
    }
    // the weave, and the scalloped hem — enough to read as tulle
    p.g.globalAlpha = 0.5;
    const vg = mulberry(back ? 91 : side ? 92 : 93);
    for (let j = 1; j < vL; j++) {
      const { hw, off } = veilAt(j / vL);
      const w = Math.round(hw), o2 = Math.round(off);
      if (j % 3 === 0) { D(p, cx - w + o2, ty0 + 5 + j, G.v); D(p, cx + w - 1 + o2, ty0 + 5 + j, G.v); }
      if (vg() > 0.72) D(p, cx - w + o2 + 1 + ((vg() * (w * 2 - 2)) | 0), ty0 + 5 + j, '#ffffff');
    }
    { const { hw, off } = veilAt(1);
      const w = Math.round(hw), o2 = Math.round(off);
      for (let x = -w + 1; x < w; x += 3) D(p, cx + x + o2, ty0 + 4 + vL, G.v); }
    p.g.globalAlpha = 1;
    VEIL = { at: veilAt, n: vL, top: ty0 + 5 };
  }

  const L = back ? 24 : 8;
  const trainAt = j => {
    const t = j / L;
    return back
      ? { hw: 4 + 8 * Math.sin(t * Math.PI * 0.94), y: b - 5 + j }
      : { hw: 14.5 - t * 5,                            y: b - 2 - j * 0.9 };
  };
  for (let j = L; j >= 0; j--) {
    const { hw, y } = trainAt(j);
    if (y < 1 || y > p.h - 1) continue;
    const w = Math.round(hw);
    R(p, cx - w, y, w * 2, 1, j > L * 0.62 ? G.m : G.l);
    D(p, cx - w, y, G.d); D(p, cx + w - 1, y, G.d);
  }
  // lace along the outer edge, and the folds running back through it
  for (let j = 1; j < L; j++) {
    const { hw, y } = trainAt(j);
    if (y < 1 || y > p.h - 1) continue;
    if (j % 3 === 0) { D(p, Math.round(cx - hw - 1), y, G.s); D(p, Math.round(cx + hw), y, G.s); }
    if (back && j % 5 === 2) {
      D(p, cx - Math.round(hw * 0.45), y, G.d);
      D(p, cx + Math.round(hw * 0.45), y, G.d);
    }
  }

  /* ── the skirt: a full A-line, tucked under at the hem ── */
  const SH = 15, skTop = b - 16;
  const hwAt = j => {
    const t = j / (SH - 1);
    let hw = (side ? 4.2 : 4.8) + (side ? 6.8 : 8.4) * Math.pow(t, 0.7);
    if (j === SH - 1) hw -= 3; else if (j === SH - 2) hw -= 1;
    return hw;
  };
  for (let j = 0; j < SH; j++) {
    const hw = hwAt(j), off = sway * 0.3;
    const w = Math.round(hw);
    R(p, cx - w + off, skTop + j, w * 2, 1, G.l);
    D(p, Math.round(cx + w - 1 + off), skTop + j, G.m);
    D(p, Math.round(cx - w + off), skTop + j, G.m);
    if (j > 1) D(p, Math.round(cx + w - 2 + off), skTop + j, G.m);
  }
  // pleats falling from the waist, spreading as the skirt does
  for (const f of [-0.62, -0.24, 0.2, 0.58]) {
    for (let j = 2; j < SH - 1; j++) {
      const hw = hwAt(j);
      D(p, Math.round(cx + f * hw + sway * 0.3), skTop + j, f < 0 ? G.l : G.d);
    }
  }
  // the hem: a shaded lip with lace picked out along it
  for (let j = SH - 2; j < SH; j++) {
    const w = Math.round(hwAt(j));
    R(p, cx - w, skTop + j, w * 2, 1, j === SH - 1 ? G.s : G.d);
  }
  { const w = Math.round(hwAt(SH - 2));
    for (let x = -w + 1; x < w; x += 3) D(p, cx + x, skTop + SH - 2, G.l); }

  /* ── the bodice ── */
  R(p, cx - 4, b - 26, 8, 11, G.l);
  R(p, cx + 2, b - 26, 2, 11, G.m);
  R(p, cx - 4, b - 26, 1, 11, G.d);
  R(p, cx - 4, b - 26, 8, 1, G.l);
  R(p, cx - 4, b - 17, 8, 2, G.m);                 // the waist seam
  R(p, cx - 4, b - 16, 8, 1, G.d);
  for (const [dx, dy] of [[-2,-23],[1,-22],[-1,-20],[2,-24],[0,-19],[-3,-21]])
    D(p, cx + dx, b + dy, C.goldL);
  if (!back) {                                      // the sweetheart neckline
    R(p, cx - 3, b - 27, 6, 2, sk[0]);
    D(p, cx - 3, b - 26, G.l); D(p, cx + 2, b - 26, G.l);
    D(p, cx, b - 25, sk[1]);
  }

  /* ── arms, and the bouquet she carries ── */
  if (wave) {
    // The hand goes up clear of her head, where it is against the dark hall
    // instead of against her own gown, and it is bare to the elbow so it
    // reads as a hand and not a sleeve.
    const out = wave === 1 ? 0 : 2;               // it swings out and back
    R(p, cx + 4, b - 26, 2, 7, G.l);              // the bouquet arm stays down
    R(p, cx + 5, b - 26, 1, 7, G.m);
    BLOB(p, cx + 4, b - 19, 1.6, 1.5, sk[0]);
    R(p, cx - 6, b - 26, 3, 4, G.l);              // the short sleeve, lifted
    R(p, cx - 6, b - 26, 1, 4, G.m);
    const hx = cx - 8 - out;
    R(p, hx, b - 34, 3, 9, sk[0]);                // bare forearm, straight up
    R(p, hx, b - 34, 1, 9, sk[1]);
    R(p, hx + 2, b - 34, 1, 9, sk[2]);
    BLOB(p, hx + 1, b - 36, 2.6, 2.2, sk[0]);     // an open hand above her head
    R(p, hx - 1, b - 39, 1, 3, sk[0]);            // fingers
    R(p, hx + 1, b - 40, 1, 4, sk[0]);
    R(p, hx + 3, b - 39, 1, 3, sk[0]);
    D(p, hx - 1, b - 36, sk[1]); D(p, hx + 3, b - 36, sk[2]);
    D(p, hx + 1, b - 37, sk[1]);
    R(p, cx - 1, b - 18, 2, 5, C.gr2);            // the bouquet, held low
    BLOB(p, cx, b - 20, 4.2, 3, C.gr1);
    for (const [dx, dy, cc] of [[-3,-20,C.pk2],[-1,-21,C.wh1],[2,-20,C.pk1],[0,-19,C.pk3],[3,-21,C.wh1]])
      BLOB(p, cx + dx, b + dy, 1.5, 1.3, cc);
  } else if (!back) {
    const bqx = cx + (side ? 3 : 0);
    R(p, cx - 6, b - 26, 2, 7, G.l); R(p, cx + 4, b - 26, 2, 7, G.l);
    R(p, cx - 6, b - 26, 1, 7, G.m); R(p, cx + 5, b - 26, 1, 7, G.m);
    BLOB(p, cx - 4, b - 19, 1.6, 1.5, sk[0]); BLOB(p, cx + 4, b - 19, 1.6, 1.5, sk[0]);
    R(p, bqx - 1, b - 18, 2, 5, C.gr2);
    for (let k = 0; k < 3; k++) D(p, bqx - 1 + k, b - 13, C.gr3);
    BLOB(p, bqx, b - 20, 4.6, 3.4, C.gr1);
    for (const [dx, dy, cc] of [[-3,-20,C.pk2],[-1,-21,C.wh1],[2,-20,C.pk1],[0,-19,C.pk3],
                                [3,-21,C.wh1],[-2,-18,C.pk1],[2,-18,C.lv1],[0,-22,C.pk1],
                                [-4,-19,C.lv1],[4,-19,C.pk2]])
      BLOB(p, bqx + dx, b + dy, 1.5, 1.3, cc);
  } else {
    R(p, cx - 6, b - 26, 2, 9, G.l); R(p, cx + 4, b - 26, 2, 9, G.l);
    R(p, cx - 6, b - 26, 1, 9, G.m); R(p, cx + 5, b - 26, 1, 9, G.m);
    BLOB(p, cx - 5, b - 17, 1.6, 1.5, sk[0]); BLOB(p, cx + 5, b - 17, 1.6, 1.5, sk[0]);
  }

  /* a whisper of the same veil laid back over the dress, so the gown
     shows through it and it reads as tulle rather than a cape */
  if (VEIL) {
    p.g.globalAlpha = 0.11;
    for (let j = 0; j < VEIL.n; j++) {
      const { hw, off } = VEIL.at(j / VEIL.n);
      const w = Math.round(hw), o2 = Math.round(off);
      R(p, cx - w + o2, VEIL.top + j, w * 2, 1, '#ffffff');
    }

  D(p, cx - 1, ty - 1, C.gold);  D(p, cx + 1, ty - 1, C.gold);
  D(p, cx, ty - 3, C.flameL);
}

/* the groom on the move: the same suit, with a walk cycle and an arm

function pxGroomWalk(p, cx, b, step, wave) {
  const sk = SKIN[1], hr = HAIR[0];
