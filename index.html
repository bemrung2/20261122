<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>민소커플의 이야기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root{
  --cream:     #faf5ee;
  --cream2:    #f3ead9;
  --gold:      #c9a96e;
  --gold2:     #b8924a;
  --rose:      #c9848e;
  --rose2:     #b06070;
  --ink:       #2a1f14;
  --ink2:      #5a4535;
  --ink3:      #9a8070;
  --ink4:      #c0b0a0;
  --white:     #fffefb;
  --glass:     rgba(250,245,238,0.72);
  --sat:       env(safe-area-inset-top,44px);
  --sab:       env(safe-area-inset-bottom,34px);
}

/* ═══════════════════════════════════════
   RESET
═══════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;width:100%;position:fixed;overflow:hidden}
body{
  width:100%;height:100%;
  background:var(--cream);
  font-family:'Noto Serif KR',serif;
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ═══════════════════════════════════════
   SCREENS
═══════════════════════════════════════ */
.screen{position:fixed;inset:0;display:none}

/* ═══════════════════════════════════════
   LOCK SCREEN
═══════════════════════════════════════ */
#lockScreen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:var(--cream);
  z-index:200;
  padding:var(--sat) 0 var(--sab);
  overflow:hidden;
}
#lockScreen::before{
  content:'';
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(201,169,110,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 110% 80%, rgba(201,132,142,0.12) 0%, transparent 60%);
  pointer-events:none;
}
.lock-wrap{
  width:100%;
  padding:0 2rem;
  display:flex;flex-direction:column;align-items:center;gap:0;
  animation:lockIn .9s cubic-bezier(.22,1,.36,1) both;
}
@keyframes lockIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.lock-emblem{
  width:64px;height:64px;
  border-radius:20px;
  background:linear-gradient(145deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;
  box-shadow:0 8px 32px rgba(201,169,110,0.35),0 2px 8px rgba(0,0,0,0.08);
  margin-bottom:1.6rem;
  animation:emblemPulse 3s ease-in-out infinite;
}
@keyframes emblemPulse{0%,100%{box-shadow:0 8px 32px rgba(201,169,110,0.35),0 2px 8px rgba(0,0,0,0.08)}50%{box-shadow:0 12px 40px rgba(201,169,110,0.5),0 4px 12px rgba(0,0,0,0.1)}}

.lock-title{
  font-family:'Cormorant Garamond',serif;
  font-size:2.2rem;font-weight:600;
  color:var(--ink);line-height:1.2;
  text-align:center;margin-bottom:.6rem;
}
.lock-sub{
  font-size:.8rem;font-weight:300;
  color:var(--ink3);line-height:1.75;
  text-align:center;margin-bottom:2.2rem;
  letter-spacing:.02em;
}
.lock-field{
  width:100%;
  background:var(--white);
  border:1.5px solid rgba(201,169,110,0.3);
  border-radius:14px;
  padding:1rem 1.2rem;
  margin-bottom:.5rem;
  transition:border-color .2s,box-shadow .2s;
}
.lock-field:focus-within{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(201,169,110,0.12);
}
.lock-field label{
  display:block;
  font-size:.7rem;color:var(--ink3);
  letter-spacing:.06em;margin-bottom:.35rem;
}
.lock-input{
  width:100%;background:none;border:none;outline:none;
  font-family:'Cormorant Garamond',serif;
  font-size:1.6rem;font-weight:600;
  color:var(--ink);letter-spacing:.15em;
  text-align:center;
  -webkit-appearance:none;
}
.lock-input::placeholder{color:var(--ink4);font-size:1rem;letter-spacing:.06em;font-weight:300}
.lock-hint{font-size:.72rem;color:var(--ink4);text-align:center;margin-bottom:1.6rem;letter-spacing:.02em}
.lock-error{
  font-size:.78rem;color:var(--rose);
  text-align:center;letter-spacing:.02em;
  opacity:0;transform:translateY(4px);
  transition:opacity .25s,transform .25s;
  min-height:1.2em;margin-bottom:1.4rem;
}
.lock-error.show{opacity:1;transform:translateY(0)}
.lock-input.shake{animation:shake .38s both}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.lock-btn{
  width:100%;height:54px;
  background:linear-gradient(135deg,var(--rose),var(--rose2));
  border:none;border-radius:27px;
  color:#fff;
  font-family:'Noto Serif KR',serif;
  font-size:.95rem;font-weight:600;
  letter-spacing:.04em;cursor:pointer;
  box-shadow:0 6px 24px rgba(176,96,112,0.35);
  transition:transform .15s,box-shadow .15s,opacity .15s;
  -webkit-appearance:none;
}
.lock-btn:active{transform:scale(.97);opacity:.9}

/* ═══════════════════════════════════════
   INTRO SCREEN
═══════════════════════════════════════ */
#intro{
  display:flex;flex-direction:column;
  justify-content:flex-end;
  background:var(--ink);
  z-index:150;
  overflow:hidden;
}
.intro-bg{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#1a1208 0%,#2a1a10 50%,#1e1010 100%);
}
.intro-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;
  width:2px;height:2px;
  background:var(--gold);
  border-radius:50%;
  opacity:0;
  animation:particleFade var(--dur,4s) var(--delay,0s) ease-in-out infinite;
}
@keyframes particleFade{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.6;transform:translateY(-20px)}}

.intro-content{
  position:relative;z-index:2;
  padding:0 2rem calc(3rem + var(--sab));
  animation:introUp 1.2s cubic-bezier(.22,1,.36,1) .2s both;
}
@keyframes introUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

.intro-year{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:.82rem;color:var(--gold);
  letter-spacing:.25em;margin-bottom:1rem;
  display:flex;align-items:center;gap:.6rem;
}
.intro-year::before{content:'';display:block;width:24px;height:1px;background:var(--gold)}

.intro-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3rem,11vw,4.5rem);
  font-weight:600;line-height:1.08;
  color:#fff;letter-spacing:-.02em;
  margin-bottom:1.2rem;
}
.intro-title em{font-style:italic;color:var(--gold)}

.intro-desc{
  font-size:.85rem;font-weight:300;
  color:rgba(255,255,255,.45);
  line-height:1.8;letter-spacing:.01em;
  margin-bottom:2.4rem;
}

.intro-btn{
  display:inline-flex;align-items:center;gap:.7rem;
  background:transparent;
  border:1px solid rgba(201,169,110,.5);
  border-radius:50px;
  padding:.85rem 1.8rem;
  color:var(--gold);
  font-family:'Noto Serif KR',serif;
  font-size:.88rem;font-weight:600;
  letter-spacing:.04em;cursor:pointer;
  transition:background .25s,border-color .25s,transform .15s;
  -webkit-appearance:none;
}
.intro-btn:hover{background:rgba(201,169,110,.12);border-color:var(--gold)}
.intro-btn:active{transform:scale(.97)}
.intro-btn-arrow{
  width:28px;height:28px;border-radius:50%;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-size:.85rem;
  transition:transform .25s;
}
.intro-btn:hover .intro-btn-arrow{transform:translateX(3px)}

.intro-scroll-hint{
  position:absolute;bottom:calc(2rem + var(--sab));right:2rem;
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  opacity:.3;z-index:2;
}
.intro-scroll-dot{
  width:4px;height:4px;border-radius:50%;background:var(--gold);
  animation:scrollDot 1.6s ease-in-out infinite;
}
.intro-scroll-dot:nth-child(2){animation-delay:.2s}
.intro-scroll-dot:nth-child(3){animation-delay:.4s}
@keyframes scrollDot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}

/* ═══════════════════════════════════════
   STORY SCREEN — 완전 고정 레이아웃
═══════════════════════════════════════ */
#storyApp{
  display:flex;flex-direction:column;
  background:var(--cream);
  z-index:100;overflow:hidden;
}

/* 상단 헤더 */
.story-header{
  position:relative;z-index:20;
  padding:calc(var(--sat) + 10px) 1.4rem 10px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.story-chapter-label{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:.78rem;
  color:var(--ink3);letter-spacing:.14em;
}
.story-progress-dots{display:flex;gap:5px;align-items:center}
.spd{
  width:5px;height:5px;border-radius:50%;
  background:var(--ink4);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
}
.spd.active{
  background:var(--rose);
  width:18px;border-radius:3px;
  transform:none;
}

/* 진행 바 */
.story-progress-bar{
  height:1.5px;
  background:rgba(201,169,110,0.15);
  flex-shrink:0;
  position:relative;
  z-index:20;
}
.story-progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--rose));
  transition:width .6s cubic-bezier(.4,0,.2,1);
  width:0%;
}

/* 미디어 — 화면의 고정 비율 차지 */
.story-media{
  position:relative;
  flex-shrink:0;
  overflow:hidden;
  background:var(--ink);
  /* 높이는 JS가 설정 */
}

/* 슬라이더 */
.slider-track{
  display:flex;
  height:100%;
  transition:transform .5s cubic-bezier(.77,0,.175,1);
  will-change:transform;
}
.slide{
  flex:0 0 100%;width:100%;height:100%;
  position:relative;overflow:hidden;
}
.slide img,.slide video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;display:block;
  transition:transform .6s ease;
}
/* 확대 효과 */
.slide.zooming img,.slide.zooming video{transform:scale(1.04)}

/* 슬라이드 오버레이 */
.slide-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(20,12,6,0.2) 0%,
    transparent 40%,
    transparent 55%,
    rgba(20,12,6,0.55) 100%);
  z-index:2;pointer-events:none;
}
.slide-placeholder{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;
  background:linear-gradient(145deg,var(--cream2),#ede0cc);
}
.ph-icon{font-size:2.2rem;opacity:.25}
.ph-text{font-size:.78rem;color:var(--ink3);letter-spacing:.06em}

/* 슬라이드 카운터 */
.slide-counter{
  position:absolute;top:12px;right:14px;
  z-index:10;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:20px;padding:3px 10px;
  font-family:'Cormorant Garamond',serif;
  font-size:.75rem;color:rgba(255,255,255,.85);
  letter-spacing:.06em;
  opacity:0;transition:opacity .3s;
}
.slide-counter.show{opacity:1}

/* 미디어 도트 */
.media-dots{
  position:absolute;bottom:12px;left:0;right:0;
  display:flex;justify-content:center;gap:5px;z-index:10;
}
.md{
  width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.4);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.md.active{
  background:#fff;width:18px;border-radius:3px;
}

/* 텍스트 카드 */
.story-card{
  flex-shrink:0;
  background:var(--cream);
  padding:1rem 1.6rem 0.8rem;
  display:flex;flex-direction:column;justify-content:center;
  position:relative;
  overflow:visible;
}
.story-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,.4),transparent);
}

.card-eyebrow{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:.72rem;
  color:var(--gold2);letter-spacing:.12em;
  opacity:0;transform:translateY(6px);
  transition:opacity .5s ease .25s,transform .5s ease .25s;
}
.card-tag{display:none}
.card-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.55rem;font-weight:600;line-height:1.25;
  color:var(--ink);white-space:pre-line;
  opacity:0;transform:translateY(8px);
  transition:opacity .55s ease .4s,transform .55s ease .4s;
}
.card-body{display:none}
.story-card.revealed .card-eyebrow,
.story-card.revealed .card-tag,
.story-card.revealed .card-title,
.story-card.revealed .card-body{
  opacity:1;transform:translateY(0);
}

/* 네비게이션 */
.story-nav{
  flex-shrink:0;
  padding:.75rem 1.4rem calc(.75rem + var(--sab));
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  background:var(--cream);
  opacity:0;transition:opacity .45s ease;
  margin-top:auto;
}
.story-nav.show{opacity:1}

.nav-back,.nav-next{
  height:44px;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  border-radius:22px;
  font-family:'Noto Serif KR',serif;
  font-size:.8rem;font-weight:600;
  letter-spacing:.02em;cursor:pointer;
  transition:all .2s;
  border:none;-webkit-appearance:none;
}
.nav-back{
  padding:0 1.1rem;
  background:rgba(201,169,110,.12);
  color:var(--ink2);
  flex:1;
}
.nav-back:active{background:rgba(201,169,110,.22)}
.nav-back:disabled{opacity:.2;pointer-events:none}

.nav-next{
  padding:0 1.4rem;
  background:linear-gradient(135deg,var(--rose),var(--rose2));
  color:#fff;
  flex:2;
  box-shadow:0 4px 16px rgba(176,96,112,.3);
}
.nav-next:active{transform:scale(.97);box-shadow:0 2px 8px rgba(176,96,112,.25)}

/* ═══════════════════════════════════════
   GALLERY SCREEN
═══════════════════════════════════════ */
#galleryScreen{
  display:flex;flex-direction:column;
  background:#0d0d0d;
  z-index:110;
}
.gallery-header{
  padding:calc(var(--sat) + .9rem) 1.4rem .6rem;
  flex-shrink:0;
  opacity:0;transform:translateY(8px);
  transition:opacity .5s .15s,transform .5s .15s;
}
#galleryScreen.show .gallery-header{opacity:1;transform:translateY(0)}
.gallery-eyebrow{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:.72rem;color:rgba(201,169,110,.7);
  letter-spacing:.16em;margin-bottom:.2rem;
}
.gallery-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.55rem;font-weight:600;
  color:rgba(255,255,255,.88);
}
.gallery-grid{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:2px;background:#0d0d0d;
  align-content:start;
  opacity:0;transition:opacity .5s .35s;
  scrollbar-width:none;
}
.gallery-grid::-webkit-scrollbar{display:none}
#galleryScreen.show .gallery-grid{opacity:1}
.gcell{
  aspect-ratio:1/1;position:relative;overflow:hidden;
  cursor:pointer;background:#1a1a1a;
  -webkit-tap-highlight-color:transparent;
}
.gcell img,.gcell video{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;transition:transform .35s ease}
.gcell:active img,.gcell:active video{transform:scale(.96)}
.gcell-ph{position:absolute;inset:0;z-index:1}
.gcell::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#1a1a1a 25%,#222 50%,#1a1a1a 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;z-index:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.gallery-footer{
  flex-shrink:0;
  padding:.8rem 1.4rem calc(.8rem + var(--sab));
  background:#0d0d0d;
  display:flex;align-items:center;justify-content:space-between;
  border-top:.5px solid rgba(255,255,255,.06);
  opacity:0;transition:opacity .5s .55s;
}
#galleryScreen.show .gallery-footer{opacity:1}
.gallery-count{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:.72rem;color:rgba(255,255,255,.25);letter-spacing:.1em;
}
.gallery-cta{
  display:flex;align-items:center;gap:.5rem;
  background:rgba(201,132,142,.15);
  border:1px solid rgba(201,132,142,.3);
  border-radius:22px;padding:.55rem 1.2rem;
  color:rgba(201,132,142,.9);
  font-family:'Noto Serif KR',serif;
  font-size:.78rem;font-weight:600;
  letter-spacing:.04em;cursor:pointer;
  transition:background .2s,transform .15s;-webkit-appearance:none;
}
.gallery-cta:active{background:rgba(201,132,142,.25);transform:scale(.97)}

/* ── 라이트박스 ── */
#lightbox{
  position:fixed;inset:0;z-index:600;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0);
  pointer-events:none;
  transition:background .28s ease;
}
#lightbox.open{background:rgba(0,0,0,.94);pointer-events:all}
.lb-media{
  max-width:96vw;max-height:86vh;object-fit:contain;
  border-radius:4px;
  transform:scale(.88);opacity:0;
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .3s ease;
}
#lightbox.open .lb-media{transform:scale(1);opacity:1}
.lb-close{
  position:absolute;top:calc(var(--sat) + 10px);right:16px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:none;color:rgba(255,255,255,.8);font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0;transition:opacity .25s ease .12s;
}
#lightbox.open .lb-close{opacity:1}
.lb-close:active{background:rgba(255,255,255,.2)}

/* ═══════════════════════════════════════
   LETTER SCREEN
═══════════════════════════════════════ */
#letterScreen{
  display:none;flex-direction:column;align-items:flex-start;justify-content:center;
  background:#fdf8f0;
  z-index:120;
  padding:calc(var(--sat) + 2rem) 2.4rem calc(var(--sab) + 2rem);
  overflow:hidden;
}
.letter-lines{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(transparent,transparent 38px,rgba(201,169,110,.1) 38px,rgba(201,169,110,.1) 39px);
}
.letter-body{position:relative;z-index:1;width:100%}
.letter-text{
  display:inline;
  font-family:'Noto Serif KR',serif;
  font-weight:300;font-size:1.15rem;line-height:2.4;
  color:var(--ink);letter-spacing:-.01em;
  word-break:keep-all;overflow-wrap:break-word;
}
.letter-cursor{
  display:inline;
  font-size:1.15rem;line-height:2.4;
  color:var(--rose);font-weight:300;
  animation:blink .9s step-end infinite;
  opacity:1;transition:opacity .8s ease;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ═══════════════════════════════════════
   PROPOSE SCREEN
═══════════════════════════════════════ */
#proposeScreen{
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--ink);
  z-index:130;
  padding:var(--sat) 2rem var(--sab);
  overflow:hidden;
}
/* 배경 그라데이션 */
#proposeScreen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,169,110,.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 0% 100%, rgba(201,132,142,.06) 0%, transparent 60%),
    linear-gradient(160deg,#1a1208 0%,#221512 50%,#180f0a 100%);
  pointer-events:none;
}
.propose-petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}

    <div class="celeb-hearts" id="celebHearts"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════
   DATA
════════════════════════════════════ */
var ANSWER='20221030';
var SCENES=[
  {chip:'Chapter 1 · 입사',date:'2021년',tags:'#KB국민은행 #37기 #동기',
   title:'단순히 취업의 기쁨만이\n아니었을 줄이야',
   body:'평생 함께할 사람을 직장에서 만날 줄은 몰랐어.',
   medias:[{src:'images/IMG_7502.png',t:'photo'},{src:'images/IMG_1596.jpeg',t:'photo'},{src:'videos/vllo.mov',t:'video'},{src:'videos/vllo.mov',t:'video'}]},
  {chip:'Chapter 2 · 발견',date:'2022년',tags:'#탑건 #방탈출 #연애',
   title:'같은 부서의 너한테\n눈길이 갔어',
   body:'조용하고 착한 너에게 자꾸 눈길이 갔고,\n너와 함께 시간을 보내고 싶다는\n욕심이 생겼어.',
   medias:[{src:'images/IMG_6151.jpeg',t:'photo'},{src:'images/IMG_6751.jpeg',t:'photo'},{src:'images/IMG_8152.jpeg',t:'photo'},{src:'images/IMG_8343.jpeg',t:'photo'},{src:'images/IMG_9246.jpeg',t:'photo'},{src:'images/IMG_9650.jpeg',t:'photo'},{src:'images/IMG_9673.jpeg',t:'photo'},{src:'images/IMG_9680.jpeg',t:'photo'},{src:'videos/IMG_9125.mov',t:'video'}]},
  {chip:'Chapter 3 · 함께',date:'2023년 — 2024년',tags:'#신길역 #넷플릭스 #여행',
   title:'가장 가까이에서\n함께한 시간들',
   body:'같이 넷플릭스 보고, 여행도 많이 다녔던 나날들.\n그 일상이 참 좋았어.',
   medias:[{src:'',t:'photo'},{src:'',t:'photo'},{src:'',t:'photo'}]},
  {chip:'Chapter 4 · 결심',date:'2025년 — 2026년',tags:'#결혼준비 #용산 #D-Day',
   title:'자연스럽게 결혼까지\n결심하게 되었어',
   body:'오랜 시간 동안 연애를 하며\n너에 대한 믿음이 커져갔어.',
   medias:[{src:'',t:'photo'},{src:'',t:'photo'}]}
];
var GALLERY=Array(18).fill(0).map(function(){return{src:'',t:'photo'};});
var SCOLS=['#e8d5c0','#d4c4b0','#c8b8a8','#ddd0c0','#e0cfc0','#ccc0b0','#d8cabb','#e4d4c4','#d0c0b0','#dccdbf','#c4b8ac','#d8cec4','#e0d4c8','#ccbfb4','#d4c8bc','#e8ddd2','#c8bdb2','#dcd2c8'];
var LETTER="앞으로도 너와 함께\n수많은 추억을 만들어 가겠지?\n\n기쁜 순간엔 행복을 같이 나누고,\n힘든 순간엔 서로 힘이 되어주고\n\n세상 누구보다 멋진 가정을\n너와 함께 이루고 싶어.\n\n평범한 하루도,\n특별한 순간도,\n\n모든 시간을\n너와 함께하고 싶어.";

/* ════════════════════════════════════
   STATE
════════════════════════════════════ */
var si=0,mi=0,navOk=false,busy=false,tx=0,ty=0,tt=null;
var MEDIA_H=0;

/* ════════════════════════════════════
   UTILS
════════════════════════════════════ */
function $(id){return document.getElementById(id);}
function show(id,d){$(id).style.display=d||'flex';}
function hide(id){$(id).style.display='none';}
function fadeOut(id,ms,cb){
  var e=$(id);
  e.style.transition='opacity '+ms+'ms ease';e.style.opacity='0';
  setTimeout(function(){e.style.display='none';e.style.transition='';e.style.opacity='';if(cb)cb();},ms);
}
function fadeIn(id,ms,d){
  var e=$(id);e.style.opacity='0';e.style.display=d||'flex';
  e.style.transition='none';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    e.style.transition='opacity '+ms+'ms ease';e.style.opacity='1';
    setTimeout(function(){e.style.transition='';e.style.opacity='';},ms);
  });});
}

/* 고정 미디어 높이 계산 */
function calcMediaH(){
  var total=window.innerHeight;
  var header=$('storyApp').querySelector('.story-header');
  var pb=$('storyApp').querySelector('.story-progress-bar');
  var card=$('storyCard');
  var nav=$('storyNav');
  var hh=header?header.offsetHeight:52;
  var ph=pb?pb.offsetHeight:2;
  var ch=card?card.offsetHeight:80;
  var nh=nav?nav.offsetHeight:72;
  var h=total-hh-ph-ch-nh;
  if(h<120)h=120;
  return h;
}
function applyMediaH(){
  var h=calcMediaH();
  MEDIA_H=h;
  var m=$('storyMedia');
  if(m)m.style.height=h+'px';
  var t=$('sliderTrack');
  if(t)t.style.height=h+'px';
  document.querySelectorAll('.slide').forEach(function(s){s.style.height=h+'px';});
}

/* ════════════════════════════════════
   INIT
════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',function(){
  /* 초기 화면 */
  show('lockScreen','flex');
  hide('intro');hide('storyApp');hide('galleryScreen');
  $('letterScreen').style.display='none';
  $('proposeScreen').style.display='none';
  $('celebScreen').style.display='none';

  /* 인트로 파티클 */
  spawnParticles();

  /* 잠금 */
  $('lockBtn').addEventListener('click',checkPwd);
  var li=$('lockInput');
  li.addEventListener('keydown',function(e){if(e.key==='Enter')checkPwd();});
  li.addEventListener('input',function(){
    $('lockError').classList.remove('show');
    li.classList.remove('shake');
    if(li.value.length===8)setTimeout(checkPwd,30);
  });

  /* 시작 */
  $('startBtn').addEventListener('click',function(){
    fadeOut('intro',600,function(){
      show('storyApp','flex');
      buildProgressDots();
      /* 카드 먼저 렌더 후 높이 계산 */
      showScene(0,true);
    });
  });

  /* 스와이프 */
  var sa=$('storyApp'),ms=$('storyMedia');
  ms.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt='media';},{passive:true});
  sa.addEventListener('touchstart',function(e){if(!e.target.closest('#storyMedia')){tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt='card';}},{passive:true});
  sa.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)<Math.abs(dy)||Math.abs(dx)<40)return;
    if(tt==='media')goMedia(dx<0?1:-1);
    else if(tt==='card'){if(dx<0)nextScene();else prevScene();}
  },{passive:true});

  window.addEventListener('resize',function(){
    if($('storyApp').style.display!=='none')setTimeout(applyMediaH,80);
  });
});

function spawnParticles(){
  var c=$('introParticles');if(!c)return;
  for(var i=0;i<18;i++){
    var p=document.createElement('div');p.className='particle';
    p.style.left=(5+Math.random()*90)+'%';
    p.style.top=(10+Math.random()*80)+'%';
    p.style.setProperty('--dur',(3+Math.random()*4)+'s');
    p.style.setProperty('--delay',(Math.random()*5)+'s');
    c.appendChild(p);
  }
}

/* ════════════════════════════════════
   LOCK
════════════════════════════════════ */
function checkPwd(){
  var li=$('lockInput'),le=$('lockError');
  if(li.value.trim()===ANSWER){
    li.blur();
    fadeOut('lockScreen',650,function(){fadeIn('intro',700,'flex');});
  } else {
    li.classList.remove('shake');void li.offsetWidth;li.classList.add('shake');
    le.classList.add('show');li.value='';li.focus();
  }
}

/* ════════════════════════════════════
   PROGRESS DOTS
════════════════════════════════════ */
function buildProgressDots(){
  var r=$('storyProgressDots');r.innerHTML='';
  SCENES.forEach(function(_,i){
    var d=document.createElement('div');d.className='spd'+(i===0?' active':'');r.appendChild(d);
  });
}
function updateProgressDots(i){
  document.querySelectorAll('.spd').forEach(function(d,j){d.classList.toggle('active',j===i);});
}

/* ════════════════════════════════════
   SCENE
════════════════════════════════════ */
function showScene(i,first){
  if(busy&&!first)return;
  busy=true;si=i;mi=0;
  var s=SCENES[i];
  var card=$('storyCard'),nav=$('storyNav');

  card.classList.remove('revealed');
  nav.classList.remove('show');
  navOk=false;

  /* 헤더 */
  $('storyChapterLabel').textContent=s.chip+' · '+s.date;
  $('storyProgressFill').style.width=((i+1)/SCENES.length*100)+'%';
  updateProgressDots(i);

  /* 카드 텍스트 */
  $('cardEyebrow').textContent=s.date;
  $('cardTag').textContent=s.tags;
  $('cardTitle').textContent=s.title;
  $('cardBody').textContent=s.body;

  /* 버튼 */
  $('prevBtn').disabled=(i===0);
  $('nextBtn').textContent=i===SCENES.length-1?'마치며 →':'다음 →';

  /* 슬라이더 빌드 */
  buildSlider(s.medias);

  /* 높이 계산 — 카드 렌더 후 */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      applyMediaH();
      setTimeout(function(){
        card.classList.add('revealed');
        /* 카드 렌더 후 높이 재계산 */
        setTimeout(applyMediaH, 80);
      },120);
      setTimeout(function(){
        applyMediaH();
        nav.classList.add('show');
        navOk=true;busy=false;
        zoomSlide(0);
      },1200);
    });
  });
}

function nextScene(){if(!navOk||busy)return;si<SCENES.length-1?showScene(si+1):showGallery();}
function prevScene(){if(!navOk||busy||si===0)return;showScene(si-1);}

/* ════════════════════════════════════
   SLIDER
════════════════════════════════════ */
function buildSlider(medias){
  var track=$('sliderTrack'),dots=$('mediaDots'),ctr=$('slideCounter');
  track.innerHTML='';dots.innerHTML='';

  medias.forEach(function(m,i){
    var slide=document.createElement('div');slide.className='slide';

    if(m.src){
      var el=m.t==='video'?document.createElement('video'):document.createElement('img');
      el.src=m.src;el.alt='';
      if(m.t==='video'){el.muted=true;el.playsInline=true;el.autoplay=true;el.loop=true;}
      slide.appendChild(el);
    } else {
      var ph=document.createElement('div');ph.className='slide-placeholder';
      ph.innerHTML='<span class="ph-icon">📷</span><span class="ph-text">사진/영상을 넣어주세요</span>';
      slide.appendChild(ph);
    }
    var ov=document.createElement('div');ov.className='slide-overlay';slide.appendChild(ov);
    track.appendChild(slide);

    if(medias.length>1){
      var dot=document.createElement('div');dot.className='md'+(i===0?' active':'');dots.appendChild(dot);
    }
  });

  /* 카운터 */
  if(medias.length>1){ctr.textContent='1 / '+medias.length;ctr.classList.add('show');}
  else{ctr.classList.remove('show');}

  setSlider(0,false);
}

function setSlider(idx,anim){
  var t=$('sliderTrack');
  if(!anim)t.style.transition='none';
  t.style.transform='translateX('+(-idx*100)+'%)';
  if(!anim)requestAnimationFrame(function(){t.style.transition='';});
  document.querySelectorAll('.md').forEach(function(d,j){d.classList.toggle('active',j===idx);});
  /* 카운터 업데이트 */
  var ctr=$('slideCounter');
  if(ctr&&SCENES[si]&&SCENES[si].medias.length>1)ctr.textContent=(idx+1)+' / '+SCENES[si].medias.length;
}

function goMedia(dir){
  var total=SCENES[si].medias.length;
  var n=mi+dir;if(n<0||n>=total)return;
  mi=n;setSlider(mi,true);
  zoomSlide(mi);
}

function zoomSlide(idx){
  var slides=document.querySelectorAll('.slide');
  slides.forEach(function(s,i){
    if(i===idx){
      setTimeout(function(){s.classList.add('zooming');},50);
    } else {
      s.classList.remove('zooming');
    }
  });
}

/* ════════════════════════════════════
   GALLERY
════════════════════════════════════ */
function showGallery(){
  fadeOut('storyApp',550,function(){
    buildGallery();
    var g=$('galleryScreen');g.style.opacity='0';g.style.display='flex';
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      g.style.transition='opacity .6s ease';g.style.opacity='1';
      setTimeout(function(){g.style.transition='';g.style.opacity='';g.classList.add('show');},600);
    });});
  });
}
function buildGallery(){
  var grid=$('galleryGrid');grid.innerHTML='';
  GALLERY.forEach(function(m,i){
    var cell=document.createElement('div');cell.className='gcell';
    if(m.src){
      var el=m.t==='video'?document.createElement('video'):document.createElement('img');
      el.src=m.src;if(m.t==='video'){el.muted=true;el.playsInline=true;el.autoplay=true;el.loop=true;}
      cell.appendChild(el);
      cell.addEventListener('click',function(){openLb(m.src,m.t);});
    } else {
      var ph=document.createElement('div');ph.className='gcell-ph';ph.style.background=SCOLS[i%SCOLS.length];ph.style.position='relative';ph.style.zIndex='1';cell.appendChild(ph);
    }
    grid.appendChild(cell);
  });
  var ce=$('galleryCount');if(ce)ce.textContent=GALLERY.length+'장';
}
function openLb(src,t){
  var lb=$('lightbox'),img=$('lbImg'),vid=$('lbVid');
  img.style.display='none';vid.style.display='none';
  if(t==='video'){vid.src=src;vid.style.display='block';}else{img.src=src;img.style.display='block';}
  requestAnimationFrame(function(){lb.classList.add('open');});
  document.body.style.overflow='hidden';
}
function closeLb(){
  var lb=$('lightbox');lb.classList.remove('open');
  document.body.style.overflow='';
  setTimeout(function(){$('lbVid').src='';$('lbImg').src='';},300);
}

/* ════════════════════════════════════
   LETTER
════════════════════════════════════ */
function showLetter(){
  var g=$('galleryScreen');g.classList.remove('show');
  fadeOut('galleryScreen',700,function(){
    fadeIn('letterScreen',800,'flex');
    setTimeout(startLetter,1300);
  });
}
function startLetter(){
  var el=$('letterText'),cur=$('letterCursor');
  var chars=LETTER.split(''),per=11000/chars.length;
  el.innerHTML='';el.appendChild(cur);cur.style.opacity='1';
  var i=0;
  function next(){
    if(i>=chars.length){
      setTimeout(function(){
        cur.style.transition='opacity .8s';cur.style.opacity='0';
        setTimeout(toPropose,900);
      },1200);return;
    }
    var ch=chars[i],prev=i>0?chars[i-1]:'';
    if(ch==='\n')el.insertBefore(document.createElement('br'),cur);
    else el.insertBefore(document.createTextNode(ch),cur);
    i++;
    var p=per;
    if(ch==='\n'&&prev==='\n')p=600;
    else if(ch==='\n')p=per*2.2;
    else if(ch==='?'||ch==='.'||ch==='!')p=per*3.8;
    else if(ch===',')p=per*2;
    setTimeout(next,p);
  }
  setTimeout(next,400);
}

/* ════════════════════════════════════
   PROPOSE
════════════════════════════════════ */
function toPropose(){
  fadeOut('letterScreen',900,function(){
    var p=$('proposeScreen');
    p.style.opacity='0';p.style.transform='scale(1.04)';p.style.display='flex';
    spawnPetals();placeNo();
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      p.style.transition='opacity 1.4s ease,transform 1.4s cubic-bezier(.22,1,.36,1)';
      p.style.opacity='1';p.style.transform='scale(1)';
      setTimeout(function(){p.style.transition='';p.style.transform='';},1500);
    });});
  });
}
function placeNo(){
  var b=$('noBtn'),y=document.querySelector('.propose-yes');if(!y)return;
  var r=y.getBoundingClientRect();
  b.style.left=(window.innerWidth/2-90)+'px';b.style.top=(r.bottom+56)+'px';
}
function escapeNo(){
  var b=$('noBtn'),y=document.querySelector('.propose-yes');
  var r=y?y.getBoundingClientRect():{left:0,right:0,top:0,bottom:0};
  var rx,ry,t=0;
  do{rx=20+Math.random()*(window.innerWidth-190);ry=20+Math.random()*(window.innerHeight-70);t++;}
  while(t<20&&rx<r.right+10&&rx+180>r.left-10&&ry<r.bottom+10&&ry+44>r.top-10);
  b.style.left=rx+'px';b.style.top=ry+'px';
}
function spawnPetals(){
  var c=$('proposePetals');c.innerHTML='';
  var items=['🌸','🌺','🌷','✨','🍀','🤍','🩷'];
  for(var i=0;i<18;i++){
    var p=document.createElement('div');p.className='petal';
    p.textContent=items[Math.floor(Math.random()*items.length)];
    p.style.left=(Math.random()*100)+'vw';
    p.style.fontSize=(.65+Math.random()*.85)+'rem';
    p.style.animationDuration=(5+Math.random()*6)+'s';
    p.style.animationDelay=(Math.random()*6)+'s';
    c.appendChild(p);
  }
}

/* ════════════════════════════════════
   CELEB
════════════════════════════════════ */
function onYes(){
  fadeOut('proposeScreen',650,function(){
    var hh=$('celebHearts');
    if(!hh.hasChildNodes())['💕','💗','💖','💝','💓'].forEach(function(h){
      var s=document.createElement('span');s.textContent=h;hh.appendChild(s);
    });
    fadeIn('celebScreen',900,'flex');spawnConfetti();
  });
}
function spawnConfetti(){
  var w=$('confettiWrap');
  var cols=['#c9a96e','#c9848e','#b8924a','#f5ede3','#d4b8a0','#fffdf9','#e8d5b7'];
  for(var i=0;i<120;i++){
    var c=document.createElement('div');c.className='cpop';
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=cols[Math.floor(Math.random()*cols.length)];
    c.style.width=(4+Math.random()*8)+'px';c.style.height=(4+Math.random()*8)+'px';
    c.style.animationDuration=(2+Math.random()*3)+'s';
    c.style.animationDelay=(Math.random()*2.5)+'s';
    w.appendChild(c);
  }
}
</script>
</body>
