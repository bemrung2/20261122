/* A cluster of blooms. The hall's flowers are hydrangea, roses and
   carnations in white, cream, blush and peach, packed through with
   dyed gypsophila — so every arrangement is built from that one range
   rather than a single flat colour. `airy` is the paler stage mix. */
function pxFlowers(p, cx, by, rw, rh, seed, airy) {
  const g = mulberry(seed);
  const cy = by - rh * 0.5;
  // foliage first, so the blooms sit into it
  for (let k = 0; k < rw * rh * 0.42; k++) {
    const a = g() * TAU, rr = Math.sqrt(g());
    const x = cx + Math.cos(a) * rw * rr, y = cy + Math.sin(a) * rh * rr;
    D(p, Math.round(x), Math.round(y), g() > 0.55 ? C.gr2 : C.gr3);
  }
  // a haze of gypsophila through the whole cluster
  for (let k = 0; k < rw * rh * 0.3; k++) {
    const a = g() * TAU, rr = Math.sqrt(g());
    const x = cx + Math.cos(a) * rw * rr * 1.06, y = cy + Math.sin(a) * rh * rr * 1.06;
    const h2 = g();
    D(p, Math.round(x), Math.round(y), airy ? (h2 > 0.45 ? C.gyp : C.cr1)
      : (h2 > 0.6 ? C.gyp : h2 > 0.3 ? C.pk1 : C.lv1));
  }
  // and the blooms themselves
  for (let k = 0; k < rw * rh * 0.3; k++) {
    const a = g() * TAU, rr = Math.sqrt(g()) * 0.92;
    const x = Math.round(cx + Math.cos(a) * rw * rr), y = Math.round(cy + Math.sin(a) * rh * rr);
    const u = g();
    const col = airy
      ? (u > 0.6 ? C.wh1 : u > 0.36 ? C.wh2 : u > 0.18 ? C.cr1 : C.pch)
      : (u > 0.84 ? C.wh1 : u > 0.62 ? C.pk1 : u > 0.40 ? C.pk2
         : u > 0.21 ? C.pk3 : u > 0.09 ? C.lv1 : C.lv2);
    BLOB(p, x, y, 1.6, 1.4, col);
    D(p, x, y - 1, col === C.wh1 ? C.ivoryL : col === C.lv1 || col === C.lv2 ? C.lv1 : C.pk1);
    D(p, x + 1, y + 1, col === C.pk3 ? C.pk4 : col === C.lv2 ? C.lv3 : C.wh2);
  }
  // stems of gypsophila and greenery breaking the outline
  for (let k = 0; k < rw * 0.8; k++) {
    const x = cx - rw + g() * rw * 2;
    const len = 2 + g() * rh * 0.8;
    const up = g() > 0.55;
    for (let j = 0; j < len; j++) {
      const yy = up ? cy - rh * 0.6 - j : by + j - 1;
      D(p, Math.round(x + Math.sin(j * 0.6) * 1.6), Math.round(yy), up ? C.gr1 : C.gr3);
    }
    if (up) D(p, Math.round(x), Math.round(cy - rh * 0.6 - len), C.gyp);
  }
}

/* Round guest tables, skirted to the floor in black with black chair
   covers — the hall's own scheme */
function texRoundTable(pale) {
  return TEX('rt' + (pale ? 1 : 0), 60, 48, p => {
    const cx = 30, cy = 26, rx = 23, ry = 11;
    const t1 = pale ? '#8d8377' : C.cloth, t2 = pale ? '#736a60' : C.clothD,
          t3 = pale ? '#a1978a' : C.clothL;
    ELL(p, cx, cy + 10, 25, 7, '#00000048');
    for (let j2 = 9; j2 >= 1; j2--)
      ELL(p, cx, cy + j2, rx - j2 * 0.32, ry - j2 * 0.26, j2 > 5 ? t2 : t1);
    for (let a2 = -1; a2 <= 1; a2 += 0.15) {           // folds down the near face
      const x2 = cx + a2 * rx * 0.94;
      const y2 = cy + Math.sqrt(Math.max(0, 1 - a2 * a2)) * ry * 0.9;
      R(p, Math.round(x2), Math.round(y2), 1, 6, t2);
    }
    ELL(p, cx, cy, rx, ry, t1);
    ELL(p, cx, cy - 1, rx - 1, ry - 1.5, t3);
    // covered chairs round the table
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU + 0.39;
      const x = Math.round(cx + Math.cos(a) * (rx + 6)), y = Math.round(cy + Math.sin(a) * (ry + 6));
      const behind = Math.sin(a) < 0;
      if (!behind) continue;                            // the near ones go on top
      R(p, x - 4, y - 9, 8, 11, t2); R(p, x - 3, y - 8, 6, 9, t1);
    }
    // place settings
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU + 0.4;
      const x = cx + Math.cos(a) * (rx - 5), y = cy + Math.sin(a) * (ry - 3);
      ELL(p, x, y, 2.8, 1.8, C.ivoryS); ELL(p, x, y, 2, 1.2, C.ivoryL);
      D(p, x + 4, y - 1, C.glass); D(p, x + 4, y - 2, C.ivoryL);
      D(p, x - 4, y, C.goldL);
    }
    // a cluster of glass hurricanes and low blooms at the centre
    for (const [dx, hgt] of [[-4, 11], [0, 15], [4, 12], [-7, 8], [7, 9]]) {
      R(p, cx + dx, cy - 4 - hgt, 3, hgt, '#e6f0f5aa');
      R(p, cx + dx, cy - 4 - hgt, 1, hgt, C.glass);
      R(p, cx + dx, cy - 3 - hgt, 3, 2, C.flame);
      D(p, cx + dx + 1, cy - 5 - hgt, C.flameL);
      R(p, cx + dx, cy - 4, 3, 1, C.goldD);
    }
    pxFlowers(p, cx, cy - 2, 9, 6, 9911, false);
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU + 0.39;
      const x = Math.round(cx + Math.cos(a) * (rx + 6)), y = Math.round(cy + Math.sin(a) * (ry + 6));
      if (Math.sin(a) < 0) continue;
      R(p, x - 4, y - 9, 8, 11, t2); R(p, x - 3, y - 8, 6, 9, t1);
      R(p, x - 3, y - 8, 6, 1, t3);
    }
  });
}


/* The tall slim brass stands that line the aisle, each carrying a glass

function texCandelabra(f, tall, flower) {

  return TEX('cd' + f + (tall ? 1 : 0) + (flower ? 1 : 0), w, h, p => {
    const cx = w >> 1, b = h - 2;

    R(p, cx - 4, b - 2, 9, 1, C.gold);
    R(p, cx - 3, b - 4, 7, 2, C.gold);

    const cx = 11, b = 36;
    ELL(p, cx, b, 6, 2.2, '#00000048');
    R(p, cx - 5, b - 24, 11, 24, C.blkD);
    R(p, cx - 5, b - 24, 2, 24, C.gold);
    R(p, cx + 4, b - 24, 2, 24, C.goldD);
    R(p, cx - 5, b - 24, 11, 2, C.gold);
    R(p, cx - 6, b - 27, 13, 3, C.blkD);
    R(p, cx - 6, b - 27, 13, 1, C.goldL);
    R(p, cx - 1, b - 34, 1, 7, '#3a3a44');              // microphone
    BLOB(p, cx - 1, b - 35, 1.5, 1.5, '#55555f');
    pxFlowers(p, cx, b - 26, 5, 4, 818, false);
  });
}

/* The entrance: a slim brass arch smothered from the floor up in blush
   and peach, thinning out toward the crown just as it does in the
   photograph, with the great mounds of flowers pooled at its feet */
function texGate() {
  return TEX('gt', 210, 136, p => {
    const cx = 105, b = 134, arw = 54, arh = 122;
    const spr = arh - arw * 0.95;
    const half = y => y <= spr ? arw
      : arw * Math.sqrt(Math.max(0, 1 - Math.pow((y - spr) / (arw * 0.95), 2)));
    // the frame, thick enough to read at this scale
    for (let y = 0; y < arh; y++) {
      const hw = half(y);
      if (hw < 1) continue;
      const l = Math.round(cx - hw), r = Math.round(cx + hw);
      R(p, l, b - y, 2, 1, C.gold); D(p, l, b - y, C.goldL);
      R(p, r - 1, b - y, 2, 1, C.goldD); D(p, r, b - y, C.gold);
    }
    // The two columns are dressed from the floor up and stop well short
    // of the crown — the arch is left bare over the middle, which is how
    // the venue had it (the blog even remarks on it).
    for (let y = 0; y < arh * 0.66; y += 2) {
      const hw = half(y);
      if (hw < 1) continue;
      const t = y / (arh * 0.66);
      const rw = 11 - t * 6, rh = 13 - t * 7;
      if (rw < 3) continue;
      pxFlowers(p, cx - hw, b - y, rw, rh, 700 + y, false);
      pxFlowers(p, cx + hw, b - y, rw, rh, 700 + y, false);
    }
    // a last few blooms tailing off where each column ends
    for (const s2 of [-1, 1]) {
      const y = arh * 0.66;
      pxFlowers(p, cx + s2 * half(y), b - y - 3, 5, 5, 760 + s2, false);
    }
    // the mounds pooled on the floor either side, and glass among them
    for (const s2 of [-1, 1]) {
      pxFlowers(p, cx + s2 * (arw + 5), b - 2, 13, 11, 900 + s2, false);
      pxFlowers(p, cx + s2 * (arw - 7), b - 1, 10, 8, 902 + s2, false);
      for (const dx of [-9, 7, 18]) {
        const x = cx + s2 * (arw + dx);
        R(p, x, b - 13, 4, 11, '#e6f0f5aa');
        R(p, x, b - 13, 1, 11, C.glass);
        R(p, x, b - 8, 4, 5, C.ivoryL);
        BLOB(p, x + 2, b - 10, 1.2, 1.6, C.flame);
      }
    }
  });
}


/* Crystal chandeliers, hung the length of the hall: warm-white strands
   of glass on a slim brass frame, not the gold candelabra of a church */
function texChandelier(big) {
  const w = big ? 30 : 22, h = big ? 34 : 26;
  return TEX('ch' + big, w, h, p => {
    const cx = w >> 1;
    const chain = big ? 7 : 5;
    R(p, cx, 0, 1, chain, C.goldD);
    R(p, cx - 1, chain, 3, 2, C.gold);
    const tiers = big ? [[12, 4], [9, 8], [5, 12]] : [[8, 3], [6, 6], [3, 9]];
    for (const [rad, ty] of tiers) {
      const yy = chain + ty;
      // the brass ring
      for (let x = -rad; x <= rad; x++) {
        const dy = Math.round(Math.sqrt(Math.max(0, 1 - (x / rad) * (x / rad))) * 1.6);
        D(p, cx + x, yy + dy, C.gold);
      }
      // strands of crystal falling from it
      for (let x = -rad; x <= rad; x += 2) {
        const dy = Math.round(Math.sqrt(Math.max(0, 1 - (x / rad) * (x / rad))) * 1.6);
        const len = 2 + ((Math.abs(x) * 7) % 3);
        for (let k = 1; k <= len; k++)
          D(p, cx + x, yy + dy + k, k === len ? C.glass : C.flameL);
      }
      // candle lamps standing on the ring
      for (let x = -rad; x <= rad; x += Math.max(3, rad >> 1)) {
        const dy = Math.round(Math.sqrt(Math.max(0, 1 - (x / rad) * (x / rad))) * 1.6);
        R(p, cx + x, yy + dy - 3, 1, 3, C.ivoryL);
        D(p, cx + x, yy + dy - 4, C.flame);
      }
    }
    R(p, cx, chain + 2, 1, big ? 16 : 11, C.goldL);   // the central stem
    BLOB(p, cx, chain + (big ? 19 : 13), 2, 2, C.flameL);
    D(p, cx, chain + (big ? 22 : 16), C.glass);
  });
}

/* The ceiling this hall is known for: deep rectangular coffers ringed
   with brass and packed with crystal, glowing warm above the room. */
function texCoffer(big) {
  const w = big ? 66 : 46, h = big ? 42 : 30;
  return TEX('cf' + big, w, h, p => {
    R(p, 0, 0, w, h, '#0b0b0f');
    const rings = big ? 3 : 2;
    for (let i = 0; i < rings; i++) {
      const inset = i * (big ? 7 : 6);
      const x0 = inset, y0 = inset, ww = w - inset * 2, hh = h - inset * 2;
      if (ww < 6 || hh < 6) break;
      // the brass lip of the coffer
      R(p, x0, y0, ww, 1, C.goldD); R(p, x0, y0 + hh - 1, ww, 1, C.gold);
      R(p, x0, y0, 1, hh, C.goldD); R(p, x0 + ww - 1, y0, 1, hh, C.gold);
      // packed with crystal, brightest where it catches the light
      const bw = big ? 5 : 4;
      const g = mulberry(i * 97 + big * 13 + 5);
      for (let k = 1; k < bw; k++) {
        for (let x = x0 + 1; x < x0 + ww - 1; x++) {
          const u = g();
          if (u > 0.45) D(p, x, y0 + k, u > 0.82 ? C.flameL : u > 0.62 ? C.flame : C.gold);
          const v = g();
          if (v > 0.45) D(p, x, y0 + hh - 1 - k, v > 0.82 ? C.flameL : v > 0.62 ? C.flame : C.goldD);
        }
        for (let y = y0 + 1; y < y0 + hh - 1; y++) {
          const u = g();
          if (u > 0.45) D(p, x0 + k, y, u > 0.82 ? C.flameL : u > 0.62 ? C.flame : C.gold);
          const v = g();
          if (v > 0.45) D(p, x0 + ww - 1 - k, y, v > 0.82 ? C.flameL : v > 0.62 ? C.flame : C.goldD);
        }
      }
    }
  });
}

/* a soft pool of light — the only smooth texture in the hall */
/* ══════════════════════════════════════════════════════════
   THE LIGHTING
   The hall is a dark room. One map, multiplied over everything
   that stands on the floor, holds the light down everywhere
   except along the runner and over the dais — so the two of them
   are what you look at, and the guests are still there to see.
══════════════════════════════════════════════════════════ */
function texLightMap() {
  const TW2 = 128, TH2 = 224;
  return TEXS('lightmap', TW2, TH2, p => {
    const g = p.g;
    const aisleC = (AISLE_MID + 0.5) / W_COLS * TW2;
    const rowY = r => (r * AH + WALLA) / (WALLA + MAPH) * TH2;

    // the room itself: dim, and dimmer still out at the walls
    const base = g.createLinearGradient(0, 0, TW2, 0);
    base.addColorStop(0,    '#5a5b64');
    base.addColorStop(0.13, '#7c7e88');
    base.addColorStop(0.28, '#8e9098');
    base.addColorStop(0.72, '#8e9098');
    base.addColorStop(0.87, '#7c7e88');
    base.addColorStop(1,    '#5a5b64');
    g.fillStyle = base; g.fillRect(0, 0, TW2, TH2);

    // and darker again toward the doors, so the room has depth
    const depth = g.createLinearGradient(0, rowY(8), 0, TH2);
    depth.addColorStop(0, 'rgba(0,0,0,0)');
    depth.addColorStop(1, 'rgba(0,0,0,0.26)');
    g.fillStyle = depth; g.fillRect(0, rowY(8), TW2, TH2 - rowY(8));

    // the runner, lit the whole way down
    const band = g.createLinearGradient(0, 0, TW2, 0);
    const st = x => Math.max(0, Math.min(1, x / TW2));
    band.addColorStop(0, 'rgba(255,252,244,0)');
    band.addColorStop(st(aisleC - 15), 'rgba(255,252,244,0)');
    band.addColorStop(st(aisleC - 9),  'rgba(255,252,244,0.55)');
    band.addColorStop(st(aisleC - 5),  'rgba(255,252,244,0.98)');
    band.addColorStop(st(aisleC + 5),  'rgba(255,252,244,0.98)');
    band.addColorStop(st(aisleC + 9),  'rgba(255,252,244,0.55)');
    band.addColorStop(st(aisleC + 15), 'rgba(255,252,244,0)');
    band.addColorStop(1, 'rgba(255,252,244,0)');
    g.save();
    g.beginPath(); g.rect(0, rowY(2), TW2, TH2 - rowY(2)); g.clip();
    g.fillStyle = band; g.fillRect(0, 0, TW2, TH2);
    g.restore();

    // and the dais, which is the brightest thing in the room
    const dy = rowY(5);
    const spot = g.createRadialGradient(aisleC, dy, 2, aisleC, dy, TW2 * 0.30);
    spot.addColorStop(0,    'rgba(255,250,238,1)');
    spot.addColorStop(0.38, 'rgba(255,248,232,0.66)');
    spot.addColorStop(1,    'rgba(255,246,228,0)');
    g.fillStyle = spot; g.fillRect(0, 0, TW2, rowY(11));

    // the 혼주 sit just off the runner — they should not be in the dark
    for (const c of [AISLE_MID - 2.2, AISLE_MID + 2.2]) {
      const px2 = (c + 0.5) / W_COLS * TW2, py2 = rowY(9.5);
      const gl = g.createRadialGradient(px2, py2, 1, px2, py2, TW2 * 0.13);
      gl.addColorStop(0, 'rgba(255,246,228,0.5)');
      gl.addColorStop(1, 'rgba(255,246,228,0)');
      g.fillStyle = gl; g.fillRect(0, 0, TW2, TH2);
    }
  });
}

function texGlow() {
  return TEXS('glow', 96, 96, p => {
    const gr = p.g.createRadialGradient(48, 48, 0, 48, 48, 48);
    gr.addColorStop(0, 'rgba(255,238,200,1)');
    gr.addColorStop(0.35, 'rgba(255,224,164,0.42)');
    gr.addColorStop(1, 'rgba(255,214,150,0)');
    p.g.fillStyle = gr; p.g.fillRect(0, 0, 96, 96);
  });
}
function texVignette() {
  return TEXS('vig', 128, 128, p => {
    const gr = p.g.createRadialGradient(64, 64, 18, 64, 64, 78);
    gr.addColorStop(0, 'rgba(0,0,0,0)');
    gr.addColorStop(0.62, 'rgba(0,0,0,0.20)');
    gr.addColorStop(1, 'rgba(0,0,0,0.62)');
    p.g.fillStyle = gr; p.g.fillRect(0, 0, 128, 128);
  });
}

/* ══════════════════════════════════════════════════════════
   THE CAST — every guest is generated from one seed, so the
   hall is full of different people but nobody is random twice.
══════════════════════════════════════════════════════════ */
const GUEST_KINDS = 18;
function guestSpec(kind) {
  const g = mulberry(kind * 1103515245 + 12345);
  const male = g() > 0.46;
  const skin = SKIN[(g() * SKIN.length) | 0];
  const hair = HAIR[(g() * HAIR.length) | 0];
  const o = { skin, hair, blush: g() > 0.55 ? 1 : 0 };
  if (male) {
    o.wear = SUITS[(g() * SUITS.length) | 0];
    o.trouser = [o.wear[0], o.wear[1]];
    o.jacket = 1;
    o.tie = [C.pk3, '#4a5f8a', '#7a5a3a', C.ivoryS, '#5b4c86'][(g() * 5) | 0];
    o.pocket = g() > 0.6 ? 1 : 0;
    o.hairStyle = g() > 0.3 ? 4 : 2;
  } else {
    o.wear = DRESSY[(g() * DRESSY.length) | 0];
    o.trouser = [o.wear[0], o.wear[1]];
    o.skirt = 1;
    o.neckline = 1;
    o.necklace = g() > 0.4 ? 1 : 0;
    o.sleeve = g() > 0.5;
    o.hairStyle = [0, 1, 1, 3, 2][(g() * 5) | 0];
  }
  return o;
}
/* one texture per (person, facing, pose) — cached, so the whole
   congregation costs a few hundred kilobytes of tiny bitmaps */
function texGuest(kind, view, seated, arms) {
  return TEX(`g${kind}${view}${seated}${arms}`, 20, 32, p => {
    const o = Object.assign({}, guestSpec(kind), { view, arms });
    if (seated) { if (view === 'side') pxSeatedSide(p, 10, 30, o); else pxSeatedFront(p, 10, 30, o); }
    else        { if (view === 'side') pxPersonSide(p, 10, 30, o); else pxPerson(p, 10, 30, o); }
  });
}

/* 혼주 — the parents, seated at the front facing the aisle */
function texParent(who, arms, v) {
  return TEX(`pa${who}${arms}${v}`, 22, 34, p => {
    const father = who === 'father';
    const chair = ['#1b1b20', '#2b2b33', '#0b0b0e'], chairPad = '#1b1b20';
    /* 한복: a short 저고리 over a full 치마. The mother on the left of the
       runner wears sky blue, the one on the right wears pink.
       [저고리, 저고리 그늘, 저고리 빛, 치마, 치마 그늘, 치마 빛] */
    const hb = v ? ['#faf0f2', '#e2d0d6', '#fffaf9', '#d4708f', '#a94d6c', '#eb9db3']
                 : ['#f2f6fa', '#d8e2ec', '#ffffff', '#5f92c4', '#42709e', '#86b4dd'];
    const o = father
      ? { skin: SKIN[2], hair: HAIR[2], hairStyle: 4, view: 'side', arms,
          wear: ['#232130', '#14131c', '#35323f'], trouser: ['#232130', '#14131c'],
          jacket: 1, tie: v ? '#c4738d' : '#7fa8cd', pocket: 1, chair, chairPad }
      : { skin: SKIN[1], hair: HAIR[0], hairStyle: 0, view: 'side', arms,
          wear: [hb[0], hb[1], hb[2]], trouser: [hb[3], hb[4]],
          skirt: 1, lap: hb[3], lapD: hb[4], lapL: hb[5],
          neckline: 1, necklace: 1, sash: hb[5], hanbok: 1, chair, chairPad };
    pxSeatedQ(p, 11, 32, o);
  });
}

function texBride(dir, step, wave) {
  // tall enough for the whole train to lie behind her when she walks away,
  // and wide enough for the hand she raises to the guests
  return TEX(`br${dir}${step}w${wave || 0}`, 50, 78,
             p => pxBride(p, 26, 46, dir, step, wave));
}

/* ══════════════════════════════════════════════════════════
   SCENE
══════════════════════════════════════════════════════════ */
let PX = null;

function wBuildScene() {
  const app = PX.app;
  const cam = PX.cam = new PIXI.Container();
  app.stage.addChild(cam);

  /* backdrop — wall and floor, one baked texture */
  const bt = PIXI.Texture.from(bakeBackdrop());
  bt.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
  const bg = new PIXI.Sprite(bt);
  bg.y = -WALLA;
  cam.addChild(bg);

  /* pools of light on the floor, under the fixtures */
  const glowL = PX.glowL = new PIXI.Container();
  glowL.blendMode = PIXI.BLEND_MODES.ADD;
  cam.addChild(glowL);

  /* everything that stands on the floor, sorted back to front */
  const props = PX.props = new PIXI.Container();
  props.sortableChildren = true;
  cam.addChild(props);

  /* the light map: everything on the floor is dimmed by it except the
     runner and the dais, which is what makes the room read as dark */
  const lm = PX.lightMap = new PIXI.Sprite(texLightMap());
  lm.blendMode = PIXI.BLEND_MODES.MULTIPLY;
  lm.x = 0; lm.y = -WALLA;
  lm.width = MAPW; lm.height = WALLA + MAPH;
  cam.addChild(lm);

  /* the chandeliers hang between us and the floor */
  const ceil = PX.ceil = new PIXI.Container();
  cam.addChild(ceil);

  const add = (layer, tex, ax, ay, z, baseFrac) => {
    const s = new PIXI.Sprite(tex);
    s.anchor.set(0.5, baseFrac === undefined ? 1 : baseFrac);
    s.x = Math.round(ax); s.y = Math.round(ay); s.zIndex = z;
    layer.addChild(s);
    return s;
  };
  const T = (col, row) => [(col + 0.5) * AW, (row + 0.5) * AH];

  /* ── the dais: warm light washes the platform, so the end of the
       aisle is the brightest thing in the hall ── */
  const spot = new PIXI.Sprite(texGlow());
  spot.anchor.set(0.5); spot.x = (AISLE_MID + 0.5) * AW; spot.y = 5 * AH;
  spot.width = 340; spot.height = 150; spot.alpha = 0.42; spot.tint = 0xffeacc;
  PX.glowL.addChild(spot);
  const spot2 = new PIXI.Sprite(texGlow());
  spot2.anchor.set(0.5); spot2.x = spot.x; spot2.y = 4.5 * AH;
  spot2.width = 160; spot2.height = 96; spot2.alpha = 0.38; spot2.tint = 0xfff4e0;
  PX.glowL.addChild(spot2);

  const daisY = 8 * AH - 8;
  add(props, texBackdrop(), (AISLE_MID + 0.5) * AW, 2 * AH + 3, -60);
  add(props, texStageFlowers(), (AISLE_MID + 0.5) * AW, daisY + 4, -40);
  // the officiant's podium balances the 사회자's lectern on the far side
  // 사회자 stands well upstage on the left, at his lectern with a mic
  const [mcx, mcy] = T(6.2, 4.6);
  add(props, texMcStand(), mcx, mcy, mcy);
  const mc = add(props, TEX('mc-person', 24, 36, p => {
    pxPersonSide(p, 12, 34, {
      skin: SKIN[1], hair: HAIR[0], hairStyle: 4, view: 'side', arms: 3,
      wear: ['#2b2838', '#191722', '#3d3950'], trouser: ['#2b2838', '#191722'],
      jacket: 1, tie: '#8a2f46', pocket: 1,
    });
  }), mcx + 9, mcy + 1, mcy + 1);
  mc.scale.x = 1;                       // turned in toward the aisle

  /* ── round guest tables ── */
  for (const tb of W_TABLES) {
    const [x, y] = T(tb.col, tb.row);
    add(props, texRoundTable(0), x, y + 18, y + 11);
  }
  /* ── the congregation ── */
  PX.guests = [];
  const seatGuest = (ax, ay, faceRight, kind, seed, standing) => {
    const g = mulberry(seed);
    const beh = g();
    const gu = {
      kind, seated: standing ? 0 : 1,
      beh: beh > 0.6 ? 'clap' : beh > 0.28 ? 'clasp' : 'rest',
      phase: (g() * 6000) | 0, period: 4200 + ((g() * 3600) | 0), frame: -1,
    };
    const sp = add(props, texGuest(kind, 'side', gu.seated, 0),
                   Math.round(ax), Math.round(ay), ay + 0.4);
    sp.scale.x = faceRight ? 1 : -1;
    gu.sp = sp;
    PX.guests.push(gu);
    return gu;
  };

  let gseed = 7;
  for (const lt of W_ROWS_SEATED) {
    const inner = lt.col < AISLE_MID ? 1 : -1;
    const cx0 = (lt.col + 0.5) * AW;

    // The front row facing the runner. About a third of the places are
    // empty and nobody sits quite square to the next, so the row reads as
    // people rather than as a fence. Both sides draw from the same seeds,
    // so the gaps fall in the same places either side of the runner.
    let i = 0, lastY = -99;
    for (let r = lt.row0 + 0.4; r <= lt.row1; r += 1.25, i++) {
      const g = mulberry(i * 7919 + 13);
      if (g() > 0.68) continue;
      const dx = (g() - 0.5) * 3.4;
      const dy = (g() - 0.5) * 5;
      const y = (r + 0.5) * AH + dy;
      if (y - lastY < 9) continue;                 // never shoulder to shoulder
      lastY = y;
      seatGuest(cx0 + inner * dx, y, inner > 0, (gseed * 7) % GUEST_KINDS, gseed++);
    }

    // Behind them, people on their feet watching — in ones and twos, spread
    // back toward the round tables, some turned to each other rather than
    // to the aisle. Not a line.
    // Behind them, people on their feet. Nobody stands on top of anybody —
    // a spot is only taken if it is clear of every spot already taken —
    // and every one of them is turned to the runner.
    const taken = [];
    const room = (x, y) => {
      for (const [px, py] of taken) if (Math.abs(px - x) < 15 && Math.abs(py - y) < 11) return false;
      taken.push([x, y]);
      return true;
    };
    let c = 0;
    for (let r = lt.row0 + 1.4; r <= lt.row1 - 1; r += 4.4, c++) {
      const g = mulberry(c * 104729 + 31);
      if (g() > 0.78) continue;                    // whole stretches stand empty
      const n = 1 + ((g() * 2.4) | 0);
      for (let k = 0; k < n; k++) {
        const dx = 16 + g() * 20;
        const dy = (g() - 0.5) * 30;
        const x = cx0 - inner * dx, y = (r + 0.5) * AH + dy;
        if (!room(x, y)) continue;
        seatGuest(x, y, inner > 0, (gseed * 11 + 5) % GUEST_KINDS, gseed++, true);
      }
    }

    // The corner by the entrance, where the last round table used to be:
    // a knot of people on their feet, craning to see her come in.
    for (let k = 0; k < 12; k++) {
      const g = mulberry(k * 3571 + 97);
      const dx = 18 + g() * 44;
      const dy = (g() - 0.5) * 62;
      const x = cx0 - inner * dx, y = (62.5 + 0.5) * AH + dy;
      if (!room(x, y)) continue;
      seatGuest(x, y, inner > 0, (gseed * 13 + 2) % GUEST_KINDS, gseed++, true);
    }
  }

  // and the round tables out by the walls, filled all the way round
  for (const tb of W_TABLES) {
    const [cx, cy] = T(tb.col, tb.row);
    const toAisle = tb.col < AISLE_MID;
    // the seats on the far side are the near side's reflected, so the two
    // halves of the hall stay mirror images of each other
    const mx = toAisle ? 1 : -1;
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU + 0.45;
      seatGuest(cx + mx * Math.cos(a) * 23, cy + Math.sin(a) * 16,
                toAisle, (gseed * 5 + 3) % GUEST_KINDS, gseed++);
    }
  }

  /* ── 혼주석 ── */
  PX.parents = [];
  W_PARENTS.forEach((pr, i) => {
    const [x, y] = T(pr.col, pr.row);
    const right = pr.col < AISLE_MID;
    const v = pr.col < AISLE_MID ? 0 : 1;   // 0 = the left of the runner
    const sp = add(props, texParent(pr.who, 0, v), x, y + 6, y + 6);
    sp.scale.x = right ? 1 : -1;
    PX.parents.push({ sp, who: pr.who, v, phase: i * 1700 + 400 });
  });

  /* ── candelabra ── */
  PX.candles = [];
  for (const cd of W_CANDELABRA) {
    const [x, y] = T(cd.col, cd.row);
    const sp = add(props, texCandelabra(0, cd.tall, cd.flower), x, y + 3, y + 3);
    if (!cd.flower) PX.candles.push({ sp, tall: cd.tall });
  }

  /* ── the entrance ── */
  for (const fl of W_ENTRY_FLOWERS) {
    const [x, y] = T(fl.col, fl.row);
    add(props, texEntryFlowers(fl.big), x, y + 4, y + 4);
  }
  add(props, texGate(), (AISLE_MID + 0.5) * AW, 69.6 * AH, 69.6 * AH);

  /* ── the groom, waiting at the top of the aisle ── */
  {
    const gy = 6.5 * AH;                 // up on the dais, waiting
    const sp = add(props, TEX('groom', 28, 40, p => pxGroom(p, 14, 38, 0)),
                   (AISLE_MID + 0.5) * AW, gy + 6, gy + 6);
    PX.groom = sp; PX.groomY = sp.y;
    const gl = new PIXI.Sprite(texGlow());
    gl.anchor.set(0.5); gl.x = sp.x; gl.y = gy + 4;
    gl.width = 96; gl.height = 54; gl.alpha = 0.3; gl.tint = 0xffd8a0;
    PX.glowL.addChild(gl);
  }

  /* ── the coffered ceiling ── */
  PX.coffers = [];
  for (const cf of W_COFFERS) {
    const sp = new PIXI.Sprite(texCoffer(cf.big ? 1 : 0));
    sp.anchor.set(0.5);
    sp.x = Math.round((cf.col + 0.5) * AW); sp.y = cf.ay;
    sp.alpha = 0.85;
    PX.ceil.addChild(sp);
    const halo = new PIXI.Sprite(texGlow());
    halo.anchor.set(0.5); halo.x = sp.x; halo.y = sp.y;
    halo.width = cf.big ? 96 : 70; halo.height = cf.big ? 62 : 44;
    halo.blendMode = PIXI.BLEND_MODES.ADD; halo.alpha = 0.14; halo.tint = 0xffe0b4;
    PX.ceil.addChild(halo);
    PX.coffers.push({ sp, halo, big: cf.big, phase: sp.x * 2 + cf.ay });
  }

  /* ── chandeliers ──
       They have to read as hanging in the air, not lying on the floor:
       each one gets a rod climbing away out of frame, a soft pool of
       light directly beneath it, and a slow sway. ── */
  PX.chandeliers = [];
  for (const ch2 of W_CHANDELIERS) {
    // most hang a fixed height over their tile; the ones above the dais
    // are given their ceiling height outright
    const x = (ch2.col + 0.5) * AW;
    const y = ch2.ay !== undefined ? ch2.ay : (ch2.row + 0.5) * AH - (ch2.big ? 58 : 46);
    const floorY = ch2.ay !== undefined ? 6.5 * AH : (ch2.row + 0.5) * AH;
    const sp = new PIXI.Sprite(texChandelier(ch2.big ? 1 : 0));
    sp.anchor.set(0.5, 1); sp.x = Math.round(x); sp.y = Math.round(y);
    // the rod it hangs from, running up past the top of the shot
    const rod = new PIXI.Sprite(TEX('rod', 3, 40, q => {
      R(q, 1, 0, 1, 40, C.goldD);
      for (let k = 4; k < 40; k += 7) D(q, 1, k, C.gold);
      R(q, 0, 36, 3, 3, C.gold);            // the collar it screws into
      R(q, 0, 36, 3, 1, C.goldL);
    }));
    rod.anchor.set(0.5, 1);
    rod.x = sp.x; rod.y = sp.y - (ch2.big ? 24 : 18);
    PX.ceil.addChild(rod);
    PX.ceil.addChild(sp);
    const halo = new PIXI.Sprite(texGlow());
    halo.anchor.set(0.5); halo.x = sp.x; halo.y = sp.y - (ch2.big ? 12 : 8);
    halo.width = ch2.big ? 54 : 38; halo.height = ch2.big ? 54 : 38;
    halo.blendMode = PIXI.BLEND_MODES.ADD; halo.alpha = 0.3;
    PX.ceil.addChild(halo);
    // the shadow it casts on the floor, which is what sells the height
    const shade = new PIXI.Sprite(texGlow());
    shade.anchor.set(0.5); shade.x = sp.x; shade.y = floorY + 4;
    shade.width = ch2.big ? 44 : 32; shade.height = ch2.big ? 20 : 15;
    shade.tint = 0x000000; shade.alpha = 0.3;
    PX.glowL.addChild(shade);
    const pool = new PIXI.Sprite(texGlow());
    pool.anchor.set(0.5); pool.x = sp.x; pool.y = floorY;
    pool.width = ch2.big ? 220 : 150; pool.height = ch2.big ? 136 : 92;
    pool.alpha = ch2.big ? 0.22 : 0.14; pool.tint = 0xffe0b0;
    PX.glowL.addChild(pool);
    PX.chandeliers.push({ sp, rod, halo, pool, shade, big: ch2.big,
                          x0: sp.x, phase: Math.abs(x - (AISLE_MID + 0.5) * AW) * 0.12 + y * 0.03 });
  }

  /* ── the bride, and the groom who leaves with her ── */
  const br = PX.bride = new PIXI.Sprite(texBride('down', 0));
  br.anchor.set(0.5, 46 / 78);
  PX.props.addChild(br);
  const pt = PX.partner = new PIXI.Sprite(texGroomWalk(0, 0));
  pt.anchor.set(0.5, 50 / 52);
  pt.visible = false;
  PX.props.addChild(pt);

  /* ── grade and vignette, over everything ── */
  const grade = PX.grade = new PIXI.Sprite(TEXS('grade', 4, 64, p => {
    const gr = p.g.createLinearGradient(0, 0, 0, 64);
    gr.addColorStop(0, 'rgba(255,214,158,0.10)');
    gr.addColorStop(0.4, 'rgba(255,230,192,0.03)');
    gr.addColorStop(1, 'rgba(12,14,22,0.3)');
    p.g.fillStyle = gr; p.g.fillRect(0, 0, 4, 64);
  }));
  app.stage.addChild(grade);
  const vig = PX.vig = new PIXI.Sprite(texVignette());
  app.stage.addChild(vig);
}

function wInitPixi() {
  const view = $('world-canvas');
  const app = new PIXI.Application({
    view, width: 640, height: 360, resolution: 1, autoDensity: false,
    antialias: false, autoStart: false, backgroundColor: 0x0a0810,
    powerPreference: 'high-performance',
  });
  app.ticker.stop();
  PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.NEAREST;
  PX = { app, Z: 0, bw: 0, bh: 0 };
  wBuildScene();
}

/* ══════════════════════════════════════════════════════════
   FRAME
══════════════════════════════════════════════════════════ */
function wRender() {
  if (!PX) {
    if (typeof PIXI === 'undefined') return;
    wInitPixi();
  }
  const app = PX.app, view = app.view;
  const cw = view.clientWidth || window.innerWidth;
  const chh = view.clientHeight || window.innerHeight;
  // Pixel art is already upscaled, so a third device pixel per art pixel
  // buys almost nothing and costs half the fill rate.
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(cw * dpr), bh = Math.round(chh * dpr);
  if (bw !== PX.bw || bh !== PX.bh) {
    // The backing store is sized in device pixels while CSS keeps the
    // element at 100% — that way one art pixel covers a whole number of
    // device pixels and nothing lands on a half-pixel.
    PX.bw = bw; PX.bh = bh;
    app.renderer.resize(bw, bh);
    PX.Z = 0;
  }
  // integer scale, so every art pixel lands on a whole block of device pixels
  const Z = Math.max(2, Math.min(9, Math.round(Math.min(bw, bh) / 285)));
  if (Z !== PX.Z) {
    PX.Z = Z;
    PX.cam.scale.set(Z);
    PX.grade.width = bw; PX.grade.height = bh;
    PX.vig.width = bw; PX.vig.height = bh;
  }
  W.scale = Z;

  /* camera, in art pixels */
  const vw = bw / Z, vh = bh / Z;
  const ax = w2ax(W.x), ay = w2ay(W.y);
  let camX = ax - vw / 2, camY = ay - vh * 0.56;
  camX = MAPW <= vw ? (MAPW - vw) / 2 : Math.max(0, Math.min(MAPW - vw, camX));
  camY = MAPH <= vh ? (MAPH - vh) / 2 : Math.max(-WALLA, Math.min(MAPH - vh, camY));
  PX.cam.x = -Math.round(camX * Z);
  PX.cam.y = -Math.round(camY * Z);

  /* Nothing outside the shot is drawn. The hall is long and full, so
     this is most of the frame's cost saved. */
  const vx0 = camX - 60, vx1 = camX + vw + 60, vy0 = camY - 140, vy1 = camY + vh + 60;
  const seen = s => s.x > vx0 && s.x < vx1 && s.y > vy0 && s.y < vy1;
  for (const layer of [PX.props, PX.glowL, PX.ceil])
    for (const s2 of layer.children) s2.renderable = seen(s2);
  PX.bride.renderable = true;

  /* the congregation: some applaud, some keep their hands folded */
  const t = W.t;
  for (const gu of PX.guests) {
    if (!gu.sp.renderable) continue;
    let arms = 0;
    if (CUT.on) {
      // as the two of them come back down the aisle, the hall applauds
      arms = ((t + gu.phase) % 320) < 170 ? 1 : 0;
    } else if (gu.beh === 'clasp') arms = 2;
    else if (gu.beh === 'clap') {
      const c = (t + gu.phase) % gu.period;
      arms = (c < 1150 && (c % 290) < 150) ? 1 : 0;
    }
    if (arms !== gu.frame) {
      gu.frame = arms;
      gu.sp.texture = texGuest(gu.kind, 'side', gu.seated, arms);
    }
  }
  for (const pa of PX.parents) {
    const c = (t + pa.phase) % 7400;
    const arms = c < 900 && (c % 300) < 160 ? 1 : 2;
    if (arms !== pa.frame) { pa.frame = arms; pa.sp.texture = texParent(pa.who, arms, pa.v); }
  }

  /* candle flicker */
  const flick = ((t / 105) | 0) & 1;
  if (flick !== PX.flick) {
    PX.flick = flick;
    for (const c of PX.candles) c.sp.texture = texCandelabra(flick, c.tall, 0);
  }

  /* Chandeliers breathe — and step out of the way. They hang between us
     and the aisle, so any fixture the bride is walking under fades back
     until she is never hidden behind one. */
  const bax = w2ax(W.x), bay = w2ay(W.y);
  for (const cf of PX.coffers)
    cf.halo.alpha = 0.15 * (0.86 + 0.14 * Math.sin(t / 900 + cf.phase));
  for (const ch2 of PX.chandeliers) {
    const tw = 0.86 + 0.14 * Math.sin(t / 620 + ch2.phase);
    // a slow sway, a pixel either way — enough to read as suspended
    const sway = Math.round(Math.sin(t / 2600 + ch2.phase) * (ch2.big ? 1.6 : 1.1));
    ch2.sp.x = ch2.x0 + sway;
    ch2.halo.x = ch2.sp.x;
    ch2.shade.x = ch2.x0 + sway * 0.4;
    const near = Math.abs(ch2.x0 - bax) < 34 &&
                 bay > ch2.sp.y - ch2.sp.height - 6 && bay < ch2.sp.y + 40;
    const want = near ? 0 : 1;
    ch2.fade = ch2.fade === undefined ? want : ch2.fade + (want - ch2.fade) * 0.12;
    const a = 0.16 + 0.84 * ch2.fade;
    ch2.sp.alpha = a; ch2.rod.alpha = a * 0.8;
    ch2.halo.alpha = (ch2.big ? 0.26 : 0.2) * tw * ch2.fade;
    ch2.pool.alpha = (ch2.big ? 0.22 : 0.14) * tw;
    ch2.shade.alpha = 0.3 * ch2.fade;
  }

  if (PX.groom) PX.groom.y = PX.groomY - (Math.sin(t / 900) > 0 ? 1 : 0);

  /* the bride — and, on the way out, the groom beside her */
  PX.camX = camX; PX.camY = camY;
  const br = PX.bride, pt = PX.partner;
  if (CUT.descend) {
    // walking down off the dais toward her, facing the camera
    pt.visible = true;
    pt.texture = texGroomWalk(CUT.gstep, 0);
    pt.scale.x = 1;
    pt.x = Math.round(CUT.gx);
    pt.y = Math.round(CUT.gy);
    pt.zIndex = CUT.gy + 1;
    br.texture = texBride('up', 0);
    br.scale.x = 1;
    br.x = Math.round(ax); br.y = Math.round(ay); br.zIndex = ay + 1;
  } else if (VOW.on || CUT.join) {
    // stood in front of her saying his piece, then stepping round to her side
    pt.visible = true;
    pt.texture = texGroomWalk(CUT.join ? CUT.gstep : 0, 0);
    pt.scale.x = 1;
    pt.x = Math.round(CUT.gx || ax); pt.y = Math.round(CUT.gy || ay - 22);
    pt.zIndex = (CUT.gy || ay - 22) + 1;
    br.texture = texBride('up', 0);
    br.scale.x = 1;
    br.x = Math.round(ax); br.y = Math.round(ay); br.zIndex = ay + 1;
  } else if (CUT.on) {
    const kiss = CUT.phase >= 1;
    const bx = ax - (kiss ? 10 : 11), gx = ax + (kiss ? 9 : 11);
    if (kiss) {
      // turned in to each other at the mouth of the aisle
      br.texture = texBride('side', 0);
      br.scale.x = 1;                        // she looks to her right, at him
      pt.texture = texGroomSide();
      pt.scale.x = -1;                       // and he looks back
    } else {
      br.texture = texBride('down', CUT.step, 0);
      br.scale.x = 1;
      pt.texture = texGroomWalk(CUT.step, 0);
      pt.scale.x = 1;
    }
    const bob = CUT.step === 2 ? -1 : 0;
    br.x = Math.round(bx); br.y = Math.round(ay) + bob; br.zIndex = ay + 1;
    pt.visible = true;
    pt.x = Math.round(gx); pt.y = Math.round(ay) + bob; pt.zIndex = ay + 1.1;
    if (kiss && CUT.phase >= 2) {            // a small heart between them
      if (!PX.heart) {
        PX.heart = new PIXI.Sprite(TEX('heart', 9, 8, p => {
          for (const [x, y, w, h] of [[1,1,3,2],[5,1,3,2],[0,2,9,3],[1,5,7,1],[2,6,5,1],[3,7,3,1]])
            R(p, x, y, w, h, '#e8607f');
          R(p, 1, 1, 2, 1, '#ff9fb4'); D(p, 2, 3, '#ffc7d4');
        }));
        PX.heart.anchor.set(0.5, 1);
        PX.ceil.addChild(PX.heart);
      }
      PX.heart.visible = true;
      PX.heart.x = Math.round(ax);
      PX.heart.y = Math.round(ay) - 40 - Math.round(Math.sin(t / 500) * 2);
      PX.heart.alpha = 0.75 + 0.25 * Math.sin(t / 430);
    }
  } else {
    const dir = W.dir === 'up' ? 'up' : W.dir === 'down' ? 'down' : 'side';
    const step = W.moving ? (W.step || 1) : 0;
    if (dir !== PX.bdir || step !== PX.bstep) {
      PX.bdir = dir; PX.bstep = step;
      br.texture = texBride(dir, step);
    }
    br.scale.x = W.dir === 'left' ? -1 : 1;
    br.x = Math.round(ax);
    br.y = Math.round(ay) + (W.moving && step === 2 ? -1 : 0);
    br.zIndex = ay + 1;
    if (pt) pt.visible = false;
  }

  app.renderer.render(app.stage);
}


function wCanMove(nx, ny) {
  const pts = [[nx - 9, ny - 5], [nx + 9, ny - 5], [nx - 9, ny], [nx + 9, ny]];
  return pts.every(([px2, py2]) => {
    const t = wTileAt(Math.floor(px2 / WT), Math.floor(py2 / WT));
    return t === 'r' || t === 'P' || t === 'd';   // runner, podium, and the dais
  });
}

/* ══════════════════════════════════════════════════════════
   THOUGHT BUBBLE
   Typed out a character at a time, like a game's textbox, and
   pinned over her head in world space so it moves with her.
══════════════════════════════════════════════════════════ */
const TH = { text: '', at: 0, timer: 0, last: false, shownAt: 0 };

function thinkShow(text, isLast) {
  const el = $('think');
  TH.text = text || ''; TH.at = 0; TH.last = !!isLast;
  TH.shownAt = performance.now();
  $('think-text').textContent = '';
  $('think-more').classList.remove('on');
  el.classList.toggle('go', TH.last);
  el.classList.add('show');
  thinkPlace();
  clearInterval(TH.timer);
  TH.timer = setInterval(() => {
    TH.at++;
    $('think-text').textContent = TH.text.slice(0, TH.at);
    if (TH.at >= TH.text.length) thinkFinishLine();
  }, 46);
}
function thinkStillTyping() { return TH.at < TH.text.length; }
function thinkFinishLine() {
  clearInterval(TH.timer); TH.timer = 0;
  TH.at = TH.text.length;
  $('think-text').textContent = TH.text;
  $('think-more').classList.add('on');
}
function thinkHide() {
  clearInterval(TH.timer); TH.timer = 0;
  TH.text = ''; TH.at = 0;
  $('think').classList.remove('show');
}
/* keep it over her head — the camera moves, so this runs every frame */
function thinkPlace() {
  if (!PX || !PX.bride) return;
  const el = $('think');
  if (!el.classList.contains('show')) return;
  const Z = PX.Z, view = PX.app.view;
  const sx = (PX.cam.x + PX.bride.x * Z) / (PX.bw / view.clientWidth);
  const sy = (PX.cam.y + (PX.bride.y - 44) * Z) / (PX.bh / view.clientHeight);
  // never let it ride off the top: it is pinned over her head, but at the
  // very end of the aisle there may not be a head's worth of room up there
  const h = el.offsetHeight || 0;
  const top = Math.max(h + 8, Math.round(sy));
  el.style.left = Math.round(Math.min(Math.max(sx, 20), view.clientWidth - 20)) + 'px';
  el.style.top = top + 'px';
}

/* ══════════════════════════════════════════════════════════
   THE FINALE
   The last letter, the question and the walk back out, all
   staged in the hall rather than on a page of their own.
══════════════════════════════════════════════════════════ */
const VOW = { on: false, line: 0, lines: [], text: '', at: 0, timer: 0, shownAt: 0, asking: false };

/* the ring, in pixels — the one thing that stays Tiffany mint */
function drawVowRing() {
  const cv = $('fn-ring');
  if (!cv) return;
  const p = pxc(44, 48);
  const M1 = '#81D8D0', M2 = '#4AADA5', M3 = '#2f7d77', HI = '#e6fbf8', TB = '#d3f6f1';
  const cx = 22, sy = 5;

  // the stone: a flat table, a crown sloping out to the girdle, and a
  // pavilion coming to a point
  R(p, cx - 4, sy, 9, 1, HI);
  R(p, cx - 4, sy + 1, 9, 3, TB);
  D(p, cx - 3, sy + 1, '#ffffff');
  for (let k = 0; k < 6; k++) {
    const w = Math.round(5 + k * 1.1);
    R(p, cx - w, sy + 4 + k, w * 2, 1, k < 3 ? TB : M1);
  }
  R(p, cx - 11, sy + 10, 23, 1, HI);                 // girdle
  for (let k = 0; k < 11; k++) {
    const w = 11 - k;
    R(p, cx - w, sy + 11 + k, w * 2, 1, k < 3 ? M1 : k < 7 ? M2 : M3);
  }
  // facets catching the light
  for (let k = 0; k < 6; k++) D(p, cx - 5 - k, sy + 4 + k, HI);
  for (let k = 0; k < 6; k++) D(p, cx + 4 + k, sy + 4 + k, M2);
  for (let k = 0; k < 9; k++) D(p, cx - 9 + k, sy + 11 + k, '#a6e8e1');
  for (let k = 0; k < 9; k++) D(p, cx + 8 - k, sy + 11 + k, M3);
  D(p, cx, sy + 21, HI);

  // the setting, and the prongs holding it
  R(p, cx - 6, sy + 22, 13, 2, M2);
  R(p, cx - 6, sy + 22, 13, 1, M1);
  R(p, cx - 9, sy + 9, 1, 4, M1); R(p, cx + 8, sy + 9, 1, 4, M1);

  // the band, seen at a slight angle
  const by = 39, rx = 15, ry = 6;
  for (let a = 180; a <= 360; a += 1) {              // the far side, in shadow
    const r = a * Math.PI / 180;
    R(p, cx + Math.cos(r) * rx - 1, by + Math.sin(r) * ry - 1, 3, 3, M3);
  }
  for (let a = 0; a <= 180; a += 1) {                // the near side, lit
    const r = a * Math.PI / 180;
    R(p, cx + Math.cos(r) * rx - 1, by + Math.sin(r) * ry - 1, 3, 3, M2);
  }
  for (let a = 20; a <= 160; a += 2) {
    const r = a * Math.PI / 180;
    D(p, Math.round(cx + Math.cos(r) * rx), Math.round(by + Math.sin(r) * ry), M1);
  }
  for (let a = 200; a <= 250; a += 3) {
    const r = a * Math.PI / 180;
    D(p, Math.round(cx + Math.cos(r) * (rx - 1)), Math.round(by + Math.sin(r) * (ry - 1)), HI);
  }
  D(p, cx - 1, 4, '#ffffff'); D(p, cx + 12, sy + 14, '#ffffff');

  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 44, 48);
  g.drawImage(p.c, 0, 0);
}

/* the closing letter, a line at a time */
function openVow() {
  VOW.on = true; VOW.asking = false; VOW.line = 0;
  VOW.lines = LETTER2.split('\n').filter(l => l.trim() !== '');
  const el = $('finale');
  el.classList.remove('ask', 'soft');
  el.classList.add('show', 'says');       // it is him speaking, not a caption
  fadeOutBgm(3000);                       // the music ebbs away under his voice
  vowType(VOW.lines[0]);
}
function vowType(text) {
  clearInterval(VOW.timer);
  VOW.text = text || ''; VOW.at = 0; VOW.shownAt = performance.now();
  $('fn-text').textContent = '';
  $('fn-more').classList.remove('on');
  VOW.timer = setInterval(() => {
    VOW.at++;
    $('fn-text').textContent = VOW.text.slice(0, VOW.at);
    if (VOW.at >= VOW.text.length) vowFinishLine();
  }, 42);
}
/* keep the speech bubble just above his head as the camera moves */
function vowPlace() {
  if (!PX || !PX.app || !VOW.on || VOW.asking) return;
  const el = $('finale'), stage = $('fn-stage'), view = PX.app.view;
  const scale = PX.bh / (view.clientHeight || 1);
  const headTop = (PX.cam.y + (CUT.gy - 40) * PX.Z) / scale;
  const h = stage.offsetHeight || 0;
  el.style.setProperty('--says-top', Math.max(8, Math.round(headTop - h - 6)) + 'px');
}

function vowFinishLine() {
  clearInterval(VOW.timer); VOW.timer = 0;
  VOW.at = VOW.text.length;
  $('fn-text').textContent = VOW.text;
  $('fn-more').classList.add('on');
}
function vowAdvance() {
  if (VOW.asking) return;
  if (VOW.at < VOW.text.length) { vowFinishLine(); return; }
  if (VOW.line < VOW.lines.length - 1) { VOW.line++; vowType(VOW.lines[VOW.line]); return; }
  // the room has been quiet since the music went out under his first
  // words — the moment he is finished, the question and its own track
  // arrive together, with nothing in between
  askTheQuestion();
  playProposalSong();
}

/* and then the question itself */
function askTheQuestion() {
  clearInterval(VOW.timer); VOW.timer = 0;
  VOW.asking = true;
  drawVowRing();
  $('finale').classList.remove('says');
  $('finale').classList.add('ask');
}

/* ── the walk back out ─────────────────────────────────────
   They leave together: down the aisle, stopping to wave to
   each side twice, and at the mouth of it they turn to each
   other while the flowers come down. */
const CUT = { on: false, phase: 0, t: 0, step: 0, walkT: 0,
              petals: [], carded: false,
              descend: false, join: false, joinWait: 0, gx: 0, gy: 0, gstep: 0, gwalkT: 0 };

/* He walks down off the dais to meet her before he says anything. The one
   standing up there is the one who comes down — no second groom appears. */
function startDescent(after) {
  CUT.descend = true;
  CUT.gx = (AISLE_MID + 0.5) * AW;
  CUT.gy = 6.5 * AH;
  CUT.gstep = 1; CUT.gwalkT = 0;
  CUT.afterDescent = after;
  if (PX && PX.groom) PX.groom.visible = false;
}
function descentStep(dt) {
  const target = w2ay(W.y) - 22;          // he stops just in front of her
  CUT.gy = Math.min(target, CUT.gy + 20 / 1000 * dt);
  CUT.gwalkT += dt;
  if (CUT.gwalkT > 320) { CUT.gwalkT = 0; CUT.gstep = CUT.gstep === 1 ? 2 : 1; }
  if (CUT.gy >= target - 0.4) {
    CUT.gy = target; CUT.descend = false; CUT.gstep = 0;
    const fn = CUT.afterDescent; CUT.afterDescent = null;
    if (fn) fn();
  }
}

function startRecessional() {
  // The scene has to take over in the same frame the panel starts fading,
  // or he blinks out of existence for as long as the fade lasts.
  CUT.on = true; CUT.phase = 0; CUT.t = 0;
  CUT.step = 0; CUT.carded = false;
  CUT.descend = false;
  CUT.join = true;                  // he walks over to her side first
  CUT.joinWait = 1000;              // ...but takes a beat to react before he moves
  CUT.gwalkT = 0; CUT.gstep = 0;
  W.locked = true; W.stop = null;
  W.x = AISLE_MID * WT + WT / 2;
  W.dir = 'down';
  if (PX && PX.groom) PX.groom.visible = false;
  VOW.on = false; VOW.asking = false;
  // grab the button's x before the classes below take it out of layout —
  // the burst keeps that horizontal position but always launches from
  // the center-top of the screen rather than low where the button sits,
  // so it actually reads as fireworks and not a puddle at the bottom
  const yesRect = $('fn-yes').getBoundingClientRect();
  const yesX = yesRect.left + yesRect.width / 2;
  $('finale').classList.add('closing');
  $('finale').classList.remove('show', 'ask', 'says');
  $('world-stick').classList.remove('show');
  burstConfetti(yesX, window.innerHeight * 0.36);
}

function cutStep(dt) {
  CUT.t += dt;
  if (CUT.join) {
    // He is standing in front of her; he steps round to her side before
    // either of them moves off, rather than simply appearing there — and
    // he takes a beat to react before he starts, rather than setting off
    // the instant she says yes.
    if (CUT.joinWait > 0) { CUT.joinWait -= dt; return; }
    const tx = w2ax(W.x) + 11, ty = w2ay(W.y);
    const dx = tx - CUT.gx, dy = ty - CUT.gy;
    const d = Math.hypot(dx, dy);
    const sp = 22 / 1000 * dt;
    if (d <= sp) {
      CUT.gx = tx; CUT.gy = ty;
      CUT.join = false; CUT.gstep = 0;
    } else {
      CUT.gx += dx / d * sp;
      CUT.gy += dy / d * sp;
      CUT.gwalkT += dt;
      if (CUT.gwalkT > 300) { CUT.gwalkT = 0; CUT.gstep = CUT.gstep === 1 ? 2 : 1; }
    }
    return;
  }
  if (CUT.phase === 0) {
    // no stopping and no waving: they simply walk it, unhurried
    W.y += 58 / 1000 * dt;
    CUT.walkT += dt;
    if (CUT.walkT > 260) { CUT.walkT = 0; CUT.step = CUT.step === 1 ? 2 : 1; }
    if (W.y / WT >= 64.5) { W.y = 64.5 * WT; CUT.phase = 1; CUT.t = 0; CUT.step = 0; }
  } else if (CUT.phase === 1) {                 // turning to each other
    if (CUT.t > 1000) { CUT.phase = 2; CUT.t = 0; }
  } else if (CUT.phase === 2) {                 // the kiss, and the flowers
    if (CUT.t > 2400 && !CUT.carded) { CUT.carded = true; showClosingCard(); }
  }
  cutPetals(dt);
}

/* petals, from somewhere above the frame */
function cutPetals(dt) {
  if (!PX || CUT.phase < 1) return;
  const vw = PX.bw / PX.Z, vh = PX.bh / PX.Z;
  const camX = PX.camX, camY = PX.camY;
  // Mostly pink, with cream and a little lilac through it — the same mix
  // that lines the aisle, coming down over the whole hall.
  const PETALS = [C.pk1, C.pk2, C.pk2, C.pk3, C.pk1, C.pk3, C.wh1, C.cr1, C.lv1];
  const want = CUT.phase >= 1 ? 210 : 0;
  while (CUT.petals.length < want) {
    const kind = (Math.random() * PETALS.length) | 0;
    const big = Math.random() > 0.55;
    const sp = new PIXI.Sprite(TEX('petal' + kind + (big ? 'b' : ''), big ? 4 : 3, big ? 4 : 3, p => {
      const col = PETALS[kind];
      if (big) { BLOB(p, 2, 2, 2, 1.7, col); D(p, 1, 0, C.wh1); D(p, 3, 3, C.pk3); }
      else     { BLOB(p, 1, 1, 1.5, 1.3, col); D(p, 1, 0, C.wh1); }
    }));
    sp.anchor.set(0.5);
    sp.x = camX + Math.random() * vw;
    sp.y = camY - 20 - Math.random() * vh * 1.3;
    sp.vy = 22 + Math.random() * 34;
    sp.vx = (Math.random() - 0.5) * 16;
    sp.ph = Math.random() * 6.28;
    sp.alpha = 0.75 + Math.random() * 0.25;
    PX.ceil.addChild(sp);
    CUT.petals.push(sp);
  }
  for (const sp of CUT.petals) {
    sp.y += sp.vy * dt / 1000;
    sp.x += (sp.vx + Math.sin(CUT.t / 420 + sp.ph) * 12) * dt / 1000;
    if (sp.y > camY + vh + 10) {                // recycle it back over the top
      sp.y = camY - 12 - Math.random() * 40;
      sp.x = camX + Math.random() * vw;
    }
  }
}

async function showClosingCard() {
  const el = $('finale');
  $('fn-text').textContent = '';
  el.classList.remove('ask', 'closing');
  el.classList.add('soft', 'says');   // soft keeps it see-through; says keeps his name tag and tail on it
  VOW.on = false;
  await sleep(200);
  el.classList.add('show');
  const lines = ['나랑 결혼해줘서 고마워 소영아', '더 멋있고 책임감 있고 든든한 사람이 돼서',
                 '남부럽지 않은 남편이 될게', '같이 행복한 가정을 꾸려나가자', '사랑해♥'];
  $('fn-text').textContent = lines.join('\n');
  $('fn-more').classList.remove('on');
}

/* ══════════════════════════════════════════════════════════
   RECALL
   The memories play over the hall rather than replacing it: she
   stays on the aisle, the room dims, and a framed photograph
   surfaces with its caption in the same box her thoughts use.
   Advancing is the same gesture as advancing a thought.
══════════════════════════════════════════════════════════ */
const RC = { on: false, ep: 0, i: 0, layer: 0, els: [] };

function openRecall(ep) {
  const ch = CHAPTERS[ep];
  RC.on = true; RC.ep = ep; RC.i = 0; RC.layer = 0;
  preloadChapterMedia(ep);

  $('rc-ep-num').textContent  = ch.num;
  $('rc-ep-name').textContent = ch.name;

  // two stacked layers, so one photograph dissolves into the next
  const media = $('rc-media');
  media.innerHTML = '';
  RC.els = [];

  const pips = $('rc-pips');
  pips.innerHTML = '';
  ch.photos.forEach(() => pips.appendChild(document.createElement('i')));

  $('recall').classList.remove('last');
  $('recall').classList.add('show');
  rcShow(0);
}

/* put photo i on the idle layer and dissolve to it */
function rcShow(i) {
  const ch = CHAPTERS[RC.ep], ph = ch.photos[i];
  if (!ph) return;
  RC.i = i;

  const isVid = /\.(mov|mp4|webm)$/i.test(ph.src);
  // the videos are muted anyway, so the music just plays straight through
  bgmTry();
  let el;
  if (isVid) {
    el = document.createElement('video');
    el.muted = true; el.playsInline = true; el.autoplay = true;
    el.setAttribute('muted', ''); el.setAttribute('playsinline', '');
    el.loop = true;
  } else {
    el = document.createElement('img');
    el.decoding = 'async';
  }
  el.src = ph.src;
  $('rc-media').appendChild(el);
  // let the browser lay it out before the class that fades it in
  requestAnimationFrame(() => {
    el.classList.add('on');
    if (isVid) el.play().catch(() => {});
  });
  // retire whatever was showing
  for (const old of RC.els) {
    old.classList.remove('on');
    setTimeout(() => { if (old.parentNode) old.parentNode.removeChild(old); }, 700);
  }
  RC.els = [el];

  [...$('rc-pips').children].forEach((p, k) => {
    p.classList.toggle('seen', k < i);
    p.classList.toggle('now', k === i);
  });

  const last = i === ch.photos.length - 1;
  $('recall').classList.toggle('last', last);
  rcType(ph.cap || '', last);
}

/* the caption types itself the way her thoughts do */
const RCT = { text: '', at: 0, timer: 0, shownAt: 0 };
function rcType(text) {
  clearInterval(RCT.timer);
  RCT.text = text; RCT.at = 0; RCT.shownAt = performance.now();
  $('rc-text').textContent = '';
  $('rc-more').classList.remove('on');
  RCT.timer = setInterval(() => {
    RCT.at++;
    $('rc-text').textContent = RCT.text.slice(0, RCT.at);
    if (RCT.at >= RCT.text.length) rcFinishLine();
  }, 34);
}
function rcFinishLine() {
  clearInterval(RCT.timer); RCT.timer = 0;
  RCT.at = RCT.text.length;
  $('rc-text').textContent = RCT.text;
  $('rc-more').classList.add('on');
}

function rcAdvance() {
  if (RCT.at < RCT.text.length) { rcFinishLine(); return; }
  const ch = CHAPTERS[RC.ep];
  if (RC.i < ch.photos.length - 1) { rcShow(RC.i + 1); return; }
  closeRecall();
}

/* the memory sinks away and the hall comes back up */
async function closeRecall() {
  clearInterval(RCT.timer); RCT.timer = 0;
  RC.on = false;
  $('recall').classList.remove('show', 'last');
  await sleep(520);
  for (const el of RC.els) { if (el.tagName === 'VIDEO') el.pause(); if (el.parentNode) el.parentNode.removeChild(el); }
  RC.els = [];
  $('rc-media').innerHTML = '';

  // set her back down exactly where she was standing when the memory opened
  const pl = W_PLACES[RC.ep];
  if (pl) { W.x = AISLE_MID * WT + WT / 2; W.y = (pl.row + 0.5) * WT; W.dir = 'up'; }
  W.locked = false; W.last = 0;
  $('world-stick').classList.add('show');
}

/* the hint stays up until she actually takes a step */
function showWalkHint() {
  if (W.walked) return;
  $('world-hint').classList.add('show');
  $('stick-arrow').classList.add('show');
}
function hideWalkHint() {
  $('world-hint').classList.remove('show');
  $('stick-arrow').classList.remove('show');
}

/* ══════════════════════════════════════════════════════════
   THE WALK
   She is never asked to press anything. Walking the aisle takes
   her through four points, and at each one she stops, thinks,
   and that episode plays.
══════════════════════════════════════════════════════════ */
function wNextStop() {
  for (const pl of W_PLACES) if (!W.visited.has(pl.ep)) return pl;
  return null;
}

function wStep(dt) {
  if (CUT.descend) { descentStep(dt); return; }
  if (VOW.on) return;
  if (CUT.on) { cutStep(dt); return; }
  const sp = 92 / 1000 * dt;   // world px this frame
  let dx = W.vx, dy = W.vy;
  const mag = Math.hypot(dx, dy);
  if (mag > 1) { dx /= mag; dy /= mag; }
  W.moving = mag > 0.12 && !W.locked;
  if (W.locked) { dx = dy = 0; }

  if (W.moving) {
    if (!W.walked) { W.walked = true; hideWalkHint(); }
    if (Math.abs(dx) > Math.abs(dy)) W.dir = dx < 0 ? 'left' : 'right';
    else                             W.dir = dy < 0 ? 'up' : 'down';
    const nx = W.x + dx * sp, ny = W.y + dy * sp;
    if (wCanMove(nx, W.y)) W.x = nx;
    if (wCanMove(W.x, ny)) W.y = ny;
    W.walkT += dt;
    if (W.walkT > 150) { W.walkT = 0; W.step = W.step === 1 ? 2 : 1; }
  } else { W.step = 0; W.walkT = 0; }

  // has she reached the next point on the aisle?
  if (!W.locked && !W.stop) {
    const pl = wNextStop();
    if (pl && W.y <= (pl.row + 0.5) * WT) wArrive(pl);
  }
}

/* she stops where she is and the thought floats up */
function wArrive(pl) {
  W.locked = true;
  W.vx = W.vy = 0;
  W.moving = false; W.step = 0;
  W.stop = pl; W.line = 0;
  W.y = (pl.row + 0.5) * WT;
  W.x = AISLE_MID * WT + WT / 2;
  W.dir = 'up';
  $('world-stick').classList.remove('show');
  hideWalkHint();
  wShowThought();
}

function wShowThought() {
  const lines = W_THOUGHTS[W.stop.ep] || [];
  thinkShow(lines[W.line], W.line === lines.length - 1);
}

/* a tap anywhere moves the thought on; the last one starts the episode */
function wAdvanceThought() {
  if (!W.stop) return;
  if (thinkStillTyping()) { thinkFinishLine(); return; }
  const lines = W_THOUGHTS[W.stop.ep] || [];
  if (W.line < lines.length - 1) { W.line++; wShowThought(); return; }
  const pl = W.stop;
  thinkHide();
  W.stop = null;
  W.visited.add(pl.ep);
  if (pl.groom) {                    // the last one is not a memory but a beginning
    startDescent(openVow);
  } else {
    openRecall(pl.ep);
  }
}

function wLoop(ts) {
  if (!W.on) return;
  const dt = Math.min(48, ts - (W.last || ts));
  W.last = ts; W.t += dt;
  wStep(dt);
  wRender();
  if (W.stop) thinkPlace();
  if (VOW.on) vowPlace();
  W.raf = requestAnimationFrame(wLoop);
}

/* Autoplay is only ever granted inside a real user gesture, and every
   point we actually want to start a track — the doors appearing, the
   proposal after its silence — is seconds removed from the tap that
   led there, so play() at those moments is refused on its own.

   So we spend the taps we do get on unlocking the elements ahead of
   time. Two things matter and both were wrong before:
     - it must NOT be muted. Muted playback is allowed unconditionally,
       so Safari does not count it as the user approving sound.
     - play() and the pause() that hides it must both run synchronously
       inside the handler. Pausing in a .then() is a turn too late: the
       gesture window has closed by then, and on iOS you get a burst of
       audible music instead of a silent unlock.
   Called on every tap until one is actually granted. */
/* Both tracks run through a Web Audio gain node rather than the
   element's own .volume, because on iOS .volume is read-only — writing
   it does nothing at all, so a volume ramp there is silently a no-op
   and the music would simply cut out instead of fading. A GainNode is
   honoured everywhere. */
let AC = null;
const GAIN = {};
function audioGraph() {
  if (AC) return AC;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  try {
    AC = new Ctx();
    for (const id of ['bgm', 'bgm2']) {
      const el = $(id);
      if (!el) continue;
      const g = AC.createGain();
      g.gain.value = 1;
      AC.createMediaElementSource(el).connect(g);
      g.connect(AC.destination);
      GAIN[id] = g;
    }
  } catch (e) { AC = null; }        // fall back to element volume below
  return AC;
}
function setGain(id, v) {
  const g = GAIN[id];
  if (g) { g.gain.cancelScheduledValues(AC.currentTime); g.gain.value = v; }
  else { const a = $(id); if (a) a.volume = v; }
}

function bgmPrime() {
  audioGraph();
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  for (const id of ['bgm', 'bgm2']) {
    const a = $(id);
    if (!a || a.dataset.primed) continue;
    try {
      const p = a.play();
      a.pause();                      // same tick — inaudible
      a.currentTime = 0;
      a.dataset.primed = '1';
      // Pausing straight after play() makes that promise reject with an
      // AbortError — ours, and the sign it worked. A NotAllowedError is
      // the browser refusing outright, so drop the flag and let the next
      // tap have another go.
      if (p && p.catch) p.catch(err => {
        if (err && err.name === 'NotAllowedError') delete a.dataset.primed;
      });
    } catch (e) { /* try again on the next tap */ }
  }
}

/* the background music: one attempt per gesture until the browser lets
   it through, then it just keeps looping — silently swallowing the
   rejection each time autoplay is still blocked */
function bgmTry() {
  const a = $('bgm');
  if (!a || !a.paused) return;
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  a.play().catch(() => {});
}

/* rides bgm down to silence over ms and then stops it — he starts
   speaking, and the room quietly empties of music under him */
function fadeOutBgm(ms) {
  const a = $('bgm');
  if (!a || a.paused) return Promise.resolve();
  const g = GAIN.bgm;
  if (g && AC) {
    const now = AC.currentTime;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(0.0001, now + ms / 1000);
    return sleep(ms).then(() => { a.pause(); setGain('bgm', 1); });
  }
  // no Web Audio: ramp the element's own volume instead
  return new Promise(resolve => {
    const startVol = a.volume, t0 = performance.now();
    function step(now) {
      const t = Math.max(0, Math.min(1, (now - t0) / ms));
      a.volume = Math.max(0, Math.min(1, startVol * (1 - t)));
      if (t < 1) requestAnimationFrame(step);
      else { a.pause(); a.volume = startVol; resolve(); }
    }
    requestAnimationFrame(step);
  });
}

/* the one-off track for the proposal itself — when it finishes, bgm
   picks back up from the top at full volume (wired once, below) */
function playProposalSong() {
  const p2 = $('bgm2');
  if (!p2) return;
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  setGain('bgm2', 1);
  p2.currentTime = 0;
  p2.play().catch(() => {});
}
$('bgm2')?.addEventListener('ended', () => {
  const a = $('bgm');
  if (!a) return;
  setGain('bgm', 1);
  a.currentTime = 0;
  a.play().catch(() => {});
});

/* ── controls: on-screen stick + keyboard ── */
function wInitControls() {
  const stick = $('world-stick'), knob = $('world-stick-knob');
  let id = null, cx = 0, cy = 0;
  const R = 34;        // how far the knob may travel
  const LIVE = 11;     // ...but this much deflection is already full speed
  const set = (dx, dy) => {
    const m = Math.hypot(dx, dy) || 1;
    const cl = Math.min(m, R);
    knob.style.transform = `translate(${dx / m * cl}px, ${dy / m * cl}px)`;
    const out = Math.min(1, m / LIVE);          // saturates after a nudge
    W.vx = dx / m * out; W.vy = dy / m * out;
  };
  const reset = () => { knob.style.transform = ''; W.vx = W.vy = 0; id = null; };

  stick.addEventListener('touchstart', e => {
    bgmTry();
    const t = e.changedTouches[0]; id = t.identifier;
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    set(t.clientX - cx, t.clientY - cy);
  }, { passive: true });
  stick.addEventListener('touchmove', e => {
    for (const t of e.changedTouches)
      if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
  }, { passive: true });
  stick.addEventListener('touchend',    reset, { passive: true });
  stick.addEventListener('touchcancel', reset, { passive: true });

  // mouse drag, for desktop
  stick.addEventListener('mousedown', e => {
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    id = 'm'; set(e.clientX - cx, e.clientY - cy);
    const mv = ev => { if (id === 'm') set(ev.clientX - cx, ev.clientY - cy); };
    const up = () => { reset(); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });

  const keys = {};
  const apply = () => {
    W.vx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    W.vy = (keys.ArrowDown  || keys.s ? 1 : 0) - (keys.ArrowUp   || keys.w ? 1 : 0);
  };
  window.addEventListener('keydown', e => {
    if (!W.on) return;
    if (e.key === 'Enter' || e.key === ' ') { VOW.on ? vowAdvance() : RC.on ? rcAdvance() : wAdvanceThought(); return; }
    keys[e.key] = true; apply();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; apply(); });

  /* A tap anywhere on the screen moves the story along — a thought, or a
     photograph. One listener, on pointerup: a touch fires touchend AND a
     synthesised click, so two listeners would eat two steps per tap.

     A tap only counts if the finger went down AFTER the thing on screen
     appeared. Otherwise the finger already resting on the joystick when
     she arrives at a stop would lift and skip the first line, which reads
     as the bubble advancing on its own. */
  const downs = new Map();
  window.addEventListener('pointerdown', e => downs.set(e.pointerId, performance.now()), { passive: true });
  window.addEventListener('pointercancel', e => downs.delete(e.pointerId), { passive: true });
  window.addEventListener('pointerup', e => {
    const began = downs.get(e.pointerId);
    downs.delete(e.pointerId);
    if (!W.on || began === undefined) return;
    bgmTry();
    if (VOW.on) {
      if (VOW.asking || began < VOW.shownAt) return;
      e.preventDefault(); vowAdvance();
    } else if (RC.on) {
      if (began < RCT.shownAt) return;
      e.preventDefault(); rcAdvance();
    } else if (W.stop) {
      if (began < TH.shownAt) return;
      e.preventDefault(); wAdvanceThought();
    }
  }, { passive: false });
}

async function openWorld(firstTime, onSwap) {
  await fadeTo('pg-world', onSwap);
  W.on = true; W.locked = false; W.last = 0;
  if (!W.raf) W.raf = requestAnimationFrame(wLoop);
  CHAPTERS.forEach((_, i) => preloadChapterMedia(i));
  await sleep(260);
  $('world-stick').classList.add('show');
  if (firstTime) showWalkHint();
}

/* Called when an episode's reel finishes — walk back out into the world */
async function returnToWorld() {
  stopAutoPlay();
  await closePhotoViewer(true);
  $('ch-detail').classList.remove('show');
  $('ch-hd').classList.remove('in');
  $('ch-scroll').classList.remove('show');
  $('ch-foot').classList.remove('show');
  await fadeTo('pg-world');
  // set her down a step past the point she just remembered, so the next
  // stretch of aisle is hers to walk
  const last = W_PLACES.filter(pl => W.visited.has(pl.ep)).pop();
  if (last) {
    W.x = AISLE_MID * WT + WT / 2;
    W.y = (last.row - 0.7) * WT;
    W.dir = 'up';
  }
  W.on = true; W.locked = false; W.last = 0; W.stop = null;
  if (!W.raf) W.raf = requestAnimationFrame(wLoop);
  $('world-stick').classList.add('show');
}

function closeWorld() {
  W.on = false;
  thinkHide();
  if (W.raf) { cancelAnimationFrame(W.raf); W.raf = 0; }
  $('world-stick').classList.remove('show');
  hideWalkHint();
}

/* ════════════════════════════════════
   ORIENTATION — re-layout anything positioned in JS pixels
════════════════════════════════════ */
function relayoutForOrientation() {
  // Carousel cards are placed with JS transforms — restep them for the new width
  if ($('cc0')) positionCards(activeCard, false);

  // Confetti canvas is a fixed-size bitmap
  const canvas = $('confetti');
  if (canvas && canvas.style.display !== 'none') {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  // The dodging button lives in absolute pixels — pull it back on screen
  if ($('pg-proposal').classList.contains('active')) {
    const btn = $('btn-no');
    const { w, h } = noBtnSize();
    const left = parseFloat(btn.style.left) || 0;
    const top  = parseFloat(btn.style.top)  || 0;
    if (left + w > window.innerWidth - 8 || top + h > window.innerHeight - 8) placeNo();
  }
}

let _orientTimer = null;
function onViewportChange() {
  clearTimeout(_orientTimer);
  // wait for the browser to settle on the new viewport size before measuring
  _orientTimer = setTimeout(relayoutForOrientation, 220);
}
window.addEventListener('orientationchange', onViewportChange);
window.addEventListener('resize', onViewportChange);

/* ════════════════════════════════════
   BOOT
════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  initLock();
  startLockBride();
  playLockLines();
  initGridDismiss();
  wInitControls();
  $('btn-ch-next').addEventListener('click', onChapterNext);
  $('fn-yes').addEventListener('click', startRecessional);
  $('btn-yes').addEventListener('click', onYes);
  $('btn-no').addEventListener('click', dodgeNo);

  // ─── Photo Viewer Touch ───────────────────────────────────
  // ① 좌/우 탭 or 스와이프 → 이전/다음
  // ② 가운데 탭          → 프로그레스바 토글 (2.5s 후 자동 숨김)
  // ③ 길게 누름          → 멈춤 (바 표시 + 타이머 정지)
  // ④ 아래 스와이프      → 뷰어 닫기 (슬라이드 다운)
  let pvStartX = 0, pvStartY = 0, pvStartT = 0;
  let pvMoveX  = 0, pvMoveY  = 0;
  let pvLongTimer = null;

  const pvEl   = $('photo-viewer');
  const pvBody = $('pv-body');

  function pvShowBars() {
    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
    pvBarsVisible = true;
    const bars = $('pv-bars');
    bars.style.transition = 'opacity 0.35s ease';
    bars.style.opacity = '1';
  }
  function pvHideBars() {
    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
    pvBarsVisible = false;
    const bars = $('pv-bars');
    bars.style.transition = 'none';
    bars.style.opacity = '0';
  }
  function pvToggleBars() {
    if (pvBarsVisible) {
      pvHideBars();
    } else {
      pvShowBars();
      pvBarsHideTimer = setTimeout(pvHideBars, 2500);
    }
  }

  function pvGoNext() {
    const cIdx   = apChIdx >= 0 ? apChIdx : currentCh;
    const photos = CHAPTERS[cIdx].photos;
    if (apPIdx < photos.length - 1) {
      const next = apPIdx + 1;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = next; apRunning = true;
      openPhotoViewer(cIdx, next, true).then(dur => { if (apRunning) startHoldTimer(dur); });
    } else {
      stopAutoPlay();
      if (isManualMode) {
        // manual mode: last photo → close viewer, stay in grid
        closePhotoViewer(false);
      } else {
        closePhotoViewer(false).then(() => onChapterNext());
      }
    }
  }
  function pvGoPrev() {
    if (apPIdx > 0) {
      const prev = apPIdx - 1;
      const cIdx = apChIdx >= 0 ? apChIdx : currentCh;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = prev; apRunning = true;
      openPhotoViewer(cIdx, prev, true).then(dur => startHoldTimer(dur));
    } else { resumeHold(); }
  }

  function pvBodyReset(animate) {
    if (animate) {
      pvBody.style.transition = 'transform 0.42s cubic-bezier(0.16,1,0.3,1), opacity 0.32s ease';
      requestAnimationFrame(() => {
        pvBody.style.transform = '';
        pvBody.style.opacity   = '';
      });
      setTimeout(() => { pvBody.style.transition = ''; }, 500);
    } else {
      pvBody.style.transition = '';
      pvBody.style.transform  = '';
      pvBody.style.opacity    = '';
    }
  }

  pvEl.addEventListener('touchstart', (e) => {
    const t  = e.touches[0];
    pvStartX = t.clientX; pvStartY = t.clientY;
    pvStartT = Date.now();
    pvMoveX  = 0; pvMoveY = 0;
    // 300ms 유지 시에만 일시정지 (빠른 탭에서 버벅임 방지)
    pvLongTimer = setTimeout(() => { pauseHold(); pvShowBars(); }, 300);
  }, { passive: true });

  pvEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    pvMoveX = t.clientX - pvStartX;
    pvMoveY = t.clientY - pvStartY;
    // 아래 드래그: 바디가 손가락 따라 내려옴
    if (pvMoveY > 0 && pvMoveY > Math.abs(pvMoveX) * 0.7) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
      const damped = pvMoveY * 0.55;
      const sc     = Math.max(0.88, 1 - pvMoveY / 1800);
      const al     = Math.max(0.25, 1 - pvMoveY / 260);
      pvBody.style.transition = 'none';
      pvBody.style.transform  = `translateY(${damped}px) scale(${sc})`;
      pvBody.style.opacity    = al;
    } else if (Math.abs(pvMoveX) > 8) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    }
  }, { passive: true });

  pvEl.addEventListener('touchend', (e) => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    const t    = e.changedTouches[0];
    const dx   = t.clientX - pvStartX;
    const dy   = t.clientY - pvStartY;
    const adx  = Math.abs(dx);
    const ady  = Math.abs(dy);
    const held = Date.now() - pvStartT;

    // ④ 아래 스와이프 → 슬라이드 다운 닫기
    if (dy > 60 && ady > adx * 0.8) {
      pvHideBars();
      stopAutoPlay();
      pvBody.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.6,1), opacity 0.28s ease';
      pvBody.style.transform  = `translateY(${pvMoveY * 0.55 + window.innerHeight * 0.22}px) scale(0.84)`;
      pvBody.style.opacity    = '0';
      pvEl.classList.remove('show'); // CSS transition 으로 fade-out
      setTimeout(() => { pvBodyReset(false); }, 380);
      return;
    }

    // ③ 길게 누름 → 재개 + 바 잠시 유지 후 숨김
    if (held >= 450 && adx < 18 && ady < 18) {
      pvBodyReset(true);
      pvBarsHideTimer = setTimeout(pvHideBars, 1000);
      resumeHold();
      return;
    }

    // ① 가로 스와이프 → 이전/다음
    if (adx > 36 && adx > ady * 1.2) {
      pvBodyReset(true);
      dx < 0 ? pvGoNext() : pvGoPrev();
      return;
    }

    // 탭 (움직임 없음) → 존 기반
    if (adx <= 22 && ady <= 22) {
      pvBodyReset(false);   // 즉시 리셋 — rAF 없이 bars transition과 충돌 방지
      const zone = t.clientX / window.innerWidth;
      if      (zone < 0.33) { pvGoPrev(); return; }
      else if (zone > 0.67) { pvGoNext(); return; }
      else                  { pvToggleBars(); resumeHold(); return; }
    }

    pvBodyReset(true);
    resumeHold();
  });

  pvEl.addEventListener('touchcancel', () => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    pvBodyReset(true);
    pvHideBars();
    resumeHold();
  });
});
</script>
