<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <title>민소커플의 이야기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#faf6f1;--bg2:#f5ede3;--champagne:#e8d5b7;--gold:#c4a882;--gold-deep:#a07850;
  --rosegold:#c8a0a8;--rosegold-d:#a07880;--text-dark:#3a2a1a;--text-mid:#7a6050;
  --text-soft:#b0968a;--white:#fffdf9;--card-bg:#fffcf8;
  --sat:env(safe-area-inset-top,44px);--sab:env(safe-area-inset-bottom,34px);
  --ease:cubic-bezier(0.22,1,0.36,1);
}
html{height:100%;width:100%;position:fixed;overflow:hidden}
body{width:100%;height:100%;background:var(--bg);font-family:'Noto Serif KR',serif;color:var(--text-dark);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.screen{position:fixed;inset:0}
.hidden{display:none!important}

/* ── 잠금 ── */
.lock-screen{
  background:linear-gradient(170deg,#fdf8f2 0%,#f7ede0 50%,#f2e0d5 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding-top:var(--sat);padding-bottom:var(--sab);overflow:hidden;
  transition:opacity .85s ease;
}
.lock-screen.fade-out{opacity:0;pointer-events:none}
.lock-inner{text-align:center;display:flex;flex-direction:column;align-items:center;padding:0 2.2rem;animation:rise 1.1s var(--ease) forwards;width:100%}
@keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
.lock-icon{font-size:2rem;margin-bottom:1.4rem;opacity:.6;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.08);opacity:.75}}
.lock-ornament{display:flex;align-items:center;gap:10px;margin-bottom:1.4rem}
.orn-line{display:block;width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--champagne))}
.orn-line:last-child{background:linear-gradient(90deg,var(--champagne),transparent)}
.orn-diamond{font-size:.5rem;color:var(--gold)}
.lock-title{font-family:'DM Serif Display',serif;font-size:2.6rem;line-height:1.15;color:var(--text-dark);margin-bottom:.9rem}
.lock-desc{font-size:.83rem;color:var(--text-mid);line-height:1.85;font-weight:300;margin-bottom:2rem}
.lock-field-wrap{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;margin-bottom:1.4rem}
.lock-label{font-size:.78rem;color:var(--text-soft);letter-spacing:.06em;padding-left:.2rem}
.lock-input-wrap{width:100%;position:relative}
.lock-input{
  width:100%;background:var(--white);border:1.5px solid var(--champagne);border-radius:12px;
  padding:.9rem 1.1rem;font-family:'DM Serif Display',serif;font-size:1.25rem;
  color:var(--text-dark);letter-spacing:.18em;text-align:center;outline:none;
  transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;min-height:52px;
}
.lock-input:focus{border-color:var(--rosegold);box-shadow:0 0 0 3px rgba(200,160,168,.15)}
.lock-input::placeholder{color:var(--champagne);letter-spacing:.08em}
.lock-input.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.lock-hint{font-size:.72rem;color:var(--text-soft);padding-left:.2rem;opacity:.7}
.lock-btn{
  width:100%;background:linear-gradient(135deg,var(--rosegold),var(--rosegold-d));
  border:none;color:var(--white);font-family:'Noto Serif KR',serif;font-size:.95rem;
  padding:.95rem 0;border-radius:50px;min-height:52px;
  box-shadow:0 6px 20px rgba(160,120,128,.28);cursor:pointer;letter-spacing:.06em;
  transition:transform .15s,box-shadow .15s;-webkit-appearance:none;margin-bottom:1rem;
}
.lock-btn:active{transform:scale(.96);box-shadow:0 3px 10px rgba(160,120,128,.2)}
.lock-error{font-size:.82rem;color:var(--rosegold-d);letter-spacing:.04em;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s;display:block!important;min-height:1.2em}
.lock-error.show{opacity:1;transform:translateY(0)}

/* ── 인트로 ── */
.intro-screen{
  background:linear-gradient(170deg,#fdf8f2 0%,#f7ede0 50%,#f2e0d5 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:90;padding-top:var(--sat);padding-bottom:var(--sab);overflow:hidden;
  transition:opacity .9s ease;
}
.intro-screen.fade-out{opacity:0;pointer-events:none}
.intro-inner{text-align:center;display:flex;flex-direction:column;align-items:center;animation:rise 1.3s var(--ease) forwards;padding:0 2rem}
.intro-ornament{display:flex;align-items:center;gap:10px;margin-bottom:1.6rem}
.intro-eyebrow{font-family:'DM Serif Display',serif;font-style:italic;font-size:.82rem;color:var(--text-soft);letter-spacing:.22em;margin-bottom:1rem}
.intro-title{font-family:'DM Serif Display',serif;font-size:3.6rem;line-height:1.08;color:var(--text-dark);margin-bottom:.65rem}
.intro-title em{font-style:italic;color:var(--rosegold-d)}
.intro-desc{font-size:.85rem;color:var(--text-mid);line-height:1.85;font-weight:300;margin-bottom:1.8rem}
.start-btn{
  display:flex;align-items:center;gap:.6rem;
  background:linear-gradient(135deg,var(--rosegold),var(--rosegold-d));
  border:none;color:var(--white);font-family:'Noto Serif KR',serif;font-size:.9rem;
  padding:.9rem 2.2rem;border-radius:50px;min-height:52px;
  box-shadow:0 6px 22px rgba(160,120,128,.3);cursor:pointer;letter-spacing:.06em;
  transition:transform .15s,box-shadow .15s;-webkit-appearance:none;
}
.start-btn:active{transform:scale(.96)}
.btn-arrow{font-size:1rem}

/* ── 스토리 ── */
.story-screen{
  display:flex;flex-direction:column;
  background:var(--bg);z-index:50;overflow:hidden;
}
.progress-track{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(196,168,130,.18);z-index:30}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--champagne),var(--rosegold));transition:width .55s ease;width:0%;border-radius:0 2px 2px 0}

/* 미디어 */
.media-section{position:relative;width:100%;background:var(--bg2);overflow:hidden;flex-shrink:0}
.slider-viewport{width:100%;height:100%;overflow:hidden;position:relative}
.slider-track{display:flex;height:100%;transition:transform .42s cubic-bezier(.4,0,.2,1);will-change:transform}
.slide{flex:0 0 100%;width:100%;position:relative;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.slide-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;background:linear-gradient(160deg,#f5e8d5,#eeddd0)}
.ph-icon{font-size:2.4rem;opacity:.3}
.ph-text{font-size:.8rem;color:var(--text-soft);letter-spacing:.08em}
.media-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:10}
.media-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .28s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.media-dot.active{background:rgba(255,255,255,.92);width:14px;border-radius:3px}
.media-fade{position:absolute;bottom:0;left:0;right:0;height:48px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none;z-index:5}

/* 스토리 카드 */
.story-card{position:relative;left:0;right:0;padding:1rem 1.6rem 0;display:flex;flex-direction:column;gap:.28rem;z-index:10;background:var(--bg);flex-shrink:0}
.card-chip{display:inline-block;background:rgba(196,168,130,.14);border:1px solid rgba(196,168,130,.3);color:var(--gold-deep);font-size:.67rem;letter-spacing:.14em;padding:.26rem .8rem;border-radius:20px;width:fit-content;margin-bottom:.15rem;opacity:0;transform:translateY(8px);transition:opacity .5s ease .3s,transform .5s ease .3s}
.card-date{font-family:'DM Serif Display',serif;font-style:italic;font-size:.8rem;color:var(--text-soft);opacity:0;transform:translateY(8px);transition:opacity .5s ease .46s,transform .5s ease .46s}
.card-tags{font-size:.72rem;color:var(--rosegold);letter-spacing:.04em;font-weight:300;opacity:0;transform:translateY(8px);transition:opacity .5s ease .54s,transform .5s ease .54s;margin-bottom:.1rem}
.card-title{font-family:'DM Serif Display',serif;font-size:1.75rem;color:var(--text-dark);line-height:1.2;white-space:pre-line;opacity:0;transform:translateY(10px);transition:opacity .6s ease .62s,transform .6s ease .62s}
.card-body{font-size:.84rem;color:var(--text-mid);line-height:1.9;font-weight:300;white-space:pre-line;margin-top:.2rem;opacity:0;transform:translateY(10px);transition:opacity .6s ease .8s,transform .6s ease .8s}
.story-card.revealed .card-chip,.story-card.revealed .card-date,.story-card.revealed .card-tags,.story-card.revealed .card-title,.story-card.revealed .card-body{opacity:1;transform:translateY(0)}

/* 네비 */
.nav-bar{position:sticky;bottom:0;padding:0.8rem 1.4rem calc(.9rem + var(--sab));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to top,var(--bg) 65%,transparent);opacity:0;transition:opacity .5s ease;z-index:15;flex-shrink:0;margin-top:auto}
.nav-bar.visible{opacity:1}
.nav-pill{background:var(--white);border:1px solid rgba(196,168,130,.4);color:var(--gold-deep);font-family:'Noto Serif KR',serif;font-size:.8rem;padding:.5rem 1.1rem;min-height:44px;border-radius:22px;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 10px rgba(160,120,80,.1);transition:background .2s,transform .15s}
.nav-pill:active{background:var(--bg2);transform:scale(.96)}
.nav-pill:disabled{opacity:.22;pointer-events:none}
.next-pill{background:linear-gradient(135deg,var(--rosegold),var(--rosegold-d));color:var(--white);border:none;box-shadow:0 4px 16px rgba(160,120,128,.28)}
.next-pill:active{opacity:.9}
.dot-row{display:flex;gap:6px;align-items:center}
.chapter-dot{width:5px;height:5px;border-radius:50%;background:rgba(196,168,130,.3);transition:all .3s}
.chapter-dot.active{background:var(--rosegold);transform:scale(1.5)}

/* ── 갤러리 ── */
.gallery-screen{display:flex;flex-direction:column;background:#000;z-index:60}
.gallery-header{padding:calc(var(--sat) + 1.1rem) 1.4rem .7rem;flex-shrink:0;background:#000;opacity:0;transform:translateY(10px);transition:opacity .55s ease .15s,transform .55s ease .15s}
.gallery-screen.revealed .gallery-header{opacity:1;transform:translateY(0)}
.gallery-eyebrow{font-family:'DM Serif Display',serif;font-style:italic;font-size:.72rem;color:rgba(255,255,255,.38);letter-spacing:.16em;margin-bottom:.18rem}
.gallery-title{font-family:'DM Serif Display',serif;font-size:1.45rem;color:rgba(255,255,255,.85);line-height:1.2}
.gallery-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#000;align-content:start;opacity:0;transition:opacity .5s ease .3s;scrollbar-width:none}
.gallery-grid::-webkit-scrollbar{display:none}
.gallery-screen.revealed .gallery-grid{opacity:1}
.gallery-cell{aspect-ratio:1/1;background:#111;overflow:hidden;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.gallery-cell:active{opacity:.72}
.gallery-cell img,.gallery-cell video{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.gallery-cell-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.gallery-cell::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#111 25%,#1a1a1a 50%,#111 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;z-index:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.gallery-footer{flex-shrink:0;padding:.8rem 1.4rem calc(.8rem + var(--sab));background:#000;display:flex;align-items:center;justify-content:space-between;opacity:0;transition:opacity .5s ease .5s;border-top:.5px solid rgba(255,255,255,.07)}
.gallery-screen.revealed .gallery-footer{opacity:1}
.gallery-count{font-family:'DM Serif Display',serif;font-style:italic;font-size:.72rem;color:rgba(255,255,255,.28);letter-spacing:.1em}
.gallery-next-btn{display:flex;align-items:center;gap:.42rem;background:rgba(200,160,168,.14);border:1px solid rgba(200,160,168,.3);color:rgba(200,160,168,.85);font-family:'Noto Serif KR',serif;font-size:.8rem;padding:.58rem 1.25rem;border-radius:50px;min-height:42px;cursor:pointer;letter-spacing:.05em;transition:background .2s,transform .15s}
.gallery-next-btn:active{background:rgba(200,160,168,.25);transform:scale(.96)}

/* ── 라이트박스 ── */
.lightbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;background:rgba(0,0,0,0);transition:opacity .25s,background .25s}
.lightbox.open{opacity:1;pointer-events:all;background:rgba(0,0,0,.93)}
.lightbox-media{max-width:96vw;max-height:84vh;object-fit:contain;border-radius:3px;transform:scale(.9);opacity:0;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .28s}
.lightbox.open .lightbox-media{transform:scale(1);opacity:1}
.lightbox-close{position:absolute;top:calc(var(--sat) + 12px);right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:none;color:rgba(255,255,255,.85);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s ease .12s}
.lightbox.open .lightbox-close{opacity:1}
.lightbox-close:active{background:rgba(255,255,255,.2)}

/* ── 편지 ── */
.letter-screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:flex-start;justify-content:center;background:#fdf8f2;padding:calc(var(--sat) + 32px) 2.6rem calc(var(--sab) + 32px);overflow:hidden;z-index:70}
.letter-bg{position:absolute;inset:0;background:repeating-linear-gradient(transparent,transparent 40px,rgba(196,168,130,.1) 40px,rgba(196,168,130,.1) 41px);pointer-events:none}
.letter-inner{position:relative;z-index:1;width:100%}
.letter-paper{display:block;width:100%}
.letter-text{display:inline;font-family:'Noto Serif KR',serif;font-weight:300;font-size:1.22rem;line-height:2.3;color:#3a2a1a;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
.letter-cursor{display:inline;font-size:1.22rem;line-height:2.3;color:var(--rosegold);font-weight:300;animation:blink .9s step-end infinite;opacity:1;transition:opacity .8s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── 프로포즈 ── */
.propose-screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#fdf8f2 0%,#f5e6d5 45%,#eedbd4 100%);z-index:200;padding:var(--sat) 2rem var(--sab);overflow:hidden}
.propose-bg-circles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bg-circle{position:absolute;border-radius:50%;animation:circle-drift 7s ease-in-out infinite}
.c1{width:280px;height:280px;top:-70px;right:-70px;background:rgba(196,168,130,.1);animation-delay:0s}
.c2{width:200px;height:200px;bottom:30px;left:-60px;background:rgba(200,160,168,.1);animation-delay:1.8s}
.c3{width:130px;height:130px;bottom:130px;right:20px;background:rgba(196,168,130,.08);animation-delay:3.5s}
@keyframes circle-drift{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.07) translateY(-14px)}}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-30px;animation:petal-fall linear infinite}
@keyframes petal-fall{0%{transform:translateY(0) rotate(0deg);opacity:.65}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.propose-inner{text-align:center;width:100%;position:relative;z-index:1;animation:rise 1s var(--ease) forwards}
.ring-wrap{margin:0 auto 1.8rem;width:100px;height:100px;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ring-outer{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#f0e0c8,#e0c0b8);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(160,120,80,.22),0 0 0 6px rgba(196,168,130,.16),0 0 0 12px rgba(200,160,168,.07)}
.ring-inner{font-size:2.6rem}
.propose-title{font-family:'DM Serif Display',serif;font-size:2.6rem;line-height:1.15;color:var(--text-dark);margin-bottom:1.2rem}
.propose-body{font-size:.9rem;color:var(--text-mid);line-height:2.05;font-weight:300;margin-bottom:2.2rem}
.propose-btns{display:flex;flex-direction:column;align-items:center;gap:.8rem}
.yes-btn{width:100%;max-width:280px;background:linear-gradient(135deg,var(--rosegold),var(--rosegold-d));border:none;color:var(--white);font-family:'Noto Serif KR',serif;font-size:1.05rem;padding:1rem 0;border-radius:50px;min-height:54px;box-shadow:0 8px 24px rgba(160,120,128,.35);cursor:pointer;letter-spacing:.05em;transition:transform .15s}
.yes-btn:active{transform:scale(.97)}
.no-btn{background:var(--white);border:1px solid rgba(196,168,130,.35);color:var(--text-soft);font-family:'Noto Serif KR',serif;font-size:.85rem;padding:.7rem 1.8rem;border-radius:50px;min-height:46px;cursor:pointer;letter-spacing:.04em;position:fixed;transition:all .12s}

/* ── 축하 ── */
.celeb-screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#fdf8f2,#f5e8d5);z-index:300;padding:var(--sat) 2rem var(--sab)}
.celeb-inner{text-align:center;animation:rise 1s ease forwards}
.celeb-emoji{font-size:4rem;margin-bottom:1.2rem;animation:float 2.2s ease-in-out infinite}
.celeb-title{font-family:'DM Serif Display',serif;font-size:3rem;color:var(--text-dark);margin-bottom:.7rem}
.celeb-body{font-size:.95rem;color:var(--text-mid);line-height:2}
.celeb-hearts{display:flex;gap:.5rem;justify-content:center;margin-top:1.4rem;font-size:1.4rem}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;top:-20px;border-radius:3px;animation:confetti linear forwards}
@keyframes confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- 잠금 -->
<div id="lockScreen" class="screen lock-screen">
  <div class="lock-inner">
    <div class="lock-icon">🔒</div>
    <div class="lock-ornament"><span class="orn-line"></span><span class="orn-diamond">◆</span><span class="orn-line"></span></div>
    <h1 class="lock-title">잠깐,<br/>당신이 맞나요?</h1>
    <p class="lock-desc">이 페이지는 오직 한 사람만을 위한 공간이에요.<br/>우리만 알고 있는 날짜를 입력해주세요.</p>
    <div class="lock-field-wrap">
      <label class="lock-label">우리가 사귀기 시작한 날은?</label>
      <div class="lock-input-wrap"><input class="lock-input" id="lockInput" type="tel" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD" autocomplete="off"/></div>
      <p class="lock-hint">숫자 8자리로 입력해주세요</p>
    </div>
    <button class="lock-btn" id="lockBtn">확인하기</button>
    <p class="lock-error" id="lockError">날짜가 맞지 않아요. 다시 생각해봐요 🤍</p>
  </div>
</div>

<!-- 인트로 -->
<div id="intro" class="screen intro-screen" style="display:none">
  <div class="intro-inner">
    <div class="intro-ornament"><span class="orn-line"></span><span class="orn-diamond">◆</span><span class="orn-line"></span></div>
    <p class="intro-eyebrow">2021~</p>
    <h1 class="intro-title">민소커플이<br/>함께한<br/><em>시간들</em></h1>
    <div class="intro-ornament" style="margin-top:.8rem;margin-bottom:2.4rem"><span class="orn-line"></span><span class="orn-diamond">◆</span><span class="orn-line"></span></div>
    <button class="start-btn" id="startBtn"><span>민소커플의 발자취 따라가기</span><span class="btn-arrow">↓</span></button>
  </div>
</div>

<!-- 스토리 -->
<div id="storyApp" class="screen story-screen" style="display:none">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="media-section" id="mediaSection">
    <div class="slider-viewport"><div class="slider-track" id="sliderTrack"></div></div>
    <div class="media-dots" id="mediaDots"></div>
    <div class="media-fade"></div>
  </div>
  <div class="story-card" id="storyCard">
    <div class="card-chip" id="cardChip"></div>
    <p class="card-date" id="cardDate"></p>
    <p class="card-tags" id="cardTags"></p>
    <h2 class="card-title" id="cardTitle"></h2>
    <p class="card-body" id="cardBody"></p>
  </div>
  <div class="nav-bar" id="navBar">
    <button class="nav-pill" id="prevBtn" onclick="prevScene()">← 이전</button>
    <div class="dot-row" id="chapterDots"></div>
    <button class="nav-pill next-pill" id="nextBtn" onclick="nextScene()">다음 →</button>
  </div>
</div>

<!-- 갤러리 -->
<div id="galleryScreen" class="screen gallery-screen" style="display:none">
  <div class="gallery-header">
    <p class="gallery-eyebrow">그 밖에도</p>
    <h2 class="gallery-title">함께했던 순간들</h2>
  </div>
  <div class="gallery-grid" id="galleryGrid"></div>
  <div class="gallery-footer">
    <span class="gallery-count" id="galleryCount"></span>
    <button class="gallery-next-btn" onclick="showLetter()">계속 보기 <span>→</span></button>
  </div>
</div>

<!-- 라이트박스 -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" class="lightbox-media" src="" alt="" style="display:none"/>
  <video id="lightboxVid" class="lightbox-media" style="display:none" muted autoplay loop playsinline></video>
</div>

<!-- 편지 -->
<div id="letterScreen" class="letter-screen">
  <div class="letter-bg"></div>
  <div class="letter-inner"><div class="letter-paper"><p class="letter-text" id="letterText"><span class="letter-cursor" id="letterCursor">|</span></p></div></div>
</div>

<!-- 프로포즈 -->
<div id="proposeScreen" class="propose-screen">
  <div class="propose-bg-circles"><div class="bg-circle c1"></div><div class="bg-circle c2"></div><div class="bg-circle c3"></div></div>
  <div class="petals" id="petals"></div>
  <div class="propose-inner">
    <div class="ring-wrap"><div class="ring-outer"><span class="ring-inner">💍</span></div></div>
    <h2 class="propose-title">결혼해줄래?</h2>
    <p class="propose-body">오래 걸렸지만,<br/>너라는 확신이 생겼어.<br/><br/>앞으로도 네 옆에 있고 싶어.</p>
    <div class="propose-btns">
      <button class="yes-btn" onclick="onYes()">응, 할게 💕</button>
      <button class="no-btn" id="noBtn" ontouchstart="escapeBtn()">조금만 더 생각해볼게</button>
    </div>
  </div>
</div>

<!-- 축하 -->
<div id="celebScreen" class="celeb-screen">
  <div class="confetti-wrap" id="confettiWrap"></div>
  <div class="celeb-inner">
    <div class="celeb-emoji">🎊</div>
    <h2 class="celeb-title">고마워 💕</h2>
    <p class="celeb-body">우리의 다음 챕터가<br/>이제 시작이야.</p>
    <div class="celeb-hearts" id="celebHearts"></div>
  </div>
</div>

<script>
var ANSWER='20221030';
var SCENES=[
  {chip:'Chapter 1 · 입사',date:'2021년',tags:'#KB국민은행  #37기  #동기',title:'단순히 취업의 기쁨만이\n아니었을 줄이야',body:'평생 함께할 사람을 직장에서 만날 줄은 몰랐어.',
   medias:[{src:'images/IMG_7502.png',mediaType:'photo'},{src:'images/IMG_1596.jpeg',mediaType:'photo'},{src:'videos/vllo.mov',mediaType:'video'},{src:'videos/vllo.mov',mediaType:'video'}]},
  {chip:'Chapter 2 · 발견',date:'2022년',tags:'#탑건  #방탈출  #연애',title:'같은 부서의 너한테\n눈길이 갔어',body:'조용하고 착한 너에게 자꾸 눈길이 갔고,\n너와 함께 시간을 보내고 싶다는\n욕심이 생겼어.',
   medias:[{src:'images/IMG_6151.jpeg',mediaType:'photo'},{src:'images/IMG_6751.jpeg',mediaType:'photo'},{src:'images/IMG_8152.jpeg',mediaType:'photo'},{src:'images/IMG_8343.jpeg',mediaType:'photo'},{src:'images/IMG_9246.jpeg',mediaType:'photo'},{src:'images/IMG_9650.jpeg',mediaType:'photo'},{src:'images/IMG_9673.jpeg',mediaType:'photo'},{src:'images/IMG_9680.jpeg',mediaType:'photo'},{src:'videos/IMG_9125.mov',mediaType:'video'}]},
  {chip:'Chapter 3 · 함께',date:'2023년 — 2024년',tags:'#신길역  #넷플릭스  #여행',title:'가장 가까이에서\n함께한 시간들',body:'같이 넷플릭스 보고, 여행도 많이 다녔던 나날들.\n그 일상이 참 좋았어.',
   medias:[{src:'',mediaType:'photo'},{src:'',mediaType:'photo'},{src:'',mediaType:'photo'}]},
  {chip:'Chapter 4 · 결심',date:'2025년 — 2026년',tags:'#결혼준비  #용산  #D-Day',title:'자연스럽게 결혼까지\n결심하게 되었어',body:'오랜 시간 동안 연애를 하며\n너에 대한 믿음이 커져갔어.',
   medias:[{src:'',mediaType:'photo'},{src:'',mediaType:'photo'}]}
];
var GALLERY_MEDIA=Array(18).fill(null).map(function(){return{src:'',mediaType:'photo'};});
var SAMPLE_COLORS=['#e8d5c0','#d4c4b0','#c8b8a8','#ddd0c0','#e0cfc0','#ccc0b0','#d8cabb','#e4d4c4','#d0c0b0','#dccdbf','#c4b8ac','#d8cec4','#e0d4c8','#ccbfb4','#d4c8bc','#e8ddd2','#c8bdb2','#dcd2c8'];
var LETTER_TEXT="앞으로도 너와 함께\n수많은 추억을 만들어 가겠지?\n\n기쁜 순간엔 행복을 같이 나누고,\n힘든 순간엔 서로 힘이 되어주고\n\n세상 누구보다 멋진 가정을\n너와 함께 이루고 싶어.\n\n평범한 하루도,\n특별한 순간도,\n\n모든 시간을\n너와 함께하고 싶어.";

var sceneIdx=0,mediaIdx=0,navVisible=false,isAnimating=false,txX=0,txY=0,txT=null;

function showEl(id,d){document.getElementById(id).style.display=d||'flex';}
function hideEl(id){document.getElementById(id).style.display='none';}
function fadeOut(id,ms,cb){var e=document.getElementById(id);e.style.transition='opacity '+ms+'ms ease';e.style.opacity='0';setTimeout(function(){e.style.display='none';e.style.transition='';e.style.opacity='';if(cb)cb();},ms);}
function fadeIn(id,ms,d){var e=document.getElementById(id);e.style.opacity='0';e.style.display=d||'flex';e.style.transition='none';requestAnimationFrame(function(){requestAnimationFrame(function(){e.style.transition='opacity '+ms+'ms ease';e.style.opacity='1';setTimeout(function(){e.style.transition='';e.style.opacity='';},ms);});});}

document.addEventListener('DOMContentLoaded',function(){
  var li=document.getElementById('lockInput'),le=document.getElementById('lockError');
  document.getElementById('lockBtn').addEventListener('click',checkPwd);
  li.addEventListener('keydown',function(e){if(e.key==='Enter')checkPwd();});
  li.addEventListener('input',function(){le.classList.remove('show');li.classList.remove('shake');if(li.value.length===8)setTimeout(checkPwd,30);});
  document.getElementById('startBtn').addEventListener('click',function(){
    var intro=document.getElementById('intro');
    intro.style.transition='opacity .9s ease';intro.style.opacity='0';
    setTimeout(function(){intro.style.display='none';showEl('storyApp','flex');buildDots();showScene(0);},900);
  });
  var sa=document.getElementById('storyApp'),ms=document.getElementById('mediaSection');
  ms.addEventListener('touchstart',function(e){txX=e.touches[0].clientX;txY=e.touches[0].clientY;txT='media';},{passive:true});
  sa.addEventListener('touchstart',function(e){if(!e.target.closest('#mediaSection')){txX=e.touches[0].clientX;txY=e.touches[0].clientY;txT='card';}},{passive:true});
  sa.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-txX,dy=e.changedTouches[0].clientY-txY;if(Math.abs(dx)<Math.abs(dy)||Math.abs(dx)<42)return;if(txT==='media')goMedia(dx<0?1:-1);else if(txT==='card'){if(dx<0)nextScene();else prevScene();}},{passive:true});
  window.addEventListener('resize',function(){if(document.getElementById('storyApp').style.display!=='none')setTimeout(setMediaH,80);});
});

function checkPwd(){
  var li=document.getElementById('lockInput'),le=document.getElementById('lockError');
  if(li.value.trim()===ANSWER){li.blur();fadeOut('lockScreen',700,function(){fadeIn('intro',600,'flex');});}
  else{li.classList.remove('shake');void li.offsetWidth;li.classList.add('shake');le.classList.add('show');li.value='';li.focus();}
}

function buildDots(){var r=document.getElementById('chapterDots');r.innerHTML='';SCENES.forEach(function(_,i){var d=document.createElement('div');d.className='chapter-dot'+(i===0?' active':'');r.appendChild(d);});}
function updateDots(i){document.querySelectorAll('.chapter-dot').forEach(function(d,j){d.classList.toggle('active',j===i);});}

/* 미디어 높이: 전체 화면 - 카드 - 네비 - 진행바 */
function setMediaH(){
  var app=document.getElementById('storyApp');
  var card=document.getElementById('storyCard');
  var nb=document.getElementById('navBar');
  var sec=document.getElementById('mediaSection');
  var totalH=window.innerHeight;
  var cardH=card?card.offsetHeight:160;
  var navH=nb?nb.offsetHeight:80;
  var progressH=2;
  var h=totalH-cardH-navH-progressH;
  if(h<120)h=120;
  sec.style.height=h+'px';
  document.getElementById('sliderTrack').style.height=h+'px';
  document.querySelectorAll('.slide').forEach(function(s){s.style.height=h+'px';});
}

function showScene(i){
  if(isAnimating)return;isAnimating=true;sceneIdx=i;mediaIdx=0;
  var s=SCENES[i],card=document.getElementById('storyCard'),nb=document.getElementById('navBar');
  card.classList.remove('revealed');nb.classList.remove('visible');navVisible=false;
  document.getElementById('progressFill').style.width=((i+1)/SCENES.length*100)+'%';
  document.getElementById('cardChip').textContent=s.chip;
  document.getElementById('cardDate').textContent=s.date;
  document.getElementById('cardTags').textContent=s.tags||'';
  document.getElementById('cardTitle').textContent=s.title;
  document.getElementById('cardBody').textContent=s.body;
  updateDots(i);
  document.getElementById('prevBtn').disabled=(i===0);
  document.getElementById('nextBtn').textContent=i===SCENES.length-1?'마치며 →':'다음 →';
  buildSlider(s.medias);
  requestAnimationFrame(function(){
    setTimeout(function(){setMediaH();card.classList.add('revealed');},80);
    setTimeout(function(){setMediaH();nb.classList.add('visible');navVisible=true;isAnimating=false;},1300);
  });
}
function nextScene(){if(!navVisible||isAnimating)return;sceneIdx<SCENES.length-1?showScene(sceneIdx+1):showGallery();}
function prevScene(){if(!navVisible||isAnimating||sceneIdx===0)return;showScene(sceneIdx-1);}

function buildSlider(medias){
  var track=document.getElementById('sliderTrack'),dots=document.getElementById('mediaDots'),sec=document.getElementById('mediaSection');
  track.innerHTML='';dots.innerHTML='';
  medias.forEach(function(m,i){
    var slide=document.createElement('div');slide.className='slide';
    if(m.src){
      if(m.mediaType==='video'){var v=document.createElement('video');v.src=m.src;v.muted=true;v.playsInline=true;v.autoplay=true;v.loop=true;slide.appendChild(v);}
      else{var img=document.createElement('img');img.src=m.src;img.alt='';slide.appendChild(img);}
    } else {var ph=document.createElement('div');ph.className='slide-placeholder';ph.innerHTML='<span class="ph-icon">📷</span><span class="ph-text">사진/영상을 넣어주세요</span>';slide.appendChild(ph);}
    track.appendChild(slide);
    if(medias.length>1){var dot=document.createElement('div');dot.className='media-dot'+(i===0?' active':'');dots.appendChild(dot);}
  });
  setSlider(0,false);
  setTimeout(setMediaH,50);
}
function setSlider(idx,anim){var t=document.getElementById('sliderTrack');if(!anim)t.style.transition='none';t.style.transform='translateX('+(-idx*100)+'%)';if(!anim)requestAnimationFrame(function(){t.style.transition='';});document.querySelectorAll('.media-dot').forEach(function(d,j){d.classList.toggle('active',j===idx);});}
function goMedia(dir){var n=mediaIdx+dir;if(n<0||n>=SCENES[sceneIdx].medias.length)return;mediaIdx=n;setSlider(n,true);}

function showGallery(){
  fadeOut('storyApp',600,function(){
    buildGallery();
    var g=document.getElementById('galleryScreen');g.style.opacity='0';g.style.display='flex';
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      g.style.transition='opacity .6s ease';g.style.opacity='1';
      setTimeout(function(){g.style.transition='';g.style.opacity='';g.classList.add('revealed');},600);
    });});
  });
}
function buildGallery(){
  var grid=document.getElementById('galleryGrid');grid.innerHTML='';
  GALLERY_MEDIA.forEach(function(m,i){
    var cell=document.createElement('div');cell.className='gallery-cell';
    if(m.src){
      var el=m.mediaType==='video'?document.createElement('video'):document.createElement('img');
      el.src=m.src;if(m.mediaType==='video'){el.muted=true;el.playsInline=true;el.autoplay=true;el.loop=true;}
      cell.appendChild(el);cell.addEventListener('click',function(){openLightbox(m.src,m.mediaType);});
    } else {var ph=document.createElement('div');ph.className='gallery-cell-ph';ph.style.background=SAMPLE_COLORS[i%SAMPLE_COLORS.length];cell.appendChild(ph);}
    grid.appendChild(cell);
  });
  var ce=document.getElementById('galleryCount');if(ce)ce.textContent=GALLERY_MEDIA.length+'장';
}
function openLightbox(src,type){var lb=document.getElementById('lightbox'),img=document.getElementById('lightboxImg'),vid=document.getElementById('lightboxVid');img.style.display='none';vid.style.display='none';if(type==='video'){vid.src=src;vid.style.display='block';}else{img.src=src;img.style.display='block';}requestAnimationFrame(function(){lb.classList.add('open');});document.body.style.overflow='hidden';}
function closeLightbox(){var lb=document.getElementById('lightbox');lb.classList.remove('open');document.body.style.overflow='';setTimeout(function(){document.getElementById('lightboxVid').src='';document.getElementById('lightboxImg').src='';},300);}

function showLetter(){
  var g=document.getElementById('galleryScreen');g.classList.remove('revealed');
  fadeOut('galleryScreen',800,function(){fadeIn('letterScreen',900,'flex');setTimeout(startType,1400);});
}
function startType(){
  var el=document.getElementById('letterText'),cur=document.getElementById('letterCursor');
  var chars=LETTER_TEXT.split(''),perChar=11000/chars.length;
  el.innerHTML='';el.appendChild(cur);cur.style.opacity='1';
  var i=0;
  function next(){
    if(i>=chars.length){setTimeout(function(){cur.style.transition='opacity .8s';cur.style.opacity='0';setTimeout(toPropose,900);},1200);return;}
    var ch=chars[i],prev=i>0?chars[i-1]:'';
    if(ch==='\n')el.insertBefore(document.createElement('br'),cur);
    else el.insertBefore(document.createTextNode(ch),cur);
    i++;
    var p=perChar;
    if(ch==='\n'&&prev==='\n')p=620;
    else if(ch==='\n')p=perChar*2.2;
    else if(ch==='?'||ch==='.'||ch==='!')p=perChar*3.8;
    else if(ch===',')p=perChar*2;
    setTimeout(next,p);
  }
  setTimeout(next,500);
}
function toPropose(){
  fadeOut('letterScreen',1000,function(){
    var p=document.getElementById('proposeScreen');
    p.style.opacity='0';p.style.transform='scale(1.03)';p.style.display='flex';
    spawnPetals();placeNo();
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      p.style.transition='opacity 1.5s ease,transform 1.5s cubic-bezier(.22,1,.36,1)';
      p.style.opacity='1';p.style.transform='scale(1)';
      setTimeout(function(){p.style.transition='';p.style.transform='';},1600);
    });});
  });
}
function placeNo(){var b=document.getElementById('noBtn'),y=document.querySelector('.yes-btn');if(!y)return;var r=y.getBoundingClientRect();b.style.position='fixed';b.style.left=(window.innerWidth/2-95)+'px';b.style.top=(r.bottom+60)+'px';}
function escapeBtn(){var b=document.getElementById('noBtn'),y=document.querySelector('.yes-btn'),r=y?y.getBoundingClientRect():{left:0,right:0,top:0,bottom:0};var rx,ry,t=0;do{rx=20+Math.random()*(window.innerWidth-200);ry=20+Math.random()*(window.innerHeight-80);t++;}while(t<20&&rx<r.right+10&&rx+190>r.left-10&&ry<r.bottom+10&&ry+46>r.top-10);b.style.left=rx+'px';b.style.top=ry+'px';}
function spawnPetals(){var c=document.getElementById('petals');c.innerHTML='';var items=['🌸','🌺','🌷','✨','🍀','🤍'];for(var i=0;i<16;i++){var p=document.createElement('div');p.className='petal';p.textContent=items[Math.floor(Math.random()*items.length)];p.style.left=(Math.random()*100)+'vw';p.style.fontSize=(.7+Math.random()*.8)+'rem';p.style.animationDuration=(5+Math.random()*5)+'s';p.style.animationDelay=(Math.random()*5)+'s';c.appendChild(p);}}
function onYes(){
  fadeOut('proposeScreen',700,function(){
    var hh=document.getElementById('celebHearts');
    if(!hh.hasChildNodes())['💕','💗','💖','💝','💓'].forEach(function(h){var s=document.createElement('span');s.textContent=h;hh.appendChild(s);});
    fadeIn('celebScreen',1000,'flex');spawnConfetti();
  });
}
function spawnConfetti(){var w=document.getElementById('confettiWrap');var cols=['#e8d5b7','#c8a0a8','#a07880','#f5ede3','#d4b8a0','#c4a882','#fffdf9'];for(var i=0;i<100;i++){var c=document.createElement('div');c.className='confetti-piece';c.style.left=(Math.random()*100)+'vw';c.style.background=cols[Math.floor(Math.random()*cols.length)];c.style.width=(5+Math.random()*8)+'px';c.style.height=(5+Math.random()*8)+'px';c.style.animationDuration=(2+Math.random()*3)+'s';c.style.animationDelay=(Math.random()*2)+'s';w.appendChild(c);}}
</script>
</body>
</html>
