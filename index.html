/* the entrance: a gold frame carrying an arch of flowers over the aisle */
function wDrawGate(g, S) {
  const TW = WT * S;
  const b = baseOf(AISLE_MID, 44, S);
  const w = 8.6 * TW, h = 5.4 * TW;
  const x = b.x - w / 2, y = b.y - h;

  // dark wall the doorway sits in
  const wg = g.createLinearGradient(0, y, 0, b.y);
  wg.addColorStop(0, '#0a0810'); wg.addColorStop(0.6, '#141020'); wg.addColorStop(1, '#1d1729');
  g.fillStyle = wg; g.fillRect(x, y, w, h);

  // warm light spilling from the lobby beyond
  const open = w * 0.40, oy = y + h * 0.30, oh = h * 0.70;
  const og = g.createLinearGradient(0, oy, 0, oy + oh);
  og.addColorStop(0, '#3a2f1c'); og.addColorStop(0.5, '#5f4b2d'); og.addColorStop(1, '#241c14');
  g.fillStyle = og; g.fillRect(b.x - open / 2, oy, open, oh);
  const spill = g.createRadialGradient(b.x, oy + oh, 0, b.x, oy + oh, open * 1.2);
  spill.addColorStop(0, 'rgba(255,224,168,0.34)');
  spill.addColorStop(1, 'rgba(255,224,168,0)');
  g.fillStyle = spill;
  g.fillRect(b.x - open, oy + oh - open, open * 2, open * 1.4);

  // the gold frame: uprights, lintel and the arc between them
  const fx0 = b.x - open * 0.86, fx1 = b.x + open * 0.86;
  const fTop = oy - TW * 0.6;
  g.strokeStyle = '#c9a961'; g.lineWidth = Math.max(1.6, S * 2);
  g.strokeRect(fx0, fTop, fx1 - fx0, b.y - fTop);
  g.beginPath();
  g.moveTo(fx0, b.y - h * 0.30);
  g.quadraticCurveTo(b.x, fTop - TW * 1.5, fx1, b.y - h * 0.30);
  g.strokeStyle = '#e0c07a'; g.lineWidth = Math.max(1.6, S * 2.4); g.stroke();

  // Flowers climb both uprights and thin out over the crown — the arch is
  // only lightly dressed at the top, exactly as it is in the photo.
  for (let i = 0; i <= 26; i++) {
    const t = i / 26;
    const climb = Math.abs(t - 0.5) * 2;         // 1 at the legs, 0 at the apex
    if (climb < 0.34) continue;                  // leave the crown bare gold
    const px2 = fx0 + (fx1 - fx0) * t;
    const py2 = (1 - t) * t * 4 * (fTop - TW * 1.2 - (b.y - h * 0.30)) + (b.y - h * 0.30);
    const dens = 0.5 + climb * 0.9;
    wArrangement(g, px2, py2 + TW * 0.3, TW * 1.35 * dens, TW * 0.95 * dens, i * 37 + 5, true);
  }
  // a few sprigs alone across the crown
  for (let i = 10; i <= 16; i += 2) {
    const t = i / 26;
    const px2 = fx0 + (fx1 - fx0) * t;
    const py2 = (1 - t) * t * 4 * (fTop - TW * 1.2 - (b.y - h * 0.30)) + (b.y - h * 0.30);
    wArrangement(g, px2, py2 + TW * 0.25, TW * 0.75, TW * 0.5, i * 91 + 13, false);
  }
  for (const fx of [fx0, fx1]) {
    for (let yy = b.y; yy > b.y - h * 0.40; yy -= TW * 0.55)
      wArrangement(g, fx, yy, TW * 1.85, TW * 1.4, fx * 0.3 + yy * 0.11, true);
    wArrangement(g, fx, b.y + TW * 0.1, TW * 2.3, TW * 1.05, fx * 0.7, true);
  }

  // stanchions and the tape across the threshold
  for (const dx of [-0.30, 0.30]) {
    const sx = b.x + w * dx;
    wShadow(g, sx, b.y + TW * 0.5, TW * 0.22, 0.4);
    const pg = g.createLinearGradient(sx - S * 2, 0, sx + S * 2, 0);
    pg.addColorStop(0, '#8e8e94'); pg.addColorStop(0.4, '#e6e6ea'); pg.addColorStop(1, '#76767c');
    g.fillStyle = pg; g.fillRect(sx - S * 1.6, b.y + TW * 0.5 - TW * 1.5, S * 3.2, TW * 1.5);
    wEllipse(g, sx, b.y + TW * 0.5, TW * 0.2, TW * 0.07, '#5c5c62');
    pxDisc(g, sx, b.y + TW * 0.5 - TW * 1.55, S * 2.4, '#e6e6ea');
  }
  g.fillStyle = '#14131a';
  g.fillRect(b.x - w * 0.30, b.y + TW * 0.5 - TW * 1.42, w * 0.60, TW * 0.24);
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.font = `${Math.max(6, S * 5)}px sans-serif`; g.textAlign = 'center';
  g.fillText('THE LINK', b.x, b.y + TW * 0.5 - TW * 1.25);
  g.textAlign = 'left';
}

    hair:'#3d2416', hairDark:'#2a180d', skin:'#ffdcbc', updo:true, blush:true,
    sash:'#f4d9e2', hairStyle:3, blush:true,
    view: back ? 'back' : (dir === 'left' ? -1 : dir === 'right' ? 1 : 'front'),
    arms: back ? 'down' : 'clasp',
  });
  // veil cap and flower crown
  const headCY = by - H * 0.80, headR = H * 0.112;
  g.fillStyle = 'rgba(255,255,255,0.5)';
  g.beginPath();
  g.ellipse(bx, headCY - headR * (back ? 0.5 : 0.85), headR * 1.2, headR * 0.6, 0, 0, TAU);
  g.fill();
  for (let i = 0; i < 5; i++) {
    const a = back ? (0.35 + i * 0.62) : (-0.35 - i * 0.62);
    wBloom(g, bx + Math.cos(a) * headR * 1.02, headCY - Math.abs(Math.sin(a)) * headR * (back ? 0.5 : 1.02),
           headR * 0.28, ['#ffffff','#fdf7ef','#f8e2d2','#f7dade','#f2c6ae'][i]);
  }
  // bouquet, only when we can see her front
  if (!back) {
    const by2 = by - H * 0.40;
    wArrangement(g, bx, by2 + H * 0.06, H * 0.42, H * 0.28, 4242, true);
  }
  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   FRAME
══════════════════════════════════════════════════════════════ */
function wRender() {
  const cv = $('world-canvas'), g = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = cv.clientWidth, chh = cv.clientHeight;
  if (cv.width !== (cw * dpr | 0) || cv.height !== (chh * dpr | 0)) {
    cv.width = cw * dpr | 0; cv.height = chh * dpr | 0;
  }
  const S = W.scale = Math.max(1, Math.min(4, Math.round(Math.min(cw, chh) / 300)));
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';

  const TW = WT * S, TH = WT * PY * S;
  const mapW = W_COLS * TW, mapH = W_ROWS * TH;
  let camX = W.x * S - cw / 2, camY = W.y * PY * S - chh * 0.58;
  camX = mapW <= cw ? (mapW - cw) / 2 : Math.max(0, Math.min(mapW - cw, camX));
  camY = mapH <= chh ? (mapH - chh) / 2 : Math.max(-WALL_H * S, Math.min(mapH - chh, camY));

  g.fillStyle = '#0a0810';
  g.fillRect(0, 0, cw, chh);
  g.save();
  g.translate(-Math.round(camX), -Math.round(camY));

  const c0 = Math.max(0, Math.floor(camX / TW) - 1);
  const c1 = Math.min(W_COLS - 1, Math.ceil((camX + cw) / TW));
  const r0 = Math.max(0, Math.floor(camY / TH) - 1);
  const r1 = Math.min(W_ROWS - 1, Math.ceil((camY + chh) / TH) + 2);
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++) wDrawTile(g, wTileAt(c, r), c, r, S);

  if (r0 <= 3) wDrawBackWall(g, camX, camY, cw, S);

  // light pools on the floor beneath every fixture
  for (const ch2 of W_CHANDELIERS) {
    const gx = (ch2.col + 0.5) * TW, gy = (ch2.row + 0.5) * TH;
    const rad = (ch2.big ? 5 : 3.2) * TW;
    const glow = g.createRadialGradient(gx, gy, 0, gx, gy, rad);
    const flick = 0.86 + 0.14 * Math.sin(W.t / 700 + ch2.row);
    glow.addColorStop(0, `rgba(255,226,170,${(ch2.big ? 0.15 : 0.09) * flick})`);
    glow.addColorStop(0.5, `rgba(255,214,150,${0.06 * flick})`);
    glow.addColorStop(1, 'rgba(255,214,150,0)');
    g.save(); g.translate(gx, gy); g.scale(1, PY); g.translate(-gx, -gy);
    g.fillStyle = glow; g.beginPath(); g.arc(gx, gy, rad, 0, TAU); g.fill();
    g.restore();
  }

  const inView = (col, row, pad = 5) =>
    col > c0 - pad && col < c1 + pad && row > r0 - pad && row < r1 + pad;
  const draw = [];
  const push = (row, f) => draw.push({ y: row, f });

  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++)
      if (wTileAt(c, r) === 'F') push(r + 0.9, () => wDrawBorderTile(g, c, r, S));

  push(3.6, () => wDrawStageFlowers(g, S));
  push(6.0, () => wDrawPodium(g, S));
  push(6.05, () => wDrawMcStand(g, S));
  push(45.4, () => wDrawGate(g, S));
  for (const lt of W_LONG_TABLES)
    if (inView(lt.col, W.y / WT, 40)) push(lt.row0 + 0.5, () => wDrawLongTable(g, lt, S));
  for (const tb of W_TABLES) if (inView(tb.col, tb.row)) push(tb.row + 2, () => wDrawTable(g, tb, S));
  for (const pr of W_PARENTS) if (inView(pr.col, pr.row)) push(pr.row + 1, () => wDrawParent(g, pr, S));
  for (const cd of W_CANDELABRA) if (inView(cd.col, cd.row, 4)) push(cd.row + 0.95, () => wCandelabra(g, cd, S));
  for (const fl of W_ENTRY_FLOWERS) if (inView(fl.col, fl.row, 4)) push(fl.row + 1, () => wDrawEntryFlowers(g, fl, S));
  for (const pl of W_PLACES) push(pl.groom ? pl.row + 1.2 : pl.row + 1, () => wDrawPlace(g, pl, S));
  push(W.y / WT, () => wDrawGirl(g, Math.round(W.x * S), Math.round(W.y * PY * S), W.dir, W.step, S));

  draw.sort((a, b) => a.y - b.y).forEach(d => d.f());

  // chandeliers hang between us and the floor, so they go last
  for (const ch2 of W_CHANDELIERS) {
    const gx = (ch2.col + 0.5) * TW;
    const gy = (ch2.row + 0.5) * TH - (ch2.big ? 1.9 : 1.5) * WT * S;
    const tw2 = 0.88 + 0.12 * Math.sin(W.t / 640 + ch2.col * 1.7 + ch2.row);
    const R = (ch2.big ? 0.62 : 0.42) * TW;
    g.strokeStyle = 'rgba(210,190,150,0.30)'; g.lineWidth = Math.max(1, S * 0.8);
    g.beginPath(); g.moveTo(gx, gy - R * 1.2); g.lineTo(gx, gy - R * 4.5); g.stroke();
    for (const [ring, cnt, al, dy] of [[1, 10, 0.45, 0.9], [0.66, 7, 0.7, 0.5], [0.34, 5, 0.95, 0.2]]) {
      for (let k = 0; k < cnt; k++) {
        const ang = k / cnt * TAU + ring * 3 + ch2.row;
        const dx2 = gx + Math.cos(ang) * R * ring;
        const dy2 = gy + Math.sin(ang) * R * ring * 0.5 + R * dy;
        g.fillStyle = `rgba(255,250,232,${al * tw2})`;
        g.beginPath(); g.arc(dx2, dy2, R * 0.075, 0, TAU); g.fill();
        g.strokeStyle = `rgba(255,244,210,${0.25 * al * tw2})`; g.lineWidth = Math.max(1, S * 0.5);
        g.beginPath(); g.moveTo(dx2, dy2 - R * 0.3); g.lineTo(dx2, dy2); g.stroke();
      }
    }
    const halo = g.createRadialGradient(gx, gy, 0, gx, gy, R * 1.15);
    halo.addColorStop(0, `rgba(255,254,248,${0.95 * tw2})`);
    halo.addColorStop(0.28, `rgba(255,246,214,${0.6 * tw2})`);
    halo.addColorStop(1, 'rgba(255,228,170,0)');
    g.fillStyle = halo; g.beginPath(); g.arc(gx, gy, R * 1.15, 0, TAU); g.fill();
  }

  g.restore();

  const grade = g.createLinearGradient(0, 0, 0, chh);
  grade.addColorStop(0, 'rgba(255,214,150,0.07)');
  grade.addColorStop(0.5, 'rgba(255,226,180,0.03)');
  grade.addColorStop(1, 'rgba(80,70,140,0.09)');
  g.fillStyle = grade; g.fillRect(0, 0, cw, chh);

  const vig = g.createRadialGradient(cw / 2, chh * 0.46, Math.min(cw, chh) * 0.24,
                                     cw / 2, chh * 0.46, Math.max(cw, chh) * 0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.46)');
  g.fillStyle = vig;
  g.fillRect(0, 0, cw, chh);
}

function wCanMove(nx, ny) {
  const pts = [[nx - 9, ny - 5], [nx + 9, ny - 5], [nx - 9, ny], [nx + 9, ny]];
  return pts.every(([px2, py2]) => {
    const t = wTileAt(Math.floor(px2 / WT), Math.floor(py2 / WT));
    return t === 'r' || t === 'P' || t === 'd';   // runner, podium, and the dais
  });
}

function wNearPlace() {
  const c = Math.floor(W.x / WT), r = Math.floor(W.y / WT);
  // she can be anywhere across the runner, so match generously on the column
  return W_PLACES.find(pl => Math.abs(pl.doorCol - c) <= 2 && Math.abs(pl.doorRow - r) <= 1) || null;
}

function wStep(dt) {
  const sp = 92 / 1000 * dt;   // world px this frame
  let dx = W.vx, dy = W.vy;
  const mag = Math.hypot(dx, dy);
  if (mag > 1) { dx /= mag; dy /= mag; }
  W.moving = mag > 0.12 && !W.locked;
  if (W.locked) { dx = dy = 0; }

  if (W.moving) {
    if (Math.abs(dx) > Math.abs(dy)) W.dir = dx < 0 ? 'left' : 'right';
    else                             W.dir = dy < 0 ? 'up' : 'down';
    const nx = W.x + dx * sp, ny = W.y + dy * sp;
    if (wCanMove(nx, W.y)) W.x = nx;
    if (wCanMove(W.x, ny)) W.y = ny;
    W.walkT += dt;
    if (W.walkT > 150) { W.walkT = 0; W.step = W.step === 1 ? 2 : 1; }
  } else { W.step = 0; W.walkT = 0; }

  // door prompt
  const near = W.locked ? null : wNearPlace();
  if (near !== W.near) {
    W.near = near;
    const el = $('world-prompt');
    if (near) {
      const lock = wLocked(near);
      $('world-prompt-name').textContent = lock
        ? `${near.name} · 아직이야` : near.name;
      el.classList.toggle('show', !lock);
    } else el.classList.remove('show');
  }
}

function wLoop(ts) {
  if (!W.on) return;
  const dt = Math.min(48, ts - (W.last || ts));
  W.last = ts; W.t += dt;
  wStep(dt);
  wRender();
  W.raf = requestAnimationFrame(wLoop);
}

/* ── controls: on-screen stick + keyboard ── */
function wInitControls() {
  const stick = $('world-stick'), knob = $('world-stick-knob');
  let id = null, cx = 0, cy = 0;
  const R = 34;        // how far the knob may travel
  const LIVE = 11;     // ...but this much deflection is already full speed
  const set = (dx, dy) => {
    const m = Math.hypot(dx, dy) || 1;
    const cl = Math.min(m, R);
    knob.style.transform = `translate(${dx / m * cl}px, ${dy / m * cl}px)`;
    const out = Math.min(1, m / LIVE);          // saturates after a nudge
    W.vx = dx / m * out; W.vy = dy / m * out;
  };
  const reset = () => { knob.style.transform = ''; W.vx = W.vy = 0; id = null; };

  stick.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; id = t.identifier;
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    set(t.clientX - cx, t.clientY - cy);
  }, { passive: true });
  stick.addEventListener('touchmove', e => {
    for (const t of e.changedTouches)
      if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
  }, { passive: true });
  stick.addEventListener('touchend',    reset, { passive: true });
  stick.addEventListener('touchcancel', reset, { passive: true });

  // mouse drag, for desktop
  stick.addEventListener('mousedown', e => {
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    id = 'm'; set(e.clientX - cx, e.clientY - cy);
    const mv = ev => { if (id === 'm') set(ev.clientX - cx, ev.clientY - cy); };
    const up = () => { reset(); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });

  const keys = {};
  const apply = () => {
    W.vx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    W.vy = (keys.ArrowDown  || keys.s ? 1 : 0) - (keys.ArrowUp   || keys.w ? 1 : 0);
  };
  window.addEventListener('keydown', e => {
    if (!W.on) return;
    if (e.key === 'Enter' || e.key === ' ') { wTryEnter(); return; }
    keys[e.key] = true; apply();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; apply(); });

  $('world-prompt').addEventListener('click', wTryEnter);
}

function wTryEnter() {
  if (!W.on || W.locked || !W.near) return;
  const pl = W.near;
  if (wLocked(pl)) return;
  W.locked = true;
  W.vx = W.vy = 0;
  $('world-prompt').classList.remove('show');
  $('world-stick').classList.remove('show');
  $('world-hint').classList.remove('show');
  W.visited.add(pl.ep);
  enterChapter(pl.ep);
}

async function openWorld(firstTime) {
  await fadeTo('pg-world');
  W.on = true; W.locked = false; W.last = 0;
  if (!W.raf) W.raf = requestAnimationFrame(wLoop);
  CHAPTERS.forEach((_, i) => preloadChapterMedia(i));
  await sleep(260);
  $('world-stick').classList.add('show');
  if (firstTime) {
    $('world-hint').classList.add('show');
    setTimeout(() => $('world-hint').classList.remove('show'), 5200);
  }
}

/* Called when an episode's reel finishes — walk back out into the world */
async function returnToWorld() {
  stopAutoPlay();
  await closePhotoViewer(true);
  $('ch-detail').classList.remove('show');
  $('ch-hd').classList.remove('in');
  $('ch-scroll').classList.remove('show');
  $('ch-foot').classList.remove('show');
  await fadeTo('pg-world');
  // step the girl back out in front of the door she came from
  const pl = W.near;
  if (pl) {
    W.x = AISLE_MID * WT + WT / 2;
    W.y = (pl.doorRow + 1) * WT + WT / 2;
    W.dir = 'up';
  }
  W.on = true; W.locked = false; W.last = 0; W.near = null;
  if (!W.raf) W.raf = requestAnimationFrame(wLoop);
  $('world-stick').classList.add('show');
}

function closeWorld() {
  W.on = false;
  if (W.raf) { cancelAnimationFrame(W.raf); W.raf = 0; }
  $('world-stick').classList.remove('show');
  $('world-prompt').classList.remove('show');
  $('world-hint').classList.remove('show');
}

/* ════════════════════════════════════
   ORIENTATION — re-layout anything positioned in JS pixels
════════════════════════════════════ */
function relayoutForOrientation() {
  // Carousel cards are placed with JS transforms — restep them for the new width
  if ($('cc0')) positionCards(activeCard, false);

  // Confetti canvas is a fixed-size bitmap
  const canvas = $('confetti');
  if (canvas && canvas.style.display !== 'none') {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  // The dodging button lives in absolute pixels — pull it back on screen
  if ($('pg-proposal').classList.contains('active')) {
    const btn = $('btn-no');
    const { w, h } = noBtnSize();
    const left = parseFloat(btn.style.left) || 0;
    const top  = parseFloat(btn.style.top)  || 0;
    if (left + w > window.innerWidth - 8 || top + h > window.innerHeight - 8) placeNo();
  }
}

let _orientTimer = null;
function onViewportChange() {
  clearTimeout(_orientTimer);
  // wait for the browser to settle on the new viewport size before measuring
  _orientTimer = setTimeout(relayoutForOrientation, 220);
}
window.addEventListener('orientationchange', onViewportChange);
window.addEventListener('resize', onViewportChange);

/* ════════════════════════════════════
   BOOT
════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  initLock();
  initGridDismiss();
  wInitControls();
  $('btn-ch-next').addEventListener('click', onChapterNext);
  $('btn-yes').addEventListener('click', onYes);
  $('btn-no').addEventListener('click', dodgeNo);

  // ─── Photo Viewer Touch ───────────────────────────────────
  // ① 좌/우 탭 or 스와이프 → 이전/다음
  // ② 가운데 탭          → 프로그레스바 토글 (2.5s 후 자동 숨김)
  // ③ 길게 누름          → 멈춤 (바 표시 + 타이머 정지)
  // ④ 아래 스와이프      → 뷰어 닫기 (슬라이드 다운)
  let pvStartX = 0, pvStartY = 0, pvStartT = 0;
  let pvMoveX  = 0, pvMoveY  = 0;
  let pvLongTimer = null;

  const pvEl   = $('photo-viewer');
  const pvBody = $('pv-body');

  function pvShowBars() {
    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
    pvBarsVisible = true;
    const bars = $('pv-bars');
    bars.style.transition = 'opacity 0.35s ease';
    bars.style.opacity = '1';
  }
  function pvHideBars() {
    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
    pvBarsVisible = false;
    const bars = $('pv-bars');
    bars.style.transition = 'none';
    bars.style.opacity = '0';
  }
  function pvToggleBars() {
    if (pvBarsVisible) {
      pvHideBars();
    } else {
      pvShowBars();
      pvBarsHideTimer = setTimeout(pvHideBars, 2500);
    }
  }

  function pvGoNext() {
    const cIdx   = apChIdx >= 0 ? apChIdx : currentCh;
    const photos = CHAPTERS[cIdx].photos;
    if (apPIdx < photos.length - 1) {
      const next = apPIdx + 1;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = next; apRunning = true;
      openPhotoViewer(cIdx, next, true).then(dur => { if (apRunning) startHoldTimer(dur); });
    } else {
      stopAutoPlay();
      if (isManualMode) {
        // manual mode: last photo → close viewer, stay in grid
        closePhotoViewer(false);
      } else {
        closePhotoViewer(false).then(() => onChapterNext());
      }
    }
  }
  function pvGoPrev() {
    if (apPIdx > 0) {
      const prev = apPIdx - 1;
      const cIdx = apChIdx >= 0 ? apChIdx : currentCh;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = prev; apRunning = true;
      openPhotoViewer(cIdx, prev, true).then(dur => startHoldTimer(dur));
    } else { resumeHold(); }
  }

  function pvBodyReset(animate) {
    if (animate) {
      pvBody.style.transition = 'transform 0.42s cubic-bezier(0.16,1,0.3,1), opacity 0.32s ease';
      requestAnimationFrame(() => {
        pvBody.style.transform = '';
        pvBody.style.opacity   = '';
      });
      setTimeout(() => { pvBody.style.transition = ''; }, 500);
    } else {
      pvBody.style.transition = '';
      pvBody.style.transform  = '';
      pvBody.style.opacity    = '';
    }
  }

  pvEl.addEventListener('touchstart', (e) => {
    const t  = e.touches[0];
    pvStartX = t.clientX; pvStartY = t.clientY;
    pvStartT = Date.now();
    pvMoveX  = 0; pvMoveY = 0;
    // 300ms 유지 시에만 일시정지 (빠른 탭에서 버벅임 방지)
    pvLongTimer = setTimeout(() => { pauseHold(); pvShowBars(); }, 300);
  }, { passive: true });

  pvEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    pvMoveX = t.clientX - pvStartX;
    pvMoveY = t.clientY - pvStartY;
    // 아래 드래그: 바디가 손가락 따라 내려옴
    if (pvMoveY > 0 && pvMoveY > Math.abs(pvMoveX) * 0.7) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
      const damped = pvMoveY * 0.55;
      const sc     = Math.max(0.88, 1 - pvMoveY / 1800);
      const al     = Math.max(0.25, 1 - pvMoveY / 260);
      pvBody.style.transition = 'none';
      pvBody.style.transform  = `translateY(${damped}px) scale(${sc})`;
      pvBody.style.opacity    = al;
    } else if (Math.abs(pvMoveX) > 8) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    }
  }, { passive: true });

  pvEl.addEventListener('touchend', (e) => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    const t    = e.changedTouches[0];
    const dx   = t.clientX - pvStartX;
    const dy   = t.clientY - pvStartY;
    const adx  = Math.abs(dx);
    const ady  = Math.abs(dy);
    const held = Date.now() - pvStartT;

    // ④ 아래 스와이프 → 슬라이드 다운 닫기
    if (dy > 60 && ady > adx * 0.8) {
      pvHideBars();
      stopAutoPlay();
      pvBody.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.6,1), opacity 0.28s ease';
      pvBody.style.transform  = `translateY(${pvMoveY * 0.55 + window.innerHeight * 0.22}px) scale(0.84)`;
      pvBody.style.opacity    = '0';
      pvEl.classList.remove('show'); // CSS transition 으로 fade-out
      setTimeout(() => { pvBodyReset(false); }, 380);
      return;
    }

    // ③ 길게 누름 → 재개 + 바 잠시 유지 후 숨김
    if (held >= 450 && adx < 18 && ady < 18) {
      pvBodyReset(true);
      pvBarsHideTimer = setTimeout(pvHideBars, 1000);
      resumeHold();
      return;
    }

    // ① 가로 스와이프 → 이전/다음
    if (adx > 36 && adx > ady * 1.2) {
      pvBodyReset(true);
      dx < 0 ? pvGoNext() : pvGoPrev();
      return;
    }

    // 탭 (움직임 없음) → 존 기반
    if (adx <= 22 && ady <= 22) {
      pvBodyReset(false);   // 즉시 리셋 — rAF 없이 bars transition과 충돌 방지
      const zone = t.clientX / window.innerWidth;
      if      (zone < 0.33) { pvGoPrev(); return; }
      else if (zone > 0.67) { pvGoNext(); return; }
      else                  { pvToggleBars(); resumeHold(); return; }
    }

    pvBodyReset(true);
    resumeHold();
  });

  pvEl.addEventListener('touchcancel', () => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    pvBodyReset(true);
    pvHideBars();
    resumeHold();
  });
});
</script>
</body>
</html>
