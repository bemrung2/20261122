<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>민소커플</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   TOKENS & RESET
═══════════════════════════════════════ */
:root {
  --sat: env(safe-area-inset-top, 44px);
  --sab: env(safe-area-inset-bottom, 34px);
  --paper: #fffef8;
  --gold:  #c8a96e;
  --gold-l:#e8d5a8;
  --gold-d:#9a7a48;
  --ink:   #2a1f14;
  --ink2:  #6b5744;
  --ink3:  #a89078;
  --dark:  #100e08;
  --tiffany:  #81D8D0;
  --tiffany-d:#4AADA5;
  --tiffany-l:#B2EDE9;
}
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--dark);
  font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}

/* ═══════════════════════════════════════
   PAGE SYSTEM
═══════════════════════════════════════ */
.pg {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; z-index: 1;
}
.pg.active { opacity: 1; pointer-events: all; z-index: 10; }

#curtain {
  position: fixed; inset: 0; background: var(--dark);
  z-index: 900; opacity: 0; pointer-events: none;
  transition: opacity 0.72s ease;
}
#curtain.on { opacity: 1; pointer-events: all; }

/* ═══════════════════════════════════════
   BOKEH
═══════════════════════════════════════ */
.bokeh-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bk {
  position: absolute; border-radius: 50%;
  filter: blur(28px); opacity: 0;
  animation: bkRise linear infinite;
}
@keyframes bkRise {
  0%   { transform: translateY(110vh); opacity: 0; }
  10%  { opacity: 0.5; }
  90%  { opacity: 0.28; }
  100% { transform: translateY(-15vh); opacity: 0; }
}

/* ═══════════════════════════════════════
   LOCK SCREEN — cosmic space
═══════════════════════════════════════ */
#pg-lock { background: #06040e; padding: var(--sat) 5vw var(--sab); overflow: hidden; }

#pg-lock::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 90% 70% at 50% 42%, rgba(55,18,140,0.45) 0%, transparent 65%),
    radial-gradient(ellipse 55% 40% at 14% 22%, rgba(30,10,100,0.28) 0%, transparent 55%),
    radial-gradient(ellipse 44% 34% at 86% 78%, rgba(90,20,130,0.22) 0%, transparent 50%),
    radial-gradient(ellipse 30% 22% at 80% 15%, rgba(40,80,200,0.14) 0%, transparent 50%),
    radial-gradient(2px   2px   at 13%  9%, rgba(255,255,255,0.90) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 28%  5%, rgba(255,255,255,0.70) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 51%  7%, rgba(255,248,220,0.95) 0%, transparent 100%),
    radial-gradient(1px   1px   at 74%  5%, rgba(255,255,255,0.60) 0%, transparent 100%),
    radial-gradient(1.8px 1.8px at 90% 16%, rgba(220,200,255,0.80) 0%, transparent 100%),
    radial-gradient(1px   1px   at  4% 36%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px   1px   at 96% 50%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 66% 72%, rgba(220,200,255,0.75) 0%, transparent 100%),
    radial-gradient(1px   1px   at 40% 85%, rgba(255,255,255,0.58) 0%, transparent 100%),
    radial-gradient(1px   1px   at 20% 78%, rgba(255,255,255,0.50) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at  2% 62%, rgba(255,255,255,0.60) 0%, transparent 100%),
    radial-gradient(1px   1px   at 86% 29%, rgba(255,248,220,0.48) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 58% 92%, rgba(200,188,255,0.60) 0%, transparent 100%),
    radial-gradient(1px   1px   at 35% 48%, rgba(255,255,255,0.32) 0%, transparent 100%),
    radial-gradient(1px   1px   at 76% 58%, rgba(200,188,255,0.38) 0%, transparent 100%);
  animation: ftNebulaBreath 11s ease-in-out infinite alternate;
}

.lock-card {
  position: relative; z-index: 1;
  background: transparent;
  padding: 28px 20px; width: min(370px, 92vw);
  flex: 1;
  display: flex; flex-direction: column; justify-content: flex-start;
  animation: cardUp 0.85s cubic-bezier(0.16,1,0.3,1) both;
  touch-action: manipulation;
}
.lock-top {
  display: flex; flex-direction: column; align-items: center; gap: 24px;
}
.lock-bottom {
  margin-top: auto;
  display: flex; flex-direction: column; align-items: stretch; gap: 10px;
}
@keyframes cardUp {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Nebula orb */
.lock-mono {
  display: flex; align-items: center; justify-content: center;
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, rgba(190,148,255,0.95) 0%, rgba(95,35,215,0.90) 48%, rgba(18,6,75,0.95) 100%);
  margin: 0 auto;
  font-size: 18px; font-weight: 500; color: rgba(255,245,255,0.95); letter-spacing: -0.5px;
  border: 1px solid rgba(205,170,255,0.30);
  box-shadow: 0 0 22px rgba(170,105,255,0.70), 0 0 55px rgba(120,50,240,0.36), 0 8px 30px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.24);
  touch-action: manipulation;
  animation: monoOrb 5s ease-in-out infinite alternate;
}
@keyframes monoOrb {
  from { box-shadow: 0 0 22px rgba(170,105,255,0.70), 0 0 55px rgba(120,50,240,0.36), 0 8px 30px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.24); }
  to   { box-shadow: 0 0 38px rgba(200,140,255,0.90), 0 0 88px rgba(155,70,255,0.48), 0 8px 30px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.32); }
}

.lock-q { text-align: center; }
.lock-q .lq-hint {
  display: block; font-size: 12px; font-weight: 300;
  color: rgba(185,168,255,0.52); letter-spacing: 0.3px; margin-bottom: 8px;
}
.lock-q .lq-main {
  font-size: 16px; font-weight: 400; color: rgba(255,248,235,0.92); line-height: 1.5;
  text-shadow: 0 0 22px rgba(180,140,255,0.28), 0 1px 3px rgba(0,0,0,0.55);
}

/* PIN dots — star constellation */
.pin-dots { display: flex; justify-content: center; gap: 10px; position: relative; align-items: center; }
#pin-lines {
  position: absolute; inset: -14px -56px; width: calc(100% + 112px); height: calc(100% + 28px);
  overflow: visible; pointer-events: none; z-index: 0;
}
.pd {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid rgba(155,128,255,0.40); background: transparent;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.14s ease;
  position: relative; z-index: 1;
}
.pd.on {
  border-color: rgba(215,188,255,0.92);
  background: rgba(130,88,255,0.10);
  box-shadow: 0 0 10px rgba(195,158,255,0.88), 0 0 26px rgba(155,105,255,0.48);
  animation: pdStarBurst 0.38s cubic-bezier(0.16,1,0.3,1) both;
}
.pd.on::after {
  content: '✦';
  font-size: 8px; line-height: 1;
  color: rgba(235,218,255,0.96);
  text-shadow: 0 0 8px rgba(220,200,255,1), 0 0 18px rgba(180,140,255,0.80);
  position: absolute;
}
@keyframes pdStarBurst {
  0%   { transform: scale(0.30); box-shadow: 0 0 0 rgba(195,158,255,0); }
  65%  { transform: scale(1.32); }
  100% { transform: scale(1); }
}
.pd.err {
  border-color: rgba(255,92,92,0.92);
  background: rgba(200,40,40,0.14);
  box-shadow: 0 0 10px rgba(255,85,85,0.72);
  animation: pdShake 0.32s ease;
}
.pd.err::after { content: ''; }
@keyframes pdShake {
  20% { transform: translateX(-4px); } 40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
}

/* Keypad — dark glass */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.key {
  height: 54px; border-radius: 13px;
  background: rgba(255,255,255,0.07); color: rgba(255,248,235,0.90);
  border: 1px solid rgba(255,255,255,0.09);
  font-size: 22px; font-weight: 400; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.11s, transform 0.1s;
  touch-action: manipulation;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.key:active { background: rgba(145,100,255,0.28); transform: scale(0.91); }
.key-del    { background: rgba(255,255,255,0.05); color: rgba(255,208,198,0.85); border-color: rgba(255,148,128,0.14); }
.key-del:active { background: rgba(200,75,55,0.24); }
.key-ok     { background: rgba(92,45,215,0.55); color: rgba(255,248,240,0.96); border-color: rgba(165,122,255,0.32); font-size: 14.5px; font-weight: 500; }
.key-ok:active { background: rgba(115,62,235,0.72); }
.key-blank  { background: transparent !important; border: none !important; pointer-events: none; }
.lock-err {
  text-align: center; font-size: 12px; color: rgba(255,118,118,0.92);
  height: 16px;
  opacity: 0; transition: opacity 0.2s;
  text-shadow: 0 0 12px rgba(255,80,80,0.50);
}
.lock-err.show { opacity: 1; }
.mode-toggle {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  max-height: 0; overflow: hidden;
  opacity: 0; transition: opacity 0.3s ease, max-height 0.3s ease;
}
.mode-toggle.show { max-height: 36px; opacity: 1; }
.mode-label { font-size: 11.5px; color: rgba(185,168,255,0.52); letter-spacing: 0.2px; }
.mode-switch {
  width: 40px; height: 22px; border-radius: 11px;
  background: rgba(255,255,255,0.12); position: relative; cursor: pointer;
  transition: background 0.22s; border: 1px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
}
.mode-switch::after {
  content: ''; position: absolute;
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(212,195,255,0.92); top: 2px; left: 2px;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 1px 4px rgba(0,0,0,0.30);
}
.mode-switch.on { background: rgba(102,52,220,0.72); border-color: rgba(162,122,255,0.32); }
.mode-switch.on::after { transform: translateX(18px); }

/* ═══════════════════════════════════════
   FUTURE PAGE
═══════════════════════════════════════ */
/* ═══════════════════════════════════════
   FUTURE PAGE — cinematic starfield
═══════════════════════════════════════ */
#pg-future {
  background: #06040e;
  overflow: hidden;
}
/* Deep-space ambient glow — breathes slowly */
#pg-future::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 44%, rgba(60,25,120,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 30% 20%, rgba(40,20,90,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 35% 25% at 75% 75%, rgba(80,30,100,0.12) 0%, transparent 55%);
  animation: ftNebulaBreath 9s ease-in-out infinite alternate;
}
@keyframes ftNebulaBreath {
  from { opacity: 0.65; transform: scale(1);    }
  to   { opacity: 1.00; transform: scale(1.06); }
}

/* Whole word-field drifts gently — like a slow camera pan */
#ft-bg {
  position: absolute; inset: -30px; z-index: 1; pointer-events: none;
  animation: ftCamPan 32s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes ftCamPan {
  0%   { transform: translate(0,   0)   scale(1.00); }
  33%  { transform: translate(-14px,-8px) scale(1.02); }
  66%  { transform: translate(10px, 6px)  scale(1.01); }
  100% { transform: translate(-6px, 14px) scale(1.03); }
}

/* Twinkling stars */
.ft-star {
  position: absolute; border-radius: 50%; background: #ffffff;
  animation: ftStarTwinkle var(--dur,3s) var(--del,0s) ease-in-out infinite alternate;
}
@keyframes ftStarTwinkle {
  from { opacity: var(--op1,0.3); transform: scale(1); }
  to   { opacity: var(--op2,0.05); transform: scale(0.6); }
}

/* Shared word base */
.ft-word {
  position: absolute; white-space: nowrap; line-height: 1;
  opacity: 0; will-change: transform, opacity;
  color: rgba(255,250,244,1);
}

/* Secondary words — gentle rise then float */
.ft-mid {
  color: rgba(225,215,255,1);
  animation:
    ftWordIn  1.3s var(--ad,0s) ease forwards,
    ftDrift   var(--fdur,11s) calc(var(--ad,0s) + 1.3s) ease-in-out infinite alternate;
}
.ft-bgw {
  color: rgba(185,175,220,1);
  animation:
    ftWordIn  1.1s var(--ad,0s) ease forwards,
    ftDrift   var(--fdur,9s)  calc(var(--ad,0s) + 1.1s) ease-in-out infinite alternate;
}
@keyframes ftWordIn {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: var(--op,0.12); transform: translateY(0); }
}
@keyframes ftDrift {
  from { transform: translate(0,0); }
  to   { transform: translate(var(--dx,10px),var(--dy,-7px)); }
}

/* Main keywords — cinematic star-birth */
.ft-main {
  color: rgba(255,252,248,1);
  font-weight: 600; letter-spacing: -0.01em;
  animation:
    ftStarBorn 1.6s var(--ad,0s) cubic-bezier(0.16,1,0.3,1) forwards,
    ftDrift    var(--fdur,18s)  calc(var(--ad,0s) + 1.6s) ease-in-out infinite alternate,
    ftGlow     var(--gdur,4.5s) calc(var(--ad,0s) + 2.2s) ease-in-out infinite;
}
@keyframes ftStarBorn {
  0%   {
    opacity: 0; transform: scale(0.22) translateY(10px);
    filter: blur(10px);
    text-shadow: none;
  }
  22%  {
    opacity: 1; transform: scale(1.28) translateY(-2px);
    filter: blur(0);
    text-shadow:
      0 0 50px rgba(255,240,200,1.0),
      0 0 110px rgba(255,210,140,0.75),
      0 0 200px rgba(255,180, 90,0.35);
  }
  55%  {
    opacity: var(--op); transform: scale(0.97) translateY(0);
    text-shadow:
      0 0 28px rgba(255,225,170,0.65),
      0 0  8px rgba(255,255,255,0.4);
  }
  100% {
    opacity: var(--op); transform: scale(1) translateY(0);
    text-shadow:
      0 0 22px rgba(255,218,160,0.40),
      0 0  6px rgba(255,255,255,0.25);
  }
}
@keyframes ftGlow {
  0%,100% {
    text-shadow:
      0 0 20px rgba(255,218,160,0.38),
      0 0  5px rgba(255,255,255,0.22);
  }
  50% {
    text-shadow:
      0 0 48px rgba(255,228,168,0.68),
      0 0 96px rgba(255,196,114,0.22),
      0 0  8px rgba(255,255,255,0.35);
  }
}

/* Closing — no box, text glows naturally out of starfield */
#ft-end {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0;
}
#ft-end-msg {
  font-size: clamp(1.1rem, 4.6vw, 1.38rem);
  font-weight: 400;
  color: rgba(255,250,238,0.96);
  line-height: 2.35;
  text-align: center;
  letter-spacing: 0.03em;
  text-shadow:
    0 0 40px rgba(255,215,148,0.80),
    0 0 80px rgba(255,190,100,0.40),
    0 0 160px rgba(255,165,70,0.18),
    0  1px  2px rgba(0,0,0,0.55);
}
}

/* ═══════════════════════════════════════
   LETTER — fixed paper, text scrolls inside
═══════════════════════════════════════ */
.pg-letter {
  background: #e8dece;
  padding: var(--sat) 22px var(--sab);
  transition: opacity 1.4s ease; /* slow reveal as curtain lifts */
}

.letter-sheet {
  position: relative;
  width: 100%; max-width: 344px;
  height: calc(100dvh - var(--sat) - var(--sab) - 72px);
  background: #fefcf5;
  border-radius: 2px; overflow: hidden;
  box-shadow:
    inset 0 0 24px rgba(0,0,0,0.03),
    0 2px 6px rgba(0,0,0,0.06),
    0 16px 48px rgba(0,0,0,0.18),
    4px 4px 0 rgba(200,180,140,0.25);
}

/* ruled lines */
.letter-sheet::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: repeating-linear-gradient(
    transparent, transparent 35px,
    rgba(140,110,80,0.14) 35px, rgba(140,110,80,0.14) 36px
  );
  background-position: 0 100px;
}

/* red margin line */
.letter-left-margin {
  position: absolute; top: 0; bottom: 0; left: 56px;
  width: 1px; background: rgba(200,70,70,0.22);
  z-index: 1; pointer-events: none;
}

/* date in top right */
.letter-date-el {
  position: absolute; top: 20px; right: 22px;
  font-size: 11.5px; color: #9a8070; font-weight: 300;
  z-index: 3; letter-spacing: 0.5px; font-style: italic;
}

/* scrollable text area */
.letter-inner {
  position: absolute;
  top: 64px; left: 64px; right: 22px; bottom: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 26px 0 60px;
  z-index: 2;
}
.letter-inner::-webkit-scrollbar { display: none; }
#l2-inner { top: 42px; }

.letter-body {
  font-size: 15.5px; line-height: 2.38; color: #362818;
  white-space: pre-wrap; word-break: keep-all; font-weight: 300;
  letter-spacing: 0.015em;
}
.letter-cursor {
  display: inline-block; width: 1.5px; height: 18px;
  background: #5a3e28; vertical-align: middle; margin-left: 1px;
  animation: cursorBlink 1s step-end infinite;
}
@keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ═══════════════════════════════════════
   LETTER 2 — cosmic space redesign
═══════════════════════════════════════ */
#pg-letter1, #pg-letter2 {
  background: #06040e;
}
#pg-letter1::before, #pg-letter2::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 48%, rgba(60,25,120,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 38% 28% at 22% 20%, rgba(40,20,90,0.14) 0%, transparent 55%),
    radial-gradient(ellipse 32% 24% at 80% 76%, rgba(80,30,100,0.12) 0%, transparent 50%),
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.80) 0%, transparent 100%),
    radial-gradient(1px   1px   at 28% 6%,  rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 47% 12%, rgba(255,248,220,0.70) 0%, transparent 100%),
    radial-gradient(1px   1px   at 65% 9%,  rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 83% 22%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px   1px   at 6%  42%, rgba(255,255,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at 92% 38%, rgba(200,180,255,0.55) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 18% 68%, rgba(255,255,255,0.60) 0%, transparent 100%),
    radial-gradient(1px   1px   at 38% 82%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 74% 74%, rgba(255,248,220,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 90% 85%, rgba(255,255,255,0.40) 0%, transparent 100%),
    radial-gradient(1px   1px   at 52% 95%, rgba(200,180,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at 33% 58%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 70% 48%, rgba(220,210,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at 8%  88%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 58% 32%, rgba(255,248,220,0.40) 0%, transparent 100%);
  animation: ftNebulaBreath 9s ease-in-out infinite alternate;
}
/* Letter 1 — full-bleed: text floats directly on starfield */
#pg-letter1 .letter-sheet {
  position: absolute; inset: 0; z-index: 1;
  max-width: none; width: 100%; height: 100%;
  background: transparent;
  border: none; border-radius: 0;
  box-shadow: none;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  animation: none;
}
#pg-letter1 .letter-sheet::before { display: none; }
#pg-letter1 .letter-left-margin { display: none; }
#pg-letter1 #l1-inner {
  left: 40px; right: 40px;
  top: calc(var(--sat) + 52px);
  padding-bottom: calc(var(--sab) + 60px);
}
#pg-letter1 .letter-date-el {
  top: calc(var(--sat) + 26px);
  right: 40px;
}

/* Letter 2 — glass card */
#pg-letter2 .letter-sheet {
  background: rgba(8,5,20,0.75);
  border-radius: 16px;
  border: 1px solid rgba(160,130,230,0.18);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 24px 72px rgba(0,0,0,0.70),
    0 0 80px rgba(90,45,180,0.14),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 -1px 0 rgba(100,60,200,0.08);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  animation: l2SheetGlow 7s ease-in-out infinite alternate;
}
@keyframes l2SheetGlow {
  from {
    border-color: rgba(140,110,220,0.14);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04), 0 24px 72px rgba(0,0,0,0.70),
      0 0 60px rgba(70,35,150,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  to {
    border-color: rgba(180,150,255,0.28);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06), 0 24px 72px rgba(0,0,0,0.70),
      0 0 110px rgba(110,55,220,0.22), inset 0 1px 0 rgba(255,255,255,0.10);
  }
}
#pg-letter2 .letter-sheet::before {
  background-image: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 35%);
}
#pg-letter2 .letter-left-margin { display: none; }
#pg-letter2 #l2-inner { left: 26px; top: 42px; }
#pg-letter1 .letter-date-el, #pg-letter2 .letter-date-el {
  color: rgba(200,170,100,0.68);
  text-shadow: 0 0 14px rgba(255,210,120,0.45);
}
#pg-letter1 .letter-body, #pg-letter2 .letter-body {
  color: rgba(255,248,232,0.87);
}
#pg-letter1 .letter-cursor, #pg-letter2 .letter-cursor {
  background: rgba(220,188,110,0.92);
  box-shadow: 0 0 6px rgba(255,210,120,0.80), 0 0 14px rgba(255,195,90,0.45);
}

/* ═══════════════════════════════════════
   LETTER 2 — cosmic line-by-line reveal
═══════════════════════════════════════ */
#l2-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 0 clamp(24px, 8vw, 52px);
  text-align: center;
}
.l2-line {
  opacity: 0;
  color: rgba(255,248,232,0.88);
  font-size: clamp(1.05rem, 4.3vw, 1.28rem);
  font-weight: 300;
  line-height: 2.1;
  letter-spacing: 0.04em;
  text-shadow:
    0 0 28px rgba(190,160,255,0.18),
    0  1px  2px rgba(0,0,0,0.55);
  transform: translateY(16px);
  transition:
    opacity 1.8s cubic-bezier(0.25,0.46,0.45,0.94),
    transform 1.8s cubic-bezier(0.25,0.46,0.45,0.94);
  will-change: opacity, transform;
}
.l2-blank { line-height: 0; height: 0.65em; }
.l2-vis  { opacity: 1; transform: translateY(0); }
.l2-last {
  color: rgba(255,244,215,0.96);
  text-shadow:
    0 0 44px rgba(255,210,130,0.42),
    0 0 16px rgba(255,230,170,0.20),
    0  1px  2px rgba(0,0,0,0.55);
}

/* ═══════════════════════════════════════
   CHAPTER OVERVIEW — horizontal carousel
═══════════════════════════════════════ */
#pg-chapters {
  background: #05030d; overflow: hidden;
  align-items: stretch; justify-content: stretch;
}

/* Starfield bg for the chapters page */
#pg-chapters::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(1px 1px at  8% 12%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 22% 28%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 38%  6%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 18%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(2px 2px at 70%  8%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 22%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 45%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 78% 65%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 62% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 92%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 28% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 12% 72%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at  4% 55%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(2px 2px at 33% 40%, rgba(255,255,255,0.65) 0%, transparent 100%);
}

/* overview wrapper */
#ov-wrap {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: var(--sat) 0 var(--sab); gap: 20px;
  z-index: 1;
}

.ov-header { text-align: center; }
.ov-header-label {
  font-size: 10.5px; letter-spacing: 3.5px; color: rgba(255,255,255,0.55);
  font-weight: 300; text-transform: uppercase; display: block; margin-bottom: 6px;
}
.ov-header-tap {
  font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.35);
  font-weight: 300;
  animation: tapHint 2.2s ease-in-out infinite;
}
@keyframes tapHint { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* carousel stage */
.carousel-stage {
  position: relative;
  width: 100%; height: 378px;
  /* overflow:visible so side cards peek; clipped by #pg-chapters */
}

/* each card */
.cc {
  position: absolute;
  width: 274px; height: 372px;
  border-radius: 24px; overflow: hidden;
  left: 50%; top: 0;
  margin-left: -137px;
  cursor: pointer;
  will-change: transform, opacity;
  box-shadow:
    0 28px 72px rgba(0,0,0,0.7),
    0 0 0 1px rgba(120,160,255,0.10),
    0 0 40px rgba(60,100,220,0.08);
  /* transition set by JS */
}

.cc-bg   { position: absolute; inset: 0; }
.cc-shim { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 18%, rgba(0,0,0,0.62) 68%, rgba(0,0,0,0.80)); }

/* Nebula glow — color injected per-card via inline style */
.cc-nebula { position: absolute; inset: 0; }

/* Star field overlay */
.cc-tex {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1.2px 1.2px at 12%  8%, rgba(255,255,255,0.80) 0%, transparent 100%),
    radial-gradient(1px   1px   at 85% 12%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1.6px 1.6px at 48% 22%, rgba(255,255,255,0.90) 0%, transparent 100%),
    radial-gradient(1px   1px   at 72% 35%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 22% 48%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 92% 55%, rgba(255,255,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at  8% 65%, rgba(255,255,255,0.60) 0%, transparent 100%),
    radial-gradient(2px   2px   at 60% 18%, rgba(255,255,255,0.95) 0%, transparent 100%),
    radial-gradient(1px   1px   at 35% 75%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 78% 82%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 18% 88%, rgba(255,255,255,0.70) 0%, transparent 100%),
    radial-gradient(1px   1px   at 55% 92%, rgba(255,255,255,0.40) 0%, transparent 100%),
    radial-gradient(1.8px 1.8px at 40%  5%, rgba(255,255,255,0.95) 0%, transparent 100%),
    radial-gradient(1px   1px   at 95% 75%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1px   1px   at  3% 30%, rgba(255,255,255,0.50) 0%, transparent 100%),
    radial-gradient(1.4px 1.4px at 68% 65%, rgba(255,255,255,0.70) 0%, transparent 100%),
    radial-gradient(1px   1px   at 30% 42%, rgba(255,255,255,0.40) 0%, transparent 100%),
    radial-gradient(1px   1px   at 88% 28%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 52% 55%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px   1px   at 15% 95%, rgba(255,255,255,0.45) 0%, transparent 100%);
}

.cc-deco {
  position: absolute; top: 16px; right: 18px;
  font-size: 54px; line-height: 1;
  color: rgba(255,255,255,0.07); font-weight: 500;
  pointer-events: none;
}
.cc-line {
  position: absolute; bottom: 82px; left: 22px;
  width: 28px; height: 1px;
  background: rgba(160,200,255,0.55);
}
.cc-content {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 0 22px 26px;
}
.cc-num  { font-size: 9.5px; letter-spacing: 3px; color: rgba(170,205,255,0.78); font-weight: 300; margin-bottom: 6px; }
.cc-name { font-size: 26px; color: rgba(255,255,255,0.96); font-weight: 500; letter-spacing: -0.4px; margin-bottom: 4px; }
.cc-date { font-size: 12px; color: rgba(255,255,255,0.38); font-weight: 300; }

/* indicator dots */
.carousel-dots { display: flex; gap: 6px; }
.cdot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.cdot.active { width: 20px; border-radius: 3px; background: rgba(160,200,255,0.85); }

/* ═══════════════════════════════════════
   CHAPTER TITLE VEIL
═══════════════════════════════════════ */
#ch-veil {
  position: absolute; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  background: rgba(4,2,16,0.92);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
}
#ch-veil.show { opacity: 1; pointer-events: all; }

.ch-vtitle {
  text-align: center;
  transform: scale(0.25); opacity: 0;
  transition: transform 0.8s cubic-bezier(0.16,1,0.3,1), opacity 0.6s ease;
}
.ch-vtitle.in  { transform: scale(1);    opacity: 1; }
.ch-vtitle.up  { transform: scale(0.5) translateY(-52px); opacity: 0; transition-duration: 0.55s; }

.ch-vt-num  { font-size: 10px; letter-spacing: 4px; color: rgba(170,205,255,0.78); font-weight: 300; margin-bottom: 12px; }
.ch-vt-name { font-size: 34px; color: white; font-weight: 500; letter-spacing: -0.4px; }

/* ═══════════════════════════════════════
   CHAPTER DETAIL — cosmic
═══════════════════════════════════════ */
.ch-detail {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  background: #06040e;
  opacity: 0; pointer-events: none;
  transition: opacity 0.38s ease;
}
.ch-detail.show { opacity: 1; pointer-events: all; }

.ch-hd {
  flex-shrink: 0;
  padding: calc(var(--sat) + 14px) 24px 16px;
  background: rgba(6,3,18,0.96);
  border-bottom: 1px solid rgba(160,140,255,0.12);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transform: translateY(-100%);
  transition: transform 0.65s cubic-bezier(0.16,1,0.3,1);
}
.ch-hd.in { transform: translateY(0); }
.ch-hd-num  { font-size: 9.5px; letter-spacing: 3px; color: rgba(172,158,255,0.72); font-weight: 300; margin-bottom: 4px; }
.ch-hd-name { font-size: 20px; color: rgba(255,248,235,0.96); font-weight: 500; }
.ch-hd-sub  { font-size: 12px; color: rgba(190,175,255,0.45); font-weight: 300; margin-top: 3px; }

.ch-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
  align-content: start;
  background: #06040e;
  opacity: 0; transition: opacity 0.45s ease 0.25s;
}
.ch-scroll::-webkit-scrollbar { display: none; }
.ch-scroll.show { opacity: 1; }

/* ── Instagram grid photo cells ── */
.photo-cell {
  aspect-ratio: 1; position: relative; overflow: hidden;
  cursor: pointer; background: #0c0820;
}
.photo-cell img, .photo-cell video {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}
.photo-cell .cell-grad {
  position: absolute; inset: 0;
}
.photo-cell .cell-ph-icon {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.photo-cell .cell-vid-badge {
  position: absolute; top: 7px; right: 7px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
@keyframes cellTap {
  0%   { transform: scale(1);    opacity: 1; }
  35%  { transform: scale(0.86); opacity: 0.72; }
  100% { transform: scale(1);    opacity: 1; }
}
.photo-cell.tapping { animation: cellTap 0.38s cubic-bezier(0.16,1,0.3,1) forwards; }

/* ── Photo viewer overlay ── */
#photo-viewer {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.55s ease;
}
#photo-viewer.show { opacity: 1; pointer-events: all; }

.pv-backdrop {
  position: absolute; inset: 0;
  background: rgba(12,10,6,0.93);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.pv-body {
  position: relative; z-index: 1;
  width: 100%; padding: 0 20px;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}

/* progress bars (Stories-style) — 기본 숨김, 가운데 탭 시 표시 */
.pv-bars {
  display: flex; gap: 3px; width: 100%; padding: 0 0 14px;
  opacity: 0;
  pointer-events: none;
}
.pv-bar {
  flex: 1; height: 2px; border-radius: 1px;
  background: rgba(255,255,255,0.22); overflow: hidden;
}
.pv-bar-fill {
  height: 100%; width: 0%;
  background: rgba(255,255,255,0.88);
  border-radius: 1px;
}
.pv-bar-fill.done   { width: 100%; }
@keyframes barFill  { to { width: 100%; } }
.pv-bar-fill.active { animation: barFill var(--pv-dur, 5s) linear forwards; }

/* photo / video frame */
#pv-img {
  width: 100%; aspect-ratio: 3/4; /* JS overrides per-image */
  max-height: 68dvh;
  border-radius: 18px; overflow: hidden;
  position: relative;
  background: #0f0e0c;
  transform: scale(0.72) translateY(20px);
  opacity: 0;
  transition: transform 0.7s cubic-bezier(0.16,1,0.3,1), opacity 0.55s ease,
              aspect-ratio 0s; /* instant ratio switch (happens while opacity=0) */
}
#photo-viewer.show #pv-img {
  transform: scale(1) translateY(0);
  opacity: 1;
}

/* caption */
#pv-cap {
  margin-top: 20px;
  font-size: 14.5px; line-height: 2.0;
  color: rgba(255,255,255,0.82);
  text-align: center; white-space: pre-line;
  font-weight: 300; padding: 0 12px;
  letter-spacing: 0.015em;
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.45s ease 0.22s, transform 0.45s ease 0.22s;
}
#photo-viewer.show #pv-cap { opacity: 1; transform: translateY(0); }

.ch-foot {
  flex-shrink: 0;
  padding: 13px 20px; padding-bottom: calc(var(--sab) + 13px);
  background: rgba(6,3,18,0.96);
  border-top: 1px solid rgba(160,140,255,0.12);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  opacity: 0; transition: opacity 0.45s ease 0.45s;
}
.ch-foot.show { opacity: 1; }

.btn-next {
  width: 100%; height: 52px; border-radius: 16px; border: none;
  background: linear-gradient(135deg, rgba(105,52,230,0.88) 0%, rgba(68,28,188,0.88) 100%);
  color: rgba(255,248,240,0.96);
  font-family: inherit; font-size: 15px; font-weight: 400;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 24px rgba(90,40,220,0.40), 0 0 0 1px rgba(160,120,255,0.20);
  transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
}
.btn-next:active { opacity: 0.80; transform: scale(0.97); box-shadow: 0 2px 12px rgba(90,40,220,0.30); }

/* ═══════════════════════════════════════
   PROPOSAL
═══════════════════════════════════════ */
#pg-proposal { background: #06040e; overflow: hidden; }
/* Deep space glow + star field */
#pg-proposal::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(50,20,110,0.32) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 18% 18%, rgba(30,10,90,0.20) 0%, transparent 55%),
    radial-gradient(ellipse 35% 28% at 82% 78%, rgba(90,20,130,0.16) 0%, transparent 50%),
    radial-gradient(1.5px 1.5px at 10% 10%, rgba(255,255,255,0.72) 0%, transparent 100%),
    radial-gradient(1px   1px   at 28%  5%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 52% 10%, rgba(255,248,220,0.78) 0%, transparent 100%),
    radial-gradient(1px   1px   at 78%  4%, rgba(255,255,255,0.52) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 92% 20%, rgba(200,188,255,0.60) 0%, transparent 100%),
    radial-gradient(1px   1px   at  5% 48%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 96% 62%, rgba(255,255,255,0.48) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 65% 80%, rgba(200,188,255,0.52) 0%, transparent 100%),
    radial-gradient(1px   1px   at 38% 88%, rgba(255,255,255,0.48) 0%, transparent 100%),
    radial-gradient(1px   1px   at 16% 86%, rgba(255,255,255,0.42) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 82% 40%, rgba(255,255,255,0.45) 0%, transparent 100%);
  animation: ftNebulaBreath 10s ease-in-out infinite alternate;
}
.proposal-inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: calc(var(--sat) + 32px) 36px calc(var(--sab) + 32px); width: 100%;
}
.ring-wrap { width: 88px; height: 88px; margin-bottom: 34px; animation: ringFloat 3.5s ease-in-out infinite; }
@keyframes ringFloat { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-13px) rotate(2deg)} }
@keyframes ringAccept {
  0%   { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 0px rgba(129,216,208,0)); }
  25%  { transform: scale(1.18) rotate(6deg); filter: drop-shadow(0 0 14px rgba(129,216,208,0.9)); }
  50%  { transform: scale(0.92) rotate(-4deg); filter: drop-shadow(0 0 22px rgba(178,237,233,1)); }
  75%  { transform: scale(1.38) rotate(8deg); filter: drop-shadow(0 0 32px rgba(129,216,208,0.85)); }
  100% { transform: scale(1.45) rotate(5deg); filter: drop-shadow(0 0 48px rgba(129,216,208,0.6)); }
}
.ring-wrap.accept { animation: ringAccept 0.72s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes ringRipple {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.7; }
  100% { transform: translate(-50%,-50%) scale(22); opacity: 0; }
}
.ring-ripple {
  position: fixed; width: 10px; height: 10px;
  border: 1.5px solid var(--tiffany); border-radius: 50%;
  pointer-events: none; z-index: 999;
  animation: ringRipple 0.85s ease-out forwards;
}
.proposal-q   { font-size: 36px; color: var(--tiffany); font-weight: 300; line-height: 1.3; margin-bottom: 16px; letter-spacing: 0.5px; text-shadow: 0 0 32px rgba(129,216,208,0.45); }
.proposal-sub { font-size: 14px; color: rgba(255,255,255,0.4); line-height: 1.9; font-weight: 300; margin-bottom: 50px; }
.btn-yes {
  width: 260px; height: 56px; border-radius: 18px; border: none;
  background: linear-gradient(135deg, var(--tiffany), var(--tiffany-d));
  color: white; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer;
  box-shadow: 0 10px 36px rgba(129,216,208,0.38);
  transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.3px;
}
.btn-yes:active { transform: scale(0.96); box-shadow: 0 5px 18px rgba(129,216,208,0.22); }
.btn-no {
  position: fixed; width: 210px; height: 46px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.1); background: transparent;
  color: rgba(255,255,255,0.28); font-family: inherit; font-size: 14px; cursor: pointer;
  touch-action: manipulation; z-index: 50;
  transition: left 0.28s cubic-bezier(0.34,1.56,0.64,1), top 0.28s cubic-bezier(0.34,1.56,0.64,1);
}

/* ═══════════════════════════════════════
   ACCEPT
═══════════════════════════════════════ */
#pg-accept { background: #06040e; overflow: hidden; }
#pg-accept::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;

const isVideoSrc = src => /\.(mp4|mov|webm|m4v)$/i.test(src);

/* ── Media preload pool ──
   Photos: preloaded as Image() → browser HTTP cache
   Videos: kept as <video preload="auto"> in a hidden DOM div so the
   download buffer survives between viewer opens / closes.           */
const _vidPool  = new Map(); // src → <video>
const _imgDone  = new Set(); // srcs already issued as Image()

function _mpc() {           // returns (or creates) the hidden preload container
  let d = document.getElementById('_mpc');
  if (!d) {
    d = document.createElement('div');
    d.id = '_mpc';
    d.style.cssText = 'position:fixed;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none;z-index:-1;';
    document.body.appendChild(d);
  }
  return d;
}

function preloadChapterMedia(chIdx) {
  const ch = CHAPTERS[chIdx];
  if (!ch) return;
  ch.photos.forEach(p => {
    if (!p.src) return;
    if (isVideoSrc(p.src)) {
      if (!_vidPool.has(p.src)) {
        const v = document.createElement('video');
        v.src = p.src; v.preload = 'auto'; v.muted = true; v.playsInline = true;
        v.load();
        _mpc().appendChild(v);
        _vidPool.set(p.src, v);
      }
    } else {
      if (!_imgDone.has(p.src)) {
        _imgDone.add(p.src);
        const img = new Image(); img.src = p.src; // prime browser cache
      }
    }
  });
}

function _returnVidToPool(vid) {
  if (!vid) return;
  vid.pause();
  vid.muted = true;
  vid.currentTime = 0;
  vid.style.cssText = '';
  _mpc().appendChild(vid); // moves element, buffer stays alive
}

}

function initLock() {

  const row = $('pin-dots');
  // slight Y stagger so constellation lines form a non-linear star pattern
  const STAGGER = [0, -5, 3, -7, 5, -3, 6, -2];
  for (let i = 0; i < PIN_LEN; i++) {
    const d = document.createElement('div');
    d.className = 'pd'; d.id = `pd${i}`;
    if (STAGGER[i]) d.style.transform = `translateY(${STAGGER[i]}px)`;
    row.appendChild(d);
  }
  // SVG overlay for constellation lines
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'pin-lines'; svg.setAttribute('fill', 'none');
  row.appendChild(svg);
  document.querySelector('.keypad').addEventListener('click', e => {
    const key = e.target.closest('.key'); if (!key) return;
    const k = key.dataset.k;
    if (k === 'del') {
      if (pin.length) { pin = pin.slice(0,-1); syncDots(); }
    } else if (k === 'ok') {
      checkPin();
    } else if (pin.length < PIN_LEN) {
      pin += k; syncDots();
      if (pin.length === PIN_LEN) setTimeout(checkPin, 250);
    }
  });

  let monoHoldTimer = null;

    monoHoldTimer = setTimeout(() => {
      monoHoldTimer = null;
      $('mode-toggle').classList.toggle('show');
    }, 2000);
  }, { passive: true });
  mono.addEventListener('touchend',   () => { if (monoHoldTimer) { clearTimeout(monoHoldTimer); monoHoldTimer = null; } }, { passive: true });
  mono.addEventListener('touchcancel',() => { if (monoHoldTimer) { clearTimeout(monoHoldTimer); monoHoldTimer = null; } }, { passive: true });

    isManualMode = !isManualMode;
    $('mode-switch').classList.toggle('on', isManualMode);
    $('mode-label').textContent = isManualMode ? '수동 모드' : '자동 모드';
  });
}

function syncDots(err = false) {
  for (let i = 0; i < PIN_LEN; i++) {
    const d = $(`pd${i}`);
    d.classList.toggle('on', i < pin.length);
    d.classList.toggle('err', err);
  }
  requestAnimationFrame(drawConstellationLines);
}

function drawConstellationLines() {
  const svg = document.getElementById('pin-lines');
  if (!svg) return;
  svg.innerHTML = '';
  const n = pin.length;
  if (n < 2) return;
  const svgR = svg.getBoundingClientRect();
  for (let i = 1; i < n; i++) {
    const r0 = $(`pd${i-1}`).getBoundingClientRect();
    const r1 = $(`pd${i}`).getBoundingClientRect();
    const x1 = r0.left + r0.width  / 2 - svgR.left;
    const y1 = r0.top  + r0.height / 2 - svgR.top;
    const x2 = r1.left + r1.width  / 2 - svgR.left;
    const y2 = r1.top  + r1.height / 2 - svgR.top;
    // glow blur line
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    glow.setAttribute('x1', x1); glow.setAttribute('y1', y1);
    glow.setAttribute('x2', x2); glow.setAttribute('y2', y2);
    glow.setAttribute('stroke', 'rgba(190,155,255,0.30)');
    glow.setAttribute('stroke-width', '3');
    glow.setAttribute('stroke-linecap', 'round');
    svg.appendChild(glow);
    // crisp dashed line
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', 'rgba(215,192,255,0.65)');
    line.setAttribute('stroke-width', '0.9');
    line.setAttribute('stroke-dasharray', '3 4');
    line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
  }
}

async function checkPin() {
  if (pin === ANSWER) {
    await fadeTo('pg-letter1');
    startLetter('l1-body', 'l1-inner', 'l1-date', LETTER1, 90, goToChapters);
  } else {
    syncDots(true);
    $('lock-err').classList.add('show');

    pin = ''; syncDots(false);
    $('lock-err').classList.remove('show');
  }
}

/* ════════════════════════════════════
   TYPEWRITER — text scrolls inside fixed paper
════════════════════════════════════ */
function startLetter(bodyId, innerId, dateId, text, speed, onDone, pinTop) {
  $(dateId).textContent = '26.07.04 (금)';
  const el  = $(bodyId);
  const box = $(innerId);
  el.innerHTML = '';
  box.scrollTop = 0;
  const cur = document.createElement('span');
  cur.className = 'letter-cursor'; el.appendChild(cur);

  let i = 0;
  function tick() {
    if (i >= text.length) {
      setTimeout(() => {
        cur.style.display = 'none';
        if (onDone) setTimeout(onDone, 2500);
      }, 1000);
      return;
    }
    const ch = text[i];
    if (ch === '\n') el.insertBefore(document.createElement('br'), cur);
    else el.insertBefore(document.createTextNode(ch), cur);
    i++;
    if (!pinTop) box.scrollTop = box.scrollHeight; // follow cursor down
    let delay = speed;
    if (ch === '\n') delay = speed * 6;
    else if ('.,!?ㅎ'.includes(ch)) delay = speed * 3.5;
    else if (Math.random() < 0.08) delay = speed * 2.2;
    setTimeout(tick, delay);
  }
  setTimeout(tick, 900);
}

/* ════════════════════════════════════
   COSMIC LETTER 2 — line-by-line reveal
════════════════════════════════════ */
async function startCosmicLetter2(onDone) {
  const content = $('l2-content');
  content.innerHTML = '';
  const lines = LETTER2.split('\n');
  const lastIdx = lines.reduce((last, l, i) => l !== '' ? i : last, -1);

  const els = lines.map((line, idx) => {
    const p = document.createElement('p');
    const isBlank = line === '';
    const isLast  = idx === lastIdx;
    p.className = 'l2-line' + (isBlank ? ' l2-blank' : '') + (isLast ? ' l2-last' : '');
    if (!isBlank) p.textContent = line;
    content.appendChild(p);
    return { el: p, blank: isBlank };
  });

  await sleep(900);
  for (const { el, blank } of els) {
    el.classList.add('l2-vis');
    await sleep(blank ? 650 : 2100);
  }

  await sleep(2800);
  if (onDone) onDone();
}

const CC_GLOW = [

  '0 28px 72px rgba(0,0,0,0.75), 0 0 0 1px rgba(200,40,255,0.22), 0 0 56px rgba(180,20,240,0.14)',

function buildCarousel() {
  const stage = $('carousel-stage');
  const dots  = $('carousel-dots');
  stage.innerHTML = ''; dots.innerHTML = '';

  CHAPTERS.forEach((ch, i) => {
    // card
    const card = document.createElement('div');
    card.className = 'cc'; card.id = `cc${i}`;
    card.style.boxShadow = CC_GLOW[i];
    card.innerHTML = `
      <div class="cc-bg" style="background:${ch.bg}"></div>
      <div class="cc-nebula" style="background:${CC_NEBULA[i]}"></div>
      <div class="cc-tex"></div>
      <div class="cc-shim"></div>
      <div class="cc-deco">${ch.deco}</div>
      <div class="cc-line"></div>
      <div class="cc-content">
        <div class="cc-num">${ch.num}</div>
        <div class="cc-name">${ch.name}</div>
        <div class="cc-date">${ch.sub}</div>
      </div>`;

    stage.appendChild(card);

    // dot
    const dot = document.createElement('div');
    dot.className = 'cdot'; dot.id = `cdot${i}`;
    dots.appendChild(dot);
  });

  positionCards(0, false);
  initCarouselTouch();
}

function positionCards(idx, animated) {
  activeCard = idx;
  CHAPTERS.forEach((_, i) => {
    const card = $(`cc${i}`);
    const offset = i - idx;
    const x = offset * CARD_STEP;
    const scale = Math.max(0.76, 1 - Math.abs(offset) * 0.13);
    const opacity = Math.max(0.28, 1 - Math.abs(offset) * 0.33);
    const zIndex = 10 - Math.abs(offset);
    card.style.transition = animated
      ? 'transform 0.58s cubic-bezier(0.16,1,0.3,1), opacity 0.55s ease'
      : 'none';
    card.style.transform = `translateX(${x}px) scale(${scale})`;
    card.style.opacity   = opacity;
    card.style.zIndex    = zIndex;
  });
  // dots
  CHAPTERS.forEach((_, i) => {
    $(`cdot${i}`).classList.toggle('active', i === idx);
  });
}

/* ─── touch & click on carousel ─── */
function initCarouselTouch() {
  const stage = $('carousel-stage');
  let startX = 0, startT = 0, dragging = false, liveOffset = 0;

  stage.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startT = Date.now();
    dragging = false; liveOffset = 0;
    // kill transition during drag
    CHAPTERS.forEach((_, i) => {
      $(`cc${i}`).style.transition = 'none';
    });
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    if (!dragging && Math.abs(dx) > 8) dragging = true;
    if (!dragging) return;
    liveOffset = dx;
    // live drag: shift all cards
    CHAPTERS.forEach((_, i) => {
      const offset = i - activeCard;
      const baseX = offset * CARD_STEP + dx * 0.88;
      const scale = Math.max(0.76, 1 - Math.abs(offset) * 0.13);
      $(`cc${i}`).style.transform = `translateX(${baseX}px) scale(${scale})`;
    });
  }, { passive: true });

  stage.addEventListener('touchend', e => {
    if (!dragging) {
      // tap: find which card was touched
      const touchX = e.changedTouches[0].clientX;
      const stageRect = stage.getBoundingClientRect();
      const cx = stageRect.left + stageRect.width / 2;
      const touched = Math.round((cx - touchX) / CARD_STEP) * -1 + activeCard;
      const clamped = Math.max(0, Math.min(CHAPTERS.length - 1, touched));

      if (clamped !== activeCard) {
        positionCards(clamped, true);
      } else {
        // tap on active card → enter
        if (!busy) enterChapter(activeCard);
      }
      return;
    }

    const dt = Date.now() - startT;
    const velocity = Math.abs(liveOffset) / dt; // px/ms
    const threshold = Math.abs(liveOffset) > 55 || velocity > 0.35;

    if (threshold) {
      const dir = liveOffset < 0 ? 1 : -1;
      const next = Math.max(0, Math.min(CHAPTERS.length - 1, activeCard + dir));
      positionCards(next, true);
    } else {
      positionCards(activeCard, true); // snap back
    }
    dragging = false; liveOffset = 0;
  }, { passive: true });

  // click fallback (desktop / non-touch)
  stage.addEventListener('click', e => {
    const card = e.target.closest('.cc'); if (!card) return;
    const idx = parseInt(card.id.replace('cc',''));
    if (idx !== activeCard) {
      positionCards(idx, true);
    } else {
      if (!busy) enterChapter(idx);
    }
  });
}

async function goToChapters() {
  await fadeTo('pg-chapters', buildCarousel);

  // zoom-out reveal — stage scales from large to normal
  const stage = $('carousel-stage');
  stage.style.transform = 'scale(1.4)';
  stage.style.opacity   = '0';
  stage.style.transition = 'none';
  await sleep(60);
  stage.style.transition = 'transform 0.85s cubic-bezier(0.16,1,0.3,1), opacity 0.7s ease';
  stage.style.transform  = 'scale(1)';
  stage.style.opacity    = '1';

  // Kick off preloading for ALL chapters while user sees carousel
  CHAPTERS.forEach((_, i) => preloadChapterMedia(i));

  // pause so user sees carousel, then auto-enter ch0
  await sleep(2400);
  if (!busy && !isManualMode) enterChapter(0);
}

async function enterChapter(idx) {
  if (busy) return;
  busy = true; currentCh = idx;
  const ch = CHAPTERS[idx];

  // Ensure media is queued for download before any animation delay
  preloadChapterMedia(idx);

  // Focus the card smoothly
  if (activeCard !== idx) positionCards(idx, true);
  await sleep(400);

  // Dim non-active cards
  CHAPTERS.forEach((_, i) => {
    const c = $(`cc${i}`);
    if (i !== idx) {
      c.style.transition = 'transform 0.55s ease, opacity 0.55s ease';
      c.style.transform  = `translateX(${(i - idx) * CARD_STEP}px) scale(0.72)`;
      c.style.opacity    = '0.05';
    } else {
      c.style.transition = 'transform 0.55s cubic-bezier(0.16,1,0.3,1)';
      c.style.transform  = 'translateX(0) scale(1.04)';
    }
  });
  await sleep(450);

  // Show title veil
  const veil    = $('ch-veil');
  const vtitle  = $('ch-vtitle');
  const vtNum   = $('ch-vt-num');
  const vtName  = $('ch-vt-name');

  vtNum.textContent  = ch.num;
  vtName.textContent = ch.name;
  vtitle.classList.remove('in','up');

  veil.classList.add('show');
  await sleep(100);
  vtitle.classList.add('in');    // title zooms in
  await sleep(1700);             // let user read the title
  vtitle.classList.add('up');    // title drifts up

  // If future episode → special page, no detail grid
  if (ch.future) {
    await sleep(300);
    veil.classList.remove('show');
    await sleep(300);
    busy = false;
    openFuturePage();
    return;
  }

  // Prepare detail
  loadDetail(idx);
  const detail = $('ch-detail');
  const hd     = $('ch-hd');
  const scroll = $('ch-scroll');
  const foot   = $('ch-foot');
  hd.classList.remove('in');
  scroll.classList.remove('show');
  foot.classList.remove('show');
  detail.classList.add('show');

  await sleep(250);

  // Cross-fade: veil out, header slides in
  veil.classList.remove('show');
  hd.classList.add('in');
  await sleep(450);

  // Images were pre-cached; this wait should resolve almost instantly from HTTP cache.
  // Videos in the grid only need metadata (for the first-frame thumbnail).
  const gridImgs = [...($('ch-scroll').querySelectorAll('img'))];
  const gridVids = [...($('ch-scroll').querySelectorAll('video'))];
  const imgWaits = gridImgs.map(img => new Promise(res => {
    if (img.complete && img.naturalWidth) { res(); return; }
    img.addEventListener('load',  res, { once: true });
    img.addEventListener('error', res, { once: true });
  }));
  const vidWaits = gridVids.map(vid => new Promise(res => {
    if (vid.readyState >= 1) { res(); return; } // HAVE_METADATA is enough for thumbnail
    vid.addEventListener('loadedmetadata', res, { once: true });
    vid.addEventListener('error',          res, { once: true });
  }));
  await Promise.race([Promise.all([...imgWaits, ...vidWaits]), sleep(1500)]);

  scroll.classList.add('show');
  foot.classList.add('show');

  // 그리드가 보인 직후 자동 재생 시작
  await sleep(1700);
  if (!isManualMode) startAutoPlay(idx);

  busy = false;
}

async function exitChapter() {
  // 자동재생 멈추고 뷰어 즉시 닫기
  stopAutoPlay();
  await closePhotoViewer(true);

  // Hide detail content
  const detail = $('ch-detail');
  const hd     = $('ch-hd');
  const scroll = $('ch-scroll');
  const foot   = $('ch-foot');

  scroll.classList.remove('show');
  foot.classList.remove('show');
  await sleep(320);
  hd.classList.remove('in');
  await sleep(400);

  // Veil comes up
  const veil   = $('ch-veil');
  const vtitle = $('ch-vtitle');
  vtitle.classList.remove('in','up');
  veil.classList.add('show');
  await sleep(280);
  detail.classList.remove('show');

  // Restore cards
  CHAPTERS.forEach((_, i) => {
    const c = $(`cc${i}`);
    c.style.transition = 'transform 0.55s cubic-bezier(0.16,1,0.3,1), opacity 0.55s ease';
    const offset = i - currentCh;
    const scale  = Math.max(0.76, 1 - Math.abs(offset) * 0.13);
    const opacity= Math.max(0.28, 1 - Math.abs(offset) * 0.33);
    c.style.transform = `translateX(${offset * CARD_STEP}px) scale(${scale})`;
    c.style.opacity   = opacity;
  });
  activeCard = currentCh;
  $(`cdot${currentCh}`).classList.add('active');

  await sleep(700);

  // Veil fades out → carousel visible
  veil.classList.remove('show');
  await sleep(520);
}

function loadDetail(idx) {
  const ch = CHAPTERS[idx];
  $('ch-hd-num').textContent  = ch.num;
  $('ch-hd-name').textContent = ch.name;

      vid.preload = 'metadata';

      vid.playsInline = true;
      vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.1; }, { once: true });
      cell.appendChild(vid);
      // Small play badge top-right
      const badge = document.createElement('div');
      badge.className = 'cell-vid-badge';

      cell.appendChild(img);

      // No source: camera icon placeholder
      const bg = document.createElement('div');
      bg.className = 'cell-grad';
      bg.style.cssText = `background:${ch.bg};opacity:0.72;`;
      cell.appendChild(bg);
      const icon = document.createElement('div');
      icon.className = 'cell-ph-icon';
      icon.innerHTML = `<svg width="22" height="22" viewBox="0 0 40 40" fill="none">
        <rect x="3" y="9" width="34" height="23" rx="4" stroke="white" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="6.5" stroke="white" stroke-width="1.6"/>
        <circle cx="30" cy="14" r="2" fill="white"/>
      </svg>`;
      cell.appendChild(icon);
    }

    cell.addEventListener('click', () => {
      stopAutoPlay();
      apChIdx   = idx;
      apPIdx    = i;
      apRunning = true;
      openPhotoViewer(idx, i, true).then(dur => startHoldTimer(dur));
    });

    grid.appendChild(cell);
  });
}

/* ════════════════════════════════════
   PHOTO VIEWER & AUTO-PLAY
════════════════════════════════════ */
let isManualMode = false; // set via secret triple-tap on 민소 circle
let apChIdx      = -1;   // autoplay: current chapter
let apPIdx       = 0;    // autoplay: current photo index
let apRunning    = false;
let apTimer      = null;
let apRemaining  = 4000; // ms remaining when paused
let apTimerStart = 0;    // timestamp when current timer started
let apHolding    = false;

function startAutoPlay(chIdx)            { startAutoPlayFrom(chIdx, 0); }
function startAutoPlayFrom(chIdx, pIdx)  {
  stopAutoPlay();
  apChIdx   = chIdx;
  apPIdx    = pIdx;
  apRunning = true;
  runAutoStep(chIdx, pIdx);
}

function stopAutoPlay() {
  apRunning = false;
  apChIdx   = -1;
  apHolding = false;
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
}

async function runAutoStep(chIdx, pIdx) {
  if (!apRunning || apChIdx !== chIdx || isManualMode) return;
  apPIdx = pIdx;

  // tap animation on grid cell
  const cells = $('ch-scroll').querySelectorAll('.photo-cell');
  const cell  = cells[pIdx];
  if (cell) {
    cell.classList.remove('tapping');
    void cell.offsetWidth;
    cell.classList.add('tapping');
  }
  await sleep(1200);
  if (!apRunning || apChIdx !== chIdx) return;

  const dur = await openPhotoViewer(chIdx, pIdx, true);
  startHoldTimer(dur);
}

/* ── 홀드 타이머 (일시정지 지원) ── */
function startHoldTimer(ms) {
  if (isManualMode) return; // manual mode: no auto-advance
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
  apRemaining  = ms;
  apTimerStart = Date.now();
  apHolding    = false;
  apTimer = setTimeout(async () => {
    if (!apRunning) return;
    const chIdx = apChIdx;
    const pIdx  = apPIdx;
    const ch    = CHAPTERS[chIdx];

    if (pIdx >= ch.photos.length - 1) {
      // 마지막 사진 → 다음 에피소드로 자동 전환
      onChapterNext();
      return;
    }

    // 다음 사진으로 — 뷰어 유지, 사진만 교체
    if (!apRunning || apChIdx !== chIdx) return;
    apPIdx = pIdx + 1;
    const dur = await openPhotoViewer(chIdx, pIdx + 1, true);
    startHoldTimer(dur);
  }, ms);
}

function pauseHold() {
  if (!apRunning || apHolding || !apTimer) return;
  apHolding = true;
  clearTimeout(apTimer); apTimer = null;
  apRemaining = Math.max(80, apRemaining - (Date.now() - apTimerStart));
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = 'paused';
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.pause();
}

function resumeHold() {
  if (!apHolding) return;
  apHolding = false;
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = '';
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.play().catch(() => {});
  startHoldTimer(apRemaining);
}

async function openPhotoViewer(chIdx, pIdx, isAuto) {
  const ch    = CHAPTERS[chIdx];
  const photo = ch.photos[pIdx];
  const pv    = $('photo-viewer');
  const pvImg = $('pv-img');
  const alreadyOpen = pv.classList.contains('show');
  const isVideo = photo.src && /\.(mp4|mov|webm|m4v)$/i.test(photo.src);

  // If replacing content in open viewer: return old video to pool, then fade
  if (alreadyOpen) {
    const oldVid = pvImg.querySelector('video');
    _returnVidToPool(oldVid); // moves element back to _mpc; buffer stays alive
    pvImg.style.transition = 'none';
    pvImg.style.opacity    = '0';
    await sleep(40);
  }

  // Clear non-video residual children (video was already moved above)
  pvImg.innerHTML = '';
  pvImg.style.background = '';
  let dur = 5000;

  if (!photo.src) {
    pvImg.style.background = ch.bg.replace('145deg', '155deg');
    pvImg.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <svg width="50" height="50" viewBox="0 0 40 40" fill="none" style="opacity:0.2">
        <rect x="3" y="9" width="34" height="23" rx="4" stroke="white" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="6.5" stroke="white" stroke-width="1.4"/>
        <circle cx="30" cy="14" r="2" fill="white"/>
      </svg>
    </div>`;
  } else if (isVideo) {
    pvImg.style.background = '#0a0806';

    // Reuse pre-buffered pool element — moving it preserves the download buffer
    let vid = _vidPool.get(photo.src);
    if (!vid) {
      // Fallback: create on-demand (shouldn't normally reach here)
      vid = document.createElement('video');
      vid.src = photo.src; vid.preload = 'auto'; vid.playsInline = true;
      vid.muted = true; vid.load();
      _vidPool.set(photo.src, vid);
    }
    vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit;';
    vid.muted  = false;
    vid.volume = 1.0;
    vid.currentTime = 0;
    pvImg.appendChild(vid); // moves from _mpc to pvImg — buffer intact

    // Metadata should already be available from preload; wait only if needed
    if (vid.readyState < 1) {
      await new Promise(res => {
        vid.addEventListener('loadedmetadata', res, { once: true });
        setTimeout(res, 4000);
      });
    }
    if (vid.duration && isFinite(vid.duration) && vid.duration > 0.1) {
      dur = Math.round(vid.duration * 1000) + 300;
    }
    if (vid.videoWidth && vid.videoHeight) {
      pvImg.style.aspectRatio = `${vid.videoWidth} / ${vid.videoHeight}`;
    }
    // Play — already buffered, starts immediately
    vid.play().catch(() => {
      vid.muted = true;
      vid.play().catch(() => {});
    });
  } else {
    pvImg.style.background = '#0f0e0c';
    const img = document.createElement('img');
    img.src = photo.src;
    img.alt = '';
    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;';
    pvImg.appendChild(img);
    // Wait for natural dimensions to set the exact aspect ratio
    await new Promise(res => {
      if (img.complete && img.naturalWidth) { res(); return; }
      img.addEventListener('load',  res, { once: true });
      img.addEventListener('error', res, { once: true });
      setTimeout(res, 4000);
    });
    if (img.naturalWidth && img.naturalHeight) {
      pvImg.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
    }
  }

  // caption
  $('pv-cap').textContent = photo.cap;

  // progress bars
  const barsEl = $('pv-bars');
  barsEl.innerHTML = '';
  if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
  ch.photos.forEach((_, i) => {
    const bar  = document.createElement('div'); bar.className = 'pv-bar';
    const fill = document.createElement('div'); fill.className = 'pv-bar-fill';
    if (i < pIdx) fill.classList.add('done');
    bar.appendChild(fill); barsEl.appendChild(bar);
  });
  barsEl.style.transition = 'opacity 0.35s ease';
  barsEl.style.opacity = '1';
  pvBarsVisible = true;

  function activateBar() {
    const fills = barsEl.querySelectorAll('.pv-bar-fill');
    if (fills[pIdx]) {
      fills[pIdx].style.setProperty('--pv-dur', `${(dur / 1000).toFixed(2)}s`);
      fills[pIdx].classList.add('active');
    }
  }

  if (alreadyOpen) {
    pvImg.style.transition = 'opacity 0.45s ease';
    pvImg.style.opacity    = '1';
    if (isAuto) { await sleep(60); activateBar(); }
    return dur;
  }

  // Fresh open — animate in via CSS
  pvImg.style.transition = 'none';
  pvImg.style.transform  = 'scale(0.72) translateY(20px)';
  pvImg.style.opacity    = '0';

  pv.classList.add('show');
  await sleep(30);

  pvImg.style.transition = '';
  pvImg.style.transform  = '';
  pvImg.style.opacity    = '';

  if (isAuto) { await sleep(60); activateBar(); }
  return dur;
}

async function closePhotoViewer(instant) {
  const pv = $('photo-viewer');
  if (!pv.classList.contains('show')) return;
  const vid = $('pv-img')?.querySelector('video');
  _returnVidToPool(vid); // return to pool so buffer is preserved for next open
  if (instant) {
    pv.style.transition = 'none';
    pv.classList.remove('show');
    await sleep(20);
    pv.style.transition = '';
  } else {
    pv.classList.remove('show');
    await sleep(420);
  }
}

async function onChapterNext() {
  // ── 뷰어 열림: 사진 레벨 네비게이션 우선 ──
  if ($('photo-viewer').classList.contains('show')) {
    const ch = CHAPTERS[currentCh];
    const isLastPhoto = apPIdx >= ch.photos.length - 1;

    if (!isLastPhoto) {
      // 다음 사진으로
      stopAutoPlay();
      await closePhotoViewer(false);
      await sleep(160);
      startAutoPlayFrom(currentCh, apPIdx + 1);
      return;
    }
    // 마지막 사진 → 에피소드 전환 (뷰어 닫고 fall-through)
    stopAutoPlay();
    await closePhotoViewer(false);
    await sleep(800);
  }

  // ── 에피소드 레벨 네비게이션 ──
  if (busy) return;
  busy = true;

  // Manual mode: return to carousel unless it's the last episode (→ letter 2)
  if (isManualMode && currentCh !== CHAPTERS.length - 1) {
    await exitChapter();
    busy = false;
    return;
  }

  const isLastEp = currentCh === CHAPTERS.length - 1;

  if (isLastEp) {
    await fadeTo('pg-letter2', () => {
      $('ch-detail').classList.remove('show');
      $('ch-hd').classList.remove('in');
      $('ch-scroll').classList.remove('show');
      $('ch-foot').classList.remove('show');
    });
    busy = false;
    startCosmicLetter2(goToProposal);
  } else {
    await exitChapter();
    const next = currentCh + 1;
    await sleep(300);
    positionCards(next, true);
    await sleep(1600);
    busy = false;
    enterChapter(next);
  }
}

function ftShuf(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) { const j = 0 | Math.random() * (i + 1); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function ftSpawn(container, text, cls, x, y, fs, op, adS, fdur, gdur, dx, dy) {
  const el = document.createElement('span');
  el.className = `ft-word ${cls}`;
  el.textContent = text;
  const style = [
    `left:${x.toFixed(1)}%`, `top:${y.toFixed(1)}%`, `font-size:${fs.toFixed(1)}px`,
    `--op:${op.toFixed(3)}`,  `--ad:${adS.toFixed(2)}s`,
    `--fdur:${fdur.toFixed(1)}s`, `--dx:${dx.toFixed(1)}px`, `--dy:${dy.toFixed(1)}px`,
  ];
  if (gdur) style.push(`--gdur:${gdur.toFixed(1)}s`);
  el.style.cssText = style.join(';');
  container.appendChild(el);
}

function buildFutureAtmosphere(container) {
  // 70 twinkling stars
  for (let i = 0; i < 70; i++) {
    const s   = document.createElement('div');
    s.className = 'ft-star';
    const sz  = Math.random() < 0.72 ? 1 : Math.random() < 0.7 ? 2 : 3;
    const op1 = (0.15 + Math.random() * 0.55).toFixed(2);
    const op2 = (parseFloat(op1) * (0.12 + Math.random() * 0.25)).toFixed(2);
    s.style.cssText = [
      `left:${(Math.random()*100).toFixed(1)}%`, `top:${(Math.random()*100).toFixed(1)}%`,
      `width:${sz}px`, `height:${sz}px`,
      `--op1:${op1}`, `--op2:${op2}`,
      `--dur:${(1.8+Math.random()*3.5).toFixed(1)}s`,
      `--del:${(Math.random()*4).toFixed(1)}s`,
    ].join(';');
    container.appendChild(s);
  }

  // Centre-avoiding helper
  const outsideCenter = (x, y, mx, my, Mx, My) => !(x > mx && x < Mx && y > my && y < My);

  // Background micro-words — staggered 0.18s apart so they float up one by one
  ftShuf(FUTURE_BG).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 28, 32, 72, 68));
    ftSpawn(container, w, 'ft-bgw',
      x, y, 10 + Math.random() * 5,
      0.22 + Math.random() * 0.14,   // brighter: 0.22–0.36
      0.2 + i * 0.18 + Math.random() * 0.08,  // ~3.6s to show all 20
      8 + Math.random() * 7,
      null,
      (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 18);
  });

  // Mid words — staggered 0.24s apart
  ftShuf(FUTURE_MID).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 25, 30, 75, 70));
    ftSpawn(container, w, 'ft-mid',
      x, y, 15 + Math.random() * 8,
      0.52 + Math.random() * 0.18,   // brighter: 0.52–0.70
      0.4 + i * 0.24 + Math.random() * 0.1,  // ~3.3s to show all 14
      10 + Math.random() * 8,
      null,
      (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 22);
  });
}

function runConfetti() {
  const canvas = $('confetti');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx  = canvas.getContext('2d');
  const cols = ['#81D8D0','#B2EDE9','#ffffff','#4AADA5','#E8FAFA','#0ABAB5'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: 4 + Math.random() * 8, h: 6 + Math.random() * 13,
    rot: Math.random() * Math.PI * 2,
    dr: (Math.random() - 0.5) * 0.13,
    vy: 1.2 + Math.random() * 1.9,
    vx: (Math.random() - 0.5) * 0.7,
    col: cols[Math.floor(Math.random() * cols.length)],
    a: 0.65 + Math.random() * 0.35,
  }));
  let frame = 0;
  function draw() {
    if (frame > 380) {
      canvas.style.transition = 'opacity 1.5s ease'; canvas.style.opacity = '0'; return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.rot += p.dr;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save(); ctx.globalAlpha = p.a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++; requestAnimationFrame(draw);
  }
  draw();
}

function initGridDismiss() {
  const scroll  = $('ch-scroll');
  const detail  = $('ch-detail');
  let startY = 0, startScrollTop = 0;
  let dismissing = false, dragY = 0;

  scroll.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startScrollTop = scroll.scrollTop;
    dismissing = false; dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    if (!dismissing) {
      if (startScrollTop <= 0 && dy > 8) dismissing = true;
      else return;
    }
    e.preventDefault();
    dragY = dy;
  }, { passive: false });

  scroll.addEventListener('touchend', async () => {
    if (!dismissing) return;
    dismissing = false;
    if (dragY > 90 && !busy) {
      busy = true;
      await exitChapter();
      busy = false;
    }
    dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchcancel', () => {
    dismissing = false;
    dragY = 0;
  }, { passive: true });
}

  let pvStartX = 0, pvStartY = 0, pvStartT = 0;

    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }

    const bars = $('pv-bars');
    bars.style.transition = 'opacity 0.35s ease';

  function pvHideBars() {
    if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
    pvBarsVisible = false;
    const bars = $('pv-bars');
    bars.style.transition = 'none';
    bars.style.opacity = '0';
  }
  function pvToggleBars() {
    if (pvBarsVisible) {
      pvHideBars();
    } else {
      pvShowBars();
      pvBarsHideTimer = setTimeout(pvHideBars, 2500);
    }
  }

  function pvGoNext() {
    const cIdx   = apChIdx >= 0 ? apChIdx : currentCh;
    const photos = CHAPTERS[cIdx].photos;

      const next = apPIdx + 1;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = next; apRunning = true;
      openPhotoViewer(cIdx, next, true).then(dur => startHoldTimer(dur));

      stopAutoPlay();
      if (isManualMode) {
        // manual mode: last photo → close viewer, stay in grid
        closePhotoViewer(false);
      } else {
        onChapterNext();
      }

  }
  function pvGoPrev() {
    if (apPIdx > 0) {
      const prev = apPIdx - 1;
      const cIdx = apChIdx >= 0 ? apChIdx : currentCh;
      stopAutoPlay();
      apChIdx = cIdx; apPIdx = prev; apRunning = true;
      openPhotoViewer(cIdx, prev, true).then(dur => startHoldTimer(dur));

  }

  function pvBodyReset(animate) {
    if (animate) {
      pvBody.style.transition = 'transform 0.42s cubic-bezier(0.16,1,0.3,1), opacity 0.32s ease';
      requestAnimationFrame(() => {
        pvBody.style.transform = '';
        pvBody.style.opacity   = '';
      });
      setTimeout(() => { pvBody.style.transition = ''; }, 500);
    } else {
      pvBody.style.transition = '';
      pvBody.style.transform  = '';
      pvBody.style.opacity    = '';
    }
  }

  pvEl.addEventListener('touchstart', (e) => {
    const t  = e.touches[0];
    pvStartX = t.clientX; pvStartY = t.clientY;
    pvStartT = Date.now();
    pvMoveX  = 0; pvMoveY = 0;
    // 300ms 유지 시에만 일시정지 (빠른 탭에서 버벅임 방지)
    pvLongTimer = setTimeout(() => { pauseHold(); pvShowBars(); }, 300);
  }, { passive: true });

  pvEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    pvMoveX = t.clientX - pvStartX;
    pvMoveY = t.clientY - pvStartY;
    // 아래 드래그: 바디가 손가락 따라 내려옴
    if (pvMoveY > 0 && pvMoveY > Math.abs(pvMoveX) * 0.7) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
      const damped = pvMoveY * 0.55;
      const sc     = Math.max(0.88, 1 - pvMoveY / 1800);
      const al     = Math.max(0.25, 1 - pvMoveY / 260);
      pvBody.style.transition = 'none';
      pvBody.style.transform  = `translateY(${damped}px) scale(${sc})`;
      pvBody.style.opacity    = al;
    } else if (Math.abs(pvMoveX) > 8) {
      if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    }
  }, { passive: true });

  pvEl.addEventListener('touchend', (e) => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    const t    = e.changedTouches[0];
    const dx   = t.clientX - pvStartX;
    const dy   = t.clientY - pvStartY;
    const adx  = Math.abs(dx);
    const ady  = Math.abs(dy);
    const held = Date.now() - pvStartT;

    // ④ 아래 스와이프 → 슬라이드 다운 닫기
    if (dy > 60 && ady > adx * 0.8) {
      pvHideBars();
      stopAutoPlay();
      pvBody.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.6,1), opacity 0.28s ease';
      pvBody.style.transform  = `translateY(${pvMoveY * 0.55 + window.innerHeight * 0.22}px) scale(0.84)`;
      pvBody.style.opacity    = '0';
      pvEl.classList.remove('show'); // CSS transition 으로 fade-out
      setTimeout(() => { pvBodyReset(false); }, 380);
      return;
    }

    // ③ 길게 누름 → 재개 + 바 잠시 유지 후 숨김
    if (held >= 450 && adx < 18 && ady < 18) {
      pvBodyReset(true);
      pvBarsHideTimer = setTimeout(pvHideBars, 1000);
      resumeHold();
      return;
    }

    // ① 가로 스와이프 → 이전/다음
    if (adx > 36 && adx > ady * 1.2) {
      pvBodyReset(true);
      dx < 0 ? pvGoNext() : pvGoPrev();
      return;
    }

    // 탭 (움직임 없음) → 존 기반
    if (adx <= 22 && ady <= 22) {
      pvBodyReset(false);   // 즉시 리셋 — rAF 없이 bars transition과 충돌 방지
      const zone = t.clientX / window.innerWidth;
      if      (zone < 0.33) { pvGoPrev(); return; }
      else if (zone > 0.67) { pvGoNext(); return; }
      else                  { pvToggleBars(); resumeHold(); return; }
    }

    pvBodyReset(true);
    resumeHold();
  });

  pvEl.addEventListener('touchcancel', () => {
    if (pvLongTimer) { clearTimeout(pvLongTimer); pvLongTimer = null; }
    pvBodyReset(true);
    pvHideBars();
    resumeHold();
  });
});
</script>
</body>
</html>
