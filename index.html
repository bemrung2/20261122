<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>민소커플</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   TOKENS & RESET
═══════════════════════════════════════ */
:root {
  --sat: env(safe-area-inset-top, 44px);
  --sab: env(safe-area-inset-bottom, 34px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --paper: #fffef8;
  --gold:  #c8a96e;
  --gold-l:#e8d5a8;
  --gold-d:#9a7a48;
  --ink:   #2a1f14;
  --ink2:  #6b5744;
  --ink3:  #a89078;
  --dark:  #100e08;
  --tiffany:  #81D8D0;
  --tiffany-d:#4AADA5;
  --tiffany-l:#B2EDE9;
}
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--dark);
  font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}

/* ═══════════════════════════════════════
   PAGE SYSTEM
═══════════════════════════════════════ */
.pg {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; z-index: 1;
}
.pg.active { opacity: 1; pointer-events: all; z-index: 10; }

#curtain {
  position: fixed; inset: 0; background: var(--dark);
  z-index: 900; opacity: 0; pointer-events: none;
  transition: opacity 0.72s ease;
}
#curtain.on { opacity: 1; pointer-events: all; }

/* ═══════════════════════════════════════
   BOKEH
═══════════════════════════════════════ */
.bokeh-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bk {
  position: absolute; border-radius: 50%;
  filter: blur(28px); opacity: 0;
  animation: bkRise linear infinite;
}
@keyframes bkRise {
  0%   { transform: translateY(110vh); opacity: 0; }
  10%  { opacity: 0.5; }
  90%  { opacity: 0.28; }
  100% { transform: translateY(-15vh); opacity: 0; }
}

/* ═══════════════════════════════════════
   LOCK SCREEN — cosmic space
═══════════════════════════════════════ */
/* ═══════════════════════════════════════
   LOCK
   Quiet and warm — the hush before the doors open. Ink and
   ivory with one blush accent, nothing borrowed from anywhere
   else and nothing shouting.
═══════════════════════════════════════ */
#pg-lock {
  background: #14121a;
  padding: var(--sat) 6vw var(--sab);
  overflow: hidden;
}
#pg-lock::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 46% at 50% 26%, rgba(255,214,178,0.14) 0%, transparent 68%),
    radial-gradient(ellipse 90% 50% at 50% 104%, rgba(60,48,64,0.5) 0%, transparent 72%),
    linear-gradient(180deg, rgba(12,10,16,0) 40%, rgba(9,8,12,0.85) 100%);
}

.lock-card {
  position: relative; z-index: 1;
  background: transparent;
  padding: clamp(14px, 3vh, 30px) 18px; width: min(360px, 92vw);
  flex: 1; min-height: 0; max-height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  gap: clamp(26px, 4.4vh, 48px);
  animation: cardUp 0.9s cubic-bezier(0.16,1,0.3,1) both;
  touch-action: manipulation;
}
/* top and bottom sit together as one centered group with a fixed gap
   between them (via .lock-card's own gap) — never the old dueling
   auto-margins, which could pinch to nothing and let the two halves
   crowd each other on a short viewport */
.lock-top    { display: flex; flex-direction: column; align-items: center; gap: clamp(20px, 3.4vh, 38px); }
.lock-bottom {
  display: flex; flex-direction: column; align-items: stretch; gap: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity 1.4s ease;
}
.lock-bottom.show { opacity: 1; pointer-events: auto; }
@keyframes cardUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: none; }
}

/* she is waiting at the head of the aisle, drawn with the same sprite the
   hall uses and faded out at the edges so she sits in the page */
#lock-bride {
  display: block; margin: 0 auto;
  width: min(200px, 54vw); height: auto; aspect-ratio: 80 / 66;
  image-rendering: pixelated; image-rendering: crisp-edges;
  -webkit-mask-image: radial-gradient(ellipse 60% 58% at 50% 52%, #000 40%, transparent 100%);
          mask-image: radial-gradient(ellipse 60% 58% at 50% 52%, #000 40%, transparent 100%);
}

/* three lines arrive one at a time, top to bottom, and stay up — the
   third one marked out as the actual question, in step with the
   keypad fading in beneath it */
.lock-q {
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(7px, 1.3vh, 13px);
  width: 100%; text-align: center;
}
.lq-line {
  padding: 0 4px;
  font-size: clamp(13px, 1.85vh, 18px); font-weight: 400; line-height: 1.42;
  color: rgba(255,246,234,0.94); letter-spacing: -0.2px;
  opacity: 0; transform: translateY(10px);
  transition: opacity 1.4s ease, transform 1.6s cubic-bezier(0.16,1,0.3,1);
}
.lq-line.on { opacity: 1; transform: none; }
.lq-line.emph {
  font-weight: 700; color: #ffe9c9; letter-spacing: -0.1px;
  text-shadow: 0 0 18px rgba(255,205,140,0.35);
}

/* the answer: the dots, and a small format hint tucked right beneath
   them — held back until the third line lands, then the keypad
   itself arrives on its own beat afterward, not in the same breath */
.lock-answer { display: flex; flex-direction: column; align-items: center; gap: clamp(5px, 1vh, 9px); margin-top: clamp(6px, 1.2vh, 12px); }
.pin-dots {
  display: flex; justify-content: center; gap: clamp(11px, 2vh, 18px); align-items: center;
  opacity: 0; pointer-events: none;
  transition: opacity 1.4s ease;
}
.pin-dots.show { opacity: 1; pointer-events: auto; }
.lock-format-hint {
  font-size: clamp(9.5px, 1.3vh, 12px); font-weight: 400;
  color: rgba(214,190,170,0.44); letter-spacing: 0.07em;
  text-align: center;
  opacity: 0;
  transition: opacity 1.4s ease;
}
.lock-format-hint.show { opacity: 1; }
#pin-lines { display: none; }
.pd {
  width: clamp(9px, 1.4vh, 13px); height: clamp(9px, 1.4vh, 13px);
  border-radius: 50%;
  background: transparent;
  box-shadow: inset 0 0 0 1.5px rgba(226,206,178,0.30);
  transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.pd.on  { background: rgba(244,228,206,0.96); box-shadow: inset 0 0 0 1.5px rgba(244,228,206,0.96), 0 0 12px rgba(232,196,168,0.45); }
.pd.err { background: #cf7078; box-shadow: inset 0 0 0 1.5px #cf7078; }

/* the keypad: soft slabs, ivory numerals, a blush confirm */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1.3vh, 12px); }
.key {
  height: clamp(48px, 7.6vh, 70px);
  border-radius: 14px;
  background: rgba(255,246,234,0.055);
  border: 1px solid rgba(232,214,190,0.10);
  color: rgba(255,246,234,0.9);
  font-family: inherit; font-size: clamp(18px, 2.8vh, 26px); font-weight: 300;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .12s ease, transform .1s ease;
  touch-action: manipulation;
}
.key:active { background: rgba(255,246,234,0.14); transform: scale(0.94); }
.key-del    { color: rgba(226,178,172,0.8); }
.key-ok {
  background: rgba(196,124,132,0.30);
  border-color: rgba(226,160,166,0.34);
  color: rgba(255,240,236,0.96);
  font-size: clamp(13px, 2vh, 18px); font-weight: 400; letter-spacing: 0.08em;
}
.key-ok:active { background: rgba(206,136,144,0.46); }
.key-blank  { background: transparent !important; border: none !important; pointer-events: none; }
.lock-err {
  text-align: center; font-size: clamp(10px, 1.5vh, 13px); color: rgba(226,140,146,0.92);
  height: 18px; letter-spacing: 0.06em;
  opacity: 0; transition: opacity 0.2s;
}
.lock-err.show { opacity: 1; }

/* the hidden toggles */
.mode-toggle {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  max-height: 0; overflow: hidden;
  opacity: 0; transition: opacity 0.3s ease, max-height 0.3s ease;
}
.mode-toggle.show { max-height: 96px; opacity: 1; }
.mode-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.mode-label { font-size: 11.5px; color: rgba(214,190,170,0.5); letter-spacing: 0.12em; }
.mode-switch {
  width: 40px; height: 22px; border-radius: 11px; position: relative; cursor: pointer;
  background: rgba(255,246,234,0.08);
  border: 1px solid rgba(232,214,190,0.14);
  transition: background .18s ease;
}
.mode-switch::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px; border-radius: 50%;
  background: rgba(226,206,178,0.55);
  transition: transform .18s cubic-bezier(0.16,1,0.3,1), background .18s ease;
}
.mode-switch.on { background: rgba(196,124,132,0.34); }
.mode-switch.on::after { transform: translateX(18px); background: rgba(255,238,232,0.95); }

/* a short phone in portrait (browser chrome eating into the viewport,
   older small screens) gets a tighter pass so the dots and the keypad
   never end up crowding each other */
@media (max-height: 700px) and (orientation: portrait) {
  #lock-bride { width: min(140px, 40vw); }
  .lock-card  { gap: clamp(16px, 2.7vh, 25px); padding: 8px 18px; }
  .lock-top   { gap: clamp(12px, 2.2vh, 20px); }
  .key        { height: clamp(38px, 6.2vh, 50px); }
  .keypad     { gap: clamp(6px, 1vh, 10px); }
}

/* ══════════════════════════════════════════════════════════
   ENTRANCE
   A pure black beat — "신부", then "입장!", one at a time —
   and only once that has passed do the hall's doors themselves
   appear, closed, and swing open on her like a real pair of
   double doors on hinges. Everything is one overlay so nothing
   can flash between the announcement and the room behind it.
══════════════════════════════════════════════════════════ */
#entrance {
  position: fixed; inset: 0; z-index: 60;
  display: none; overflow: hidden;
  background: #050508;
  perspective: 1400px;
}
#entrance.on { display: block; }

/* the doors: invisible until the announcement is done (so the opening
   beat is flat black, not a textured gate), then they fade in already
   closed, then swing open on hinges at their outer edges */
.en-door {
  position: absolute; top: -2%; bottom: -2%; width: 51%;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.55) 100%),
    repeating-linear-gradient(90deg, #14131a 0 7px, #191822 7px 14px),
    #14131a;
  opacity: 0;
  backface-visibility: hidden;
  transition: transform 2.1s cubic-bezier(0.55, 0, 0.25, 1),
              filter 2.1s ease,
              opacity 0.7s ease;
  will-change: transform;
}
#en-l { left: 0;  border-right: 2px solid #3a3020; transform-origin: left center; }
#en-r { right: 0; border-left:  2px solid #3a3020; transform-origin: right center; }
#entrance.doors-in .en-door { opacity: 1; }
/* a brass line down the leading edge of each leaf, and a handle */
.en-door::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(180deg, rgba(160,132,80,0.15), rgba(200,168,110,0.55), rgba(160,132,80,0.15));
}
#en-l::after { right: 0; }
#en-r::after { left: 0; }
.en-door i {
  position: absolute; top: 50%; width: 13px; height: clamp(222px, 45vh, 414px);
  margin-top: calc(clamp(222px, 45vh, 414px) / -2);
  background: linear-gradient(180deg, #7d6640, #cbb079 40%, #7d6640);
  border-radius: 6px;
}
#en-l i { right: 16px; }
#en-r i { left: 16px; }
/* hinged at the outer wall, so each leaf swings back and away rather
   than sliding sideways off screen */
#entrance.open #en-l { transform: rotateY(-112deg); }
#entrance.open #en-r { transform: rotateY(112deg); }
#entrance.open .en-door { filter: brightness(0.5); }

/* the light behind them — round rather than a tall vertical oval (which
   read like a lens, not a room), and it blooms outward from a small
   core as the doors swing rather than just fading in at full size */
#en-light {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle 38vmin at 50% 52%, #fffdf6 0%, rgba(255,247,226,0.86) 32%, rgba(255,238,204,0.35) 60%, rgba(255,232,196,0) 82%);
  opacity: 0;
  transform: scale(0.22);
  transform-origin: 50% 50%;
  transition: opacity 2s ease, transform 2.4s cubic-bezier(0.45, 0, 0.2, 1);
}
#entrance.open #en-light { opacity: 1; transform: scale(1); }

/* the announcement: one word at a time, dead center, nothing else on
   screen — the same crossfade-in-place language the lock screen's
   three lines use, just larger and slower */
#en-words {
  position: absolute; inset: 0; z-index: 3;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
#en-words span {
  position: absolute;
  opacity: 0;
  transform: translateY(16px);
  font-family: 'Nanum Myeongjo', 'Noto Serif KR', serif;
  color: rgba(255,246,232,0.97);
  letter-spacing: 0.36em; text-indent: 0.36em; font-weight: 400;
  text-shadow: 0 0 44px rgba(255,214,160,0.42);
  transition: opacity 1.3s ease, transform 1.4s cubic-bezier(0.16,1,0.3,1);
}
#en-1 { font-size: clamp(26px, 5.2vh, 58px); }
#en-2 { font-size: clamp(38px, 8vh, 92px); font-weight: 700; color: #ffeccd; letter-spacing: 0.24em; text-indent: 0.24em; }
#en-words span.in { opacity: 1; transform: none; }

/* and the moment it is too bright to look at */
#en-glare {
  position: absolute; inset: 0; z-index: 4;
  background: #fffdf6; opacity: 0; pointer-events: none;
  transition: opacity 1.05s ease;
}
#entrance.glare #en-glare { opacity: 1; }
#entrance.fade  #en-glare { opacity: 0; transition-duration: 1.5s; }
#entrance.fade  { background: transparent; }
#entrance.fade .en-door, #entrance.fade #en-light { opacity: 0; transition: opacity .5s ease; }

/* ═══════════════════════════════════════
   LETTER — fixed paper, text scrolls inside
═══════════════════════════════════════ */
.pg-letter {
  background: #e8dece;
  padding: var(--sat) 22px var(--sab);
  transition: opacity 1.4s ease; /* slow reveal as curtain lifts */
}

.letter-sheet {
  position: relative;
  width: 100%; max-width: 344px;
  height: calc(100dvh - var(--sat) - var(--sab) - 72px);
  background: #fefcf5;
  border-radius: 2px; overflow: hidden;
  box-shadow:
    inset 0 0 24px rgba(0,0,0,0.03),
    0 2px 6px rgba(0,0,0,0.06),
    0 16px 48px rgba(0,0,0,0.18),
    4px 4px 0 rgba(200,180,140,0.25);
}

/* ruled lines */
.letter-sheet::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: repeating-linear-gradient(
    transparent, transparent 35px,
    rgba(140,110,80,0.14) 35px, rgba(140,110,80,0.14) 36px
  );
  background-position: 0 100px;
}

/* red margin line */
.letter-left-margin {
  position: absolute; top: 0; bottom: 0; left: 56px;
  width: 1px; background: rgba(200,70,70,0.22);
  z-index: 1; pointer-events: none;
}

/* date in top right */
.letter-date-el {
  position: absolute; top: 20px; right: 22px;
  font-size: 11.5px; color: #9a8070; font-weight: 300;
  z-index: 3; letter-spacing: 0.5px; font-style: italic;
}

/* scrollable text area */
.letter-inner {
  position: absolute;
  top: 64px; left: 64px; right: 22px; bottom: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 26px 0 60px;
  z-index: 2;
}
.letter-inner::-webkit-scrollbar { display: none; }
#l2-inner { top: 42px; }

.letter-body {
  font-size: 15.5px; line-height: 2.38; color: #362818;
  white-space: pre-wrap; word-break: keep-all; font-weight: 300;
  letter-spacing: 0.015em;
}
.letter-cursor {
  display: inline-block; width: 1.5px; height: 18px;
  background: #5a3e28; vertical-align: middle; margin-left: 1px;
  animation: cursorBlink 1s step-end infinite;
}
@keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ═══════════════════════════════════════
   LETTER 2 — cosmic space redesign
═══════════════════════════════════════ */
#pg-letter2 {
  background: #06040e;
}
#pg-letter2::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 48%, rgba(60,25,120,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 38% 28% at 22% 20%, rgba(40,20,90,0.14) 0%, transparent 55%),
    radial-gradient(ellipse 32% 24% at 80% 76%, rgba(80,30,100,0.12) 0%, transparent 50%),
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.80) 0%, transparent 100%),
    radial-gradient(1px   1px   at 28% 6%,  rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 47% 12%, rgba(255,248,220,0.70) 0%, transparent 100%),
    radial-gradient(1px   1px   at 65% 9%,  rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 83% 22%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px   1px   at 6%  42%, rgba(255,255,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at 92% 38%, rgba(200,180,255,0.55) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 18% 68%, rgba(255,255,255,0.60) 0%, transparent 100%),
    radial-gradient(1px   1px   at 38% 82%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 74% 74%, rgba(255,248,220,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 90% 85%, rgba(255,255,255,0.40) 0%, transparent 100%),
    radial-gradient(1px   1px   at 52% 95%, rgba(200,180,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at 33% 58%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 70% 48%, rgba(220,210,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at 8%  88%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 58% 32%, rgba(255,248,220,0.40) 0%, transparent 100%);
  animation: ftNebulaBreath 9s ease-in-out infinite alternate;
}
/* Letter 2 — glass card */
#pg-letter2 .letter-sheet {
  background: rgba(8,5,20,0.75);
  border-radius: 16px;
  border: 1px solid rgba(160,130,230,0.18);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 24px 72px rgba(0,0,0,0.70),
    0 0 80px rgba(90,45,180,0.14),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 -1px 0 rgba(100,60,200,0.08);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  animation: l2SheetGlow 7s ease-in-out infinite alternate;
}
@keyframes l2SheetGlow {
  from {
    border-color: rgba(140,110,220,0.14);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04), 0 24px 72px rgba(0,0,0,0.70),
      0 0 60px rgba(70,35,150,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  to {
    border-color: rgba(180,150,255,0.28);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06), 0 24px 72px rgba(0,0,0,0.70),
      0 0 110px rgba(110,55,220,0.22), inset 0 1px 0 rgba(255,255,255,0.10);
  }
}
#pg-letter2 .letter-sheet::before {
  background-image: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 35%);
}
#pg-letter2 .letter-left-margin { display: none; }
#pg-letter2 #l2-inner { left: 26px; top: 42px; }
#pg-letter2 .letter-date-el {
  color: rgba(200,170,100,0.68);
  text-shadow: 0 0 14px rgba(255,210,120,0.45);
}
#pg-letter2 .letter-body {
  color: rgba(255,248,232,0.87);
}
#pg-letter2 .letter-cursor {
  background: rgba(220,188,110,0.92);
  box-shadow: 0 0 6px rgba(255,210,120,0.80), 0 0 14px rgba(255,195,90,0.45);
}

/* ═══════════════════════════════════════
   LETTER 2 — cosmic line-by-line reveal
═══════════════════════════════════════ */
#l2-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 0 clamp(24px, 8vw, 52px);
  text-align: center;
}
.l2-line {
  opacity: 0;
  color: rgba(255,248,232,0.88);
  font-size: clamp(1.05rem, 4.3vw, 1.28rem);
  font-weight: 300;
  line-height: 2.1;
  letter-spacing: 0.04em;
  text-shadow:
    0 0 28px rgba(190,160,255,0.18),
    0  1px  2px rgba(0,0,0,0.55);
  transform: translateY(16px);
  transition:
    opacity 1.8s cubic-bezier(0.25,0.46,0.45,0.94),

}

.l2-vis  { opacity: 1; transform: translateY(0); }

/* ═══════════════════════════════════════
   CHAPTER OVERVIEW — horizontal carousel
═══════════════════════════════════════ */

  align-items: stretch; justify-content: stretch;
}

/* Starfield bg for the chapters page */

  background-image:
    radial-gradient(1px 1px at  8% 12%, rgba(255,255,255,0.6) 0%, transparent 100%),

    radial-gradient(2px 2px at 70%  8%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 22%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 45%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 78% 65%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 62% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 92%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 28% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),

/* overview wrapper */

.ov-header { text-align: center; }
.ov-header-label {

}
.ov-header-tap {

/* carousel stage */

/* each card */
.cc {

.cc-bg   { position: absolute; inset: 0; }

/* Star field overlay */

    radial-gradient(1.2px 1.2px at 12%  8%, rgba(255,255,255,0.80) 0%, transparent 100%),

    radial-gradient(1.6px 1.6px at 48% 22%, rgba(255,255,255,0.90) 0%, transparent 100%),

    radial-gradient(1px   1px   at 22% 48%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 92% 55%, rgba(255,255,255,0.50) 0%, transparent 100%),
    radial-gradient(1px   1px   at  8% 65%, rgba(255,255,255,0.60) 0%, transparent 100%),
    radial-gradient(2px   2px   at 60% 18%, rgba(255,255,255,0.95) 0%, transparent 100%),
    radial-gradient(1px   1px   at 35% 75%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 78% 82%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 18% 88%, rgba(255,255,255,0.70) 0%, transparent 100%),
    radial-gradient(1px   1px   at 55% 92%, rgba(255,255,255,0.40) 0%, transparent 100%),
    radial-gradient(1.8px 1.8px at 40%  5%, rgba(255,255,255,0.95) 0%, transparent 100%),
    radial-gradient(1px   1px   at 95% 75%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1px   1px   at  3% 30%, rgba(255,255,255,0.50) 0%, transparent 100%),
    radial-gradient(1.4px 1.4px at 68% 65%, rgba(255,255,255,0.70) 0%, transparent 100%),
    radial-gradient(1px   1px   at 30% 42%, rgba(255,255,255,0.40) 0%, transparent 100%),
    radial-gradient(1px   1px   at 88% 28%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 52% 55%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(1px   1px   at 15% 95%, rgba(255,255,255,0.45) 0%, transparent 100%);
}

.cc-deco {
  position: absolute; top: 16px; right: 18px;
  font-size: 54px; line-height: 1;
  color: rgba(255,255,255,0.07); font-weight: 500;
  pointer-events: none;
}
.cc-line {
  position: absolute; bottom: 82px; left: 22px;
  width: 28px; height: 1px;
  background: rgba(160,200,255,0.55);
}
.cc-content {
  position: absolute; bottom: 0; left: 0; right: 0;

}

.cc-name { font-size: 26px; color: rgba(255,255,255,0.96); font-weight: 500; letter-spacing: -0.4px; margin-bottom: 4px; }
.cc-date { font-size: 12px; color: rgba(255,255,255,0.38); font-weight: 300; }

/* indicator dots */
.carousel-dots { display: flex; gap: 6px; }
.cdot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.cdot.active { width: 20px; border-radius: 3px; background: rgba(160,200,255,0.85); }

/* ═══════════════════════════════════════
   CHAPTER TITLE VEIL
═══════════════════════════════════════ */
#ch-veil {
  position: absolute; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  background: rgba(4,2,16,0.92);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
}
#ch-veil.show { opacity: 1; pointer-events: all; }
/* fully opaque while an episode is swapped behind it, so the rebuild
   underneath can never show through the chapter card */
#ch-veil.solid {
  background: #04020f;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}

.ch-vtitle {
  text-align: center;
  transform: scale(0.25); opacity: 0;
  transition: transform 0.8s cubic-bezier(0.16,1,0.3,1), opacity 0.6s ease;
}
.ch-vtitle.in  { transform: scale(1);    opacity: 1; }
.ch-vtitle.up  { transform: scale(0.5) translateY(-52px); opacity: 0; transition-duration: 0.55s; }

.ch-vt-num  { font-size: 10px; letter-spacing: 4px; color: rgba(170,205,255,0.78); font-weight: 300; margin-bottom: 12px; }
.ch-vt-name { font-size: 34px; color: white; font-weight: 500; letter-spacing: -0.4px; }

/* ═══════════════════════════════════════
   CHAPTER DETAIL — cosmic
═══════════════════════════════════════ */
.ch-detail {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  background: #06040e;
  opacity: 0; pointer-events: none;
  transition: opacity 0.38s ease;
}
.ch-detail.show { opacity: 1; pointer-events: all; }

.ch-hd {
  flex-shrink: 0;
  padding: calc(var(--sat) + 14px) 24px 16px;
  background: rgba(6,3,18,0.96);
  border-bottom: 1px solid rgba(160,140,255,0.12);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transform: translateY(-100%);
  transition: transform 0.65s cubic-bezier(0.16,1,0.3,1);
}
.ch-hd.in { transform: translateY(0); }
.ch-hd-num  { font-size: 9.5px; letter-spacing: 3px; color: rgba(172,158,255,0.72); font-weight: 300; margin-bottom: 4px; }
.ch-hd-name { font-size: 20px; color: rgba(255,248,235,0.96); font-weight: 500; }
.ch-hd-sub  { font-size: 12px; color: rgba(190,175,255,0.45); font-weight: 300; margin-top: 3px; }

.ch-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0;
  display: grid; grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: calc((100vw - 4px) / 3);
  gap: 2px;
  align-content: start;
  background: #06040e;
  opacity: 0; transition: opacity 0.45s ease 0.25s;
}
.ch-scroll::-webkit-scrollbar { display: none; }
.ch-scroll.show { opacity: 1; }

/* ── Instagram grid photo cells ── */
.photo-cell {
  position: relative; overflow: hidden;
  cursor: pointer; background: #0c0820;
  min-width: 0; min-height: 0;
}
.photo-cell img, .photo-cell video {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}
.photo-cell .cell-grad {
  position: absolute; inset: 0;
}
.photo-cell .cell-ph-icon {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.photo-cell .cell-vid-badge {
  position: absolute; top: 7px; right: 7px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
@keyframes cellTap {
  0%   { transform: scale(1);    opacity: 1; }
  35%  { transform: scale(0.86); opacity: 0.72; }
  100% { transform: scale(1);    opacity: 1; }
}
.photo-cell.tapping { animation: cellTap 0.38s cubic-bezier(0.16,1,0.3,1) forwards; }

/* ═══════════════════════════════════════
   PHOTO VIEWER — full-bleed cinematic frame
   Every shot fills the screen, drifts slowly (Ken Burns) and dissolves
   into the next, so a folder of stills plays back like a film.
═══════════════════════════════════════ */
#photo-viewer {
  position: absolute; inset: 0; z-index: 10;
  opacity: 0; pointer-events: none;
  transition: opacity 0.85s ease;
}
#photo-viewer.show { opacity: 1; pointer-events: all; }

.pv-backdrop { position: absolute; inset: 0; background: #000; }

.pv-body  { position: absolute; inset: 0; z-index: 1; }
.pv-stage { position: absolute; inset: 0; }

/* One layer per shot. The new shot sweeps in from the right as the old one
   is pushed off left — a directional advance, so each cut reads as time
   moving forward rather than as two images blending. Fast in, gentle settle. */
.pv-layer {
  position: absolute; inset: 0;
  opacity: 0;
  transform: translate3d(7%, 0, 0) scale(1.05);
  transition: opacity 0.42s ease,
              transform 0.66s cubic-bezier(0.19, 1, 0.28, 1);
  will-change: transform, opacity;
}
.pv-layer.in  { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
.pv-layer.out {
  opacity: 0; transform: translate3d(-5.5%, 0, 0) scale(0.975);
  transition: opacity 0.34s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Blurred, darkened copy fills the frame so no photo is ever cropped */
.pv-blur {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  filter: blur(38px) brightness(0.30) saturate(1.25);
  /* overscanned so the layer can slide without exposing a bare edge */
  transform: scale(1.26);
}
/* The photo itself — always whole, never cropped */
.pv-main {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  will-change: transform;
}

/* Ken Burns — slow drift, direction varied per shot so it never repeats */
@keyframes kb1 { from { transform: scale(1.00) translate( 0,     0);    } to { transform: scale(1.13) translate(-1.8%,-1.3%); } }
@keyframes kb2 { from { transform: scale(1.13) translate( 1.5%, 1.1%);  } to { transform: scale(1.00) translate( 0,     0);    } }
@keyframes kb3 { from { transform: scale(1.03) translate( 1.9%,-1.0%);  } to { transform: scale(1.15) translate(-1.3%, 1.1%); } }
@keyframes kb4 { from { transform: scale(1.15) translate(-1.6%, 1.0%);  } to { transform: scale(1.02) translate( 1.2%,-1.0%); } }
.pv-main.kb1 { animation: kb1 var(--kbdur, 7s) linear both; }
.pv-main.kb2 { animation: kb2 var(--kbdur, 7s) linear both; }
.pv-main.kb3 { animation: kb3 var(--kbdur, 7s) linear both; }
.pv-main.kb4 { animation: kb4 var(--kbdur, 7s) linear both; }

/* Subtitle scrim so captions stay readable over any photo */
.pv-scrim {
  position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  z-index: 1; pointer-events: none;
  background: linear-gradient(to top,
    rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.58) 34%, rgba(0,0,0,0.18) 66%, transparent 100%);
}

/* progress bars — thin film-strip ticks pinned to the top edge */
.pv-bars {
  position: absolute; z-index: 3;
  top: calc(var(--sat) + 10px);
  left: calc(var(--sal) + 14px); right: calc(var(--sar) + 14px);
  width: auto; padding: 0;
  display: flex; gap: 3px;
  opacity: 0;
  pointer-events: none;
}
.pv-bar {
  flex: 1; height: 2px; border-radius: 1px;
  background: rgba(255,255,255,0.22); overflow: hidden;
}
.pv-bar-fill {
  height: 100%; width: 0%;
  background: rgba(255,255,255,0.88);
  border-radius: 1px;
}
.pv-bar-fill.done   { width: 100%; }
@keyframes barFill  { to { width: 100%; } }
.pv-bar-fill.active { animation: barFill var(--pv-dur, 5s) linear forwards; }

/* the frame itself — edge to edge, no card, no rounding */
#pv-img {
  position: absolute; inset: 0;
  overflow: hidden; background: #000;
}
/* vignette — pulls the eye to the centre of frame, as a lens would */
#pv-img::after {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 76% 60% at 50% 46%, transparent 46%, rgba(0,0,0,0.45) 100%);
}

/* caption — sits low in frame like a film subtitle */
#pv-cap {
  position: absolute; z-index: 2;
  left: 0; right: 0;
  bottom: calc(var(--sab) + 40px);
  padding: 0 clamp(24px, 7vw, 96px);
  font-size: clamp(14.5px, min(4.2vw, 4.4vh), 19px);
  line-height: 1.9;
  color: rgba(255,255,255,0.97);
  text-align: center; white-space: pre-line;
  font-weight: 300;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 28px rgba(0,0,0,0.65);
  opacity: 0; transform: translateY(14px);
  transition: opacity 0.55s ease 0.15s, transform 0.55s cubic-bezier(0.16,1,0.3,1) 0.15s;
}
#photo-viewer.show #pv-cap { opacity: 1; transform: translateY(0); }
/* caption rides the cut with the shot rather than snapping to new text */
#photo-viewer.show #pv-cap.swapping {
  opacity: 0; transform: translateY(9px);
  transition: opacity 0.26s ease, transform 0.26s ease;
}

/* Footer reads as a scrim over the film, not as an app toolbar */
.ch-foot {
  flex-shrink: 0;
  padding: 16px 20px; padding-bottom: calc(var(--sab) + 16px);
  background: linear-gradient(to top, rgba(6,3,18,0.97) 45%, rgba(6,3,18,0) 100%);
  border-top: none;
  opacity: 0; transition: opacity 0.45s ease 0.45s;
}
.ch-foot.show { opacity: 1; }

.btn-next {
  width: 100%; height: 46px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.17);
  background: rgba(255,255,255,0.055);
  color: rgba(255,248,240,0.86);
  font-family: inherit; font-size: 13px; font-weight: 300; letter-spacing: 0.16em;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background 0.2s, transform 0.2s;
}
.btn-next:active { background: rgba(255,255,255,0.13); transform: scale(0.98); }

/* ═══════════════════════════════════════
   PROPOSAL
═══════════════════════════════════════ */
#pg-proposal { background: #06040e; overflow: hidden; }
/* Deep space glow + star field */
#pg-proposal::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(50,20,110,0.32) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 18% 18%, rgba(30,10,90,0.20) 0%, transparent 55%),
    radial-gradient(ellipse 35% 28% at 82% 78%, rgba(90,20,130,0.16) 0%, transparent 50%),
    radial-gradient(1.5px 1.5px at 10% 10%, rgba(255,255,255,0.72) 0%, transparent 100%),
    radial-gradient(1px   1px   at 28%  5%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(2px   2px   at 52% 10%, rgba(255,248,220,0.78) 0%, transparent 100%),
    radial-gradient(1px   1px   at 78%  4%, rgba(255,255,255,0.52) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 92% 20%, rgba(200,188,255,0.60) 0%, transparent 100%),
    radial-gradient(1px   1px   at  5% 48%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px   1px   at 96% 62%, rgba(255,255,255,0.48) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 65% 80%, rgba(200,188,255,0.52) 0%, transparent 100%),
    radial-gradient(1px   1px   at 38% 88%, rgba(255,255,255,0.48) 0%, transparent 100%),
    radial-gradient(1px   1px   at 16% 86%, rgba(255,255,255,0.42) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 82% 40%, rgba(255,255,255,0.45) 0%, transparent 100%);
  animation: ftNebulaBreath 10s ease-in-out infinite alternate;
}
.proposal-inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: calc(var(--sat) + 32px) 36px calc(var(--sab) + 32px); width: 100%;
}
.ring-wrap { width: 88px; height: 88px; margin-bottom: 34px; animation: ringFloat 3.5s ease-in-out infinite; }
@keyframes ringFloat { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-13px) rotate(2deg)} }
@keyframes ringAccept {
  0%   { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 0px rgba(129,216,208,0)); }
  25%  { transform: scale(1.18) rotate(6deg); filter: drop-shadow(0 0 14px rgba(129,216,208,0.9)); }
  50%  { transform: scale(0.92) rotate(-4deg); filter: drop-shadow(0 0 22px rgba(178,237,233,1)); }
  75%  { transform: scale(1.38) rotate(8deg); filter: drop-shadow(0 0 32px rgba(129,216,208,0.85)); }
  100% { transform: scale(1.45) rotate(5deg); filter: drop-shadow(0 0 48px rgba(129,216,208,0.6)); }
}
.ring-wrap.accept { animation: ringAccept 0.72s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes ringRipple {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.7; }
  100% { transform: translate(-50%,-50%) scale(22); opacity: 0; }
}
.ring-ripple {
  position: fixed; width: 10px; height: 10px;
  border: 1.5px solid var(--tiffany); border-radius: 50%;
  pointer-events: none; z-index: 999;
  animation: ringRipple 0.85s ease-out forwards;
}
.proposal-q   { font-size: 36px; color: var(--tiffany); font-weight: 300; line-height: 1.3; margin-bottom: 16px; letter-spacing: 0.5px; text-shadow: 0 0 32px rgba(129,216,208,0.45); }
.proposal-sub { font-size: 14px; color: rgba(255,255,255,0.4); line-height: 1.9; font-weight: 300; margin-bottom: 50px; }
.btn-yes {
  width: 260px; height: 56px; border-radius: 18px; border: none;
  background: linear-gradient(135deg, var(--tiffany), var(--tiffany-d));
  color: white; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer;
  box-shadow: 0 10px 36px rgba(129,216,208,0.38);
  transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 0.3px;
}
.btn-yes:active { transform: scale(0.96); box-shadow: 0 5px 18px rgba(129,216,208,0.22); }
.btn-no {
  position: fixed; width: 210px; height: 46px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.1); background: transparent;
  color: rgba(255,255,255,0.28); font-family: inherit; font-size: 14px; cursor: pointer;
  touch-action: manipulation; z-index: 50;
  transition: left 0.28s cubic-bezier(0.34,1.56,0.64,1), top 0.28s cubic-bezier(0.34,1.56,0.64,1);
}

/* ═══════════════════════════════════════
   ACCEPT
═══════════════════════════════════════ */
#pg-accept { background: #06040e; overflow: hidden; }
#pg-accept::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 75% 60% at 50% 45%, rgba(30,100,120,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 20% 18%, rgba(10,80,100,0.18) 0%, transparent 55%),
    radial-gradient(1.5px 1.5px at 12% 10%, rgba(255,255,255,0.72) 0%, transparent 100%),
    radial-gradient(2px   2px   at 54%  8%, rgba(255,248,220,0.78) 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 88% 18%, rgba(178,237,233,0.65) 0%, transparent 100%),
    radial-gradient(1px   1px   at  7% 50%, rgba(255,255,255,0.48) 0%, transparent 100%),
    radial-gradient(1px   1px   at 94% 60%, rgba(178,237,233,0.50) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 70% 82%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1px   1px   at 35% 90%, rgba(178,237,233,0.48) 0%, transparent 100%);
  animation: ftNebulaBreath 10s ease-in-out infinite alternate;
}
.accept-inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: calc(var(--sat) + 40px) 36px calc(var(--sab) + 40px); width: 100%;
}
.accept-icon { width: 88px; height: 88px; margin-bottom: 28px; animation: ringFloat 2.5s ease-in-out infinite; }
.accept-title {
  font-size: 30px; color: white; font-weight: 400; margin-bottom: 14px; letter-spacing: -0.3px;
  opacity: 0; transform: translateY(18px);
  transition: all 0.85s cubic-bezier(0.16,1,0.3,1) 0.25s;
}
.accept-title.in { opacity: 1; transform: translateY(0); }
.accept-sub {
  font-size: 14.5px; color: rgba(255,255,255,0.42); line-height: 2; font-weight: 300;
  opacity: 0; transform: translateY(18px);
  transition: all 0.85s cubic-bezier(0.16,1,0.3,1) 0.55s;
}
.accept-sub.in { opacity: 1; transform: translateY(0); }
.accept-badge {
  margin-top: 42px; padding: 14px 32px;
  border: 1px solid rgba(129,216,208,0.28); border-radius: 30px;
  font-size: 12.5px; color: var(--tiffany); letter-spacing: 1.5px;
  opacity: 0; transition: opacity 0.8s ease 0.95s;
}
.accept-badge.in { opacity: 1; }

/* ═══════════════════════════════════════
   PIXEL WORLD
═══════════════════════════════════════ */
#pg-world { background: #0d0b12; overflow: hidden; }
#world-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  touch-action: none;
}
/* Telling her how to walk. It lives just above the stick, in the same
   cut panel her thoughts arrive in, with an arrow blinking on the knob —
   and it goes the moment she takes her first step. */
#world-hint {
  --hb: clamp(3px, 0.5vh, 6px);
  position: absolute; z-index: 5;
  left: 50%; transform: translateX(-50%);
  bottom: calc(var(--sab) + 184px);
  background: #241f2b; padding: calc(var(--hb) * 1.6);
  clip-path: polygon(
    calc(var(--hb) * 2) 0, calc(100% - var(--hb) * 2) 0,
    100% calc(var(--hb) * 2), 100% calc(100% - var(--hb) * 2),
    calc(100% - var(--hb) * 2) 100%, calc(var(--hb) * 2) 100%,
    0 calc(100% - var(--hb) * 2), 0 calc(var(--hb) * 2));
  filter: drop-shadow(0 calc(var(--hb) * 1.2) 0 rgba(0,0,0,0.45));
  opacity: 0; pointer-events: none;
  transition: opacity .5s ease;
}
#world-hint span {
  display: block;
  padding: calc(var(--hb) * 2) calc(var(--hb) * 3.2);
  background: #f7f3ea; color: #241f2b;
  font-size: clamp(11.5px, 1.75vh, 18px); font-weight: 500; letter-spacing: -0.2px;
  white-space: nowrap;
  clip-path: polygon(
    var(--hb) 0, calc(100% - var(--hb)) 0, 100% var(--hb),
    100% calc(100% - var(--hb)), calc(100% - var(--hb)) 100%, var(--hb) 100%,
    0 calc(100% - var(--hb)), 0 var(--hb));
  box-shadow: inset var(--hb) var(--hb) 0 0 #fffdf6,
              inset calc(var(--hb) * -1) calc(var(--hb) * -1) 0 0 #d5cbba;
}
#world-hint.show { opacity: 1; }
@media (orientation: landscape) and (min-aspect-ratio: 12/10) {
  #world-hint { bottom: calc(var(--sab) + 184px); }
}
/* the arrow that blinks on the knob until she moves */
#stick-arrow {
  position: absolute; left: 50%; top: -6px;
  margin-left: -9px;
  width: 0; height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-bottom: 12px solid rgba(255,246,232,0.92);
  filter: drop-shadow(0 0 6px rgba(255,214,168,0.6));
  opacity: 0; pointer-events: none;
  transition: opacity .4s ease;
}
#stick-arrow.show { opacity: 1; animation: stickNudge 1.15s ease-in-out infinite; }
@keyframes stickNudge {
  0%, 100% { transform: translateY(0);    opacity: 0.45; }
  45%      { transform: translateY(-7px); opacity: 1; }
}

/* "enter here" pill — appears when the girl is standing at a door */
/* bottom-right, opposite the stick: the girl stays near the middle of the
   screen, so a centred pill would sit right on top of her */
/* Her thoughts, as a bubble drawn the way the world is drawn: square,
   hard-edged, with the corners notched back a pixel at a time. Two
   nested clipped panels give the ink outline and the cream face; every
   measurement is a multiple of one border unit, so it scales as a whole. */
#think {
  --tb: clamp(4px, 0.72vh, 9px);          /* one "pixel" of the bubble */
  position: absolute; z-index: 6;
  left: 0; top: 0;
  transform: translate(-50%, -100%);
  pointer-events: none;
  opacity: 0;
  transition: opacity .16s steps(3, end);
  filter: drop-shadow(0 calc(var(--tb) * 1.2) 0 rgba(0,0,0,0.45));
}
#think.show { opacity: 1; animation: thinkPop .2s steps(3, end) both; }
@keyframes thinkPop {
  0%   { transform: translate(-50%, -92%) scale(0.84); }
  100% { transform: translate(-50%, -100%) scale(1); }
}
/* the notch: corners cut back by two units on the frame, one on the face */
#think-box {
  background: #241f2b;
  padding: calc(var(--tb) * 2);
  clip-path: polygon(
    calc(var(--tb) * 2) 0, calc(100% - var(--tb) * 2) 0,
    100% calc(var(--tb) * 2), 100% calc(100% - var(--tb) * 2),
    calc(100% - var(--tb) * 2) 100%, calc(var(--tb) * 2) 100%,
    0 calc(100% - var(--tb) * 2), 0 calc(var(--tb) * 2));
}
#think-inner {
  position: relative;
  min-width: clamp(190px, 34vh, 400px);
  max-width: min(82vw, 560px);
  padding: calc(var(--tb) * 2.8) calc(var(--tb) * 3.8) calc(var(--tb) * 3.6);
  background: #f7f3ea;
  color: #241f2b;
  font-size: clamp(12.5px, 1.95vh, 21px);
  line-height: 1.7; letter-spacing: -0.2px; font-weight: 500;
  text-align: center; white-space: pre-wrap; word-break: keep-all;
  clip-path: polygon(
    var(--tb) 0, calc(100% - var(--tb)) 0,
    100% var(--tb), 100% calc(100% - var(--tb)),
    calc(100% - var(--tb)) 100%, var(--tb) 100%,
    0 calc(100% - var(--tb)), 0 var(--tb));
  /* a lit top-left edge and a shaded bottom-right, drawn inside the clip */
  box-shadow:
    inset var(--tb) var(--tb) 0 0 #fffdf6,
    inset calc(var(--tb) * -1) calc(var(--tb) * -1) 0 0 #d5cbba;
}
#think-text { position: relative; }
#think-more {                              /* the blinking "there's more" */
  position: absolute; right: calc(var(--tb) * 1.8); bottom: calc(var(--tb) * 0.8);
  width: 0; height: 0;
  border-left: calc(var(--tb) * 1.5) solid transparent;
  border-right: calc(var(--tb) * 1.5) solid transparent;
  border-top: calc(var(--tb) * 1.7) solid #241f2b;
  opacity: 0;
}
#think-more.on { opacity: 1; animation: thinkBlink 820ms steps(2, end) infinite; }
@keyframes thinkBlink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.08; } }
#think.go #think-more.on {                 /* the last line reads differently */
  animation: none; opacity: 1; border-top-color: #b0446a;
}
#think-tail {                              /* puffs of thought down to her */
  position: relative; height: calc(var(--tb) * 10); margin-top: calc(var(--tb) * 1.6);
}
#think-tail i {
  position: absolute; left: 50%; display: block;
  background: #f7f3ea; box-shadow: 0 0 0 calc(var(--tb) * 0.7) #241f2b;
}
#think-tail i:nth-child(1) {
  width: calc(var(--tb) * 2); height: calc(var(--tb) * 2);
  margin-left: calc(var(--tb) * -1); top: 0;
}
#think-tail i:nth-child(2) {
  width: calc(var(--tb) * 1.3); height: calc(var(--tb) * 1.3);
  margin-left: calc(var(--tb) * -0.65); top: calc(var(--tb) * 4);
}
#think-tail i:nth-child(3) {
  width: calc(var(--tb) * 0.8); height: calc(var(--tb) * 0.8);
  margin-left: calc(var(--tb) * -0.4); top: calc(var(--tb) * 7.2);
}
/* ══════════════════════════════════════════════════════════
   RECALL — the memories, opened over the hall itself
   She never leaves the aisle. The room dims behind a framed
   photograph that surfaces the way a memory does, and the
   caption arrives in the same textbox her thoughts use.
══════════════════════════════════════════════════════════ */
#recall {
  --rb: clamp(4px, 0.72vh, 9px);
  position: absolute; inset: 0; z-index: 8;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: calc(var(--rb) * 2);
  padding: calc(var(--sat) + 12px) 4vw calc(var(--sab) + 12px);
  opacity: 0; pointer-events: none;
  transition: opacity .5s ease;
}
#recall.show { opacity: 1; }
#rc-dim {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 46%, rgba(10,9,14,0.28) 0%, rgba(8,7,11,0.68) 66%, rgba(5,4,8,0.86) 100%);
  backdrop-filter: saturate(0.62) brightness(0.8) blur(1px);
  -webkit-backdrop-filter: saturate(0.62) brightness(0.8) blur(1px);
}
#rc-stage {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  gap: calc(var(--rb) * 2);
  max-width: 100%;
  transform: translateY(calc(var(--rb) * 2.4)) scale(0.96);
  opacity: 0;
  transition: transform .7s cubic-bezier(0.16,1,0.3,1), opacity .55s ease;
}
#recall.show #rc-stage { transform: translateY(0) scale(1); opacity: 1; }

/* the episode this memory belongs to */
#rc-ep {
  display: flex; align-items: center; gap: calc(var(--rb) * 1.6);
  color: rgba(240,224,198,0.82);
  font-size: clamp(9px, 1.35vh, 14px); letter-spacing: 0.34em;
  text-transform: uppercase;
}
#rc-ep b { font-weight: 500; letter-spacing: 0.06em; font-size: clamp(12px, 1.9vh, 19px); color: #f6ecdc; }
#rc-ep i { display: block; width: calc(var(--rb) * 0.8); height: calc(var(--rb) * 0.8); background: #d8c9b4; }

/* the frame: brass and cream, corners notched like everything else here */
#rc-frame {
  position: relative;
  /* a matted print: an ink surround with an ivory mount inside it, which
     is what the hall's own framed photographs look like */
  background: #26232c;
  padding: calc(var(--rb) * 1.1);
  clip-path: polygon(
    calc(var(--rb) * 2) 0, calc(100% - var(--rb) * 2) 0,
    100% calc(var(--rb) * 2), 100% calc(100% - var(--rb) * 2),
    calc(100% - var(--rb) * 2) 100%, calc(var(--rb) * 2) 100%,
    0 calc(100% - var(--rb) * 2), 0 calc(var(--rb) * 2));
  filter: drop-shadow(0 calc(var(--rb) * 1.4) 0 rgba(0,0,0,0.5));
  box-shadow: inset 0 0 0 var(--rb) #3b3743;
}
#rc-mat {
  position: relative; overflow: hidden;
  background: #ece2d2;
  padding: calc(var(--rb) * 1.8);
  clip-path: polygon(
    var(--rb) 0, calc(100% - var(--rb)) 0,
    100% var(--rb), 100% calc(100% - var(--rb)),
    calc(100% - var(--rb)) 100%, var(--rb) 100%,
    0 calc(100% - var(--rb)), 0 var(--rb));
}
#rc-media {
  position: relative; overflow: hidden; background: #1a1820;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.45);
  width: min(80vw, 440px); height: min(44vh, 330px);
}
#rc-side { display: flex; flex-direction: column; align-items: center; gap: calc(var(--rb) * 2); }
#rc-media > * {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: contain;
  opacity: 0; transition: opacity .62s ease;
  transform-origin: 50% 50%;
}
#rc-media > .on { opacity: 1; animation: rcDrift 7.5s linear both; }
@keyframes rcDrift { from { transform: scale(1.005); } to { transform: scale(1.075); } }
/* a warm bloom over the photograph, so it sits in the room's light */
#rc-mat::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255,226,178,0.10) 0%, rgba(0,0,0,0) 62%),
    linear-gradient(180deg, rgba(255,232,198,0.06) 0%, rgba(24,16,30,0.28) 100%);
}

/* how far through the memory she is */
#rc-pips { display: flex; gap: calc(var(--rb) * 0.9); }
#rc-pips i {
  display: block;
  width: calc(var(--rb) * 1.1); height: calc(var(--rb) * 1.1);
  background: rgba(246,236,220,0.24);
  transition: background .25s steps(2, end), transform .25s steps(2, end);
}
#rc-pips i.seen { background: rgba(246,236,220,0.5); }
#rc-pips i.now  { background: #f6ecdc; transform: scale(1.4); }

/* the caption, in the same box her thoughts arrive in */
#rc-box {
  background: #241f2b;
  padding: calc(var(--rb) * 2);
  clip-path: polygon(
    calc(var(--rb) * 2) 0, calc(100% - var(--rb) * 2) 0,
    100% calc(var(--rb) * 2), 100% calc(100% - var(--rb) * 2),
    calc(100% - var(--rb) * 2) 100%, calc(var(--rb) * 2) 100%,
    0 calc(100% - var(--rb) * 2), 0 calc(var(--rb) * 2));
  filter: drop-shadow(0 calc(var(--rb) * 1.2) 0 rgba(0,0,0,0.45));
}
#rc-inner {
  position: relative;
  min-width: min(78vw, 420px); max-width: min(84vw, 560px);
  padding: calc(var(--rb) * 2.4) calc(var(--rb) * 3.4) calc(var(--rb) * 3.2);
  background: #f7f3ea; color: #241f2b;
  font-size: clamp(12px, 1.95vh, 21px);
  line-height: 1.72; letter-spacing: -0.2px; font-weight: 500;
  text-align: center; white-space: pre-wrap; word-break: keep-all;
  clip-path: polygon(
    var(--rb) 0, calc(100% - var(--rb)) 0,
    100% var(--rb), 100% calc(100% - var(--rb)),
    calc(100% - var(--rb)) 100%, var(--rb) 100%,
    0 calc(100% - var(--rb)), 0 var(--rb));
  box-shadow:
    inset var(--rb) var(--rb) 0 0 #fffdf6,
    inset calc(var(--rb) * -1) calc(var(--rb) * -1) 0 0 #d5cbba;
}
#rc-more {
  position: absolute; right: calc(var(--rb) * 1.8); bottom: calc(var(--rb) * 0.7);
  width: 0; height: 0;
  border-left: calc(var(--rb) * 1.5) solid transparent;
  border-right: calc(var(--rb) * 1.5) solid transparent;
  border-top: calc(var(--rb) * 1.7) solid #241f2b;
  opacity: 0;
}
#rc-more.on { opacity: 1; animation: thinkBlink 820ms steps(2, end) infinite; }
#recall.last #rc-more.on { animation: none; border-top-color: #b0446a; }

@media (orientation: landscape) and (min-aspect-ratio: 12/10) {
  #recall { --rb: clamp(5px, 1.05vh, 13px); flex-direction: row; }
  #rc-stage { flex-direction: row; align-items: center; gap: calc(var(--rb) * 3); }
  #rc-media { width: min(50vw, 640px); height: min(64vh, 470px); }
  #rc-side { align-items: flex-start; gap: calc(var(--rb) * 1.8); }
  #rc-inner { min-width: min(30vw, 390px); max-width: min(34vw, 450px); text-align: left; }
  #rc-ep { align-self: flex-start; font-size: clamp(10px, 1.6vh, 16px); }
  #rc-ep b { font-size: clamp(14px, 2.4vh, 24px); }
}

/* ══════════════════════════════════════════════════════════
   FINALE — the letter and the question, over the hall
══════════════════════════════════════════════════════════ */
#finale {
  --rb: clamp(4px, 0.72vh, 9px);
  position: absolute; inset: 0; z-index: 9;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: calc(var(--rb) * 2.4);
  padding: calc(var(--sat) + 12px) 5vw calc(var(--sab) + 12px);
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease;
}
#finale.show { opacity: 1; }
#finale.ask  { pointer-events: auto; }
#fn-dim {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 46%, rgba(10,9,14,0.34) 0%, rgba(7,6,10,0.76) 66%, rgba(4,3,7,0.92) 100%);
  backdrop-filter: saturate(0.6) brightness(0.76) blur(1px);
  -webkit-backdrop-filter: saturate(0.6) brightness(0.76) blur(1px);
}
#fn-stage {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  gap: calc(var(--rb) * 2.4); max-width: 100%;
  transform: translateY(calc(var(--rb) * 2)) scale(0.97); opacity: 0;
  transition: transform .8s cubic-bezier(0.16,1,0.3,1), opacity .6s ease;
}
#finale.show #fn-stage { transform: none; opacity: 1; }
#fn-ring {
  width: min(176px, 34vw); height: auto; aspect-ratio: 44 / 48;
  image-rendering: pixelated; image-rendering: crisp-edges;
  display: none;
  filter: drop-shadow(0 0 calc(var(--rb) * 3) rgba(129,216,208,0.55));
  animation: fnRingIn .7s cubic-bezier(0.16,1,0.3,1) both;
}
#finale.ask #fn-ring { display: block; }
@keyframes fnRingIn { from { transform: translateY(14px) scale(0.7); opacity: 0; } to { transform: none; opacity: 1; } }
#fn-title {
  display: none;
  color: #a9ece6; font-size: clamp(19px, 3.4vh, 40px);
  letter-spacing: 0.16em; font-weight: 400; text-align: center; line-height: 1.35;
  text-shadow: 0 0 calc(var(--rb) * 3) rgba(129,216,208,0.5), 0 3px 0 rgba(0,0,0,0.5);
  animation: fnTitleIn 1.4s cubic-bezier(0.16,1,0.3,1) .35s both;
}
#finale.ask #fn-title { display: block; }
@keyframes fnTitleIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
#fn-box {
  background: #241f2b; padding: calc(var(--rb) * 2);
  clip-path: polygon(
    calc(var(--rb) * 2) 0, calc(100% - var(--rb) * 2) 0,
    100% calc(var(--rb) * 2), 100% calc(100% - var(--rb) * 2),
    calc(100% - var(--rb) * 2) 100%, calc(var(--rb) * 2) 100%,
    0 calc(100% - var(--rb) * 2), 0 calc(var(--rb) * 2));
  filter: drop-shadow(0 calc(var(--rb) * 1.2) 0 rgba(0,0,0,0.45));
}
#finale.ask #fn-box { display: none; }
#fn-inner {
  position: relative;
  min-width: min(76vw, 440px); max-width: min(84vw, 560px);
  padding: calc(var(--rb) * 2.6) calc(var(--rb) * 3.4) calc(var(--rb) * 3.4);
  background: #f7f3ea; color: #241f2b;
  font-size: clamp(13px, 2.05vh, 22px);
  line-height: 1.85; letter-spacing: -0.2px; font-weight: 500;
  text-align: center; white-space: pre-wrap; word-break: keep-all;
  clip-path: polygon(
    var(--rb) 0, calc(100% - var(--rb)) 0,
    100% var(--rb), 100% calc(100% - var(--rb)),
    calc(100% - var(--rb)) 100%, var(--rb) 100%,
    0 calc(100% - var(--rb)), 0 var(--rb));
  box-shadow:
    inset var(--rb) var(--rb) 0 0 #fffdf6,
    inset calc(var(--rb) * -1) calc(var(--rb) * -1) 0 0 #d5cbba;
}
#fn-more {
  position: absolute; right: calc(var(--rb) * 1.8); bottom: calc(var(--rb) * 0.8);
  width: 0; height: 0;
  border-left: calc(var(--rb) * 1.5) solid transparent;
  border-right: calc(var(--rb) * 1.5) solid transparent;
  border-top: calc(var(--rb) * 1.7) solid #241f2b;
  opacity: 0;
}
#fn-more.on { opacity: 1; animation: thinkBlink 820ms steps(2, end) infinite; }
/* while he is the one talking, the box grows a tail and a name plate */
#fn-who {
  display: none;
  align-self: flex-start; margin-left: calc(var(--rb) * 2);
  background: #241f2b; color: #f6ecdc;
  padding: calc(var(--rb) * 0.8) calc(var(--rb) * 2);
  font-size: clamp(11px, 1.6vh, 17px); letter-spacing: 0.1em;
  clip-path: polygon(var(--rb) 0, calc(100% - var(--rb)) 0, 100% var(--rb),
    100% calc(100% - var(--rb)), calc(100% - var(--rb)) 100%, var(--rb) 100%,
    0 calc(100% - var(--rb)), 0 var(--rb));
}
#finale.says #fn-who { display: block; }
#fn-tail { display: none; width: 0; height: 0;
  border-left: calc(var(--rb) * 2.4) solid transparent;
  border-right: calc(var(--rb) * 2.4) solid transparent;
  border-top: calc(var(--rb) * 3) solid #241f2b;
  margin-top: calc(var(--rb) * -0.5);
}
#finale.says #fn-tail { display: block; }
#finale.says {
  justify-content: flex-start;
  padding-top: var(--says-top, calc(var(--sat) + 6vh));
}
/* while he is talking the hall stays readable — he is the one you look at */
#finale.says #fn-dim {
  background: radial-gradient(ellipse at 50% 52%, rgba(8,7,11,0.18) 0%, rgba(6,5,9,0.62) 62%, rgba(4,3,7,0.84) 100%);
  backdrop-filter: saturate(0.7) brightness(0.9);
  -webkit-backdrop-filter: saturate(0.7) brightness(0.9);
}
/* the two answers, as pressable slabs cut the same way as everything else */
/* the very last card lets the hall through — they are still standing in it */
#finale.soft #fn-dim {
  background: linear-gradient(180deg, rgba(6,5,9,0.62) 0%, rgba(6,5,9,0.14) 46%, rgba(6,5,9,0) 72%);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
#finale.soft { justify-content: flex-start; padding-top: calc(var(--sat) + 7vh); }
#finale.soft #fn-inner { line-height: 2.1; }
#fn-btns { display: none; gap: calc(var(--rb) * 2.4); animation: fnTitleIn 1.1s cubic-bezier(0.16,1,0.3,1) .9s both; }
#finale.ask #fn-btns { display: flex; }
/* the moment she says yes, everything inside — ring, box, name plate,
   buttons — drops out together so nothing has a chance to reappear
   for the half-second the panel takes to fade, whatever state it was
   last in */
#finale.closing #fn-ring, #finale.closing #fn-title,
#finale.closing #fn-box, #finale.closing #fn-btns,
#finale.closing #fn-who, #finale.closing #fn-tail { display: none !important; }
.fn-btn {
  position: relative; cursor: pointer; user-select: none;
  padding: calc(var(--rb) * 1.8) calc(var(--rb) * 4.4);
  font-size: clamp(14px, 2.2vh, 24px); font-weight: 500; letter-spacing: 0.1em;
  background: #241f2b; color: #f7f3ea;
  clip-path: polygon(
    calc(var(--rb) * 1.4) 0, calc(100% - var(--rb) * 1.4) 0,
    100% calc(var(--rb) * 1.4), 100% calc(100% - var(--rb) * 1.4),
    calc(100% - var(--rb) * 1.4) 100%, calc(var(--rb) * 1.4) 100%,
    0 calc(100% - var(--rb) * 1.4), 0 calc(var(--rb) * 1.4));
  box-shadow: inset var(--rb) var(--rb) 0 0 rgba(255,255,255,0.14),
              inset calc(var(--rb) * -1) calc(var(--rb) * -1) 0 0 rgba(0,0,0,0.4);
}
#fn-yes {
  background: #2f6f6a; color: #eafffb;
  font-size: clamp(17px, 2.9vh, 30px); letter-spacing: 0.12em;
  padding: calc(var(--rb) * 2) calc(var(--rb) * 6);
  animation: fnYes 1.6s ease-in-out infinite;
}
@keyframes fnYes { 0%,100% { transform: none; } 50% { transform: translateY(-3px); } }
#fn-yes:active { transform: translateY(2px); }

#world-stick {
  position: absolute; z-index: 5;
  left: calc(var(--sal) + 26px); bottom: calc(var(--sab) + 26px);
  width: 116px; height: 116px; border-radius: 50%;
  background: rgba(12,8,26,0.28);
  border: 2px solid rgba(255,255,255,0.34);
  touch-action: none;
  opacity: 0; transition: opacity 0.5s ease;
}
#world-stick.show { opacity: 1; }
#world-stick-knob {
  position: absolute; left: 50%; top: 50%;
  width: 50px; height: 50px; margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: rgba(255,255,255,0.88);
  border: 2px solid rgba(40,25,70,0.5);
  box-shadow: 0 3px 0 rgba(0,0,0,0.25);
}

/* ═══════════════════════════════════════
   CONFETTI
═══════════════════════════════════════ */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1000; display: none; }

/* Layout wrappers — invisible in portrait, become flex containers in landscape */
.pv-stage, .proposal-text, .accept-text { display: contents; }

/* ═══════════════════════════════════════════════════════════════════
   LANDSCAPE — phone rotated sideways (cinematic widescreen layout)
   Targets phones only: tablets/desktop stay on the portrait layout.
═══════════════════════════════════════════════════════════════════ */
@media (orientation: landscape) and (min-aspect-ratio: 12/10) {

  /* Sideways there is no top notch to clear, so the portrait fallbacks
     (44px / 34px) would waste the little height we have. Fall back to 0
     and let a real device inset override it where one exists. */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    /* height reserved under the photo for the caption (2 lines + padding) */
    --cap-band: calc(var(--sab) + clamp(84px, 23vh, 190px));
    /* one scale knob: everything sideways is sized off viewport height, so
       the same layout holds from a 393px-tall phone up to a 1080p TV */
    --u: clamp(1px, 0.255vh, 2.4px);
  }

  /* ── LOCK: she stands on the left, the keypad on the right ── */
  #pg-lock { padding: 10px calc(var(--sar) + 3vw) 10px calc(var(--sal) + 3vw); }
  .lock-card {
    flex: none;
    flex-direction: row; align-items: center; justify-content: center;
    gap: clamp(24px, 4vw, 56px);
    width: min(860px, 100%); padding: 0;
  }
  /* the left column has to be wide enough that the question does not
     wrap every few characters */
  #lock-bride { width: clamp(130px, 18vw, 220px); }
  .lock-top {
    flex: 0 1 auto; gap: clamp(10px, 1.8vh, 20px);
    width: clamp(240px, 34vw, 380px); min-width: 240px;
  }
  .lock-bottom { width: clamp(230px, 32vw, 340px); flex: none; gap: calc(var(--lb) * 2); }
  .keypad { gap: calc(var(--lb) * 1.8); }
  .key    { height: clamp(38px, 9vh, 62px); }

  /* ── CAROUSEL: shorter cards, tighter spacing ── */
  #ov-wrap { gap: calc(13 * var(--u)); padding: calc(8 * var(--u)) 0; }
  .carousel-stage { height: calc(250 * var(--u)); }
  .cc {
    width: calc(190 * var(--u)); height: calc(246 * var(--u));
    margin-left: calc(-95 * var(--u)); border-radius: calc(19 * var(--u));
  }
  .cc-deco { font-size: calc(40 * var(--u)); top: calc(12 * var(--u)); right: calc(14 * var(--u)); }
  .cc-line { bottom: calc(66 * var(--u)); left: calc(17 * var(--u)); width: calc(22 * var(--u)); }
  .cc-content { padding: 0 calc(17 * var(--u)) calc(19 * var(--u)); }
  .cc-num  { font-size: calc(8.5 * var(--u)); letter-spacing: calc(2.4 * var(--u)); margin-bottom: calc(4 * var(--u)); }
  .cc-name { font-size: calc(20 * var(--u)); margin-bottom: calc(3 * var(--u)); }
  .cc-date { font-size: calc(10.5 * var(--u)); }

  /* ── CHAPTER TITLE VEIL ── */
  .ch-vt-num  { font-size: calc(9 * var(--u)); letter-spacing: calc(3.4 * var(--u)); margin-bottom: calc(9 * var(--u)); }
  .ch-vt-name { font-size: calc(27 * var(--u)); }
  .ch-vtitle.up { transform: scale(0.5) translateY(calc(-34 * var(--u))); }

  /* ── CHAPTER DETAIL: title rail on the left, photo grid fills the rest ── */
  .ch-detail {
    --sb: calc(200 * var(--u));        /* sidebar width */
    display: grid;
    grid-template-columns: var(--sb) 1fr;
    grid-template-rows: 1fr auto;
    grid-template-areas: "hd grid" "foot grid";
    padding-left: var(--sal); padding-right: var(--sar);
  }
  .ch-hd {
    grid-area: hd;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: calc(16 * var(--u)) calc(18 * var(--u)) calc(10 * var(--u));
    border-bottom: none;
    border-right: 1px solid rgba(160,140,255,0.12);
    transform: translateX(-100%);
  }
  .ch-hd.in { transform: translateX(0); }
  .ch-hd-num  { font-size: calc(9 * var(--u)); letter-spacing: calc(2.6 * var(--u)); }
  .ch-hd-name { font-size: calc(17 * var(--u)); }
  .ch-hd-sub  { font-size: calc(11 * var(--u)); }
  .ch-scroll {
    grid-area: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: calc((100vw - var(--sal) - var(--sar) - var(--sb) - 8px) / 5);
  }
  .ch-foot {
    grid-area: foot;
    padding: 0 calc(18 * var(--u)) calc(14 * var(--u));
    padding-bottom: calc(var(--sab) + 14 * var(--u));
    background: transparent; border-top: none;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    border-right: 1px solid rgba(160,140,255,0.12);
  }
  .btn-next { height: calc(44 * var(--u)); font-size: calc(13.5 * var(--u)); border-radius: 999px; }

  /* ── PHOTO VIEWER — cast to a TV ──
     Landscape is watched on a big screen, so the photo is centred in its own
     area and the caption sits on a clean band beneath it rather than lying
     over the image. The blurred backdrop still fills the panel behind both. */
  /* explicit height, not auto insets — an <img> with auto size falls back to
     its intrinsic dimensions rather than filling the inset box */
  .pv-main {
    top: 16px; bottom: auto; left: 0; right: 0;
    width: 100%;
    height: calc(100% - 16px - var(--cap-band));
  }
  #pv-cap {
    bottom: calc(var(--sab) + 22 * var(--u));
    padding: 0 clamp(40px, 12vw, 190px);
    font-size: clamp(15px, 3.9vh, 30px);
    line-height: 1.7;
  }
  .pv-scrim { height: 42%; }

  /* ── FUTURE PAGE ── */
  #ft-bg { inset: -20px -30px; }
  #ft-end-msg {
    font-size: clamp(0.95rem, 3.8vh, 2.1rem);
    line-height: 1.95;
  }

  /* ── LETTER 2: tighter leading so all lines fit the short viewport ── */
  #l2-content { padding: 0 clamp(28px, 7vw, 64px); }
  .l2-line {
    font-size: clamp(0.95rem, 3.6vh, 2.1rem);   /* grows on a cast TV */
    line-height: 1.74;
  }
  .l2-blank { height: 0.45em; }

  /* ── PROPOSAL: ring on the left, question and answer on the right ── */
  .proposal-inner {
    flex-direction: row; align-items: center; justify-content: center;
    gap: clamp(26px, 6vw, 60px); text-align: left;
    padding: 12px calc(var(--sar) + 5vw) 12px calc(var(--sal) + 5vw);
  }
  .proposal-text {
    display: flex; flex-direction: column;
    align-items: flex-start; min-width: 0;
  }
  .ring-wrap { width: 84px; height: 84px; margin-bottom: 0; flex: none; }
  .proposal-q   { font-size: 30px; margin-bottom: 9px; line-height: 1.25; }
  .proposal-sub { font-size: 12.5px; line-height: 1.75; margin-bottom: 22px; }
  .btn-yes { width: 210px; height: 48px; font-size: 15px; border-radius: 15px; }
  .btn-no  { width: 168px; height: 40px; font-size: 13px; }

  /* ── ACCEPT: same two-column rhythm as the proposal ── */
  .accept-inner {
    flex-direction: row; align-items: center; justify-content: center;
    gap: clamp(26px, 6vw, 60px); text-align: left;
    padding: 12px calc(var(--sar) + 5vw) 12px calc(var(--sal) + 5vw);
  }
  .accept-text {
    display: flex; flex-direction: column;
    align-items: flex-start; min-width: 0;
  }
  .accept-icon  { width: 84px; height: 84px; margin-bottom: 0; flex: none; }
  .accept-title { font-size: 25px; margin-bottom: 10px; }
  .accept-sub   { font-size: 12.5px; line-height: 1.8; }
  .accept-badge { margin-top: 20px; padding: 10px 24px; font-size: 11.5px; }
}
</style>
</head>

        <path d="M23 58 A21 7 0 0 1 65 58" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="37" y1="46" x2="34" y2="40" stroke="#81D8D0" stroke-width="2" stroke-linecap="round"/>
        <line x1="51" y1="46" x2="54" y2="40" stroke="#81D8D0" stroke-width="2" stroke-linecap="round"/>
        <path d="M44 13 L57 27 L44 41 L31 27 Z" fill="#81D8D0"/>

/* ── Media preload pool ──
   Photos: preloaded as Image() → browser HTTP cache
   Videos: kept as <video preload="auto"> in a hidden DOM div so the
   download buffer survives between viewer opens / closes.           */
const _vidPool  = new Map(); // src → <video>
const _imgDone  = new Set(); // srcs already issued as Image()

function _mpc() {           // returns (or creates) the hidden preload container
  let d = document.getElementById('_mpc');
  if (!d) {
    d = document.createElement('div');
    d.id = '_mpc';
    d.style.cssText = 'position:fixed;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none;z-index:-1;';
    document.body.appendChild(d);
  }
  return d;
}

function preloadChapterMedia(chIdx) {
  const ch = CHAPTERS[chIdx];
  if (!ch) return;
  ch.photos.forEach(p => {
    if (!p.src) return;
    if (isVideoSrc(p.src)) {
      if (!_vidPool.has(p.src)) {
        const v = document.createElement('video');
        v.src = p.src; v.preload = 'auto'; v.muted = true; v.playsInline = true;
        v.load();
        _mpc().appendChild(v);
        _vidPool.set(p.src, v);
      }
    } else {
      if (!_imgDone.has(p.src)) {
        _imgDone.add(p.src);
        const img = new Image(); img.src = p.src; // prime browser cache
      }
    }
  });
}

function _returnVidToPool(vid) {
  if (!vid) return;
  vid.pause();
  vid.muted = true;
  vid.currentTime = 0;
  vid.style.cssText = '';
  _mpc().appendChild(vid); // moves element, buffer stays alive
}

function initLock() {
  const row = $('pin-dots');

    const d = document.createElement('div');
    d.className = 'pd'; d.id = `pd${i}`;

  document.querySelector('.keypad').addEventListener('click', e => {
    const key = e.target.closest('.key'); if (!key) return;
    bgmPrime();                       // a real tap: the only chance to unlock audio
    const k = key.dataset.k;
    if (k === 'del') {
      if (pin.length) { pin = pin.slice(0,-1); syncDots(); }
    } else if (k === 'ok') {
      checkPin();
    } else if (pin.length < PIN_LEN) {
      pin += k; syncDots();
      if (pin.length === PIN_LEN) setTimeout(checkPin, 250);
    }
  });

  /* A long press anywhere on this screen reveals the two switches. There
     is nothing on the page hinting at it, which is the point. */
  let holdTimer = null;
  const startHold = e => {
    bgmPrime();                       // any touch here is a chance to unlock audio
    if (e.target.closest('.key') || e.target.closest('.mode-toggle')) return;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      holdTimer = null;
      $('mode-toggle').classList.toggle('show');
    }, 1600);
  };
  const endHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
  const lockPage = $('pg-lock');
  lockPage.addEventListener('pointerdown', startHold);
  lockPage.addEventListener('pointerup', endHold);
  lockPage.addEventListener('pointercancel', endHold);
  lockPage.addEventListener('pointermove', e => {
    if (holdTimer && (Math.abs(e.movementX) > 6 || Math.abs(e.movementY) > 6)) endHold();
  });

/* ══════════════════════════════════════════════════════════
   LOCK SCREEN — she is already standing there
   The same pixel bride the hall draws, on a scrap of runner,
   breathing and shifting her weight while she waits.
══════════════════════════════════════════════════════════ */
let _lockRaf = 0, _lockP = null;

function lockBrideFrame(t) {
  // a nine-second loop: mostly standing and breathing, with a few small
  // steps in the middle of it so she never looks frozen
  const cyc = t % 9200;
  const walking = cyc > 6200 && cyc < 8600;
  const step = walking ? (Math.floor((cyc - 6200) / 280) % 2 ? 1 : 2) : 0;
  const breath = Math.sin(t / 1500) > 0.25 ? 1 : 0;
  const sway = walking ? 0 : Math.round(Math.sin(t / 2700));
  return { step, breath, sway };
}

function drawLockBride(t) {
  const cv = $('lock-bride');
  if (!cv) return;
  if (!_lockP) _lockP = pxc(80, 66);
  const p = _lockP;
  p.g.clearRect(0, 0, 80, 66);

  // a scrap of the hall: runner down the middle, flowers either side
  R(p, 0, 0, 80, 66, C.carpet);
  SPEC(p, 0, 0, 80, 66, C.carpetD, 0.1, 5);
  R(p, 23, 0, 34, 66, C.runner);
  SPEC(p, 23, 0, 34, 66, C.runnerL, 0.07, 9);
  R(p, 23, 0, 2, 66, C.runnerD); R(p, 55, 0, 2, 66, C.runnerD);
  R(p, 25, 0, 1, 66, C.runnerL); R(p, 54, 0, 1, 66, C.runnerL);
  for (const [x0, flip] of [[8, 0], [57, 1]]) {
    const g = mulberry(x0 * 31 + 7);
    R(p, x0, 0, 15, 66, C.gr4);
    for (let k = 0; k < 300; k++) {
      const dx = (g() * 15) | 0, y = (g() * 66) | 0;
      D(p, x0 + (flip ? 14 - dx : dx), y, g() > 0.5 ? C.gr3 : C.gr2);
    }
    for (let k = 0; k < 90; k++) {
      const dx = (g() * 15) | 0, y = (g() * 66) | 0;
      D(p, x0 + (flip ? 14 - dx : dx), y, g() > 0.5 ? C.gyp : C.pk1);
    }
    for (let k = 0; k < 74; k++) {
      const dx = 1 + ((g() * 13) | 0), y = 1 + ((g() * 64) | 0);
      const u = g();
      const col = u > 0.84 ? C.wh1 : u > 0.6 ? C.pk1 : u > 0.38 ? C.pk2
                : u > 0.2 ? C.pk3 : u > 0.08 ? C.lv1 : C.lv2;
      BLOB(p, x0 + (flip ? 14 - dx : dx), y, 1.5, 1.3, col);
    }
  }
  // the light she is standing in
  p.g.save();
  const gr = p.g.createRadialGradient(40, 44, 2, 40, 44, 32);
  gr.addColorStop(0, 'rgba(255,226,178,0.22)');
  gr.addColorStop(1, 'rgba(255,226,178,0)');
  p.g.fillStyle = gr; p.g.fillRect(6, 14, 68, 52);
  p.g.restore();

  const f = lockBrideFrame(t);
  pxBride(p, 40 + f.sway, 60 - f.breath, 'down', f.step);

  const g2 = cv.getContext('2d');
  g2.imageSmoothingEnabled = false;
  g2.clearRect(0, 0, 80, 66);
  g2.drawImage(p.c, 0, 0);
}

function startLockBride() {
  if (_lockRaf) return;
  const loop = ts => { drawLockBride(ts); _lockRaf = requestAnimationFrame(loop); };
  _lockRaf = requestAnimationFrame(loop);
}
function stopLockBride() {
  if (_lockRaf) { cancelAnimationFrame(_lockRaf); _lockRaf = 0; }
}

/* the three lines that set the scene, stacking up top to bottom. The
   dots (and their format hint) arrive a beat after the third line has
   landed, and the keypad itself only after a further beat past that —
   three distinct arrivals, not one pile-up at the end */
let _lockLineTimers = [];
function playLockLines() {
  _lockLineTimers.forEach(clearTimeout);
  _lockLineTimers = [];
  const lines = document.querySelectorAll('#lock-q .lq-line');
  const dots = $('pin-dots');
  const hint = $('lock-format-hint');
  const bottom = document.querySelector('.lock-bottom');
  lines.forEach(l => l.classList.remove('on'));
  dots.classList.remove('show');
  hint.classList.remove('show');
  bottom.classList.remove('show');
  if (!lines.length) return;
  const lineDelays = [450, 1950, 3550];
  lines.forEach((line, i) => {
    _lockLineTimers.push(setTimeout(() => line.classList.add('on'),
      lineDelays[i] ?? lineDelays[lineDelays.length - 1] + i * 850));
  });
  const lastLine = lineDelays[lineDelays.length - 1];
  _lockLineTimers.push(setTimeout(() => {
    dots.classList.add('show');
    hint.classList.add('show');
  }, lastLine + 800));
  _lockLineTimers.push(setTimeout(() => {
    bottom.classList.add('show');
  }, lastLine + 800 + 950));
}

function syncDots(err = false) {
  for (let i = 0; i < PIN_LEN; i++) {
    const d = $(`pd${i}`);
    d.classList.toggle('on', i < pin.length);
    d.classList.toggle('err', err);
  }
}

async function playEntrance() {
  const el = $('entrance');
  el.className = 'on';

  $('en-2').classList.remove('in');
  await sleep(800);

  $('en-1').classList.add('in');          // 신부 rises, alone, on black
  await sleep(2000);
  $('en-1').classList.remove('in');       // and fades away again
  await sleep(950);

  $('en-2').classList.add('in');          // 입장!
  await sleep(2300);
  $('en-2').classList.remove('in');
  await sleep(700);

  el.classList.add('doors-in');           // only now does the gate itself appear, closed
  bgmTry();                               // the music starts with the door, not after it opens
  await sleep(650);
  el.classList.add('open');               // and swings open on its hinges
  await sleep(2100);

  el.classList.add('glare');              // for a moment it is all light
  await sleep(1000);

  // the hall is already there behind it; the glare simply lifts
  showPage('pg-world');
  W.on = true; W.locked = false; W.last = 0;

async function checkPin() {
  if (pin === ANSWER) {
    const lockEl = $('pg-lock');
    lockEl.style.transition = 'transform 1.1s cubic-bezier(0.16,1,0.3,1), opacity 0.85s ease';
    lockEl.style.transform  = 'scale(1.4)';
    lockEl.style.opacity    = '0';
    await sleep(800);
    const resetLock = () => {
      lockEl.style.transition = '';
      lockEl.style.transform  = '';
      lockEl.style.opacity    = '';
    };
    if (classicMode) {
      // The card version still opens on a letter, in the same style the
      // reel closes with.
      await fadeTo('pg-letter2', resetLock);
      startCosmicLetter(LETTER_INTRO, startJourney);
    } else {

      resetLock();

/* ════════════════════════════════════
   COSMIC LETTER 2 — line-by-line reveal
════════════════════════════════════ */
async function startCosmicLetter(text, onDone) {
  const content = $('l2-content');
  content.innerHTML = '';
  const lines = text.split('\n');
  const lastIdx = lines.reduce((last, l, i) => l !== '' ? i : last, -1);

  const els = lines.map((line, idx) => {
    const p = document.createElement('p');
    const isBlank = line === '';
    const isLast  = idx === lastIdx;
    p.className = 'l2-line' + (isBlank ? ' l2-blank' : '') + (isLast ? ' l2-last' : '');
    if (!isBlank) p.textContent = line;
    content.appendChild(p);
    return { el: p, blank: isBlank };
  });

  await sleep(900);
  for (const { el, blank } of els) {
    el.classList.add('l2-vis');
    await sleep(blank ? 650 : 2100);
  }

  await sleep(2800);
  if (onDone) onDone();
}

/* True when the phone is held sideways — must match the CSS media query. */
function isLandscape() {
  return window.matchMedia('(orientation: landscape) and (min-aspect-ratio: 12/10)').matches;
}

// px between card centers — measured off the card the active layout produced,
// so it keeps up as the cards scale with the screen (phone → TV)
function cardStep() {
  const c = document.getElementById('cc0');
  const w = c ? c.offsetWidth : 0;   // offsetWidth ignores the drag transform
  if (w > 0) return Math.round(w * 1.114);
  return isLandscape() ? 212 : 305;
}

// Per-card nebula: stronger, more saturated, distinct per episode

const CC_GLOW = [

  '0 28px 72px rgba(0,0,0,0.75), 0 0 0 1px rgba(200,40,255,0.22), 0 0 56px rgba(180,20,240,0.14)',
