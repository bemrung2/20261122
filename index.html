}

/* ════════════════════════════════════
   PHOTO VIEWER & AUTO-PLAY
════════════════════════════════════ */
let isManualMode = false; // set via secret triple-tap on 민소 circle
let classicMode  = false; // ON → old card carousel; default is the pixel world
let apChIdx      = -1;   // autoplay: current chapter
let apPIdx       = 0;    // autoplay: current photo index
let apRunning    = false;
let apTimer      = null;
let apRemaining  = 4000; // ms remaining when paused
let apTimerStart = 0;    // timestamp when current timer started
let apHolding    = false;

function startAutoPlay(chIdx)            { startAutoPlayFrom(chIdx, 0); }
function startAutoPlayFrom(chIdx, pIdx)  {
  stopAutoPlay();
  apChIdx   = chIdx;
  apPIdx    = pIdx;
  apRunning = true;
  runAutoStep(chIdx, pIdx);
}

function stopAutoPlay() {
  _apGen++;          // invalidate any in-flight openPhotoViewer calls
  apRunning = false;
  apChIdx   = -1;
  apHolding = false;
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
}

async function runAutoStep(chIdx, pIdx) {
  if (!apRunning || apChIdx !== chIdx || isManualMode) return;
  apPIdx = pIdx;

  // tap animation on grid cell
  const cells = $('ch-scroll').querySelectorAll('.photo-cell');
  const cell  = cells[pIdx];
  if (cell) {
    cell.classList.remove('tapping');
    void cell.offsetWidth;
    cell.classList.add('tapping');
  }
  await sleep(1200);
  if (!apRunning || apChIdx !== chIdx) return;

  const dur = await openPhotoViewer(chIdx, pIdx, true);
  startHoldTimer(dur);
}

/* ── 홀드 타이머 (일시정지 지원) ── */
function startHoldTimer(ms) {
  if (isManualMode || !apRunning) return; // manual mode or stopped: no auto-advance
  if (apTimer) { clearTimeout(apTimer); apTimer = null; }
  apRemaining  = ms;
  apTimerStart = Date.now();
  apHolding    = false;
  apTimer = setTimeout(async () => {
    if (!apRunning) return;
    const chIdx = apChIdx;
    const pIdx  = apPIdx;
    const ch    = CHAPTERS[chIdx];

    if (pIdx >= ch.photos.length - 1) {
      // 마지막 사진 → 다음 에피소드로 자동 전환
      onChapterNext();
      return;
    }

    // 다음 사진으로 — 뷰어 유지, 사진만 교체
    if (!apRunning || apChIdx !== chIdx) return;
    apPIdx = pIdx + 1;
    const dur = await openPhotoViewer(chIdx, pIdx + 1, true);
    startHoldTimer(dur);
  }, ms);
}

function pauseHold() {
  if (!apRunning || apHolding || !apTimer) return;
  apHolding = true;
  clearTimeout(apTimer); apTimer = null;
  apRemaining = Math.max(80, apRemaining - (Date.now() - apTimerStart));
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = 'paused';
  const kb = $('pv-img')?.querySelector('.pv-layer.in .pv-main');
  if (kb) kb.style.animationPlayState = 'paused';   // freeze the drift too
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.pause();
}

function resumeHold() {
  if (!apHolding) return;
  apHolding = false;
  const fill = $('pv-bars')?.querySelector('.pv-bar-fill.active');
  if (fill) fill.style.animationPlayState = '';
  const kb = $('pv-img')?.querySelector('.pv-layer.in .pv-main');
  if (kb) kb.style.animationPlayState = '';
  const vid = $('pv-img')?.querySelector('video');
  if (vid) vid.play().catch(() => {});
  startHoldTimer(apRemaining);
}

async function openPhotoViewer(chIdx, pIdx, isAuto) {
  const myGen = _apGen;   // capture — if stopAutoPlay fires mid-await, myGen !== _apGen
  const ch    = CHAPTERS[chIdx];
  const photo = ch.photos[pIdx];
  const pv    = $('photo-viewer');
  const pvImg = $('pv-img');
  const alreadyOpen = pv.classList.contains('show');
  const isVideo = photo.src && /\.(mp4|mov|webm|m4v)$/i.test(photo.src);

  let dur = 6000;

  // Build the incoming shot in its own layer, so it can dissolve over the
  // outgoing one instead of the frame blinking to black between photos.
  const prevLayers = [...pvImg.querySelectorAll('.pv-layer')];
  const layer = document.createElement('div');
  layer.className = 'pv-layer';
  let kbEl = null;   // element that carries the Ken Burns drift

  if (!photo.src) {
    layer.style.background = ch.bg.replace('145deg', '155deg');
    layer.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <svg width="50" height="50" viewBox="0 0 40 40" fill="none" style="opacity:0.2">
        <rect x="3" y="9" width="34" height="23" rx="4" stroke="white" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="6.5" stroke="white" stroke-width="1.4"/>
        <circle cx="30" cy="14" r="2" fill="white"/>
      </svg>
    </div>`;
    pvImg.appendChild(layer);
  } else if (isVideo) {
    layer.style.background = '#000';

    // Reuse pre-buffered pool element — moving it preserves the download buffer
    let vid = _vidPool.get(photo.src);
    if (!vid) {
      // Fallback: create on-demand (shouldn't normally reach here)
      vid = document.createElement('video');
      vid.src = photo.src; vid.preload = 'auto'; vid.playsInline = true;
      vid.muted = true; vid.load();
      _vidPool.set(photo.src, vid);
    }
    vid.className   = 'pv-main';   // full-bleed, contained — no crop
    vid.style.cssText = '';
    vid.muted  = false;
    vid.volume = 1.0;
    vid.currentTime = 0;
    layer.appendChild(vid);        // moves from _mpc to the layer — buffer intact
    pvImg.appendChild(layer);

    // Metadata should already be available from preload; wait only if needed
    if (vid.readyState < 1) {
      await new Promise(res => {
        vid.addEventListener('loadedmetadata', res, { once: true });
        setTimeout(res, 4000);
      });
    }
    if (vid.duration && isFinite(vid.duration) && vid.duration > 0.1) {
      dur = Math.round(vid.duration * 1000) + 300;
    }
    // Play — already buffered, starts immediately
    vid.play().catch(() => {
      vid.muted = true;
      vid.play().catch(() => {});
    });
  } else {
    // Blurred copy behind the photo fills the frame, so a portrait shot on a
    // wide screen reads as a composed frame rather than a letterboxed image.
    const blur = document.createElement('img');
    blur.className = 'pv-blur'; blur.src = photo.src; blur.alt = '';
    const main = document.createElement('img');
    main.className = 'pv-main'; main.src = photo.src; main.alt = '';
    layer.append(blur, main);
    pvImg.appendChild(layer);
    kbEl = main;

    await new Promise(res => {
      if (main.complete && main.naturalWidth) { res(); return; }
      main.addEventListener('load',  res, { once: true });
      main.addEventListener('error', res, { once: true });
      setTimeout(res, 4000);
    });
  }

  // caption fades out now; the new text is set at the cut, below, so a stale
  // shot can never leave its words on screen
  const capEl = $('pv-cap');
  if (alreadyOpen) {
    capEl.classList.add('swapping');
    // a real frame has to elapse or the browser coalesces the fade away, and
    // letting the words clear just before the cut reads better besides
    await sleep(110);
  }

  // progress bars
  const barsEl = $('pv-bars');
  barsEl.innerHTML = '';
  if (pvBarsHideTimer) { clearTimeout(pvBarsHideTimer); pvBarsHideTimer = null; }
  ch.photos.forEach((_, i) => {
    const bar  = document.createElement('div'); bar.className = 'pv-bar';
    const fill = document.createElement('div'); fill.className = 'pv-bar-fill';
    if (i < pIdx) fill.classList.add('done');
    bar.appendChild(fill); barsEl.appendChild(bar);
  });
  barsEl.style.transition = 'opacity 0.35s ease';
  barsEl.style.opacity = '1';
  pvBarsVisible = true;

  function activateBar() {
    const fills = barsEl.querySelectorAll('.pv-bar-fill');
    if (fills[pIdx]) {
      fills[pIdx].style.setProperty('--pv-dur', `${(dur / 1000).toFixed(2)}s`);
      fills[pIdx].classList.add('active');
    }
  }

  // Stale call — this shot was superseded while its media loaded. Drop the
  // layer we built so it can never surface over the current one.
  if (_apGen !== myGen) { layer.remove(); return dur; }

  // Start the drift so the motion runs for exactly as long as the shot holds
  if (kbEl) {
    kbEl.style.setProperty('--kbdur', `${Math.round(dur * 1.35)}ms`);
    kbEl.classList.add(`kb${1 + Math.floor(Math.random() * 4)}`);
  }

  // The cut: sweep the new shot in, push the previous ones out, swap the words
  capEl.textContent = photo.cap;
  requestAnimationFrame(() => {
    layer.classList.add('in');
    capEl.classList.remove('swapping');
  });
  prevLayers.forEach(old => {
    old.classList.add('out');
    setTimeout(() => {
      // re-query: if this video was reclaimed by a later shot it is no longer
      // inside `old`, and must not be yanked back to the pool
      _returnVidToPool(old.querySelector('video'));
      old.remove();
    }, 700);
  });

  if (!alreadyOpen) pv.classList.add('show');

  if (isAuto) { await sleep(60); activateBar(); }
  return dur;
}

async function closePhotoViewer(instant) {
  const pv = $('photo-viewer');
  if (!pv.classList.contains('show')) return;
  const vid = $('pv-img')?.querySelector('video');
  _returnVidToPool(vid); // return to pool so buffer is preserved for next open
  if (instant) {
    pv.style.transition = 'none';
    pv.classList.remove('show');
    await sleep(20);
    pv.style.transition = '';
  } else {
    pv.classList.remove('show');
    await sleep(420);
  }
  // Discard spent shot layers so the next open starts on a clean frame
  $('pv-img').innerHTML = '';
  $('pv-cap').classList.remove('swapping');
}

/* Roll straight from the last shot of one episode into the first shot of the
   next. The chapter card rises over the still-open viewer, the episode is
   swapped behind it, and the card lifts onto the new opening shot — so the
   carousel and the grid never reappear and the reel never stops. */
async function advanceEpisodeSeamless(next) {
  const veil   = $('ch-veil');
  const vtitle = $('ch-vtitle');
  const ch     = CHAPTERS[next];

  preloadChapterMedia(next);

  // Chapter card rises over the frame that is still on screen
  $('ch-vt-num').textContent  = ch.num;
  $('ch-vt-name').textContent = ch.name;
  vtitle.classList.remove('in', 'up');
  veil.classList.add('solid', 'show');
  await sleep(560);
  vtitle.classList.add('in');
  await sleep(1450);

  // Behind the opaque card: retire the old episode, stage the new one
  stopAutoPlay();
  await closePhotoViewer(true);
  currentCh = next;

  if (ch.future) {
    openFuturePage();                 // raises its own curtain over us
    await sleep(900);
    veil.classList.remove('show', 'solid');
    vtitle.classList.remove('in', 'up');
    return;
  }

  loadDetail(next);
  positionCards(next, false);
  $('ch-hd').classList.add('in');
  $('ch-scroll').classList.add('show');
  $('ch-foot').classList.add('show');
  $('ch-detail').classList.add('show');

  vtitle.classList.add('up');
  await sleep(430);

  // Open the new episode's first shot, then lift the card onto it
  apChIdx = next; apPIdx = 0; apRunning = true;
  const dur = await openPhotoViewer(next, 0, true);
  veil.classList.remove('show');
  await sleep(520);
  veil.classList.remove('solid');
  if (apRunning) startHoldTimer(dur);
}

async function onChapterNext() {
  // ── 뷰어 열림: 사진 레벨 네비게이션 우선 ──
  if ($('photo-viewer').classList.contains('show')) {
    const ch = CHAPTERS[currentCh];
    const isLastPhoto = apPIdx >= ch.photos.length - 1;

    if (!isLastPhoto) {
      // 다음 사진으로
      stopAutoPlay();
      await closePhotoViewer(false);
      await sleep(160);
      startAutoPlayFrom(currentCh, apPIdx + 1);
      return;
    }
    // 마지막 사진 → 월드 모드면 캐릭터가 있던 자리로 돌아감
    if (!classicMode) {
      if (busy) return;
      busy = true;
      await returnToWorld();
      busy = false;
      return;
    }

    // 카드 모드: 다음 에피소드로 끊김 없이 이어서 재생
    if (!isManualMode && currentCh < CHAPTERS.length - 1) {
      if (busy) return;
      busy = true;
      await advanceEpisodeSeamless(currentCh + 1);
      busy = false;
      return;
    }

    // 수동 모드 / 마지막 에피소드 → 뷰어 닫고 fall-through
    stopAutoPlay();
    await closePhotoViewer(false);
    await sleep(800);
  }

  // ── 에피소드 레벨 네비게이션 ──
  if (busy) return;
  busy = true;

  // Manual mode: return to carousel unless it's the last episode (→ letter 2)
  if (isManualMode && currentCh !== CHAPTERS.length - 1) {
    await exitChapter();
    busy = false;
    return;
  }

  const isLastEp = currentCh === CHAPTERS.length - 1;

  if (isLastEp) {
    await fadeTo('pg-letter2', () => {
      $('ch-detail').classList.remove('show');
      $('ch-hd').classList.remove('in');
      $('ch-scroll').classList.remove('show');
      $('ch-foot').classList.remove('show');
    });
    busy = false;
    startCosmicLetter(LETTER2, goToProposal);
  } else {
    await exitChapter();
    const next = currentCh + 1;
    await sleep(300);
    positionCards(next, true);
    await sleep(1600);
    busy = false;
    enterChapter(next);
  }
}

// Main keywords — ignite one by one with predefined positions
const FUTURE_MAIN = ['결혼식', '신혼여행', '아파트 이사', '신혼생활', '해외여행', '출산', '육아'];
const FUTURE_MAIN_POS = [
  { x: 25, y: 10, fs: 32 },   // 결혼식  → 화면 좌측 ~14%
  { x: 63, y:  7, fs: 28 },   // 신혼여행 → 화면 우측 ~66%
  { x: 16, y: 37, fs: 24 },   // 아파트 이사 → 화면 좌측 ~11%
  { x: 63, y: 26, fs: 28 },   // 신혼생활 → 화면 우측 ~66%
  { x: 20, y: 62, fs: 27 },   // 해외여행 → 화면 좌측 ~14%
  { x: 70, y: 68, fs: 34 },   // 출산 → 화면 우측 ~73%
  { x: 46, y: 82, fs: 25 },   // 육아 → 화면 중앙 ~45%
];

// Landscape keyword layout — authored in VISIBLE-screen %, converted below.
// Spread wide across the 16:9 canvas, leaving the centre clear for the closing line.
const FUTURE_MAIN_POS_LS = [
  { x: 12, y: 15, fs: 30 },   // 결혼식
  { x: 73, y: 11, fs: 26 },   // 신혼여행
  { x:  7, y: 45, fs: 22 },   // 아파트 이사
  { x: 77, y: 39, fs: 26 },   // 신혼생활
  { x: 15, y: 75, fs: 25 },   // 해외여행
  { x: 60, y: 72, fs: 32 },   // 출산
  { x: 41, y: 84, fs: 24 },   // 육아
];

/* #ft-bg is inset beyond the viewport so it can pan, so a word's % position
   inside it is not the % the eye sees. Convert desired screen % → container %. */
function ftToContainer(bg, visX, visY) {
  const W = bg.offsetWidth,   H  = bg.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  const insX = (W - vw) / 2,  insY = (H - vh) / 2;
  return {
    x: ((visX / 100) * vw + insX) / W * 100,
    y: ((visY / 100) * vh + insY) / H * 100,
  };
}

// Secondary and ambient words — appear all at once, fill the field
const FUTURE_MID = [
  '크리스마스', '새해', '드라이브', '캠핑',
  '첫눈', '생일', '설날', '추석', '가족사진', '주말 아침', '기념일', '카페'
];
const FUTURE_BG = [
  '웃음', '바다',
  '여름밤', '공원 산책', '요리', '집들이',
  '여행 계획', '소소한 행복', '함께', '이사', '파티',
  '가족', '새벽', '봄날', '승진'
];

function ftShuf(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) { const j = 0 | Math.random() * (i + 1); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

/* Word sizes below are authored for a phone. Sideways the same field may be
   on a TV, so scale them with the viewport height. */
function ftScale() {
  return isLandscape() ? Math.min(2.4, Math.max(1, window.innerHeight / 393)) : 1;
}

function ftSpawn(container, text, cls, x, y, fs, op, adS, fdur, gdur, dx, dy) {
  fs *= ftScale();
  const el = document.createElement('span');
  el.className = `ft-word ${cls}`;
  el.textContent = text;
  const style = [
    `left:${x.toFixed(1)}%`, `top:${y.toFixed(1)}%`, `font-size:${fs.toFixed(1)}px`,
    `--op:${op.toFixed(3)}`,  `--ad:${adS.toFixed(2)}s`,
    `--fdur:${fdur.toFixed(1)}s`, `--dx:${dx.toFixed(1)}px`, `--dy:${dy.toFixed(1)}px`,
  ];
  if (gdur) style.push(`--gdur:${gdur.toFixed(1)}s`);
  el.style.cssText = style.join(';');
  container.appendChild(el);
}

function buildFutureAtmosphere(container) {
  // 70 twinkling stars
  for (let i = 0; i < 70; i++) {
    const s   = document.createElement('div');
    s.className = 'ft-star';
    const sz  = Math.random() < 0.72 ? 1 : Math.random() < 0.7 ? 2 : 3;
    const op1 = (0.15 + Math.random() * 0.55).toFixed(2);
    const op2 = (parseFloat(op1) * (0.12 + Math.random() * 0.25)).toFixed(2);
    s.style.cssText = [
      `left:${(Math.random()*100).toFixed(1)}%`, `top:${(Math.random()*100).toFixed(1)}%`,
      `width:${sz}px`, `height:${sz}px`,
      `--op1:${op1}`, `--op2:${op2}`,
      `--dur:${(1.8+Math.random()*3.5).toFixed(1)}s`,
      `--del:${(Math.random()*4).toFixed(1)}s`,
    ].join(';');
    container.appendChild(s);
  }

  // Centre-avoiding helper
  const outsideCenter = (x, y, mx, my, Mx, My) => !(x > mx && x < Mx && y > my && y < My);

  // Background micro-words — staggered 0.18s apart so they float up one by one
  ftShuf(FUTURE_BG).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 28, 32, 72, 68));
    ftSpawn(container, w, 'ft-bgw',
      x, y, 10 + Math.random() * 5,
      0.22 + Math.random() * 0.14,   // brighter: 0.22–0.36
      0.2 + i * 0.18 + Math.random() * 0.08,  // ~3.6s to show all 20
      8 + Math.random() * 7,
      null,
      (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 18);
  });

  // Mid words — staggered 0.24s apart
  ftShuf(FUTURE_MID).forEach((w, i) => {
    let x, y;
    do { x = 11 + Math.random() * 77; y = 5 + Math.random() * 88; }
    while (!outsideCenter(x, y, 25, 30, 75, 70));
    ftSpawn(container, w, 'ft-mid',
      x, y, 15 + Math.random() * 8,
      0.52 + Math.random() * 0.18,   // brighter: 0.52–0.70
      0.4 + i * 0.24 + Math.random() * 0.1,  // ~3.3s to show all 14
      10 + Math.random() * 8,
      null,
      (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 22);
  });
}

async function openFuturePage() {
  await fadeTo('pg-future', () => {
    $('ch-detail').classList.remove('show');
    $('ch-hd').classList.remove('in');
    $('ch-scroll').classList.remove('show');
    $('ch-foot').classList.remove('show');
  });

  const bg = $('ft-bg');
  bg.innerHTML = '';
  buildFutureAtmosphere(bg);   // stars + mid + bg words (all start fading in now)

  const endEl = $('ft-end');
  endEl.style.opacity    = '0';
  endEl.style.transition = '';

  // Sequential main keyword ignitions — each waits for previous to bloom
  await sleep(700);
  const ls    = isLandscape();
  const table = ls ? FUTURE_MAIN_POS_LS : FUTURE_MAIN_POS;
  for (let i = 0; i < FUTURE_MAIN.length; i++) {
    const p    = table[i];
    const pos  = ls ? ftToContainer(bg, p.x, p.y) : { x: p.x, y: p.y };
    const gdur = 3.4 + Math.random() * 2.0;
    const dx   = (Math.random() - 0.5) * 20;
    const dy   = (Math.random() - 0.5) * 14;
    // --ad:0 so animation fires immediately on DOM insert
    ftSpawn(bg, FUTURE_MAIN[i], 'ft-main', pos.x, pos.y, p.fs, 0.90, 0, 18, gdur, dx, dy);
    // Gap: first keyword gets a bit longer to stand alone, rest tighter
    await sleep(i === 0 ? 1900 : 1450);
  }

  // Let all words float and settle together
  await sleep(2200);

  // Closing message fades in over the word-field
  endEl.style.transition = 'opacity 2.2s ease';
  endEl.style.opacity    = '1';
  await sleep(3600);

  await fadeTo('pg-letter2', () => { endEl.style.opacity = '0'; });
  startCosmicLetter(LETTER2, goToProposal);
}

// btn-no is sized by CSS per orientation — keep the JS maths in step
function noBtnSize() { return isLandscape() ? { w: 168, h: 40 } : { w: 210, h: 46 }; }

function placeNo() {
  const yes = document.querySelector('.btn-yes');
  const r   = yes.getBoundingClientRect();
  const btn = $('btn-no');
  const { w, h } = noBtnSize();
  const left = r.left + r.width / 2 - w / 2;
  btn.style.left   = `${Math.max(12, Math.min(window.innerWidth - w - 12, left))}px`;
  btn.style.top    = `${Math.min(r.bottom + 18, window.innerHeight - h - 12)}px`;
  btn.style.bottom = 'auto';
}

const NO_MSGS = ['싫어!','싫다고!','안 해!','절대!','저리 가!','왜 이래!','싫어!!!','안 돼!','진짜 싫어!'];
let noTaps = 0, _noLastTs = 0;
function dodgeNo(e) {
  const now = Date.now();
  if (now - _noLastTs < 350) return;
  _noLastTs = now;
  const btn = $('btn-no');
  const yes = document.querySelector('.btn-yes');
  const yR  = yes.getBoundingClientRect();
  const w = window.innerWidth, h = window.innerHeight;
  const { w: bw, h: bh } = noBtnSize();
  const margin = isLandscape() ? 14 : 20;
  // vertical keep-out at top/bottom — much smaller in landscape, where height is scarce
  const vPad = isLandscape() ? 16 : 90;

  // pick a random position that doesn't overlap btn-yes
  let x, y, tries = 0;
  do {
    x = margin + Math.random() * Math.max(10, w - bw - margin * 2);
    y = vPad   + Math.random() * Math.max(10, h - bh - vPad * 2);
    tries++;
  } while (
    tries < 30 &&
    x < yR.right  + margin && x + bw > yR.left   - margin &&
    y < yR.bottom + margin && y + bh > yR.top     - margin
  );

  btn.style.left = x + 'px';
  btn.style.top  = y + 'px';
  btn.textContent = NO_MSGS[noTaps % NO_MSGS.length];
  noTaps++;
}

async function onYes() {
  const ring = document.querySelector('.ring-wrap');
  ring.classList.add('accept');

  // Three expanding glow rings, staggered
  const ringRect = ring.getBoundingClientRect();
  const cx = ringRect.left + ringRect.width / 2;
  const cy = ringRect.top  + ringRect.height / 2;
  [0, 200, 400].forEach(delay => {
    setTimeout(() => {
      const ripple = document.createElement('div');
      ripple.className = 'ring-ripple';
      ripple.style.left = cx + 'px';
      ripple.style.top  = cy + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 900);
    }, delay);
  });

  await sleep(820);
  await fadeTo('pg-accept', () => spawnBokeh('bk2', 18, TIFFANY_BOKEH));
  await sleep(100);
  $('accept-title').classList.add('in');
  await sleep(320);
  $('accept-sub').classList.add('in');
  await sleep(580);
  $('accept-badge').classList.add('in');

function runConfetti() {
  const canvas = $('confetti');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx  = canvas.getContext('2d');
  const cols = ['#81D8D0','#B2EDE9','#ffffff','#4AADA5','#E8FAFA','#0ABAB5'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: 4 + Math.random() * 8, h: 6 + Math.random() * 13,
    rot: Math.random() * Math.PI * 2,
    dr: (Math.random() - 0.5) * 0.13,
    vy: 1.2 + Math.random() * 1.9,
    vx: (Math.random() - 0.5) * 0.7,
    col: cols[Math.floor(Math.random() * cols.length)],
    a: 0.65 + Math.random() * 0.35,
  }));
  let frame = 0;
  function draw() {
    if (frame > 380) {
      canvas.style.transition = 'opacity 1.5s ease'; canvas.style.opacity = '0'; return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.rot += p.dr;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save(); ctx.globalAlpha = p.a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++; requestAnimationFrame(draw);
  }
  draw();
}

/* ════════════════════════════════════
   GRID SWIPE-DOWN → 에피소드 카드로 복귀
════════════════════════════════════ */
function initGridDismiss() {
  const scroll  = $('ch-scroll');
  const detail  = $('ch-detail');
  let startY = 0, startScrollTop = 0;
  let dismissing = false, dragY = 0;

  scroll.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startScrollTop = scroll.scrollTop;
    dismissing = false; dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    if (!dismissing) {
      if (startScrollTop <= 0 && dy > 8) dismissing = true;
      else return;
    }
    e.preventDefault();
    dragY = dy;
  }, { passive: false });

  scroll.addEventListener('touchend', async () => {
    if (!dismissing) return;
    dismissing = false;
    if (dragY > 90 && !busy) {
      busy = true;
      await exitChapter();
      busy = false;
    }
    dragY = 0;
  }, { passive: true });

  scroll.addEventListener('touchcancel', () => {
    dismissing = false;
    dragY = 0;
  }, { passive: true });
}

/* ════════════════════════════════════
   PIXEL WORLD — the default way into the episodes
   A small overworld drawn entirely in code: no sprite sheets, so the page
   stays self-contained. The girl walks to a place, steps to its door and
   that episode's reel plays.
════════════════════════════════════ */
const WT = 28;   // tile size in world pixels — sized so the round
                 // tables either side stay inside the camera's band

/* The hall, laid out from the venue's own photos.
   # wall  . carpet  r runner  F floral border  s stage  d dais  L long table
   P podium at the doors  G gateway */
const W_COLS = 29, W_ROWS = 46;
const AISLE_L = 13, AISLE_R = 15;
const AISLE_MID = 14;

const WORLD_MAP = (() => {
  const m = Array.from({ length: W_ROWS }, () => new Array(W_COLS).fill('.'));
  const box = (r0, r1, c0, c1, ch) => {
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
      if (m[r] && m[r][c] !== undefined) m[r][c] = ch;
  };
  box(0, W_ROWS - 1, 0, 1, '#'); box(0, W_ROWS - 1, W_COLS - 2, W_COLS - 1, '#');
  box(0, 1, 0, W_COLS - 1, '#'); box(W_ROWS - 1, W_ROWS - 1, 0, W_COLS - 1, '#');

  box(2, 7, 2, W_COLS - 3, 's');          // stage floor
  box(3, 7, 10, 18, 'd');                 // dais, open to the runner below
  box(8, 42, AISLE_L, AISLE_R, 'r');      // the runner
  box(8, 42, AISLE_L - 1, AISLE_L - 1, 'F');
  box(8, 42, AISLE_R + 1, AISLE_R + 1, 'F');
  box(43, 43, AISLE_L - 1, AISLE_R + 1, 'P');
  box(44, 44, AISLE_L - 3, AISLE_R + 3, 'G');
  return m.map(row => row.join(''));
})();

/* Memory stands sit just outside the flower line, episode 1 nearest the doors */
const W_PLACES = [
  { ep:0, col:AISLE_L-2, row:36, side:-1, doorCol:AISLE_MID, doorRow:36, name:'회사 동기' },
  { ep:1, col:AISLE_R+2, row:29, side: 1, doorCol:AISLE_MID, doorRow:29, name:'연인' },
  { ep:2, col:AISLE_L-2, row:22, side:-1, doorCol:AISLE_MID, doorRow:22, name:'일상' },
  { ep:3, col:AISLE_R+2, row:15, side: 1, doorCol:AISLE_MID, doorRow:15, name:'여행' },
  { ep:4, col:AISLE_MID, row:5,  side: 0, doorCol:AISLE_MID, doorRow:8,  name:'앞으로의 우리', groom:true },
];

/* Long black banquet tables running the length of the aisle, guests on the
   inner side turned toward the runner — the hall's main seating */
const W_LONG_TABLES = [
  { col: AISLE_L - 3, row0: 13, row1: 41, side: -1 },
  { col: AISLE_R + 3, row0: 13, row1: 41, side:  1 },
];

/* Round tables out towards the walls */
const W_TABLES = (() => {
  const out = [];
  for (const r of [15, 21, 27, 33, 39])
    for (const c of [6, 20]) out.push({ col: c, row: r, seats: 8 });
  return out;
})();

/* 혼주석 — a pair of upholstered armchairs each side, no table */
const W_PARENTS = [
  { col: AISLE_L - 2.6, row: 9.4,  who: 'father' },
  { col: AISLE_L - 1.5, row: 9.4,  who: 'mother' },
  { col: AISLE_R + 1.5, row: 9.4,  who: 'mother' },
  { col: AISLE_R + 2.6, row: 9.4,  who: 'father' },
];

/* Tall candelabra standing along the flower line, as in the photos */
const W_CANDELABRA = (() => {
  const out = [];
  for (let r = 11; r <= 41; r += 4.5) {
    out.push({ col: AISLE_L - 1.15, row: r });
    out.push({ col: AISLE_R + 1.15, row: r + 1.2 });
  }
  return out;
})();

/* Big pillar arrangements massed at the mouth of the aisle */
const W_ENTRY_FLOWERS = [
  { col: AISLE_L - 2, row: 42.4, big: 0 }, { col: AISLE_R + 2, row: 42.4, big: 0 },
];

/* Chandeliers hung down the aisle and in banks either side */
const W_CHANDELIERS = (() => {
  const out = [];
  for (let r = 9; r <= 43; r += 3.4) {
    out.push({ col: AISLE_MID, row: r, big: 1 });
    out.push({ col: AISLE_L - 5.5, row: r + 1.7, big: 0 });
    out.push({ col: AISLE_R + 5.5, row: r + 1.7, big: 0 });
    out.push({ col: AISLE_L - 10,  row: r, big: 0 });
    out.push({ col: AISLE_R + 10,  row: r, big: 0 });
  }
  return out;
})();

const wSolid = ch => '#FtHBcGL'.includes(ch);
function wTileAt(c, r) {
  if (c < 0 || r < 0 || c >= W_COLS || r >= W_ROWS) return 'T';
  return WORLD_MAP[r][c];
}

const W = {
  on:false, raf:0, last:0,
  x:AISLE_MID*WT+WT/2, y:41*WT+WT/2,   // just inside the gateway, facing the aisle
  dir:'up', step:0, walkT:0, moving:false,
  vx:0, vy:0, scale:3,
  visited:new Set(), near:null, locked:false, t:0,
};

/* Each memory opens only once the one before it has played, so walking the
   aisle walks the story in order. The groom waits for all four. */
function wLocked(pl) {
  if (!pl) return false;
  if (pl.groom) return W.visited.size < 4;
  return pl.ep > 0 && !W.visited.has(pl.ep - 1);
}

/* ── deterministic per-tile noise so grass detail never flickers ── */
function wHash(c, r) {
  let h = (c * 374761393 + r * 668265263) ^ 0x5bf03635;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const TAU = Math.PI * 2;
const PY  = 0.62;          // vertical squash — the hall is seen at an angle,
                           // not straight down, so we see the front of things
const WALL_H = 132;        // how tall the back wall stands, in world units

/* ── small drawing helpers ── */
function pxDisc(g, cx, cy, rad, col) {
  if (rad <= 0) return;
  g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fillStyle = col; g.fill();
}
function wEllipse(g, cx, cy, rx, ry, col) {
  g.beginPath(); g.ellipse(cx, cy, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU);
  g.fillStyle = col; g.fill();
}
function wRound(g, x, y, w, h, col, r) {
  if (w <= 0 || h <= 0) return;
  const rr = Math.min(r === undefined ? Math.min(w, h) * 0.3 : r, w / 2, h / 2);
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, rr);
  else {
    g.moveTo(x + rr, y); g.lineTo(x + w - rr, y); g.quadraticCurveTo(x + w, y, x + w, y + rr);
    g.lineTo(x + w, y + h - rr); g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    g.lineTo(x + rr, y + h); g.quadraticCurveTo(x, y + h, x, y + h - rr);
    g.lineTo(x, y + rr); g.quadraticCurveTo(x, y, x + rr, y);
  }
  g.fillStyle = col; g.fill();
}
/* soft ground shadow beneath anything standing on the floor */
function wShadow(g, cx, cy, rx, strength) {
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rx);
  gr.addColorStop(0, `rgba(0,0,0,${strength})`);
  gr.addColorStop(0.55, `rgba(0,0,0,${strength * 0.45})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.translate(cx, cy); g.scale(1, 0.42); g.translate(-cx, -cy);
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, rx, 0, TAU); g.fill();
  g.restore();
}
/* a bloom: petal lobes, shaded underside, lit crown */
function wBloom(g, cx, cy, rad, col) {
  if (rad <= 0.9) { pxDisc(g, cx, cy, Math.max(0.4, rad), col); return; }
  g.fillStyle = col;
  if (rad > 2) {
    const n = rad > 4 ? 6 : 5, ph = cx * 0.07 + cy * 0.05;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + ph;
      g.beginPath();
      g.arc(cx + Math.cos(a) * rad * 0.44, cy + Math.sin(a) * rad * 0.44, rad * 0.6, 0, TAU);
      g.fill();
    }
  }
  g.beginPath(); g.arc(cx, cy, rad * 0.82, 0, TAU); g.fill();
  g.save();
  g.beginPath(); g.arc(cx, cy, rad * 1.1, 0, TAU); g.clip();
  g.beginPath(); g.arc(cx + rad * 0.4, cy + rad * 0.46, rad * 0.95, 0, TAU);
  g.fillStyle = 'rgba(70,25,60,0.22)'; g.fill();
  g.beginPath(); g.arc(cx - rad * 0.34, cy - rad * 0.4, rad * 0.6, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.32)'; g.fill();
  g.restore();
  pxDisc(g, cx, cy, rad * 0.19, 'rgba(120,60,90,0.28)');
  pxDisc(g, cx - rad * 0.24, cy - rad * 0.3, rad * 0.19, 'rgba(255,255,255,0.8)');
}
/* a mass of blooms with foliage — used for every arrangement in the hall */
function wArrangement(g, cx, baseY, w, h, seed, dense) {
  const N = Math.max(5, Math.round(w * h / (dense ? 78 : 130)));
  wEllipse(g, cx, baseY, w * 0.52, w * 0.17, 'rgba(0,0,0,0.34)');
  for (let i = 0; i < N * 0.8; i++) {                       // foliage behind
    const a = wHash(seed + i * 3, 11), b = wHash(seed + 7, i * 5);
    g.save();
    g.translate(cx + (a - 0.5) * w * 1.05, baseY - b * h * 0.95);
    g.rotate((wHash(seed + i, 3) - 0.5) * 2.2);
    wEllipse(g, 0, 0, w * 0.17, w * 0.055, i % 2 ? '#8faa79' : '#5c7a52');
    g.restore();
  }
  const pinks = ['#ffffff','#fdf7ef','#f8e2d2','#f2c6ae','#f7dade','#eec2c6','#fbeade','#e9dcc6'];
  for (let i = 0; i < N; i++) {
    const a = wHash(seed + i * 5, 17), b = wHash(seed + 13, i * 3);
    const bx = cx + (a - 0.5) * w;
    const by = baseY - 3 - b * h;
    const rad = (0.055 + wHash(seed + i, i * 7) * 0.075) * w;
    wBloom(g, bx, by, rad, pinks[(wHash(seed + i * 2, i) * 8) | 0]);
  }
  for (let i = 0; i < N * 0.35; i++) {                      // baby's breath
    const a = wHash(seed + i * 11, 29), b = wHash(seed + 3, i * 13);
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath();
    g.arc(cx + (a - 0.5) * w * 1.08, baseY - 2 - b * h * 1.06, w * 0.022, 0, TAU);
    g.fill();
  }
}

/* ══════════════════════════════════════════════════════════════
   PEOPLE

   `o.view` is 'front', 'back', or -1 / +1 for a side-on figure facing
   left or right. Guests watching the aisle are drawn side-on, which is
   what they would actually be doing; only the couple and the officiant
   face down the room.

   Everything is proportioned off H, the standing height, at roughly
   3.7 heads tall — stylised, but with a real skeleton underneath.
══════════════════════════════════════════════════════════════ */
/* A genuine profile, drawn as its own silhouette rather than a front figure
   with hair pasted over half the head. Everything below is drawn facing
   right around the feet at (0,0); facing left just mirrors the canvas. */
function wFigureSide(g, bx, by, H, o, side) {
  const seated = !!o.seated;
  const skirted = o.kind === 'gown' || o.kind === 'dress' || o.kind === 'hanbok';
  const skin = o.skin, skinSh = o.skinShade || '#d99e77';
  const hair = o.hair, hairSh = o.hairDark || '#241609';
  const wear = o.wear, wear2 = o.wear2;
  const r = H * 0.135;                     // head radius

  wShadow(g, bx, by, H * 0.26, 0.5);

  g.save();
  g.translate(bx, by);
  if (side < 0) g.scale(-1, 1);

  const hipY   = seated ? -H * 0.355 : -H * 0.44;
  const hipX   = seated ? -H * 0.10  : 0;
  const shY    = hipY - H * (seated ? 0.30 : 0.235);
  const neckY  = shY - H * 0.05;
  const headCY = shY - H * 0.185;
  const bodyD  = H * 0.225;                // front-to-back depth of the torso

  const limb = (x0, y0, x1, y1, w, col) => {
    g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  };
  const dim = c => { g.globalAlpha = 0.55; g.fillStyle = c; };

  // ── far arm and far leg, behind the body ──
  const shX = -H * 0.01;
  const armW = H * 0.055;
  const clapT = o.arms === 'clap'
    ? (0.5 + 0.5 * Math.sin(W.t / 88 + (o.phase || 0))) : 0;
  const handP = o.arms === 'clap'
    ? { x: H * (0.13 + clapT * 0.045), y: shY + H * 0.145 }
    : o.arms === 'clasp'
      ? { x: H * 0.125, y: shY + H * 0.175 }
      : o.arms === 'fold'
        ? { x: H * 0.10, y: shY + H * 0.115 }
        : { x: H * 0.035, y: shY + H * 0.235 };

  g.globalAlpha = 0.62;
  limb(shX - H * 0.02, shY + H * 0.015, handP.x - H * 0.03, handP.y, armW, wear2);
  g.globalAlpha = 1;

  if (!skirted) {
    const kneeX = seated ? H * 0.155 : 0;
    const kneeY = seated ? -H * 0.315 : -H * 0.2;
    g.globalAlpha = 0.6;
    if (seated) {
      limb(hipX - H * 0.02, hipY, kneeX - H * 0.03, kneeY, H * 0.10, o.trouser || wear2);
      limb(kneeX - H * 0.03, kneeY, kneeX - H * 0.02, -H * 0.015, H * 0.075, o.trouser || wear2);
    } else {
      limb(-H * 0.055, hipY, -H * 0.075, -H * 0.015, H * 0.082, o.trouser || wear2);
      g.beginPath();
      g.ellipse(-H * 0.05, -H * 0.012, H * 0.05, H * 0.022, 0, 0, TAU);
      g.fillStyle = '#0d0b12'; g.fill();
    }
    g.globalAlpha = 1;
  }

  // ── near leg / skirt ──
  if (seated) {
    const legCol = o.trouser || wear2;
    const kneeX = H * 0.165, kneeY = -H * 0.315;
    limb(hipX, hipY, kneeX, kneeY, H * 0.112, legCol);
    limb(kneeX, kneeY + H * 0.008, kneeX + H * 0.012, -H * 0.018, H * 0.08, legCol);
    g.beginPath();
    g.ellipse(kneeX + H * 0.035, -H * 0.014, H * 0.056, H * 0.025, 0, 0, TAU);
    g.fillStyle = '#0d0b12'; g.fill();
    if (skirted) {                       // skirt draping over the thighs
      g.beginPath();
      g.moveTo(hipX - bodyD * 0.55, hipY - H * 0.03);
      g.quadraticCurveTo(H * 0.04, hipY + H * 0.03, kneeX + H * 0.05, kneeY + H * 0.035);
      g.lineTo(kneeX + H * 0.05, kneeY - H * 0.075);
      g.quadraticCurveTo(H * 0.02, hipY - H * 0.13, hipX - bodyD * 0.55, hipY - H * 0.14);
      g.closePath(); g.fillStyle = wear; g.fill();
    }
  } else if (skirted) {
    const sw = o.kind === 'gown' ? H * 0.42 : H * 0.30;
    g.beginPath();
    g.moveTo(-bodyD * 0.5, hipY);
    g.bezierCurveTo(-sw * 0.75, -H * 0.16, -sw * 0.72, -H * 0.03, -sw * 0.66, 0);
    g.lineTo(sw * 0.66, 0);
    g.bezierCurveTo(sw * 0.72, -H * 0.03, sw * 0.7, -H * 0.16, bodyD * 0.5, hipY);
    g.closePath();
    const sg = g.createLinearGradient(-sw * 0.66, 0, sw * 0.66, 0);
    sg.addColorStop(0, wear2); sg.addColorStop(0.45, wear); sg.addColorStop(1, wear2);
    g.fillStyle = sg; g.fill();
    // creases falling from the waist, and a lit hem
    g.strokeStyle = 'rgba(0,0,0,0.11)'; g.lineWidth = Math.max(1, H * 0.007);
    for (const t of [-0.3, 0.34]) {
      g.beginPath();
      g.moveTo(t * sw * 0.34, hipY + H * 0.05);
      g.quadraticCurveTo(t * sw * 0.58, -H * 0.13, t * sw * 0.70, -H * 0.02);
      g.stroke();
    }
    wEllipse(g, 0, 0, sw * 0.66, sw * 0.11, wear2);
    g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = Math.max(1, H * 0.007);
    g.beginPath(); g.ellipse(0, -H * 0.004, sw * 0.63, sw * 0.10, 0, Math.PI * 1.08, Math.PI * 1.9);
    g.stroke();
  } else {
    limb(H * 0.035, hipY, H * 0.05, -H * 0.015, H * 0.088, o.trouser || wear2);
    g.beginPath();
    g.ellipse(H * 0.055, -H * 0.012, H * 0.055, H * 0.024, 0, 0, TAU);
    g.fillStyle = '#0d0b12'; g.fill();
  }

  // ── torso: chest forward, back curved ──
  g.beginPath();
  g.moveTo(hipX - bodyD * 0.5, hipY);
  g.quadraticCurveTo(-bodyD * 0.62, (hipY + shY) / 2, -bodyD * 0.44, shY + H * 0.02);
  g.quadraticCurveTo(-bodyD * 0.4, shY - H * 0.02, -bodyD * 0.12, shY - H * 0.026);
  g.quadraticCurveTo(bodyD * 0.34, shY - H * 0.022, bodyD * 0.46, shY + H * 0.03);
  g.quadraticCurveTo(bodyD * 0.62, (hipY + shY) / 2, hipX + bodyD * 0.5, hipY);
  g.closePath();
  const tg = g.createLinearGradient(-bodyD * 0.6, 0, bodyD * 0.6, 0);
  tg.addColorStop(0, wear2); tg.addColorStop(0.55, wear); tg.addColorStop(1, wear2);
  g.fillStyle = tg; g.fill();

  // ── what shows of their clothes from the side ──
  if (o.kind === 'suit' || o.kind === 'tux') {
    // a narrow strip of shirt showing at the jacket opening, tapering away
    g.beginPath();
    g.moveTo(bodyD * 0.18, shY + H * 0.002);
    g.quadraticCurveTo(bodyD * 0.50, shY + H * 0.03, bodyD * 0.42, shY + H * 0.125);
    g.quadraticCurveTo(bodyD * 0.30, shY + H * 0.150, bodyD * 0.06, shY + H * 0.11);
    g.closePath(); g.fillStyle = '#f9f6f0'; g.fill();
    g.fillStyle = 'rgba(0,0,0,0.10)';                 // collar shadow
    g.fillRect(bodyD * 0.10, shY + H * 0.002, bodyD * 0.36, H * 0.012);
    if (o.bowTie) {
      g.fillStyle = o.tie || '#20202c';
      g.beginPath();
      g.moveTo(bodyD * 0.34, shY + H * 0.026);
      g.lineTo(bodyD * 0.20, shY + H * 0.012);
      g.lineTo(bodyD * 0.20, shY + H * 0.046);
      g.closePath(); g.fill();
      pxDisc(g, bodyD * 0.33, shY + H * 0.029, H * 0.008, 'rgba(255,255,255,0.3)');
    } else {
      limb(bodyD * 0.30, shY + H * 0.032, bodyD * 0.27, shY + H * 0.10, H * 0.020, o.tie || '#7a2f3a');
    }
    g.beginPath();                                    // lapel over it
    g.moveTo(bodyD * 0.46, shY - H * 0.006);
    g.lineTo(bodyD * 0.06, shY + H * 0.016);
    g.lineTo(bodyD * 0.22, shY + H * 0.125);
    g.closePath(); g.fillStyle = 'rgba(255,255,255,0.20)'; g.fill();
  } else if (o.kind === 'hanbok') {
    g.beginPath();
    g.moveTo(-bodyD * 0.5, shY - H * 0.02);
    g.lineTo(bodyD * 0.48, shY - H * 0.02);
    g.quadraticCurveTo(bodyD * 0.52, shY + H * 0.16, 0, shY + H * 0.175);
    g.quadraticCurveTo(-bodyD * 0.5, shY + H * 0.16, -bodyD * 0.5, shY - H * 0.02);
    g.closePath(); g.fillStyle = o.jeogori || '#f6efe4'; g.fill();
    limb(bodyD * 0.26, shY + H * 0.04, bodyD * 0.24, shY + H * 0.2, H * 0.028, o.goreum || '#9c3f52');
  } else if (skirted) {
    // In profile you only see a sliver of décolletage at the front edge,
    // not the whole neckline, so keep it small and scooped.
    const depth = [0.052, 0.075, 0.032, 0.062][o.neckline || 0] * H;
    g.beginPath();
    g.moveTo(bodyD * 0.45, shY + H * 0.003);
    g.quadraticCurveTo(bodyD * 0.26, shY + depth, bodyD * 0.02, shY + H * 0.006);
    g.quadraticCurveTo(bodyD * 0.24, shY + depth * 0.42, bodyD * 0.45, shY + H * 0.003);
    g.closePath(); g.fillStyle = skin; g.fill();
    if ((o.neckline || 0) === 3) {                    // halter strap up to the neck
      g.strokeStyle = wear; g.lineWidth = Math.max(1, H * 0.014);
      g.beginPath();
      g.moveTo(bodyD * 0.30, shY + depth * 0.6);
      g.quadraticCurveTo(bodyD * 0.22, shY - H * 0.03, bodyD * 0.06, shY - H * 0.045);
      g.stroke();
    }
    // waist seam
    g.fillStyle = o.sash || 'rgba(0,0,0,0.18)';
    g.fillRect(-bodyD * 0.5, hipY - H * 0.05, bodyD, H * 0.03);
    if (o.stole) {                                    // a wrap sitting on the shoulders
      g.strokeStyle = o.stole; g.lineWidth = H * 0.030; g.lineCap = 'round';
      g.globalAlpha = 0.85;
      g.beginPath();
      g.moveTo(-bodyD * 0.44, shY + H * 0.055);
      g.quadraticCurveTo(-bodyD * 0.1, shY - H * 0.018, bodyD * 0.34, shY + H * 0.06);
      g.stroke();
      g.globalAlpha = 1;
    }
  }
  if (o.pocketSq) {                                   // pocket square
    g.fillStyle = o.pocketSq;
    g.fillRect(-bodyD * 0.30, shY + H * 0.055, H * 0.028, H * 0.014);
  }
  if (o.necklace) {
    g.strokeStyle = '#e8dcc0'; g.lineWidth = Math.max(0.8, H * 0.006);
    g.beginPath();
    g.arc(bodyD * 0.02, shY + H * 0.012, H * 0.036, 0.25, Math.PI - 0.25);
    g.stroke();
    pxDisc(g, bodyD * 0.03, shY + H * 0.05, H * 0.011, '#f4e6c2');
  }

  // ── neck ──
  limb(H * 0.012, neckY + H * 0.042, H * 0.020, neckY - H * 0.012, H * 0.062, skinSh);

  // ── head, as a real profile silhouette ──
  const hy = headCY;
  g.save();
  if (o.nod) { g.translate(0, hy); g.rotate(o.nod); g.translate(0, -hy); }
  g.beginPath();
  g.moveTo(-r * 0.88, hy + r * 0.42);                       // nape
  g.bezierCurveTo(-r * 1.10, hy + r * 0.05, -r * 1.02, hy - r * 0.72, -r * 0.42, hy - r * 0.98);
  g.bezierCurveTo(r * 0.14, hy - r * 1.18, r * 0.76, hy - r * 0.80, r * 0.84, hy - r * 0.30);
  g.bezierCurveTo(r * 0.90, hy - r * 0.16, r * 0.87, hy - r * 0.05, r * 0.91, hy + r * 0.01);
  g.quadraticCurveTo(r * 1.03, hy + r * 0.07, r * 1.00, hy + r * 0.16);   // nose
  g.quadraticCurveTo(r * 0.97, hy + r * 0.22, r * 0.86, hy + r * 0.24);
  g.quadraticCurveTo(r * 0.94, hy + r * 0.33, r * 0.86, hy + r * 0.40);   // lips
  g.quadraticCurveTo(r * 0.92, hy + r * 0.52, r * 0.72, hy + r * 0.68);   // chin
  g.quadraticCurveTo(r * 0.30, hy + r * 1.00, -r * 0.30, hy + r * 0.84);  // jaw
  g.closePath();
  const fg2 = g.createLinearGradient(-r, hy - r, r, hy + r);
  fg2.addColorStop(0, skinSh); fg2.addColorStop(0.45, skin); fg2.addColorStop(1, '#fff1e0');
  g.fillStyle = fg2; g.fill();

  // ear
  g.strokeStyle = skinSh; g.lineWidth = Math.max(0.7, r * 0.09);
  g.beginPath(); g.arc(-r * 0.18, hy + r * 0.14, r * 0.19, -1.1, 1.5); g.stroke();

  // hair: skull cap sweeping into a fringe over the brow
  g.beginPath();
  g.moveTo(-r * 0.95, hy + r * 0.52);
  g.bezierCurveTo(-r * 1.18, hy + r * 0.05, -r * 1.08, hy - r * 0.80, -r * 0.42, hy - r * 1.06);
  g.bezierCurveTo(r * 0.20, hy - r * 1.28, r * 0.86, hy - r * 0.86, r * 0.90, hy - r * 0.28);
  g.quadraticCurveTo(r * 0.62, hy - r * 0.52, r * 0.20, hy - r * 0.44);
  g.quadraticCurveTo(-r * 0.30, hy - r * 0.36, -r * 0.55, hy + r * 0.10);
  g.quadraticCurveTo(-r * 0.72, hy + r * 0.38, -r * 0.95, hy + r * 0.52);
  g.closePath();
  g.fillStyle = hair; g.fill();
  g.beginPath();
  g.ellipse(-r * 0.30, hy - r * 0.62, r * 0.42, r * 0.24, -0.4, 0, TAU);
  g.fillStyle = o.hairLight || 'rgba(255,255,255,0.12)'; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = Math.max(0.7, r * 0.06);
  g.beginPath();
  g.moveTo(-r * 0.72, hy - r * 0.66);
  g.quadraticCurveTo(r * 0.1, hy - r * 0.94, r * 0.62, hy - r * 0.44);
  g.stroke();

  if (o.hairStyle === 1) {                              // bob
    g.beginPath();
    g.moveTo(-r * 1.0, hy - r * 0.2);
    g.quadraticCurveTo(-r * 1.32, hy + r * 0.6, -r * 0.86, hy + r * 1.15);
    g.quadraticCurveTo(-r * 0.3, hy + r * 1.05, -r * 0.28, hy + r * 0.5);
    g.closePath(); g.fillStyle = hair; g.fill();
  } else if (o.hairStyle === 2) {                       // long
    g.beginPath();
    g.moveTo(-r * 1.02, hy - r * 0.25);
    g.quadraticCurveTo(-r * 1.45, hy + r * 1.2, -r * 1.05, hy + r * 2.6);
    g.quadraticCurveTo(-r * 0.5, hy + r * 2.5, -r * 0.34, hy + r * 0.6);
    g.closePath(); g.fillStyle = hair; g.fill();
    g.beginPath();
    g.moveTo(-r * 1.02, hy - r * 0.1);
    g.quadraticCurveTo(-r * 1.3, hy + r * 1.1, -r * 1.0, hy + r * 2.3);
    g.quadraticCurveTo(-r * 0.86, hy + r * 1.0, -r * 0.8, hy + r * 0.2);
    g.closePath(); g.fillStyle = 'rgba(255,255,255,0.07)'; g.fill();
  } else if (o.hairStyle === 3) {                       // updo
    pxDisc(g, -r * 0.92, hy - r * 0.52, r * 0.46, hairSh);
    pxDisc(g, -r * 0.98, hy - r * 0.58, r * 0.34, hair);
  } else if (o.hairStyle === 4) {                       // ponytail
    g.beginPath();
    g.moveTo(-r * 0.95, hy - r * 0.15);
    g.quadraticCurveTo(-r * 1.6, hy + r * 0.5, -r * 1.3, hy + r * 1.9);
    g.quadraticCurveTo(-r * 1.0, hy + r * 0.9, -r * 0.7, hy + r * 0.25);
    g.closePath(); g.fillStyle = hair; g.fill();
  }

  // features
  const eyX = r * 0.56, eyY = hy + r * 0.05;
  g.fillStyle = 'rgba(45,30,22,0.94)';
  g.beginPath(); g.ellipse(eyX, eyY, r * 0.095, r * 0.14, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.beginPath(); g.arc(eyX + r * 0.035, eyY - r * 0.05, r * 0.037, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(55,36,26,0.72)'; g.lineWidth = Math.max(0.7, r * 0.075);
  g.beginPath();
  g.moveTo(eyX - r * 0.15, eyY - r * 0.28);
  g.quadraticCurveTo(eyX + r * 0.06, eyY - r * 0.36, eyX + r * 0.22, eyY - r * 0.26);
  g.stroke();
  g.strokeStyle = 'rgba(150,80,70,0.8)'; g.lineWidth = Math.max(0.7, r * 0.08);
  g.beginPath();
  g.moveTo(r * 0.72, hy + r * 0.36);
  g.quadraticCurveTo(r * 0.86, hy + r * 0.40, r * 0.80, hy + r * 0.46);
  g.stroke();
  if (o.blush) {
    g.fillStyle = 'rgba(238,146,156,0.36)';
    g.beginPath(); g.ellipse(r * 0.52, eyY + r * 0.30, r * 0.20, r * 0.11, 0, 0, TAU); g.fill();
  }
  if (o.glasses) {
    g.strokeStyle = 'rgba(40,34,30,0.75)'; g.lineWidth = Math.max(0.7, r * 0.055);
    g.beginPath(); g.arc(eyX, eyY, r * 0.24, 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(eyX - r * 0.24, eyY - r * 0.02);
    g.lineTo(-r * 0.1, eyY - r * 0.08); g.stroke();
    g.fillStyle = 'rgba(210,232,244,0.16)';
    g.beginPath(); g.arc(eyX, eyY, r * 0.22, 0, TAU); g.fill();
  }
  if (o.earring) pxDisc(g, -r * 0.16, hy + r * 0.32, r * 0.075, '#f0e2bc');

  g.restore();                       // end of the head's tilt

  // ── near arm, over everything ──
  const bareArm = skirted && o.kind !== 'hanbok';
  limb(shX + H * 0.02, shY + H * 0.015, handP.x, handP.y, armW, bareArm ? skin : wear);
  if (bareArm && o.sleeve) {                          // cap, elbow or full sleeve
    const t = o.sleeve === 1 ? 0.22 : o.sleeve === 2 ? 0.55 : 0.92;
    limb(shX + H * 0.02, shY + H * 0.015,
         shX + H * 0.02 + (handP.x - shX - H * 0.02) * t,
         shY + H * 0.015 + (handP.y - shY - H * 0.015) * t,
         armW * 1.16, wear);
  }
  if (o.arms !== 'down') pxDisc(g, handP.x, handP.y, armW * 0.46, skin);
  if (o.clutch) {                                     // clutch bag in the hand
    g.save(); g.translate(handP.x + H * 0.012, handP.y + H * 0.028); g.rotate(0.22);
    wRound(g, -H * 0.032, -H * 0.018, H * 0.064, H * 0.036, o.clutch, H * 0.008);
    g.fillStyle = 'rgba(255,255,255,0.28)';
    g.fillRect(-H * 0.03, -H * 0.014, H * 0.06, H * 0.005);
    g.restore();
  }

  g.restore();
}

function wFigure(g, bx, by, H, o) {
  if (o.scale || o.lean) {
    const sc = o.scale || 1, ln = o.lean || 0;
    g.save(); g.translate(bx, by); g.rotate(ln); g.translate(-bx, -by);
    const inner = Object.assign({}, o); inner.scale = 0; inner.lean = 0;
    wFigure(g, bx, by, H * sc, inner);
    g.restore();
    return;
  }
  const side   = typeof o.view === 'number' ? o.view : 0;
  if (side) return wFigureSide(g, bx, by, H, o, side);
  const back   = o.view === 'back';
  const seated = !!o.seated;
  const skirted = o.kind === 'gown' || o.kind === 'dress' || o.kind === 'hanbok';

  // ── skeleton ──
  const headR   = H * 0.135;
  const headCY  = by - H * 0.855;
  const neckY   = by - H * 0.725;
  const shoulderY = by - H * 0.675;
  const waistY  = by - H * 0.52;
  const hipY    = by - H * 0.44;
  const shW = (side ? H * 0.19 : H * 0.30) * (o.slim ? 0.92 : 1);
  const hipW = side ? H * 0.17 : H * 0.235;

  // seated: hips drop to the seat and the thighs run forward
  const sHipY = by - H * 0.355;
  const sHipX = bx - side * H * 0.10;
  const kneeX = bx + side * H * 0.155;
  const kneeY = by - H * 0.315;

  const bodyTopY = seated ? sHipY - H * 0.34 : shoulderY;
  const bodyHipY = seated ? sHipY : hipY;
  const bodyHipX = seated ? sHipX : bx;
  const bodyNeckY = seated ? bodyTopY - H * 0.05 : neckY;
  const bodyHeadCY = seated ? bodyTopY - H * 0.185 : headCY;

  const skin = o.skin, skinSh = o.skinShade || '#d99e77';
  const hair = o.hair, hairSh = o.hairDark || '#241609';
  const wear = o.wear, wear2 = o.wear2;

  if (!seated) wShadow(g, bx, by, H * 0.30, 0.5);

  const limb = (x0, y0, x1, y1, w, col) => {
    g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  };

  // ── far arm, behind the body ──
  const armW = H * 0.058, armCol = skirted && o.kind !== 'hanbok' ? skin : wear2;
  const shX = (s) => bx + s * shW * 0.5 + (seated ? -side * H * 0.02 : 0);
  const armPose = o.arms || 'down';
  const clapT = armPose === 'clap'
    ? (0.5 + 0.5 * Math.sin(W.t / 88 + (o.phase || 0))) : 0;

  function drawArm(s, front) {
    const ox = shX(s), oy = bodyTopY + H * 0.02;
    let ex, ey;
    if (armPose === 'fold') {
      ex = bx + s * H * 0.055 + side * H * 0.06;
      ey = bodyTopY + H * 0.135;
    } else if (armPose === 'clap') {
      ex = bx + s * H * (0.05 + clapT * 0.05) + side * H * 0.10;
      ey = bodyTopY + H * 0.16;
    } else if (armPose === 'clasp') {
      ex = bx + s * H * 0.035 + side * H * 0.09;
      ey = bodyTopY + H * 0.185;
    } else {
      ex = ox + s * H * 0.012 + side * H * 0.02;
      ey = bodyTopY + H * 0.235;
    }
    limb(ox, oy, ex, ey, armW, front ? armCol : wear2);
    if (armPose !== 'down') pxDisc(g, ex, ey, armW * 0.48, skin);
  }
  drawArm(side ? -1 : -1, false);

  // ── lower body ──
  if (seated) {
    const legCol = o.trouser || wear2;
    limb(sHipX, sHipY, kneeX, kneeY, H * 0.115, legCol);              // thigh, forward
    limb(kneeX, kneeY + H * 0.01, kneeX + side * H * 0.015, by - H * 0.015,
         H * 0.082, legCol);                                          // shin, down
    g.beginPath();
    g.ellipse(kneeX + side * H * 0.035, by - H * 0.012, H * 0.058, H * 0.026, 0, 0, TAU);
    g.fillStyle = '#0d0b12'; g.fill();
    if (skirted) {                                                // skirt over the knees
      g.beginPath();
      g.moveTo(sHipX - hipW * 0.62, sHipY - H * 0.03);
      g.quadraticCurveTo(bx + side * H * 0.06, sHipY + H * 0.02,
                         kneeX + side * H * 0.05, kneeY + H * 0.03);
      g.lineTo(kneeX + side * H * 0.05, kneeY - H * 0.07);
      g.quadraticCurveTo(bx, sHipY - H * 0.12, sHipX - hipW * 0.62, sHipY - H * 0.14);
      g.closePath(); g.fillStyle = wear; g.fill();
    }
  } else if (skirted) {
    const skirtW = o.kind === 'gown' ? H * 0.60 : H * 0.42;
    g.beginPath();
    g.moveTo(bx - hipW * 0.52, hipY);
    g.bezierCurveTo(bx - skirtW * 0.60, by - H * 0.16, bx - skirtW * 0.54, by - H * 0.03, bx - skirtW * 0.5, by);
    g.lineTo(bx + skirtW * 0.5, by);
    g.bezierCurveTo(bx + skirtW * 0.54, by - H * 0.03, bx + skirtW * 0.60, by - H * 0.16, bx + hipW * 0.52, hipY);
    g.closePath();
    const sg = g.createLinearGradient(bx - skirtW * 0.5, 0, bx + skirtW * 0.5, 0);
    sg.addColorStop(0, wear2); sg.addColorStop(0.32, wear);
    sg.addColorStop(0.6, wear); sg.addColorStop(1, wear2);
    g.fillStyle = sg; g.fill();
    wEllipse(g, bx, by, skirtW * 0.5, skirtW * 0.085, wear2);
  } else {
    const lw = H * 0.088, sp = hipW * 0.30;
    limb(bx - sp, hipY, bx - sp * 0.85, by - H * 0.015, lw, o.trouser || wear2);
    limb(bx + sp, hipY, bx + sp * 0.85, by - H * 0.015, lw, o.trouser || wear2);
    wEllipse(g, bx - sp * 0.9, by, lw * 0.62, lw * 0.28, '#0b0910');
    wEllipse(g, bx + sp * 0.9, by, lw * 0.62, lw * 0.28, '#0b0910');
  }

  // ── torso: shoulders round off, waist pulls in ──
  g.beginPath();
  g.moveTo(bodyHipX - hipW * 0.5, bodyHipY);
  g.quadraticCurveTo(bx - shW * 0.56, waistY - (seated ? H * 0.06 : 0), bx - shW * 0.5, bodyTopY + H * 0.03);
  g.quadraticCurveTo(bx - shW * 0.5, bodyTopY - H * 0.012, bx - shW * 0.3, bodyTopY - H * 0.018);
  g.lineTo(bx + shW * 0.3, bodyTopY - H * 0.018);
  g.quadraticCurveTo(bx + shW * 0.5, bodyTopY - H * 0.012, bx + shW * 0.5, bodyTopY + H * 0.03);
  g.quadraticCurveTo(bx + shW * 0.56, waistY - (seated ? H * 0.06 : 0), bodyHipX + hipW * 0.5, bodyHipY);
  g.closePath();
  const tg = g.createLinearGradient(bx - shW * 0.5, 0, bx + shW * 0.5, 0);
  if (side) {
    tg.addColorStop(0, side > 0 ? wear2 : wear); tg.addColorStop(1, side > 0 ? wear : wear2);
  } else { tg.addColorStop(0, wear2); tg.addColorStop(0.4, wear); tg.addColorStop(1, wear2); }
  g.fillStyle = tg; g.fill();

  // ── what they are wearing, only where it shows ──
  if (!back) {
    if (o.kind === 'suit' || o.kind === 'tux') {
      const cx2 = bx + side * shW * 0.16;
      g.beginPath();
      g.moveTo(cx2 - shW * (side ? 0.10 : 0.15), bodyTopY);
      g.lineTo(cx2 + shW * (side ? 0.10 : 0.15), bodyTopY);
      g.lineTo(cx2 + shW * 0.09, bodyHipY - H * 0.02);
      g.lineTo(cx2 - shW * 0.09, bodyHipY - H * 0.02);
      g.closePath(); g.fillStyle = '#f7f3ec'; g.fill();
      limb(cx2, bodyTopY + H * 0.025, cx2 - side * H * 0.004, bodyTopY + H * 0.115,
           H * 0.026, o.tie || '#7a2f3a');
      if (!side) {                                   // lapels
        for (const s of [-1, 1]) {
          g.beginPath();
          g.moveTo(bx + s * shW * 0.46, bodyTopY - H * 0.01);
          g.lineTo(bx + s * shW * 0.12, bodyTopY + H * 0.015);
          g.lineTo(bx + s * shW * 0.2, waistY);
          g.closePath(); g.fillStyle = 'rgba(255,255,255,0.08)'; g.fill();
        }
      }
    } else if (o.kind === 'hanbok') {
      g.beginPath();
      g.moveTo(bx - shW * 0.54, bodyTopY - H * 0.015);
      g.lineTo(bx + shW * 0.54, bodyTopY - H * 0.015);
      g.quadraticCurveTo(bx + shW * 0.5, bodyTopY + H * 0.17, bx, bodyTopY + H * 0.185);
      g.quadraticCurveTo(bx - shW * 0.5, bodyTopY + H * 0.17, bx - shW * 0.54, bodyTopY - H * 0.015);
      g.closePath(); g.fillStyle = o.jeogori || '#f6efe4'; g.fill();
      g.fillStyle = 'rgba(0,0,0,0.10)';
      g.fillRect(bx - shW * 0.54, bodyTopY + H * 0.145, shW * 1.08, H * 0.02);
      limb(bx + side * H * 0.02, bodyTopY + H * 0.03, bx + side * H * 0.02, bodyTopY + H * 0.20,
           H * 0.03, o.goreum || '#9c3f52');
    } else if (skirted && o.sash) {
      g.fillStyle = o.sash;
      g.fillRect(bodyHipX - hipW * 0.52, bodyHipY - H * 0.055, hipW * 1.04, H * 0.035);
    }
    if (o.kind === 'dress' || o.kind === 'gown') {   // collarbone / neckline
      wEllipse(g, bx, bodyTopY + H * 0.012, shW * 0.30, H * 0.024, skin);
    }
  }

  // ── near arm, over the body ──
  drawArm(side ? 1 : 1, true);

  // ── neck ──
  limb(bx + side * H * 0.012, bodyNeckY + H * 0.03, bx + side * H * 0.018, bodyNeckY - H * 0.03,
       H * 0.062, skinSh);

  // ── head ──
  const hx = bx + side * headR * 0.16;
  const hy = bodyHeadCY;

  // hair behind the head
  if (o.hairStyle === 2) wRound(g, hx - headR * 1.0, hy - headR * 0.35, headR * 2.0, headR * 2.5, hair, headR * 0.85);
  if (o.hairStyle === 4) pxDisc(g, hx - side * headR * 0.95, hy + headR * 0.15, headR * 0.52, hair);
  if (o.hairStyle === 3) pxDisc(g, hx - side * headR * 0.82, hy - headR * 0.42, headR * 0.46, hairSh);

  if (back) {
    pxDisc(g, hx, hy, headR, hair);
    g.beginPath(); g.arc(hx - headR * 0.3, hy - headR * 0.32, headR * 0.5, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fill();
    if (o.hairStyle === 3) { pxDisc(g, hx, hy - headR * 0.05, headR * 0.5, hairSh); pxDisc(g, hx, hy - headR * 0.1, headR * 0.36, hair); }
    if (o.hairStyle === 1) wRound(g, hx - headR * 0.95, hy - headR * 0.2, headR * 1.9, headR * 1.5, hair, headR * 0.6);
  } else {
    // face
    const fg2 = g.createRadialGradient(hx - headR * 0.36, hy - headR * 0.38, headR * 0.08,
                                       hx, hy, headR * 1.06);
    fg2.addColorStop(0, '#fff3e2'); fg2.addColorStop(0.55, skin); fg2.addColorStop(1, skinSh);
    g.beginPath(); g.arc(hx, hy, headR, 0, TAU); g.fillStyle = fg2; g.fill();

    if (side) {
      // a soft brow-and-nose bump on the silhouette, not a beak
      g.beginPath();
      g.moveTo(hx + side * headR * 0.90, hy - headR * 0.18);
      g.quadraticCurveTo(hx + side * headR * 1.05, hy + headR * 0.02,
                         hx + side * headR * 0.94, hy + headR * 0.16);
      g.quadraticCurveTo(hx + side * headR * 0.86, hy + headR * 0.06,
                         hx + side * headR * 0.88, hy - headR * 0.18);
      g.closePath(); g.fillStyle = skin; g.fill();
    }

    // Hair: a disc pushed back off the face and clipped to the skull, which
    // leaves a clean crescent of face at the front rather than a bitten circle.
    g.save();
    g.beginPath(); g.arc(hx, hy, headR * 1.015, 0, TAU); g.clip();
    if (side) {
      // Back of the skull plus a crown band, masked to the head: leaves a
      // clean profile of brow, eye and jaw at the front.
      g.fillStyle = hair;
      const backX = side > 0 ? hx - headR * 1.1 : hx + headR * 0.28;
      g.fillRect(backX, hy - headR * 1.1, headR * 0.82, headR * 2.2);
      g.beginPath();                                // crown, sweeping to a fringe
      g.moveTo(hx - side * headR * 1.1, hy - headR * 1.15);
      g.lineTo(hx + side * headR * 1.15, hy - headR * 1.15);
      g.quadraticCurveTo(hx + side * headR * 1.0, hy - headR * 0.5,
                         hx + side * headR * 0.55, hy - headR * 0.34);
      g.quadraticCurveTo(hx - side * headR * 0.1, hy - headR * 0.62,
                         hx - side * headR * 1.1, hy - headR * 0.42);
      g.closePath(); g.fill();
      if (o.hairStyle !== 0) {                      // longer hair falls at the nape
        g.fillRect(backX - (side > 0 ? headR * 0.1 : 0), hy - headR * 0.2,
                   headR * 0.9, headR * 1.5);
      }
    } else {
      g.beginPath();
      g.arc(hx, hy - headR * 0.22, headR * 1.0, 0, TAU);
      g.fillStyle = hair; g.fill();
      g.beginPath();                              // face opening
      g.ellipse(hx, hy + headR * 0.18, headR * 0.78, headR * 0.82, 0, 0, TAU);
      g.fillStyle = skin; g.fill();
      g.beginPath();                              // fringe
      g.moveTo(hx - headR * 1.1, hy - headR * 0.18);
      g.quadraticCurveTo(hx - headR * 0.3, hy - headR * 0.62, hx + headR * 0.15, hy - headR * 0.2);
      g.quadraticCurveTo(hx + headR * 0.55, hy - headR * 0.72, hx + headR * 1.1, hy - headR * 0.22);
      g.lineTo(hx + headR * 1.1, hy - headR * 1.2);
      g.lineTo(hx - headR * 1.1, hy - headR * 1.2);
      g.closePath(); g.fillStyle = hair; g.fill();
    }
    g.beginPath(); g.arc(hx - headR * 0.32, hy - headR * 0.52, headR * 0.4, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.11)'; g.fill();
    g.restore();
    if (side && o.hairStyle !== 0) {              // ear, tucked under the hair
      g.strokeStyle = skinSh; g.lineWidth = Math.max(0.6, headR * 0.08);
      g.beginPath();
      g.arc(hx - side * headR * 0.16, hy + headR * 0.12, headR * 0.16,
            side > 0 ? -1.2 : 1.9, side > 0 ? 1.2 : 4.4);
      g.stroke();
    }

    // features
    const eyY = hy + headR * 0.12;
    const lid = 'rgba(45,30,22,0.92)';
    if (side) {
      const ex = hx + side * headR * 0.50;
      g.fillStyle = lid;
      g.beginPath(); g.ellipse(ex, eyY, headR * 0.10, headR * 0.15, 0, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.7)';
      g.beginPath(); g.arc(ex + side * headR * 0.03, eyY - headR * 0.05, headR * 0.04, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(55,36,26,0.7)'; g.lineWidth = Math.max(0.6, headR * 0.085);
      g.beginPath(); g.moveTo(ex - side * headR * 0.14, eyY - headR * 0.3);
      g.lineTo(ex + side * headR * 0.14, eyY - headR * 0.34); g.stroke();
      g.strokeStyle = 'rgba(150,80,70,0.8)';
      g.beginPath();
      g.moveTo(hx + side * headR * 0.62, hy + headR * 0.44);
      g.quadraticCurveTo(hx + side * headR * 0.74, hy + headR * 0.5, hx + side * headR * 0.5, hy + headR * 0.54);
      g.stroke();
      if (o.blush) { g.fillStyle = 'rgba(238,146,156,0.38)';
        g.beginPath(); g.ellipse(hx + side * headR * 0.5, eyY + headR * 0.3, headR * 0.2, headR * 0.11, 0, 0, TAU); g.fill(); }
    } else {
      const ex = headR * 0.37;
      g.fillStyle = lid;
      for (const s of [-1, 1]) {
        g.beginPath(); g.ellipse(hx + s * ex, eyY, headR * 0.11, headR * 0.16, 0, 0, TAU); g.fill();
      }
      g.fillStyle = 'rgba(255,255,255,0.72)';
      for (const s of [-1, 1]) {
        g.beginPath(); g.arc(hx + s * ex + headR * 0.04, eyY - headR * 0.055, headR * 0.042, 0, TAU); g.fill();
      }
      g.strokeStyle = 'rgba(55,36,26,0.68)'; g.lineWidth = Math.max(0.6, headR * 0.08);
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(hx + s * (ex + headR * 0.15), eyY - headR * 0.30);
        g.quadraticCurveTo(hx + s * ex, eyY - headR * 0.40, hx + s * (ex - headR * 0.15), eyY - headR * 0.30);
        g.stroke();
      }
      g.strokeStyle = 'rgba(150,80,70,0.8)'; g.lineWidth = Math.max(0.6, headR * 0.085);
      g.beginPath(); g.arc(hx, hy + headR * 0.34, headR * 0.19, 0.35, Math.PI - 0.35); g.stroke();
      if (o.blush) {
        g.fillStyle = 'rgba(238,146,156,0.36)';
        for (const s of [-1, 1]) {
          g.beginPath();
          g.ellipse(hx + s * (ex + headR * 0.16), eyY + headR * 0.28, headR * 0.19, headR * 0.11, 0, 0, TAU);
          g.fill();
        }
      }
    }
    if (o.hairStyle === 1 && !side)
      for (const s of [-1, 1]) wRound(g, hx + s * headR * 0.78 - headR * 0.22, hy - headR * 0.5, headR * 0.44, headR * 1.5, hair, headR * 0.22);
    if (o.hairStyle === 2 && !side)
      for (const s of [-1, 1]) wRound(g, hx + s * headR * 0.86 - headR * 0.26, hy - headR * 0.45, headR * 0.52, headR * 2.3, hair, headR * 0.26);
  }
}

const W_SUITS  = ['#232032','#2e2438','#1d2433','#33283a','#262d3c','#2b2129','#20293a'];
const W_DRESSES= ['#6b4a68','#3f4d63','#7c5560','#4a3c66','#8a6470','#3d5052','#65517a','#5d4550'];
const W_HAIRS  = ['#241810','#3a2717','#171009','#4a3320','#2b2028','#503826'];
const W_SKINS  = ['#ffdcbc','#f6d0ab','#eec5a0','#e0b189'];

function wGuestOpts(seed, view) {
  const a = wHash(seed * 977, 31), b = wHash(seed * 613, 57), c = wHash(seed * 331, 83);
  const d = wHash(seed * 191, 47);
  const fem = a > 0.45;
  const cycle = 5200 + d * 4200;
  const clapping = ((W.t + d * 9000) % cycle) < 1500;
  return {
    view: view === undefined ? 'front' : view,
    kind: fem ? 'dress' : 'suit',
    wear:  fem ? W_DRESSES[(a * 8) | 0] : W_SUITS[(a * 7) | 0],
    wear2: fem ? W_DRESSES[(b * 8) | 0] : '#151220',
    trouser: '#171420',
    tie: ['#7a2f3a','#2f3f6b','#4a3a2a','#3f5a4a','#5a3a52'][(c * 5) | 0],
    hair: W_HAIRS[(b * 6) | 0],
    hairDark: '#1b1109',
    skin: W_SKINS[(c * 4) | 0],
    hairStyle: fem ? [1, 2, 3, 4][(b * 4) | 0] : 0,
    blush: fem,
    slim: fem,
    sash: c > 0.7 ? '#e8dfe8' : null,
    arms: clapping ? 'clap' : (d > 0.62 ? 'clasp' : d > 0.34 ? 'fold' : 'down'),
    phase: d * 6.3,
    // no two guests quite the same height, posture or angle
    scale: 0.90 + wHash(seed * 53, 19) * 0.20,
    lean: (wHash(seed * 71, 13) - 0.5) * 0.09,
    nod: (wHash(seed * 97, 29) - 0.5) * 0.22,
    // and none dressed quite the same either
    neckline: (wHash(seed * 137, 11) * 4) | 0,
    sleeve:   fem ? ((wHash(seed * 211, 23) * 4) | 0) : 3,
    stole:    fem && wHash(seed * 307, 41) > 0.72
                ? ['#e9e2ea','#d9c7cf','#cdd6dd','#efe4d4'][(wHash(seed * 17, 5) * 4) | 0] : null,
    glasses:  wHash(seed * 419, 7)  > 0.80,
    necklace: fem && wHash(seed * 523, 3) > 0.45,
    earring:  fem && wHash(seed * 607, 31) > 0.5,
    clutch:   fem && wHash(seed * 701, 19) > 0.66
                ? ['#c9a961','#e0d6c4','#8f7a5c'][(wHash(seed * 29, 9) * 3) | 0] : null,
    pocketSq: !fem && wHash(seed * 811, 13) > 0.5
                ? ['#f7f3ec','#f2c6ae','#b9c8d8'][(wHash(seed * 37, 7) * 3) | 0] : null,
    bowTie:   !fem && wHash(seed * 907, 17) > 0.72,
    hairLight: ['rgba(255,236,200,0.16)','rgba(255,220,190,0.13)','rgba(230,215,255,0.12)'][(wHash(seed * 43, 3) * 3) | 0],
  };
}

/* ══════════════════════════════════════════════════════════════
   FLOOR
══════════════════════════════════════════════════════════════ */
function wDrawTile(g, ch, c, r, S) {
  const TW = WT * S, TH = WT * PY * S;
  const X = c * TW, Y = r * TH;
  const n = wHash(c, r);

  if (ch === '#') { g.fillStyle = '#0d0a12'; g.fillRect(X, Y, TW, TH); return; }

  if (ch === 'r') {                       // the runner
    const gr = g.createLinearGradient(X, 0, X + TW, 0);
    if (c === AISLE_MID) { gr.addColorStop(0, '#22233c'); gr.addColorStop(0.5, '#2a2b4a'); gr.addColorStop(1, '#22233c'); }
    else { gr.addColorStop(0, '#1b1c30'); gr.addColorStop(1, '#20213a'); }
    g.fillStyle = gr; g.fillRect(X, Y, TW, TH);
    g.fillStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i < 3; i++) g.fillRect(X, Y + i * TH / 3, TW, TH * 0.05);
    if (c === AISLE_L) { g.fillStyle = '#4a4b6b'; g.fillRect(X, Y, TW * 0.06, TH); }
    if (c === AISLE_R) { g.fillStyle = '#4a4b6b'; g.fillRect(X + TW * 0.94, Y, TW * 0.06, TH); }
    if (n > 0.9) wBloom(g, X + n * TW, Y + TH * 0.5, TW * 0.05, '#f0c6d6');
    return;
  }
  if (ch === 's' || ch === 'd' || ch === 'P') {
    const base = ch === 'd' ? '#3f3549' : (ch === 'P' ? '#342d3f' : '#332b3d');
    const fg = g.createLinearGradient(X, Y, X + TW, Y + TH);
    fg.addColorStop(0, base); fg.addColorStop(1, ch === 'd' ? '#2f2739' : '#282230');
    g.fillStyle = fg; g.fillRect(X, Y, TW, TH);
    g.fillStyle = 'rgba(255,255,255,0.035)'; g.fillRect(X, Y, TW, TH * 0.12);
    // riser at the front edge of the dais, so it reads as a step up
    if (ch === 'd' && wTileAt(c, r + 1) !== 'd') {
      const rh = TH * 0.55;
      const rg = g.createLinearGradient(0, Y + TH - rh, 0, Y + TH);
      rg.addColorStop(0, '#4a3f55'); rg.addColorStop(1, '#1d1826');
      g.fillStyle = rg; g.fillRect(X, Y + TH - rh, TW, rh);
      g.fillStyle = '#c9a961'; g.fillRect(X, Y + TH - rh, TW, Math.max(1, S));
    }
    if (ch === 'P' && wTileAt(c, r + 1) !== 'P') {
      g.fillStyle = '#c9a961'; g.fillRect(X, Y + TH - Math.max(1, S * 1.4), TW, Math.max(1, S * 1.4));
    }
    return;
  }

  // patterned blue-grey carpet, as laid through the hall
  const fg = g.createLinearGradient(X, Y, X + TW, Y + TH);
  fg.addColorStop(0, n > 0.5 ? '#2c3040' : '#292d3a');
  fg.addColorStop(1, n > 0.5 ? '#232634' : '#20232f');
  g.fillStyle = fg; g.fillRect(X, Y, TW, TH);
  g.save(); g.beginPath(); g.rect(X, Y, TW, TH); g.clip();
  for (let i = 0; i < 3; i++) {
    const h2 = wHash(c * 7 + i, r * 3);
    g.beginPath();
    g.moveTo(X + h2 * TW, Y - TH * 0.2);
    g.bezierCurveTo(X + (1 - h2) * TW * 1.3, Y + TH * 0.35,
                    X + h2 * TW * 0.4,       Y + TH * 0.7,
                    X + (1 - h2) * TW,       Y + TH * 1.2);
    g.strokeStyle = i % 2 ? 'rgba(150,170,200,0.055)' : 'rgba(90,110,150,0.07)';
    g.lineWidth = Math.max(1, S * (1 + h2 * 2)); g.stroke();
  }
  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   STANDING PIECES — each drawn upward from its footprint
══════════════════════════════════════════════════════════════ */
function baseOf(col, row, S) {
  return { x: (col + 0.5) * WT * S, y: (row + 1) * WT * PY * S };
}

/* the drapery wall behind the stage */
function wDrawBackWall(g, camX, camY, cw, S) {
  const wallBase = 2 * WT * PY * S;
  const top = wallBase - WALL_H * S;
  const gr = g.createLinearGradient(0, top, 0, wallBase);
  gr.addColorStop(0, '#0a0810'); gr.addColorStop(0.55, '#171223'); gr.addColorStop(1, '#221a30');
  g.fillStyle = gr; g.fillRect(camX - 40, top, cw + 80, wallBase - top);
  // pleats
  const step = WT * S * 0.5;
  for (let x = Math.floor((camX - 40) / step) * step; x < camX + cw + 40; x += step) {
    g.fillStyle = 'rgba(0,0,0,0.30)'; g.fillRect(x, top, step * 0.34, wallBase - top);
    g.fillStyle = 'rgba(255,255,255,0.035)'; g.fillRect(x + step * 0.42, top, step * 0.16, wallBase - top);
  }
  // gold cornice
  g.fillStyle = '#8d7440'; g.fillRect(camX - 40, top, cw + 80, S * 5);
  g.fillStyle = '#e0c07a'; g.fillRect(camX - 40, top, cw + 80, S * 1.6);
  g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(camX - 40, wallBase - S * 3, cw + 80, S * 3);
}

/* round banquet table with guests seated all round it */
function wDrawTable(g, tb, S) {
  const b = baseOf(tb.col + 1, tb.row + 1, S);
  const cx = b.x, floorY = b.y;
  const rx = 1.5 * WT * S, ry = rx * 0.44;
  const topY = floorY - WT * S * 0.52;
  const toAisle = tb.col < AISLE_L ? 1 : -1;   // which way the runner lies

  // guests behind the table first
  for (let i = 0; i < tb.seats; i++) {
    const a = i / tb.seats * TAU + 0.35;
    if (Math.sin(a) > -0.1) continue;
    const go = wGuestOpts(wHash(tb.col + i * 7, tb.row + i * 3), toAisle);
    go.seated = true;
    wFigure(g, cx + Math.cos(a) * rx * 1.16, floorY + Math.sin(a) * ry * 1.16,
            WT * S * 1.3, go);
  }
  // cloth
  wShadow(g, cx, floorY + ry * 0.5, rx * 1.35, 0.55);
  g.beginPath();
  g.moveTo(cx - rx, topY);
  g.lineTo(cx - rx, floorY - ry * 0.1);
  g.ellipse(cx, floorY - ry * 0.1, rx, ry, 0, Math.PI, 0, true);
  g.lineTo(cx + rx, topY);
  g.closePath();
  const cg = g.createLinearGradient(cx - rx, 0, cx + rx, 0);
  cg.addColorStop(0, '#171320'); cg.addColorStop(0.4, '#2b2438'); cg.addColorStop(1, '#12101a');
  g.fillStyle = cg; g.fill();
  // top
  const tgr = g.createRadialGradient(cx - rx * 0.3, topY - ry * 0.3, ry * 0.1, cx, topY, rx);
  tgr.addColorStop(0, '#41374f'); tgr.addColorStop(0.6, '#2f2740'); tgr.addColorStop(1, '#221c2e');
  wEllipse(g, cx, topY, rx, ry, '#000');
  g.beginPath(); g.ellipse(cx, topY, rx, ry, 0, 0, TAU); g.fillStyle = tgr; g.fill();
  g.beginPath(); g.ellipse(cx, topY, rx * 0.98, ry * 0.98, 0, Math.PI * 1.1, Math.PI * 1.85);
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = Math.max(1, S); g.stroke();
  // centrepiece
  wArrangement(g, cx, topY + ry * 0.15, rx * 1.15, WT * S * 0.85, tb.col * 31 + tb.row, true);
  // Tall glass candelabrum rising out of the blooms — the striking piece
  // each round table carries in the photographs.
  const stalkH = WT * S * 1.85;
  for (let i = 0; i < 5; i++) {
    const dx = (i - 2) * WT * S * 0.16;
    const hh = stalkH * (i === 2 ? 1 : i % 2 ? 0.70 : 0.85);
    g.fillStyle = 'rgba(226,240,245,0.20)';
    g.fillRect(cx + dx - S * 2.2, topY - hh, S * 4.4, hh);
    g.fillStyle = 'rgba(255,255,255,0.30)';
    g.fillRect(cx + dx - S * 2.2, topY - hh, S * 1.3, hh);
    g.fillStyle = '#f6efdf';
    g.fillRect(cx + dx - S * 1.7, topY - hh - S * 4.5, S * 3.4, S * 4.5);
    const fl2 = g.createRadialGradient(cx + dx, topY - hh - S * 6, 0,
                                       cx + dx, topY - hh - S * 6, S * 6.5);
    fl2.addColorStop(0, 'rgba(255,240,196,0.95)');
    fl2.addColorStop(1, 'rgba(255,220,150,0)');
    g.fillStyle = fl2;
    g.beginPath(); g.arc(cx + dx, topY - hh - S * 6, S * 6.5, 0, TAU); g.fill();
  }
  wArrangement(g, cx, topY - stalkH * 0.40, rx * 0.85, WT * S * 0.6, tb.col * 13 + 7, true);
  // guests in front
  for (let i = 0; i < tb.seats; i++) {
    const a = i / tb.seats * TAU + 0.35;
    if (Math.sin(a) <= -0.1) continue;
    const go = wGuestOpts(wHash(tb.col + i * 7, tb.row + i * 3), toAisle);
    go.seated = true;
    wFigure(g, cx + Math.cos(a) * rx * 1.16, floorY + Math.sin(a) * ry * 1.16,
            WT * S * 1.3, go);
  }
}

/* a guest standing along the aisle */
function wDrawLongTable(g, lt, S) {
  const TW = WT * S, TH = WT * PY * S;
  const cx = (lt.col + 0.5) * TW;
  const w  = TW * 1.55;
  const y0 = lt.row0 * TH, y1 = (lt.row1 + 1) * TH;
  const top = TW * 0.42;                      // apparent height of the table top

  // chairs and guests behind the table (outer side)
  for (let r = lt.row0 + 0.4; r < lt.row1; r += 1.9) {
    const gy = r * TH;
    wChair(g, cx - lt.side * w * 0.62, gy, S, -1);
    const go = wGuestOpts(wHash(lt.col * 3 + r * 7, 11), lt.side);
    go.seated = true;
    wFigure(g, cx - lt.side * w * 0.62, gy + TH * 0.1, TW * 1.3, go);
  }

  // the table: black cloth to the floor, with a lit top edge
  const cg = g.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  cg.addColorStop(0, '#0b0a0f'); cg.addColorStop(0.45, '#17161d'); cg.addColorStop(1, '#0a090e');
  g.fillStyle = cg;
  g.fillRect(cx - w / 2, y0, w, y1 - y0);
  const tg = g.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  tg.addColorStop(0, '#1c1b24'); tg.addColorStop(0.4, '#2a2833'); tg.addColorStop(1, '#151419');
  g.fillStyle = tg;
  g.fillRect(cx - w / 2, y0 - top, w, y1 - y0);
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.fillRect(cx - w / 2, y0 - top, w, Math.max(1, S));

  // a low run of blooms and glass down the middle of the cloth
  for (let r = lt.row0 + 0.6; r < lt.row1; r += 2.1) {
    const gy = r * TH - top * 0.5;
    wArrangement(g, cx, gy, w * 0.66, TW * 0.3, lt.col * 61 + r * 13, true);
    if ((r * 10 | 0) % 3 === 0) {
      const vx = cx + (wHash(r, lt.col) - 0.5) * w * 0.5;
      const vh = TW * (0.85 + wHash(r * 3, lt.col) * 0.35);
      g.fillStyle = 'rgba(222,238,244,0.26)';                 // clear glass
      g.fillRect(vx - S * 2.6, gy - vh, S * 5.2, vh);
      g.fillStyle = 'rgba(255,255,255,0.32)';
      g.fillRect(vx - S * 2.6, gy - vh, S * 1.4, vh);
      g.strokeStyle = '#6f8f5e'; g.lineWidth = Math.max(1, S * 0.9);
      for (const t of [-1, 0, 1]) {                           // tulips
        g.beginPath();
        g.moveTo(vx + t * S * 1.3, gy - vh * 0.6);
        g.quadraticCurveTo(vx + t * S * 2.8, gy - vh * 1.2, vx + t * S * 3.2, gy - vh * 1.42);
        g.stroke();
        wBloom(g, vx + t * S * 3.2, gy - vh * 1.48, S * 3,
               ['#f7dade','#ffffff','#f3c6ae'][t + 1]);
      }
    }
  }

  // chairs and guests on the aisle side, drawn over the table
  for (let r = lt.row0 + 1.35; r < lt.row1; r += 1.9) {
    const gy = r * TH + TH * 0.55;
    wChair(g, cx + lt.side * w * 0.62, gy, S, 1);
    const go = wGuestOpts(wHash(lt.col * 5 + r * 11, 23), lt.side);
    go.seated = true;
    wFigure(g, cx + lt.side * w * 0.62, gy, TW * 1.3, go);
  }
}

/* a black banquet chair */
function wChair(g, cx, by, S, front) {
  const TW = WT * S;
  const w = TW * 0.5, h = TW * 0.62;
  wShadow(g, cx, by, w * 0.7, 0.4);
  if (front < 0) {                            // seen from behind: tall back
    wRound(g, cx - w / 2, by - h, w, h, '#121118', w * 0.3);
    wRound(g, cx - w / 2 + S, by - h + S, w - S * 2, h * 0.60, '#1e1d26', w * 0.26);
    wRound(g, cx - w / 2 + S * 1.6, by - h * 0.32, w - S * 3.2, h * 0.28, '#6b6660', w * 0.15);
  } else {
